name: Build
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Build Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format

      - name: Run check
        run: bun run check

      - name: Run typecheck
        run: bun run typecheck

      - name: Run build:typedoc
        run: bun run build:typedoc

      - name: Run build
        run: bun run build

      - name: Verify messaging package outside the workspace
        run: bun run verify:messaging-pack

      - name: Run test
        run: bun run test

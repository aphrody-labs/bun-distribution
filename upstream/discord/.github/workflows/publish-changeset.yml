name: Publish - Changeset

on:
  workflow_dispatch:

jobs:
  build:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: check out code 🛎
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format

      - name: Run check
        run: bun run check

      - name: Run typecheck
        run: bun run typecheck

      - name: Run build:typedoc
        run: bun run build:typedoc

      - name: Run build
        run: bun run build

      - name: Verify messaging package outside the workspace
        run: bun run verify:messaging-pack

      - name: Run test
        run: bun run test

      - name: Set release commit identity
        run: |
          git config user.name aphrody-code
          git config user.email contact@aphrody.com

      - name: Publish to npm
        uses: changesets/action@ae5c373a18fe02dac7d40bcbc0184758c90d94d2 # maintenance/v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        with:
          publish: bunx changeset publish
          setupGitUser: false

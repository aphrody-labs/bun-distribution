name: Aphrody Sites

on:
  push:
    branches: [os]
  workflow_dispatch:

permissions:
  contents: read

# No schedule: a pending run in the concurrency group is replaced by the newest
# one, so an hourly cron kept cancelling the deploy queued by a push.
concurrency:
  group: aphrody-sites-production
  cancel-in-progress: false

jobs:
  webos:
    name: Build and publish unified WebOS
    runs-on: aphrody-bun-linux
    timeout-minutes: 120
    env:
      GIT_SSH_COMMAND: ssh -F /run/aphrody/git-ssh/config
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate checkout transport
        run: |
          command -v git >/dev/null
          command -v ssh >/dev/null
          test -r /run/aphrody/git-ssh/identity
          test -r /run/aphrody/git-ssh/config
          test -r /run/aphrody/git-ssh/known_hosts
          test "$(stat -c %a /run/aphrody/git-ssh/identity)" = 600
      - uses: builtin:checkout
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch the submodules the Sites build needs
        run: |
          # Submodule URLs resolve to the read-only host mirrors (runner GIT_CONFIG_SYSTEM); persist-credentials
          # is false, so this step cannot fetch from origin again. Kernel, LLVM and Wine forks are distribution-only sources the Sites never build.
          for p in vendor/cachyos-linux vendor/ogc-linux vendor/linux-cachyos vendor/kernel-patches vendor/ogc-kernel-packages vendor/nvidia-kernels vendor/open-gpu-kernel-modules vendor/llvm vendor/proton vendor/proton-cachyos vendor/wine-cachyos packages/re/third_party/unblob; do
            git config "submodule.$p.update" none
          done
          git submodule update --init --jobs 4 --depth 1
      - name: Select pinned Aphrody Bun runtime
        run: |
          test -x "$BUN_EXECUTABLE"
          "$BUN_EXECUTABLE" --revision
          printf '%s\n' "${BUN_EXECUTABLE%/*}" >> "$GITHUB_PATH"
      - name: Install workspace
        run: |
          bun install --frozen-lockfile
          bun scripts/node-modules.ts
      - name: Require production credential
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Compile the complete installable Craft suite
        run: |
          rustup target add wasm32-unknown-unknown
          CARGO_BUILD_JOBS=4 APHRODY_CARGO_JOBS=4 bun apps/webos/build-craft.ts
      - name: Build, deploy and verify all unified Worker hosts
        run: bun apps/webos/deploy.ts

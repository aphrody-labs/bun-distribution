# Packaging recipe only. Rust source is pinned in source.json and source.tar.gz.
[package]
name = "aphrody-rust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "aphrody_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.0", features = ["extension-module", "abi3-py311"] }
ndarray = "=0.17.2"

[workspace]

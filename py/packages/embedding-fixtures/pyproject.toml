# SPDX-License-Identifier: Apache-2.0

[project]
name = "aphrody-embedding-fixtures"
version = "0.1.0"
description = "Regenerate reference fixtures for the native Aphrody embedding crate"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []
classifiers = ["Operating System :: POSIX :: Linux"]

[project.scripts]
aphrody-embedding-fixture = "aphrody_embedding_fixtures.generate_reference:main"
aphrody-rerank-fixture = "aphrody_embedding_fixtures.generate_rerank_reference:main"

[project.optional-dependencies]
generate = ["sentence-transformers>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aphrody_embedding_fixtures"]

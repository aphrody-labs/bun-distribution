# SPDX-License-Identifier: Apache-2.0
name: Python SDK distributions

on:
  push:
    paths:
      - "packages/aphrody/**"
      - "tools/sdk/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-sdk.yml"
  pull_request:
    paths:
      - "packages/aphrody/**"
      - "tools/sdk/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-sdk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distributions:
    name: Installed SDK (Linux, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SDK_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.22"
          python-version: ${{ matrix.python }}
      - name: Build wheels and source archive outside the checkout
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess

          scratch = Path(os.environ["RUNNER_TEMP"]) / "aphrody-sdk"
          source = scratch / "source"
          checkout = Path(os.environ["GITHUB_WORKSPACE"])
          shutil.copytree(checkout / "packages/aphrody", source,
                          ignore=shutil.ignore_patterns(".git", ".venv", "__pycache__", "target", "dist", "build"))
          subprocess.run(["uv", "--no-config", "build", str(source), "--no-sources",
                          "--python", os.environ["SDK_PYTHON"], "--out-dir", str(scratch / "dist")],
                         cwd=scratch, check=True)
          sdists = list((scratch / "dist").glob("*.tar.gz"))
          assert len(sdists) == 1, sdists
          subprocess.run(["uv", "--no-config", "build", str(sdists[0]), "--wheel",
                          "--no-sources", "--python", os.environ["SDK_PYTHON"],
                          "--out-dir", str(scratch / "rebuilt")], cwd=scratch, check=True)
      - name: Install and verify both wheel builds in fresh environments
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess

          scratch = Path(os.environ["RUNNER_TEMP"]) / "aphrody-sdk"
          checkout = Path(os.environ["GITHUB_WORKSPACE"])
          verifier = checkout / "tools/sdk/verify-wheel.py"
          tests = checkout / "packages/aphrody/tests"
          for directory in ("dist", "rebuilt"):
              wheels = list((scratch / directory).glob("*.whl"))
              assert len(wheels) == 1, wheels
              subprocess.run(["python", str(verifier), str(wheels[0]), "--python", os.environ["SDK_PYTHON"],
                              "--tests", str(tests)], cwd=scratch, check=True)
      - name: Preserve validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aphrody-sdk-Linux-py${{ matrix.python }}
          path: ${{ runner.temp }}/aphrody-sdk/dist/*
          if-no-files-found: error

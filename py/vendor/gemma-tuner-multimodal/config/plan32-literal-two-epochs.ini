# Frozen Plan 32 two-epoch literal-target lineage. Run from the pinned trainer
# checkout; every segment has a separate output directory and explicit resume.

[DEFAULT]
num_train_epochs = 2
logging_steps = 1
save_steps = 88
save_total_limit = 1
gradient_accumulation_steps = 8
learning_rate = 0.0001
warmup_steps = 0
output_dir = output/plan32-unset
required_transformers_version = 5.5.2

[dataset_defaults]
text_column = response
max_label_length = 1024
max_duration = 1.0
id_column = id
streaming_enabled = false
preprocessing_num_workers = 0
dataloader_num_workers = 0

[group:gemma]
dtype = bfloat16
attn_implementation = sdpa
optim = adamw_torch

[model:gemma-4-e4b-it-pinned]
base_model = google/gemma-4-E4B-it
model_revision = fee6332c1abaafb77f6f9624236c63aa2f1d0187
group = gemma
per_device_train_batch_size = 1
per_device_eval_batch_size = 1

[dataset:tt-screenshot-plan32-literal-v1-deploy/epoch-1]
source = tt-screenshot-plan32-literal-v1-deploy/epoch-1
train_split = train
validation_split = validation

[dataset:tt-screenshot-plan32-literal-v1-deploy/epoch-2]
source = tt-screenshot-plan32-literal-v1-deploy/epoch-2
train_split = train
validation_split = validation

[profile:plan32-warmstart-smoke]
model = gemma-4-e4b-it-pinned
dataset = tt-screenshot-plan32-literal-v1-deploy/epoch-1
modality = image
image_sub_mode = vqa
image_path_column = image_path
prompt_column = prompt
system_prompt_column = system_prompt
text_column = response
image_token_budget = 280
image_view_policy = global_plus_four_nonoverlapping_quadrants
completion_only_logits = true
max_seq_length = 24576
max_samples = 1
num_train_epochs = 1
max_steps = 1
per_device_train_batch_size = 1
gradient_accumulation_steps = 1
gradient_checkpointing = true
full_determinism = true
seed = 42
load_validation = true
save_strategy = no
eval_strategy = steps
eval_steps = 1
require_validation_telemetry = true
record_exposures = true
telemetry_interval_steps = 1
telemetry_train_rows = 1
telemetry_validation_rows = 1
telemetry_full_validation_at_stop = false
telemetry_start_step = 0
stop_after_step = 1
initial_adapter_path = output/plan31-mixed-step704/checkpoint-704
lora_r = 64
lora_alpha = 128
lora_dropout = 0.05
learning_rate = 0.0001
weight_decay = 0.01
lr_scheduler_type = constant
warmup_steps = 0
warmup_ratio = 0
required_transformers_version = 5.5.2
require_gradient_subsystems = vision,projector,decoder
lora_target_modules_regex = ^(?:model\.language_model\..*\.(?:q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)|model\.vision_tower\.encoder\.layers\.\d+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))|model\.embed_vision\.embedding_projection)$


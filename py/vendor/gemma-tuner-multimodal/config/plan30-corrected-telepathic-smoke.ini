# Plan 30 corrected-path, bounded smoke. Historical Plan 29 profile remains
# immutable in data/datasets/tt-screenshot-plan28-sft-v1/profiles.ini.
# Install requirements/requirements-gemma4-telepathic-corrected.lock in an
# isolated environment. This profile must never resume Plan 29 checkpoints.
# Transformers 5.5.2 omits 36 inactive shared-layer k_proj/v_proj modules;
# the unchanged target regex therefore matches 371 active linears (258 decoder,
# 112 vision, 1 projector), versus 407 in Transformers 5.5.0.

[DEFAULT]
num_train_epochs = 1
logging_steps = 1
save_steps = 88
save_total_limit = 4
gradient_accumulation_steps = 8
learning_rate = 0.0001
warmup_steps = 0
output_dir = output-plan30-corrected

[dataset_defaults]
text_column = response
max_label_length = 1024
max_duration = 1.0
id_column = id
streaming_enabled = false
preprocessing_num_workers = 0
dataloader_num_workers = 0

[group:gemma]
dtype = bfloat16
attn_implementation = sdpa
optim = adamw_torch

[model:gemma-4-e4b-it-pinned]
base_model = google/gemma-4-E4B-it
model_revision = fee6332c1abaafb77f6f9624236c63aa2f1d0187
group = gemma
per_device_train_batch_size = 1
per_device_eval_batch_size = 1

[dataset:tt-screenshot-plan28-sft-v1/full]
source = tt-screenshot-plan28-sft-v1/full
train_split = train
validation_split = validation

[profile:telepathic-plan30-r64-corrected-smoke]
model = gemma-4-e4b-it-pinned
dataset = tt-screenshot-plan28-sft-v1/full
modality = image
image_sub_mode = vqa
image_path_column = image_path
prompt_column = prompt
system_prompt_column = system_prompt
text_column = response
image_token_budget = 280
image_view_policy = global_plus_four_nonoverlapping_quadrants
require_telepathic_contract = false
completion_only_logits = true
max_seq_length = 24576
gradient_checkpointing = true
full_determinism = true
seed = 42
load_validation = true
save_strategy = steps
save_steps = 88
save_total_limit = 4
eval_strategy = steps
eval_steps = 88
require_validation_telemetry = true
telemetry_interval_steps = 22
telemetry_train_rows = 20
telemetry_validation_rows = 20
telemetry_full_validation_at_stop = true
required_transformers_version = 5.5.2
stop_after_step = 88
lora_r = 64
lora_alpha = 128
lora_dropout = 0.05
learning_rate = 0.0001
weight_decay = 0.01
num_train_epochs = 1
gradient_accumulation_steps = 8
lr_scheduler_type = constant
warmup_steps = 0
warmup_ratio = 0
logging_steps = 1
require_gradient_subsystems = vision,projector,decoder
record_exposures = true
lora_target_modules_regex = ^(?:model\.language_model\..*\.(?:q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)|model\.vision_tower\.encoder\.layers\.\d+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))|model\.embed_vision\.embedding_projection)$

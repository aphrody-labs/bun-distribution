# Plan 31 final bounded segment. Launch only after checkpoint-616 is sealed,
# verified, and durably archived with telemetry.

[DEFAULT]
num_train_epochs = 2
logging_steps = 1
save_steps = 88
save_total_limit = 4
gradient_accumulation_steps = 8
learning_rate = 0.0001
warmup_steps = 0
output_dir = output/plan31-mixed-step704

[dataset_defaults]
text_column = response
max_label_length = 1024
max_duration = 1.0
id_column = id
streaming_enabled = false
preprocessing_num_workers = 0
dataloader_num_workers = 0

[group:gemma]
dtype = bfloat16
attn_implementation = sdpa
optim = adamw_torch

[model:gemma-4-e4b-it-pinned]
base_model = google/gemma-4-E4B-it
model_revision = fee6332c1abaafb77f6f9624236c63aa2f1d0187
group = gemma
per_device_train_batch_size = 1
per_device_eval_batch_size = 1

[dataset:tt-screenshot-plan31-mixed-v4/full]
source = tt-screenshot-plan31-mixed-v4/full
train_split = train
validation_split = validation

[profile:telepathic-plan31-r64-mixed-step704]
model = gemma-4-e4b-it-pinned
dataset = tt-screenshot-plan31-mixed-v4/full
modality = image
image_sub_mode = vqa
image_path_column = image_path
prompt_column = prompt
system_prompt_column = system_prompt
input_mode_column = input_mode
text_column = response
image_token_budget = 280
image_view_policy = global_plus_four_nonoverlapping_quadrants
require_telepathic_contract = false
completion_only_logits = true
max_seq_length = 24576
gradient_checkpointing = true
full_determinism = true
seed = 42
load_validation = true
save_strategy = steps
save_steps = 88
eval_strategy = steps
eval_steps = 88
require_validation_telemetry = true
telemetry_interval_steps = 22
telemetry_train_rows = 20
telemetry_validation_rows = 20
telemetry_full_validation_at_stop = true
telemetry_start_step = 616
required_transformers_version = 5.5.2
stop_after_step = 704
max_steps = 704
resume_from_checkpoint = output/plan31-mixed-step616/checkpoint-616
plan31_schedule_path = data/datasets/tt-screenshot-plan31-mixed-v4/full/epoch-1-modes.jsonl
plan31_schedule_sha256 = ad89766c00958bce014c48fcc561d2e2fec34f3d95a98392344e3e0d4eb81ca2
plan31_projection_receipt_sha256 = e0a3e6d0833cce3cb5b1a21858452c83e47f122ed38718df2de8bcc18675a418
lora_r = 64
lora_alpha = 128
lora_dropout = 0.05
learning_rate = 0.0001
weight_decay = 0.01
num_train_epochs = 2
gradient_accumulation_steps = 8
lr_scheduler_type = constant
warmup_steps = 0
warmup_ratio = 0
logging_steps = 1
require_gradient_subsystems = vision,projector,decoder
record_exposures = true
lora_target_modules_regex = ^(?:model\.language_model\..*\.(?:q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)|model\.vision_tower\.encoder\.layers\.\d+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))|model\.embed_vision\.embedding_projection)$

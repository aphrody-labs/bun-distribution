# Frozen Plan 33 three-epoch literal v3 lineage on pinned stock Gemma 4 E2B.
# Generated once from the Plan 32 recipe; do not edit hashes by hand. Every
# segment writes a fresh output directory and resumes only a verified seal.

[DEFAULT]
num_train_epochs = 3
logging_steps = 1
save_steps = 88
save_total_limit = 1
gradient_accumulation_steps = 8
learning_rate = 0.0001
warmup_steps = 0
output_dir = output/plan33-unset
required_transformers_version = 5.5.2

[dataset_defaults]
text_column = response
max_label_length = 1024
max_duration = 1.0
id_column = id
streaming_enabled = false
preprocessing_num_workers = 0
dataloader_num_workers = 0

[group:gemma]
dtype = bfloat16
attn_implementation = sdpa
optim = adamw_torch

[model:gemma-4-e2b-it-pinned]
base_model = google/gemma-4-E2B-it
model_revision = 3e22461f65e89153144f8adb70e3b8c2cc9845a7
group = gemma
per_device_train_batch_size = 1
per_device_eval_batch_size = 1

[dataset:tt-screenshot-plan33-literal-v3-deploy/epoch-1]
source = tt-screenshot-plan33-literal-v3-deploy/epoch-1
train_split = train
validation_split = validation

[dataset:tt-screenshot-plan33-literal-v3-deploy/epoch-2]
source = tt-screenshot-plan33-literal-v3-deploy/epoch-2
train_split = train
validation_split = validation

[dataset:tt-screenshot-plan33-literal-v3-deploy/epoch-3]
source = tt-screenshot-plan33-literal-v3-deploy/epoch-3
train_split = train
validation_split = validation

[profile:plan33-smoke-step1]
model = gemma-4-e2b-it-pinned
dataset = tt-screenshot-plan33-literal-v3-deploy/epoch-1
modality = image
image_sub_mode = vqa
image_path_column = image_path
prompt_column = prompt
system_prompt_column = system_prompt
input_mode_column = input_mode
text_column = response
image_token_budget = 280
image_view_policy = global_plus_four_nonoverlapping_quadrants
completion_only_logits = true
max_seq_length = 24576
gradient_checkpointing = true
full_determinism = true
seed = 42
load_validation = true
save_strategy = steps
eval_strategy = steps
require_validation_telemetry = true
literal_epochs = 3
plan32_epoch = 1
plan32_schedule_path = data/datasets/tt-screenshot-plan33-literal-v3-deploy/epoch-1/epoch-modes.jsonl
plan32_schedule_sha256 = 86281e43044aa1d5f97b1a3f072c67fbef319c8ad6bbfec0d1384e43848f081b
plan32_projection_receipt_sha256 = 09dab2cfabdd72dce2901023add679c469e189fe4f9f7fa9f380800bc56e0c6a
plan32_projection_receipt_path = data/datasets/tt-screenshot-plan33-literal-v3-deploy/epoch-1/projection.receipt.json
lora_r = 64
lora_alpha = 128
lora_dropout = 0.05
weight_decay = 0.01
lr_scheduler_type = constant
warmup_ratio = 0
require_gradient_subsystems = vision,projector,decoder
record_exposures = true
lora_target_modules_regex = ^(?:model\.language_model\..*\.(?:q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)|model\.vision_tower\.encoder\.layers\.\d+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))|model\.embed_vision\.embedding_projection)$
segment_steps = 1
save_steps = 1
eval_steps = 1
telemetry_interval_steps = 1
telemetry_train_rows = 2
telemetry_validation_rows = 2
telemetry_full_validation_at_stop = false
telemetry_start_step = 0
stop_after_step = 1
max_steps = 1


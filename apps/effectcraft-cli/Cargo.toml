[package]
name = "effectcraft-cli"
description = "EffectCraft headless CLI: render frames and sequences, run commands, MCP server"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[[bin]]
name = "effectcraft-cli"
path = "src/main.rs"

[dependencies]
effectcraft-engine = { path = "../../crates/effectcraft-engine" }
effectcraft-host = { path = "../../crates/effectcraft-host" }
effectcraft-automation = { path = "../../crates/effectcraft-automation" }
effectcraft-ui-egui = { path = "../../crates/effectcraft-ui-egui" }
effectcraft-render = { path = "../../crates/effectcraft-render" }
effectcraft-gpu = { path = "../../crates/effectcraft-gpu" }
effectcraft-time = { path = "../../crates/effectcraft-time" }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
] }
cpu-time = "1"

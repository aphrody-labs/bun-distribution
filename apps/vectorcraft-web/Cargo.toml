[package]
name = "vectorcraft-web"
description = "VectorCraft in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
# VectorCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[[bin]]
name = "vectorcraft-web"
path = "src/main.rs"

[dependencies]
vectorcraft-engine = { path = "../../crates/vectorcraft-engine" }
vectorcraft-ui-egui = { path = "../../crates/vectorcraft-ui-egui" }
vectorcraft-format = { path = "../../crates/vectorcraft-format" }
vectorcraft-text = { path = "../../crates/vectorcraft-text" }
egui = "0.36"
log = "0.4"

<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aphrody / Bun · Slides</title>
    <link
      data-trunk
      rel="css"
      href="../../build/craft-web/deckcraft-web/theme.css"
    />
    <link
      data-trunk
      rel="icon"
      href="../../packages/identity/assets/icon-64.png"
    />
    <link
      data-trunk
      rel="rust"
      data-bin="deckcraft-web"
      data-wasm-opt="z"
      data-weak-refs
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--md-sys-color-surface, #ffffff);
      }
      #deckcraft_canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #deckcraft_loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--md-sys-color-on-surface-variant, #5c5f62);
        font:
          14px system-ui,
          sans-serif;
        pointer-events: none;
      }
    </style>
    <link
      data-trunk
      rel="copy-file"
      href="../../build/craft-web/deckcraft-web/aphrody-icon.png"
    />
  </head>
  <body>
    <canvas id="deckcraft_canvas" aria-label="Slides editor"></canvas>
    <div id="deckcraft_loading" role="status">
      <img
        class="aphrody-identity"
        src="aphrody-icon.png"
        alt=""
        width="48"
        height="48"
      />Loading Slides&hellip;
    </div>
  </body>
</html>

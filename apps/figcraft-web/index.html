<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FigCraft</title>
    <link
      data-trunk
      rel="rust"
      data-bin="figcraft-web"
      data-cargo-profile="web-release"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue"
      data-weak-refs
    />
    <link
      data-trunk
      rel="css"
      href="../../build/craft-web/figcraft-web/theme.css"
    />
    <link
      data-trunk
      rel="icon"
      href="../../packages/identity/assets/icon-64.png"
    />
    <link
      data-trunk
      rel="copy-file"
      href="../../build/craft-web/figcraft-web/aphrody-icon.png"
    />
  </head>
  <body>
    <canvas id="figcraft_canvas" aria-label="figcraft editor"></canvas>
    <div id="figcraft_loading" role="status">
      <img
        class="craft-identity"
        src="aphrody-icon.png"
        alt=""
        width="48"
        height="48"
      />Loading FigCraft&hellip;
    </div>
  </body>
</html>

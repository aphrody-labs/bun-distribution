# Build with: trunk build --release   (from apps/figcraft-web)
[build]
target = "index.html"
dist = "../../dist/web"
public_url = ".//"
filehash = true

[serve]
addresses = ["127.0.0.1"]
port = 8767

[[hooks]]
stage = "pre_build"
command = "bun"
command_arguments = ["../../scripts/craft-web-shell.ts", "figcraft-web"]

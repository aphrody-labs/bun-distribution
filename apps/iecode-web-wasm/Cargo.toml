[package]
description = "Nintendo DS WebAssembly browser adapter."
license-file = "../../docs/licenses/iecode/licenses/dust/LICENSE"
name = "aphrody-dust-web"
version = "0.0.1"
edition = "2021"
publish = true
[lib]
crate-type = ["cdylib", "rlib"]

[features]
log = ["slog", "aphrody-dust-core/log"]

[dependencies]
aphrody-dust-core = { path = "../../crates/aphrody-dust-core" }
aphrody-dust-soft-2d = { path = "../../crates/aphrody-dust-soft-2d" }
aphrody-dust-soft-3d = { path = "../../crates/aphrody-dust-soft-3d" }
aphrody-dust-wgpu = { path = "../../crates/aphrody-dust-wgpu" }
aphrody-emulator-host = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "OffscreenCanvas"] }
slog = { version = "2.7", optional = true }
console_error_panic_hook = "0.1"

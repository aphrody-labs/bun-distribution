[package]
name = "aphrody"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
authors.workspace     = true
license.workspace     = true
homepage.workspace    = true
repository.workspace  = true
description           = "Aphrody — cross-platform Rust CLI (Linux / Windows / macOS / WebAssembly)."

# The general CLI lives under apps/cli; package and binary identities
# remain `aphrody` for consumer compatibility.

[lints]
workspace = true

[features]
default = []
koharu = ["aphrody-command/koharu"]
native = ["aphrody-command/native"]
rag = ["aphrody-command/rag"]
train = ["aphrody-command/train"]
memory-lancedb = ["aphrody-command/memory-lancedb"]
magika = ["aphrody-command/magika"]
forensics = ["aphrody-command/forensics"]
index = ["aphrody-command/index"]
infer = ["aphrody-command/infer"]
ocr = ["aphrody-command/ocr"]
jobs = ["aphrody-command/jobs"]
firefly = ["aphrody-command/firefly"]
yara = ["aphrody-command/yara"]

[dependencies]
aphrody-command = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { workspace = true }
aphrody-guard = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
assert_cmd    = { workspace = true }
predicates    = { workspace = true }
serde_json    = { workspace = true }
tempfile      = { workspace = true }
tokio         = { workspace = true, features = ["macros", "rt"] }
# `cold_start` bench — measures `aphrody version` p50/p95/p99 (PLAN R-A R1.5).
criterion     = { workspace = true }

# --- Cold-start benchmarks (native targets only) ---------------------------
# The bench harness spawns the freshly-built binary, so it cannot run on
# wasm32 (no Command::output) and is gated to native targets via the
# dev-dependencies block above. `harness = false` disables libtest so
# criterion can install its own main() — same convention as
# `crates/os/backend/benches/backend_bench.rs`.
[[bench]]
name    = "cold_start"
harness = false

[package.metadata.cargo-machete]
# `scraper`: its only consumer (the DuckDuckGo SERP scraper in SearchCommand)
# was routed to `bxc search --json`. Declared but unreferenced by design — see
# the comment on the dependency.
ignored = ["ort", "scraper"]

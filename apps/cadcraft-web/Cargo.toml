[package]
name = "cadcraft-web"
description = "CADCraft in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version = "0.6.2"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[[bin]]
name = "cadcraft-web"
path = "src/main.rs"

[dependencies]
cadcraft-engine = { path = "../../crates/cadcraft-engine", version = "=1.4.4" }
cadcraft-ui-egui = { path = "../../crates/cadcraft-ui-egui", version = "=1.4.4" }
cadcraft-io = { path = "../../crates/cadcraft-io", version = "=1.4.4" }
egui = "0.36"
log = "0.4"
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.wasm32-unknown-unknown.dependencies]
web-sys = { version = "0.3", features = ["HtmlInputElement", "FileList", "File"] }

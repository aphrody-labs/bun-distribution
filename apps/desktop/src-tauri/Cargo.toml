[package]
name = "aphrody-bun-desktop"
version = "1.4.4"
description = "Aphrody desktop library inspector"
authors = ["aphrody-dev <contact@aphrody.com>"]
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace]
resolver = "3"

[build-dependencies]
tauri-build = { package = "aphrody-tauri-build", version = "=1.4.4", path = "../../../packages/bun-tauri/crates/aphrody-tauri-build" }

[dependencies]
tauri = { package = "aphrody-tauri", version = "=1.4.4", path = "../../../packages/bun-tauri/crates/aphrody-tauri", default-features = false, features = ["compression"] }
tauri-runtime-cef = { package = "aphrody-tauri-runtime-cef", version = "=1.4.4", path = "../../../packages/bun-tauri/crates/aphrody-tauri-runtime-cef" }
tauri-plugin-aphrody = { version = "=1.4.4", path = "../../../packages/bun-tauri/crates/tauri-plugin-aphrody", default-features = false }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

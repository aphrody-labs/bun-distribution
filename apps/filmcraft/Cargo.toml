[package]
name = "filmcraft"
description = "FilmCraft desktop app"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
default-run = "filmcraft"
build = "build.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["filmcraft-engine/whisper", "filmcraft-engine/speech-download"]
# Natural Text to Speech voices (Kokoro-82M on the CPU, downloaded on first use).
neural-voices = ["filmcraft-engine/neural-voices"]

[dependencies]
filmcraft-engine = { path = "../../crates/filmcraft-engine" }
filmcraft-export = { path = "../../crates/filmcraft-export" }
filmcraft-project = { path = "../../crates/filmcraft-project" }
filmcraft-render = { path = "../../crates/filmcraft-render" }
filmcraft-time = { path = "../../crates/filmcraft-time" }
filmcraft-gpu = { path = "../../crates/filmcraft-gpu" }
filmcraft-ui-egui = { path = "../../crates/filmcraft-ui-egui" }
filmcraft-platform = { path = "../../crates/filmcraft-platform" }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = "1"
log = "0.4"
rfd = "0.17"
cpal = "0.16"
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"
open = "5"

[dev-dependencies]
glob = "0.3"
pollster = "0.4"

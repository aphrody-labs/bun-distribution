[package]
name = "wordcraft-web"
description = "WordCraft in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[[bin]]
name = "wordcraft-web"
path = "src/main.rs"

[dependencies]
wordcraft-engine = { path = "../../crates/wordcraft-engine" }
wordcraft-ui-egui = { path = "../../crates/wordcraft-ui-egui" }
egui = "0.36"
log = "0.4"
serde_json = { version = "1", features = ["float_roundtrip"] }
wordcraft-doc = { path = "../../crates/wordcraft-doc" }
wordcraft-fonts = { path = "../../crates/wordcraft-fonts" }

[package]
name = "figcraft-server"
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "FigCraft's standalone collaboration server: keeps many files with share links (edit or view), persists them as snapshots plus a log, and serves live sessions (headless, native only)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "figcraft-server"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
# Style lints from newer toolchains that fight index-heavy pixel code.
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
# FigCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Never crash). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
figcraft-collab = { path = "../../crates/figcraft-collab" }
figcraft-collab-net = { path = "../../crates/figcraft-collab-net" }
figcraft-format = { path = "../../crates/figcraft-format" }
figcraft-plugin = { path = "../../crates/figcraft-plugin" }
log = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
crc32fast = "1"
toml = "1"
env_logger = { version = "0.11", default-features = false, features = [
  "humantime",
] }
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
wat = "1.261"
figcraft-engine = { path = "../../crates/figcraft-engine" }
figcraft-doc = { path = "../../crates/figcraft-doc" }
tungstenite = { version = "0.30", default-features = false, features = [
  "handshake",
] }

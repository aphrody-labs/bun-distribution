<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9146ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond -->
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Formes décoratives -->
  <circle cx="100" cy="100" r="80" fill="#9146ff" opacity="0.1"/>
  <circle cx="1100" cy="500" r="120" fill="#ff006e" opacity="0.1"/>
  <rect x="300" y="400" width="150" height="150" fill="#9146ff" opacity="0.05" transform="rotate(45 375 475)"/>
  
  <!-- Ligne d'accent -->
  <line x1="0" y1="150" x2="1200" y2="150" stroke="url(#accentGradient)" stroke-width="3" opacity="0.5"/>
  
  <!-- Texte principal -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    Rose Griffon Store
  </text>
  
  <!-- Texte secondaire -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="32" fill="#e0e0e0" text-anchor="middle" opacity="0.9">
    Merchandise Officiel
  </text>
  
  <!-- Icônes stylisées (boîtes/articles) -->
  <g opacity="0.3">
    <rect x="200" y="400" width="80" height="100" fill="none" stroke="#9146ff" stroke-width="2" rx="8"/>
    <line x1="200" y1="435" x2="280" y2="435" stroke="#9146ff" stroke-width="2"/>
    
    <rect x="920" y="380" width="100" height="120" fill="none" stroke="#ff006e" stroke-width="2" rx="8"/>
    <line x1="920" y1="420" x2="1020" y2="420" stroke="#ff006e" stroke-width="2"/>
    <line x1="920" y1="460" x2="1020" y2="460" stroke="#ff006e" stroke-width="2"/>
  </g>
</svg>

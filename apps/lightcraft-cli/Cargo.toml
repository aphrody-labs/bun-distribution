[package]
name = "lightcraft-cli"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "LightCraft command-line tool: headless render, command listing and the MCP server"

[[bin]]
name = "lightcraft-cli"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[dependencies]
lightcraft-engine = { path = "../../crates/lightcraft-engine" }
lightcraft-denoise = { path = "../../crates/lightcraft-denoise", default-features = false }
lightcraft-sysmem = { path = "../../crates/lightcraft-sysmem" }
lightcraft-mcp = { path = "../../crates/lightcraft-mcp" }
lightcraft-ui-egui = { path = "../../crates/lightcraft-ui-egui" }
lightcraft-codecs = { path = "../../crates/lightcraft-codecs" }
lightcraft-raster = { path = "../../crates/lightcraft-raster" }
lightcraft-merge = { path = "../../crates/lightcraft-merge" }
serde_json = { version = "1", features = ["float_roundtrip"] }
dhat = { version = "0.3", optional = true }

[features]
default = ["denoise"]
denoise = ["lightcraft-engine/denoise"]
rawnind-model = ["denoise", "lightcraft-engine/rawnind-model"]
# Heap profiling: `cargo run --release -p lightcraft-cli --features dhat-heap -- snapshot …` counts
# every allocation (live/peak bytes in `library.memory` / `ui.inspect`) and writes dhat-heap.json
# (open it in DHAT's viewer: allocation sites by bytes at the peak). Slows allocation-heavy work.
dhat-heap = ["dep:dhat"]

# Open HEIC/HEIF photos (the optional lightcraft-heif crate). Not default so distributors choose
# it (HEVC patents); build with `--features heif` to include it.
heif = ["lightcraft-codecs/heif"]

[package]
name = "sd-images"
version = "0.1.0"

authors = [
  "Jake Robinson <jake@spacedrive.com>",
  "Vítor Vasconcellos <vitor@spacedrive.com>",
]
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
heif = ["dep:libheif-rs", "dep:libheif-sys"]

[dependencies]
# Workspace dependencies
image = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }
specta = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Specific Images dependencies
bincode = { version = "=2.0.0-rc.3", features = ["alloc", "derive"], optional = true }
# Disable defaults for libheif* to avoid bindgen and use pre-compiled headers
libheif-rs = { version = "1.0", default-features = false, optional = true }
libheif-sys = { version = "2.1", default-features = false, optional = true }
# Keep the same resvg backend and raster semantics locally. The OS layer does
# not depend on the UI workspace; see svg_raster.rs for the adaptation.
resvg = { version = "0.47", default-features = false, features = [
  "system-fonts",
  "text",
] }

[dependencies.pdfium-render]
default-features = false
features = ["image", "pdfium_6666", "sync", "thread_safe"]
git = "https://github.com/spacedriveapp/pdfium-render.git"
rev = "983f8d8"

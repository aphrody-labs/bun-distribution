[package]
name = "designcraft-web"
description = "DesignCraft in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version = "0.7.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[[bin]]
name = "designcraft-web"
path = "src/main.rs"

[dependencies]
designcraft-engine = { path = "../../crates/designcraft-engine" }
designcraft-format = { path = "../../crates/designcraft-format" }
form_urlencoded = "1.2"
designcraft-ui-egui = { path = "../../crates/designcraft-ui-egui" }
egui = "0.36"
log = "0.4"
serde_json = { version = "1", features = ["float_roundtrip"] }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="" />
    <meta
      name="description"
      content="Bun OS Play: your games, emulation in the browser on WebGPU, Steam and streaming from the gaming host."
    />
    <title>Bun OS Play</title>
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="../../../../packages/identity/assets/icon-64.png"
    />
    <link
      rel="apple-touch-icon"
      href="../../../../packages/identity/assets/icon-192.png"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skip-to-content"></a>
    <div class="shell">
      <nav class="nav" id="nav"></nav>
      <div class="frame">
        <header class="top-bar">
          <button
            class="icon-button"
            id="menu-button"
            type="button"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="quick-menu"
          ></button>
          <a class="brand" href="/" data-link
            ><img
              src="../../../../packages/identity/assets/icon-64.png"
              width="32"
              height="32"
              alt="" /><span data-i18n="app-name"></span
          ></a>
          <div class="top-actions" id="account"></div>
        </header>
        <main id="main" tabindex="-1"></main>
      </div>
    </div>
    <dialog
      id="quick-menu"
      class="side-sheet"
      aria-labelledby="quick-menu-title"
    ></dialog>
    <dialog id="signin" class="modal" aria-labelledby="signin-title"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>

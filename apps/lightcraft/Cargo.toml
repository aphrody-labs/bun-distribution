[package]
name = "lightcraft"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
default-run = "lightcraft"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[features]
default = ["denoise"]
denoise = ["lightcraft-engine/denoise"]
rawnind-model = ["denoise", "lightcraft-engine/rawnind-model"]
# Open HEIC/HEIF photos (the optional lightcraft-heif crate). Not default so distributors choose
# it (HEVC patents); build with `--features heif` to include it.
heif = ["lightcraft-codecs/heif"]

[dependencies]
lightcraft-engine = { path = "../../crates/lightcraft-engine", features = [
  "sam",
] }
lightcraft-sysmem = { path = "../../crates/lightcraft-sysmem" }
lightcraft-ui-egui = { path = "../../crates/lightcraft-ui-egui" }
lightcraft-codecs = { path = "../../crates/lightcraft-codecs" }
lightcraft-raster = { path = "../../crates/lightcraft-raster" }
eframe = { version = "0.36", default-features = false, features = [
  "default_fonts",
  "wgpu",
  "glow",
  "accesskit",
  "wayland",
  "x11",
] }
egui = "0.36"
serde_json = { version = "1", features = ["float_roundtrip"] }
pollster = "1"
log = "0.4"

[build-dependencies]
winresource = "0.1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { workspace = true, features = ["x11"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }

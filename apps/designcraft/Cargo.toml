[package]
name = "designcraft"
version = "0.7.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
default-run = "designcraft"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
designcraft-engine = { path = "../../crates/designcraft-engine" }
designcraft-ui-egui = { path = "../../crates/designcraft-ui-egui" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui = "0.36"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"

[build-dependencies]
winresource = "0.1"

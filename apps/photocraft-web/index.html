<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aphrody / Bun · Images</title>
    <link
      data-trunk
      rel="rust"
      data-bin="photocraft-web"
      data-cargo-profile="wasm-release"
      data-cargo-features="heif"
      data-wasm-opt="z"
      data-wasm-opt-params="--converge"
      data-weak-refs
    />
    <link
      data-trunk
      rel="css"
      href="../../build/craft-web/photocraft-web/theme.css"
    />
    <link
      data-trunk
      rel="icon"
      href="../../packages/identity/assets/icon-64.png"
    />
    <link
      data-trunk
      rel="copy-file"
      href="../../build/craft-web/photocraft-web/aphrody-icon.png"
    />
  </head>
  <body>
    <canvas id="photocraft_canvas" aria-label="Images editor"></canvas>
    <div id="photocraft_loading" role="status">
      <img
        class="craft-identity"
        src="aphrody-icon.png"
        alt=""
        width="48"
        height="48"
      />
      <p>Loading Images&hellip;</p>
      <p id="photocraft_stalled">
        This is taking longer than usual. If the Images editor doesn't start, its files
        may have failed to download or come from a different version of this
        page. <a href="">Reload</a> to try again; the browser console lists what
        failed.
      </p>
    </div>
  </body>
</html>

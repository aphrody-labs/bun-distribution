# Build with: trunk build --release   (from apps/pdfcraft-web)
# The release zip (packaging/web/package.sh) expects the site in dist/web with relative URLs.
[build]
target = "index.html"
dist = "../../dist/web"
public_url = ".//"
filehash = true

[serve]
addresses = ["127.0.0.1"]
port = 8766

[[hooks]]
stage = "pre_build"
command = "bun"
command_arguments = ["../../scripts/craft-web-shell.ts", "pdfcraft-web"]

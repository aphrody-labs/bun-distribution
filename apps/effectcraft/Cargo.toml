[package]
name = "effectcraft"
description = "EffectCraft desktop app"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
default-run = "effectcraft"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-engine = { path = "../../crates/effectcraft-engine", version = "0.9.2" }
effectcraft-host = { path = "../../crates/effectcraft-host", version = "0.9.2" }
effectcraft-ui-egui = { path = "../../crates/effectcraft-ui-egui", version = "0.9.2" }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
  "default_fonts",
  "glow",
  "wgpu",
  "accesskit",
  "links",
  "wayland",
  "x11",
] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
winit = { version = "0.30", default-features = false }
rfd = "0.17"
pollster = "0.4"
cpal = "0.16"
log = "0.4"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true, features = ["async-io", "blocking-api"] }

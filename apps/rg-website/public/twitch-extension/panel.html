<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rose Griffon TV - Planning</title>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <style>
      :root {
        --background: #020817; /* Slate 950 */
        --card: #1e293b; /* Slate 800 */
        --primary: #d63901; /* RGTV Red/Orange */
        --secondary: #345182; /* RGTV Blue */
        --text-primary: #f8fafc; /* Slate 50 */
        --text-secondary: #94a3b8; /* Slate 400 */
        --border: #334155; /* Slate 700 */
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: var(--background);
        color: var(--text-primary);
        margin: 0;
        padding: 12px;
        overflow-x: hidden;
      }

      /* Energy Line Effect */
      .energy-line {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(
          to right,
          transparent,
          var(--primary),
          transparent
        );
        z-index: 50;
        opacity: 0.8;
      }

      /* Header Style like RGTV */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
        position: relative;
      }

      h1 {
        font-size: 1.1rem;
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(to right, var(--secondary), var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .logo-icon {
        stroke: var(--primary);
      }

      /* Card Style like RGTV Schedule */
      .schedule-item {
        background-color: rgba(52, 81, 130, 0.05); /* #345182 + 0D approx */
        border: 1px solid rgba(52, 81, 130, 0.2); /* #345182 + 33 approx */
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
      }

      .schedule-item:hover {
        border-color: var(--secondary);
        transform: translateY(-1px);
        background-color: rgba(52, 81, 130, 0.1);
      }

      .schedule-item.active {
        border-left: 3px solid var(--primary);
        background: linear-gradient(
          90deg,
          rgba(214, 57, 1, 0.1) 0%,
          rgba(52, 81, 130, 0.05) 100%
        );
      }

      .schedule-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
      }

      .schedule-title {
        font-size: 0.95rem;
        font-weight: 700;
        margin-bottom: 8px;
        line-height: 1.3;
      }

      .schedule-streamer {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        color: var(--text-primary);
        font-weight: 600;
      }

      .category-badge {
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 4px;
        background-color: rgba(52, 81, 130, 0.2);
        color: var(--text-secondary);
        margin-left: auto;
      }

      /* Icons */
      .icon {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      /* Badge Live */
      .badge-live {
        background-color: var(--primary);
        color: white;
        font-size: 0.65rem;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: bold;
        margin-left: auto;
        animation: pulse 2s infinite;
        box-shadow: 0 0 8px rgba(214, 57, 1, 0.4);
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
        100% {
          opacity: 1;
        }
      }

      /* Loading & Error */
      .state-msg {
        text-align: center;
        padding: 20px;
        color: var(--text-secondary);
        font-size: 0.9rem;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 8px;
        border: 1px dashed var(--border);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--secondary);
      }
    </style>
  </head>
  <body>
    <div class="energy-line"></div>
    <header>
      <h1>
        <svg
          class="icon logo-icon"
          viewBox="0 0 24 24"
          style="width: 20px; height: 20px"
        >
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        Planning RGTV
      </h1>
    </header>

    <div id="schedule-container">
      <div class="state-msg">Chargement du planning...</div>
    </div>

    <script>
      // Configuration
      // Note: En production, il faudra utiliser l'URL réelle de votre API (https://www.rosegriffon.fr/api/twitch/schedule)
      // Pour le test local, assurez-vous que votre API autorise les requêtes CORS depuis localhost
      const API_URL = "https://www.rosegriffon.fr/api/twitch/schedule";

      window.Twitch.ext.onAuthorized(function (auth) {
        console.log("Extension autorisée");
        fetchSchedule();
      });

      async function fetchSchedule() {
        const container = document.getElementById("schedule-container");

        try {
          const response = await fetch(API_URL);
          if (!response.ok) throw new Error("Erreur réseau");

          const json = await response.json();
          const segments = json.data?.segments || [];

          if (segments.length === 0) {
            container.innerHTML =
              '<div class="state-msg">Aucun stream prévu prochainement.</div>';
            return;
          }

          // Transformer les données pour l'affichage
          const scheduleData = segments.map((segment) => {
            const startDate = new Date(segment.start_time);
            const endDate = segment.end_time
              ? new Date(segment.end_time)
              : null;
            const now = new Date();

            // Vérifier si c'est en cours
            const isLive = startDate <= now && (endDate ? endDate > now : true);

            return {
              day: startDate.toLocaleDateString("fr-FR", {
                weekday: "long",
                day: "numeric",
              }),
              startTime: startDate.toLocaleTimeString("fr-FR", {
                hour: "2-digit",
                minute: "2-digit",
              }),
              endTime: endDate
                ? endDate.toLocaleTimeString("fr-FR", {
                    hour: "2-digit",
                    minute: "2-digit",
                  })
                : null,
              title: segment.title,
              streamer: segment.streamer || "Rose Griffon TV",
              isLive: isLive,
              type: segment.type,
            };
          });

          renderSchedule(scheduleData);
        } catch (error) {
          console.error("Erreur fetch schedule:", error);
          container.innerHTML =
            '<div class="state-msg" style="color: #ef4444;">Impossible de charger le planning.</div>';
        }
      }

      function renderSchedule(items) {
        const container = document.getElementById("schedule-container");
        container.innerHTML = "";

        items.forEach((item) => {
          const el = document.createElement("div");
          el.className = `schedule-item ${item.isLive ? "active" : ""}`;

          const timeDisplay = item.endTime
            ? `${item.startTime} - ${item.endTime}`
            : item.startTime;
          const liveBadge = item.isLive
            ? '<span class="badge-live">EN DIRECT</span>'
            : "";

          // Icons SVG
          const calendarIcon = `<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`;
          const userIcon = `<svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`;

          el.innerHTML = `
            <div class="schedule-meta">
              ${calendarIcon}
              <span>${capitalize(item.day)} • ${timeDisplay}</span>
              ${liveBadge}
            </div>
            <div class="schedule-title">${item.title}</div>
            <div class="schedule-streamer">
              ${userIcon}
              <span>${item.streamer}</span>
            </div>
          `;
          container.appendChild(el);
        });
      }

      function capitalize(s) {
        return s && s[0].toUpperCase() + s.slice(1);
      }
    </script>
  </body>
</html>

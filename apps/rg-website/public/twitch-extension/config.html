<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuration Rose Griffon TV</title>
    <style>
      :root {
        --background: #020817;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --primary: #d63901;
        --border: #334155;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: var(--background);
        color: var(--text-primary);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        box-sizing: border-box;
      }

      h1 {
        font-size: 1.2rem;
        margin-bottom: 16px;
        color: var(--primary);
      }

      p {
        color: var(--text-secondary);
        text-align: center;
        line-height: 1.5;
        max-width: 400px;
      }

      .icon {
        width: 48px;
        height: 48px;
        stroke: var(--primary);
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <svg
      class="icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="16" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12.01" y2="8"></line>
    </svg>
    <h1>Configuration</h1>
    <p>
      Cette extension utilise le planning officiel de Rose Griffon TV.<br />
      Aucune configuration supplémentaire n'est requise.
    </p>
  </body>
</html>

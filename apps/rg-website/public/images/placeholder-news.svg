<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#121212"/>
  <rect width="1200" height="675" fill="url(#az-bg)" opacity="0.9"/>

  <!-- Decorative shapes -->
  <circle cx="250" cy="120" r="280" fill="#6750A4" opacity="0.04"/>
  <circle cx="950" cy="550" r="320" fill="#D0BCFF" opacity="0.03"/>
  <circle cx="600" cy="337" r="160" fill="#6750A4" opacity="0.03"/>

  <!-- Subtle dot pattern -->
  <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.8" fill="#ffffff" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- Center icon -->
  <g transform="translate(600, 280)">
    <circle cx="0" cy="0" r="56" fill="none" stroke="url(#az-accent)" stroke-width="1.5" opacity="0.2"/>
    <circle cx="0" cy="0" r="40" fill="url(#az-accent)" opacity="0.06"/>
    <!-- Newspaper icon -->
    <g transform="translate(-18, -18)" fill="none" stroke="url(#az-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
      <rect x="2" y="2" width="32" height="32" rx="4"/>
      <line x1="9" y1="10" x2="20" y2="10"/>
      <line x1="9" y1="16" x2="27" y2="16"/>
      <line x1="9" y1="22" x2="27" y2="22"/>
      <line x1="9" y1="28" x2="22" y2="28"/>
      <rect x="22" y="8" width="7" height="6" rx="1"/>
    </g>
  </g>

  <!-- Branding text -->
  <text x="600" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#D0BCFF" opacity="0.2" letter-spacing="3">
    AZALÉE NEWS
  </text>

  <!-- Accent line -->
  <rect x="565" y="385" width="70" height="1.5" rx="0.75" fill="url(#az-accent)" opacity="0.15"/>

  <defs>
    <linearGradient id="az-bg" x1="0" y1="0" x2="1200" y2="675">
      <stop offset="0%" stop-color="#1C1B1F"/>
      <stop offset="50%" stop-color="#141218"/>
      <stop offset="100%" stop-color="#1C1B1F"/>
    </linearGradient>
    <linearGradient id="az-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D0BCFF"/>
      <stop offset="100%" stop-color="#6750A4"/>
    </linearGradient>
  </defs>
</svg>

<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aphrody / Bun · Photo Processing</title>

    <meta
      name="description"
      content="LightCraft: open-source photo library and raw developer, running in your browser (WASM)."
    />
    <link rel="stylesheet" href="theme.css" />
    <link rel="icon" href="aphrody-icon.png" />
  </head>
  <body>
    <canvas id="lightcraft_canvas" aria-label="lightcraft editor"></canvas>
    <div id="lightcraft_loading" role="status">
      <img
        class="craft-identity"
        src="aphrody-icon.png"
        alt=""
        width="48"
        height="48"
      />Loading LightCraft…
    </div>
    <div id="lightcraft_status" aria-live="polite"></div>
    <script type="module">
      import init, { start, command } from "./lightcraft_web.js";
      (async () => {
        // The Chinese font is a separate file: embedding it would exceed the host's WASM size limit.
        // Font-free development builds can still run, with the same missing-glyph warning as before.
        const chineseFont = fetch("./lightcraft_zh_hans.otf")
          .then(async (response) =>
            response.ok
              ? new Uint8Array(await response.arrayBuffer())
              : new Uint8Array(),
          )
          .catch(() => new Uint8Array());
        // Compile once; the render workers (worker.js) instantiate the same compiled module.
        const [module, font] = await Promise.all([
          WebAssembly.compileStreaming(fetch("./lightcraft_web_bg.wasm")),
          chineseFont,
        ]);
        globalThis.lightcraftModule = module;
        await init({ module_or_path: module });
        // automation: `await lightcraft.command("library.info", "{}")` → JSON text
        globalThis.lightcraft = { command };
        start(font);
      })().catch((e) => {
        console.error(e);
        const el = document.getElementById("lightcraft_loading");
        if (el) el.textContent = "LightCraft failed to load: " + e;
      });
    </script>
  </body>
</html>

[package]
name = "lightcraft-web"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "LightCraft in the browser: the egui UI compiled to WASM (build with `cargo xtask web`)"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lightcraft-engine = { path = "../../crates/lightcraft-engine" }
lightcraft-ui-egui = { path = "../../crates/lightcraft-ui-egui" }
lightcraft-codecs = { path = "../../crates/lightcraft-codecs" }
lightcraft-raster = { path = "../../crates/lightcraft-raster" }
lightcraft-preview = { path = "../../crates/lightcraft-preview" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
crc32fast = "1"

[features]
# Open HEIC/HEIF photos (the optional lightcraft-heif crate). Not default so distributors choose
# it (HEVC patents); build with `--features heif` to include it. On wasm32 panics abort, so
# heic-rs's `catch_unwind` guard does not apply there.
heif = ["lightcraft-codecs/heif"]

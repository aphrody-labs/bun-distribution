<!doctype html>
<html><body><pre id="out">pending</pre>
<script>window.addEventListener("error",e=>{document.title="ERR "+e.message;window.__TAURI__&&window.__TAURI__.core.invoke("report",{text:"WINERROR "+e.message+" "+e.filename})});window.addEventListener("unhandledrejection",e=>{window.__TAURI__&&window.__TAURI__.core.invoke("report",{text:"REJECT "+e.reason})});</script>
<script type="module">
import init, * as w from "./pkg/aphrody_shell_web.js";
import { attach, localTransport, tauriTransport } from "./index.js";
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
try {
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  globalThis.invoke = invoke;
  await init();
  const local = localTransport(w, 60, 10);
  attach(w, local, 60, 10);
  local.send(new TextEncoder().encode("echo tauri-wasm\r"));
  const t = tauriTransport({ invoke, listen }, "e2e", 100, 20);
  const term = attach(w, t, 100, 20);
  await sleep(800);
  term.type("echo pty-$((20+22))\r");
  await sleep(1500);
  await invoke("report", { text: "LOCAL[" + local.snapshot().lines.join("|") + "] REMOTE[" + term.snapshot().lines.join("|") + "]" });
} catch (e) {
  await globalThis.invoke?.("report", { text: "ERROR " + e + " " + (e && e.stack) });
}
</script></body></html>

# Config gitleaks — durcissement post-incident (purge historique 2026-06).
# Objectif : attraper tout NOUVEAU secret committé, sans bruit sur les faux positifs connus
# (données scrapées tierces + valeurs publiques par design : clé anon Supabase, client IDs).
[extend]
useDefault = true

[allowlist]
description = "Faux positifs connus"
paths = [
  # HTML scrapé depuis inazuma.jp : contient des clés API Google/YouTube TIERCES (embeds), pas à nous
  '''data/inazuma\.jp/''',
  '''data/.*\.html$''',
  # Templates et lockfile
  '''.*\.example$''',
  '''.*\.sample$''',
  '''bun\.lock$''',
  '''.*\.lock$''',
]
regexes = [
  # Discord client IDs / application IDs : PUBLICS par design (pas des secrets)
  '''299502648317444096''',
  # Clé anon Supabase : publique par design (exposée côté client via NEXT_PUBLIC_*).
  # Le payload JWT contient "role":"anon". La clé service_role ("role":"service_role")
  # n'est PAS allowlistée et sera donc bien détectée.
  '''"role":"anon"''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzYmthZWx0dWJxaXR0eXdpYmVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYwNjk0MzAsImV4cCI6MjA2MTY0NTQzMH0\.N4l07k3V_X5I8iW0n_D6K9-O4v5l7l6s6MYGpJIXRW_rB8zc45k7chqi8Ljl_CLiLc''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzYmthZWx0dWJxaXR0eXdpYmVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1NDYyNzUsImV4cCI6MjA5MjEyMjI3NX0\.eAyJfqREb8Kh5F_yLf5Jp43S2qOil4qUcqFTLQiExx0''',
]
stopwords = [
  "anon",
  "publishable",
  "example",
]

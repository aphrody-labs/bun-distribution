# Optimise la RAM globale en activant le mode smol de Bun
smol = true

[install]
# Hoist deps autant que possible (vitesse + déduplication)
hoist = true
saveTextLockfile = true
exact = false

[install.scopes]
"@rg" = { url = "" }

[run]
# Permet d'utiliser bun comme task runner sans préfixe
bun = true
silent = false

[test]
coverage = false
# Globals DOM (document/window) pour les tests de composants React via happy-dom.
preload = ["./happydom.ts"]

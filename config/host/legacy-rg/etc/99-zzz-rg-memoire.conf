# Réglages mémoire du VPS Rose Griffon — déposé dans /etc/sysctl.d/.
#
# ATTENTION au nom du fichier : /etc/sysctl.d est appliqué dans l'ordre lexicographique et
# le dernier écrit gagne. Deux fichiers posaient déjà vm.swappiness avec des valeurs
# différentes (99-rpb-performance.conf : 5, puis 99-zz-llm-tuning.conf : 1, qui l'emportait
# sans que rien ne le signale). Le préfixe « 99-zzz- » place celui-ci après les deux : c'est
# lui qui décide, et les valeurs ci-dessous sont donc celles qui s'appliquent réellement.
# Vérification : « sysctl vm.swappiness vm.page-cluster ».

# Le swap principal est zram (RAM compressée, priorité 100), pas le disque. Y déplacer une
# page coûte une compression zstd, pas une écriture SSD : le noyau doit donc s'en servir
# franchement au lieu de garder des pages anonymes froides en mémoire. La valeur héritée
# était 1 — « ne swappe qu'en dernier recours » — et le résultat était un swapfile de 4 Gio
# plein en permanence, sans amortisseur, avec earlyoom qui tuait le type-check en plein
# déploiement.
vm.swappiness = 15

# Une lecture de swap ramène 2^page-cluster pages d'un coup. C'est rentable sur un disque,
# où le coût est dominé par le déplacement de la tête ; c'est du gaspillage sur zram, où
# chaque page décompressée est du travail CPU pur. 0 = une page à la fois.
vm.page-cluster = 0

# Conserve les dentries et inodes en cache plus longtemps que le défaut (100) : le VFS du
# jeu compte 255 308 entrées et les services les reparcourent en boucle.
vm.vfs_cache_pressure = 50

# Réveille la récupération mémoire plus tôt (défaut 10). Avec 12 cœurs qui allouent en
# rafale pendant un build Next ou un cargo, attendre le seuil bas laisse le noyau récupérer
# en urgence, ce qui se voit comme un gel de quelques secondes.
vm.watermark_scale_factor = 125

# Nombre maximum de zones mémoire par processus. Les moteurs de build modernes (Turbopack,
# rustc en parallèle sur 12 cœurs) dépassent le défaut de 65 530 et échouent alors sur un
# ENOMEM trompeur, machine pourtant loin d'être pleine.
vm.max_map_count = 1048576

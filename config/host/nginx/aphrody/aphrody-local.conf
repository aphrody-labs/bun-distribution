# Installer replaces @STATE@ and @PRIVATE@ with user-owned absolute paths.
worker_processes 1;
pid @STATE@/nginx.pid;
error_log @STATE@/nginx-error.log warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path @STATE@/client-body;
    proxy_temp_path @STATE@/proxy;
    server {
        listen 0.0.0.0:1421 ssl;
        server_name _;
        ssl_certificate @PRIVATE@/tls.crt;
        ssl_certificate_key @PRIVATE@/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        auth_basic "Aphrody";
        auth_basic_user_file @PRIVATE@/htpasswd;
        root @STATE@/current/ui;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        client_max_body_size 64m;
        location ~ ^/(mcp|api/v1)(/|$) {
            if ($http_origin ~* "^https?://") { set $has_origin 1; }
            set $valid_origin "$scheme://$http_host";
            set $request_origin $http_origin;
            if ($request_origin = $valid_origin) { set $has_origin 0; }
            if ($has_origin = 1) { return 403; }
            proxy_pass http://127.0.0.1:8791;
            proxy_set_header Host 127.0.0.1:8791;
            proxy_set_header Origin http://127.0.0.1:8791;
            include @PRIVATE@/mcp-auth.conf;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location = /healthz { auth_basic off; default_type application/json; return 200 '{"ok":true,"service":"aphrody-app-ui"}'; }
        location ~ ^/(rpc|events|notifications|health)$ {
            # Reject browser requests originating from a different public authority.
            if ($http_origin ~* "^https?://") { set $has_origin 1; }
            set $valid_origin "$scheme://$http_host";
            set $request_origin $http_origin;
            if ($request_origin = $valid_origin) { set $has_origin 0; }
            if ($has_origin = 1) { return 403; }
            proxy_pass http://127.0.0.1:8765;
            proxy_set_header Host 127.0.0.1:8765;
            proxy_set_header Origin http://127.0.0.1:8765;
            proxy_set_header Authorization "";
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}

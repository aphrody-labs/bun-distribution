# Retired 2026-09-25: aphrody.com's origin (aphrody-site) and its certificate were removed from vps (config/nginx-routes.json status:retired; docs/PLAN.md). Kept as a redeploy template for the Aphrody convergence plan (superproject docs/architecture/APHRODY-CONVERGENCE.md).
# Aphrody public routing.
#
# Canonical origins:
#   127.0.0.1:8083  aphrody-site      OS UI and Web REST
#   127.0.0.1:8788  aphrody-a2a       AI A2A, loopback only
#   127.0.0.1:8085  nie-site          nie backend (API, raw VFS), nie.aphrody.com only
#   127.0.0.1:8792  nie-model-serve   derived game assets, nie.aphrody.com/cdn/ and
#                                     cdn.rosegriffon.fr only (never from this file)
#
# BXC is a web capability in aphrody-os; N2B remains a backend capability.
# `bxc-site :8084` and `n2b-site :8086` are retired.
#
# Install only after an exact-origin/main build:
#   sudo install -m 644 $YOLO_ROOT/config/host/nginx/aphrody/aphrody.com.conf /etc/nginx/conf.d/aphrody.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# `nie.aphrody.com` (the only public name of nie, a backend) and `cdn.aphrody.com` (aphrody's
# shared static CDN) live in aphrody-nie-cdn.conf, which also defines the `nie_assets` /
# `nie_conn` zones that api.aphrody.com below reuses: install that file first.

# --- Reserved hosts: no origin until their future projects are promoted ----------------------
# These reserved names must not fall through to a stopped placeholder service:
# an explicit 410 keeps the production contract deterministic.
# `downloads.aphrody.com` has never had a backing service (unlike the retired hosts elsewhere
# in this file) and so has no config/nginx-routes.json entry by design — a reserved host with no
# service is not a "route" in that catalog's schema. See docs/PORTS-AND-DOMAINS.md.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name downloads.aphrody.com
        bot.aphrody.com admin.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location / {
        return 410 '{"status":"retired","service":"reserved-aphrody-host"}\n';
        default_type application/json;
    }
}

# --- N2B compatibility host: one backend, no standalone site -------------------------------
# Retired 2026-09-25 along with its 8083 backend (config/nginx-routes.json: n2b.aphrody.com,
# status retired). Kept as a redeploy template, same as the rest of this file.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name n2b.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / {
        return 308 https://aphrody.com/api/v1/n2b;
    }

    location = /api/v1/n2b {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/n2b/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}

# Retired 2026-09-25 along with its 8083/8788/8789 backends (config/nginx-routes.json:
# api.aphrody.com, status retired). Kept as a redeploy template, same as the rest of this file.
# --- api.aphrody.com : l'API de lecture, et RIEN d'autre -------------------------------------
# Le meme service que `aphrody.com`, mais restreint a ses espaces de donnees. Sans cette
# restriction, l'hote servirait aussi les pages HTML : deux origines rendraient le meme
# contenu, chacune avec son propre canonique — le doublon exact que `hreflang` et `canonical`
# existent pour eviter. D'ou le 404 par defaut et le `noindex`.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_req zone=nie_assets burst=40 nodelay;
    limit_conn nie_conn 16;
    limit_req_status 429;
    limit_conn_status 429;

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /healthz { proxy_pass http://127.0.0.1:8083/healthz; proxy_set_header Host $host; }
    location = /health  { proxy_pass http://127.0.0.1:8083/healthz; proxy_set_header Host $host; }
    location = /.well-known/agent-card.json { proxy_pass http://127.0.0.1:8788/.well-known/agent-card.json; proxy_set_header Host $host; }
    location = /api/v1/openapi.json { proxy_pass http://127.0.0.1:8083/api/v1/openapi.json; proxy_set_header Host $host; }
    location = /api/v1/ecosystem { proxy_pass http://127.0.0.1:8083/api/v1/ecosystem; proxy_set_header Host $host; }
    location = /llms.txt { proxy_pass http://127.0.0.1:8083/llms.txt; proxy_set_header Host $host; }
    location = /ai.json { alias /srv/aphrody/current/ai.json; default_type application/json; }
    location = /api/v1/a2a {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
    location ^~ /api/v1/a2a/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location = /api/v1/models { proxy_pass http://127.0.0.1:8789/api/v1/models; proxy_set_header Host $host; }
    location = /api/v1/rag/query { proxy_pass http://127.0.0.1:8789/api/v1/rag/query; proxy_set_header Host $host; }
    location = /api/v1/rag/stats { proxy_pass http://127.0.0.1:8789/api/v1/rag/stats; proxy_set_header Host $host; }
    location /api/ { proxy_pass http://127.0.0.1:8083; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    # No nie route here: the raw VFS spaces `/f/` and `/b` (nie-site :8085) are published on
    # nie.aphrody.com only, behind nie-site's bearer token (aphrody-nie-cdn.conf).

    # Tout le reste — les pages, le bundle — n'a rien a faire ici.
    location / { return 404; }
}

# --- HTTP -> HTTPS, pour tous les hotes de ce certificat ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.aphrody.com downloads.aphrody.com
        bot.aphrody.com admin.aphrody.com n2b.aphrody.com;
    access_log off;
    return 301 https://$host$request_uri;
}

# aphrody.com, www.aphrody.com and mcp.aphrody.com live in aphrody-apex.conf.

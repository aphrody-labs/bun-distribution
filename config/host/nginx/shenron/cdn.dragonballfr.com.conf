# SPDX-License-Identifier: Apache-2.0
#
# cdn.dragonballfr.com: Shenron asset CDN (vps), served entirely from disk, with no
# dependency on a running release. Root /srv/shenron-cdn (layout and sync in
# nginx/shenron/00-shenron.conf and systemd/shenron/shenron-cdn-sync.service):
#   /wiki/...           wiki media (Range, long cache)
#   /assets/wiki/...    same files, legacy alias
#   /assets/...         bot assets
#   /_next/static/...   Next build chunks (immutable)
#   /_next/image        Next optimizer when it runs, else 302 to the original file
#   /<file>             site public/ and site-extra/ files (fonts, banners, sprites...)
#   /health             CDN liveness
# The site is built with NEXT_PUBLIC_CDN_URL = NEXT_PUBLIC_SHENRON_ASSETS_URL =
# https://cdn.dragonballfr.com (inlined at build time).
# Route declared in nginx/routes.json ("cdn.dragonballfr.com").
#
# Install (vps), from config/host:
#   sudo install -m 644 nginx/shenron/cdn.dragonballfr.com.conf /etc/nginx/conf.d/cdn.dragonballfr.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Rollback: remove /etc/nginx/conf.d/cdn.dragonballfr.com.conf, `sudo nginx -t`, reload.

server {
    listen 80;
    listen [::]:80;
    server_name cdn.dragonballfr.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdn.dragonballfr.com;

    ssl_certificate     /etc/letsencrypt/live/cdn.dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.dragonballfr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_cdn_dbfr:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    # headers-more: inherited by every location, added on every status.
    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    more_set_headers "Access-Control-Allow-Origin: *";
    more_set_headers "Timing-Allow-Origin: *";
    more_set_headers "Cross-Origin-Resource-Policy: cross-origin";

    access_log /var/log/nginx/cdn-dragonballfr-access.log combined buffer=64k flush=1m;
    error_log  /var/log/nginx/cdn-dragonballfr-error.log warn;

    root /srv/shenron-cdn;
    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;
    # Large clips: asynchronous reads past 8 MiB, sendfile below.
    aio threads;
    directio 8m;
    output_buffers 2 1m;
    open_file_cache max=50000 inactive=120s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    brotli on;
    brotli_comp_level 5;
    brotli_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain text/xml application/xml font/ttf font/otf;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain text/xml application/xml font/ttf font/otf;

    if ($shenron_mirror_tmp) { return 404; }

    location ~* "\.(env|git/|aws/|ssh/|sql|bak|old|swp|DS_Store)$" { return 410; }

    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "cdn ok\n";
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location ^~ /_next/static/ {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri @release_static;
    }
    # A chunk of a newer release not mirrored yet: Next when it runs, else 404.
    location @release_static {
        proxy_pass http://shenron_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host dragonballfr.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        error_page 502 504 = @absent;
    }

    location /_next/image {
        proxy_pass http://shenron_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host dragonballfr.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_cache shenron_images;
        proxy_cache_key "$scheme$request_method$host$uri$is_args$args$http_accept";
        proxy_cache_valid 200 1d;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        error_page 502 504 = @image_origin;
    }
    location @image_origin {
        if ($shenron_image_origin = "") { return 404; }
        return 302 /$shenron_image_origin;
    }

    location ^~ /assets/wiki/ {
        limit_except GET HEAD { deny all; }
        alias /srv/shenron-cdn/wiki/;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000";
    }

    location ^~ /wiki/ {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location = /api/health {
        proxy_pass http://shenron_site/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host dragonballfr.com;
        proxy_connect_timeout 3s;
        error_page 502 504 = @site_down;
    }
    location @site_down {
        default_type application/json;
        more_set_headers "Cache-Control: no-store";
        return 503 '{"status":"down","cdn":"ok"}\n';
    }

    location = / { return 302 https://dragonballfr.com/; }

    # Site public files; directories and unknown paths are not listed.
    location / {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files /site$uri /site-extra$uri =404;
    }

    location @absent { return 404; }
}

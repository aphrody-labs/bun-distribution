# Reproducible import of the Tauri-stack forks into crates/tauri/aphrody-*  (see docs/VENDORING.md)
# `yolo import` reads the committed HEAD of each submodule under vendor/ and rewrites the crates.

prefix = "aphrody-"
repository = "https://github.com/aphrody-labs/yolo"
out = "crates"

# File globs (relative to each source repository) never imported.
exclude = [
  "**/target/**",
  "**/node_modules/**",
  "**/Cargo.lock",
  "**/.github/**",
  "**/.changes/**",
  "**/renovate.json",
  "**/pnpm-lock.yaml",
  "**/pnpm-workspace.yaml",
  "**/permissions/schemas/schema.json", # generated by the plugin build
]

[[source]]
name = "tauri"
rustfmt = "rustfmt.toml"
crates = [
  "crates/tauri",
  "crates/tauri-build",
  "crates/tauri-bundler",
  "crates/tauri-cli",
  "crates/tauri-codegen",
  "crates/tauri-driver",
  "crates/tauri-macos-sign",
  "crates/tauri-macros",
  "crates/tauri-plugin",
  "crates/tauri-examples",
  "crates/tauri-schema-worker",
  "crates/tauri-runtime",
  "crates/tauri-runtime-cef",
  "crates/tauri-runtime-wry",
  "crates/tauri-schema-generator",
  "crates/tauri-utils",
  "crates/tests/acl",
  "crates/tests/restart",
  "packages/cli",
]
# The Tauri CLI is served by `aphrody tauri` (multi-call binary): no standalone `cargo-tauri` binary.
exclude = ["crates/tauri-cli/src/main.rs"]
# Not vendored on purpose (see `yolo import --scan`): the migrate fixtures, cef-rollback, the
# benchmark crates and the example apps under examples/ (frontends, mobile projects).

[[source]]
name = "plugins-workspace"
rustfmt = "default"
crates = ["plugins/*"]
# plugins/*/contributors: one shared assets/tauri/contributors (see the [[copy]] and README rewrite below).
# plugins/*/SECURITY.md: identical upstream policy, kept once as crates/tauri/SECURITY.md.
exclude = ["plugins/*/examples/**", "plugins/*/tests/**", "plugins/*/contributors/**", "plugins/*/SECURITY.md"]

[[source]]
name = "wry"
rustfmt = "rustfmt.toml"
crates = ["."]
exclude = ["bench/**", "audits/**", ".license_template", "examples/wgpu.rs"]

[[source]]
name = "tao"
rustfmt = "rustfmt.toml"
crates = [".", "tao-macros"]
exclude = ["audits/**", ".gitmodules"]

[[source]]
name = "create-tauri-app"
rustfmt = "default"
crates = [".", "node"]
# src/main.rs: served by `aphrody create-tauri-app`, no standalone binary.
exclude = ["worker/**", ".scripts/**", "*.sh", "*.ps1", "package.json", "CONTRIBUTING.md", "src/main.rs"]

# Plugin README logos live once in assets/tauri/contributors (identical files in six plugins).
[[copy]]
from = "plugins-workspace:plugins/nfc/contributors"
to = "assets/tauri/contributors"

[[copy]]
from = "plugins-workspace:plugins/haptics/contributors"
to = "assets/tauri/contributors"

[[rewrite]]
files = "crates/aphrody-tauri-plugin-*/README.md"
from = 'src="contributors/'
to = 'src="../../../assets/tauri/contributors/'

# Sources of the `tauri-examples` crate (its [[example]] entries live outside the crate).
[[copy]]
from = "tauri:examples"
to = "examples/tauri"
exclude = ["api/**", "cef/**", "file-associations/**", "resources/**"]

[[rewrite]]
files = "crates/aphrody-tauri-examples/**"
from = "../../examples/"
to = "../../examples/tauri/"

[[rewrite]]
files = "examples/tauri/**/*.rs"
from = "../../examples/"
to = "../../examples/tauri/"

[[rewrite]]
files = "crates/aphrody-tauri-cli/Cargo.toml"
from = '''[[bin]]
name = "cargo-tauri"
path = "src/main.rs"

'''
to = ""

[[rewrite]]
files = "crates/aphrody-create-tauri-app/Cargo.toml"
from = '''[[bin]]
name = "cargo-create-tauri-app"
path = "src/main.rs"

'''
to = ""

# One config schema: the generator crate owns it; the CLI embeds that copy instead of a second generated file.
[[rewrite]]
files = "crates/aphrody-tauri-schema-generator/build.rs"
from = '''    write_if_changed(out.join("../aphrody-tauri-cli/config.schema.json"), config_schema)?;
'''
to = ""

[[rewrite]]
files = "crates/aphrody-tauri-cli/src/helpers/config.rs"
from = '''include_str!("../../config.schema.json")'''
to = '''include_str!("../../../aphrody-tauri-schema-generator/schemas/config.schema.json")'''

# One version per crate: the vendored crates follow the workspace pins so Cargo.lock keeps a single copy
# (jsonschema, resvg, urlpattern, infer, json5, cargo_metadata, zip, whoami) and wry drops the wgpu 23 dev-dependency
# of its wgpu example (wgpu 30 is the workspace GPU stack).
[[rewrite]]
files = "crates/aphrody-tauri-cli/Cargo.toml"
from = '''json5 = "0.4"'''
to = '''json5 = "1.3"'''

[[rewrite]]
files = "crates/aphrody-tauri-cli/Cargo.toml"
from = '''jsonschema = { version = "0.49", default-features = false }'''
to = '''jsonschema = { version = "0.58", default-features = false }'''

[[rewrite]]
files = "crates/aphrody-tauri-cli/Cargo.toml"
from = '''resvg = "0.47"'''
to = '''resvg = "0.48"'''

[[rewrite]]
files = "crates/aphrody-tauri-utils/Cargo.toml"
from = '''json5 = { version = "0.4", optional = true }'''
to = '''json5 = { version = "1.3", optional = true }'''

[[rewrite]]
files = "crates/aphrody-tauri-utils/Cargo.toml"
from = '''cargo_metadata = { version = "0.19", optional = true }'''
to = '''cargo_metadata = { version = "0.23", optional = true }'''

[[rewrite]]
files = "crates/aphrody-tauri-plugin-http/Cargo.toml"
from = '''urlpattern = "0.3"'''
to = '''urlpattern = "0.6"'''

[[rewrite]]
files = "crates/aphrody-tauri-plugin-updater/Cargo.toml"
from = '''infer = "0.19"'''
to = '''infer = "0.22"'''

[[rewrite]]
files = "crates/aphrody-tauri-plugin-updater/Cargo.toml"
from = '''zip = { version = "4", default-features = false, optional = true }'''
to = '''zip = { version = "8", default-features = false, optional = true }'''

[[rewrite]]
files = "crates/aphrody-create-tauri-app/Cargo.toml"
from = '''whoami = { version = "1.6.0", default-features = false }'''
to = '''whoami = { version = "2", default-features = false }'''

[[rewrite]]
files = "crates/aphrody-create-tauri-app/src/lib.rs"
from = '''utils::to_valid_pkg_name(&whoami::username())'''
to = '''utils::to_valid_pkg_name(&whoami::username().unwrap_or_default())'''

[[rewrite]]
files = "crates/aphrody-wry/Cargo.toml"
from = '''wgpu = "23"
'''
to = ''''''

# The v2 migration snapshots expect the versions of metadata-v2.json (tauri and tauri-runtime-wry alpha.4,
# tauri-build alpha.3); the upstream snapshots lag one release behind. Order matters: alpha.3 first, then alpha.2.
[[rewrite]]
files = "crates/aphrody-tauri-cli/src/migrate/migrations/v2/snapshots/*Cargo.toml.snap"
from = '''version = "3.0.0-alpha.3"'''
to = '''version = "3.0.0-alpha.4"'''

[[rewrite]]
files = "crates/aphrody-tauri-cli/src/migrate/migrations/v2/snapshots/*Cargo.toml.snap"
from = '''version = "3.0.0-alpha.2"'''
to = '''version = "3.0.0-alpha.3"'''

# Scaffolded apps depend on the Aphrody packages (the dependency keys stay `tauri`, `tauri-build`…).
[[rewrite]]
files = "crates/aphrody-create-tauri-app/templates/_base_/src-tauri/Cargo.toml.lte"
from = 'tauri-build = { version = "3.0.0-alpha", features = [] }'
to = 'tauri-build = { package = "aphrody-tauri-build", version = "3.0.0-alpha", features = [] }'

[[rewrite]]
files = "crates/aphrody-create-tauri-app/templates/_base_/src-tauri/Cargo.toml.lte"
from = 'tauri = { version = "3.0.0-alpha", features = [] }'
to = 'tauri = { package = "aphrody-tauri", version = "3.0.0-alpha", features = [] }'

[[rewrite]]
files = "crates/aphrody-create-tauri-app/templates/_base_/src-tauri/Cargo.toml.lte"
from = 'tauri-plugin-opener = "3.0.0-alpha"'
to = 'tauri-plugin-opener = { package = "aphrody-tauri-plugin-opener", version = "3.0.0-alpha" }'

[[rewrite]]
files = "crates/aphrody-create-tauri-app/src/deps.rs"
from = "cargo install tauri-cli --version ^3.0.0-alpha --locked"
to = "cargo install aphrody-tauri-cli --version ^3.0.0-alpha --locked"

# Reproducible import of the Tauri-stack forks into crates/tauri/aphrody-*  (see docs/guides/workspace/VENDORING.md)
# `yolo import` reads the committed HEAD of each submodule under vendor/ and rewrites the crates.

prefix = "aphrody-"
repository = "https://github.com/aphrody-labs/yolo"
out = "crates/tauri"

# File globs (relative to each source repository) never imported.
exclude = [
  "**/target/**",
  "**/node_modules/**",
  "**/Cargo.lock",
  "**/.github/**",
  "**/.changes/**",
  "**/renovate.json",
  "**/pnpm-lock.yaml",
  "**/pnpm-workspace.yaml",
  "**/permissions/schemas/schema.json", # generated by the plugin build
]

[[source]]
name = "tauri"
rustfmt = "rustfmt.toml"
crates = [
  "crates/tauri",
  "crates/tauri-build",
  "crates/tauri-bundler",
  "crates/tauri-cli",
  "crates/tauri-codegen",
  "crates/tauri-macros",
  "crates/tauri-plugin",
  "crates/tauri-runtime",
  "crates/tauri-runtime-cef",
  "crates/tauri-utils",
  "crates/tests/acl",
  "packages/cli",
]
# The Tauri CLI is served by `aphrody tauri` (multi-call binary): no standalone `cargo-tauri` binary.
exclude = ["crates/tauri-cli/src/main.rs"]
# Not vendored on purpose (see `yolo import --scan`): the migrate fixtures, cef-rollback, the
# benchmark crates and the example apps under examples/ (frontends, mobile projects).

[[source]]
name = "plugins-workspace"
rustfmt = "default"
# Only the plugins the desktop app registers (crates/ui/app); mobile and unused plugins are not imported.
crates = ["plugins/autostart", "plugins/clipboard-manager", "plugins/deep-link", "plugins/dialog", "plugins/fs", "plugins/global-shortcut", "plugins/log", "plugins/notification", "plugins/opener", "plugins/os", "plugins/process", "plugins/single-instance", "plugins/store", "plugins/updater", "plugins/window-state"]
# plugins/*/contributors: one shared assets/tauri/contributors (see the [[copy]] and README rewrite below).
# plugins/*/SECURITY.md: identical upstream policy, kept once as crates/tauri/SECURITY.md.
exclude = ["plugins/*/examples/**", "plugins/*/tests/**", "plugins/*/contributors/**", "plugins/*/SECURITY.md"]

# Plugin README logos live once in assets/tauri/contributors (identical files in six plugins).

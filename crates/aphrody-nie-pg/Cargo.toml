[package]
name = "aphrody-nie-pg"
description = "Import des cfg.bin du VFS IEVR (RDBN et T2B) dans PostgreSQL, schéma `nie`, sans étape JSON"
version.workspace = true
edition.workspace = true
license-file = "../../docs/licenses/iecode/nie/LICENSE"
publish = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
real-fixtures = ["aphrody-nie-formats/real-fixtures"]

[dependencies]
aphrody-nie-formats = { workspace = true, features = ["std"] }
tokio-postgres = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
futures-util = { workspace = true }
sha2 = { version = "0.10" }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }

[[bin]]
name = "aphrody-nie-pg"
path = "src/main.rs"

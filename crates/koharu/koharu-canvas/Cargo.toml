[package]
name = "koharu-canvas"
version = "0.83.5"
edition = "2024"
description = "Manga translation tools"
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
readme = "README.md"
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = false
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = { workspace = true }
js-sys = { workspace = true }
koharu-rasterizer = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
vello = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "ColorSpaceConversion",
    "HtmlCanvasElement",
    "ImageBitmap",
    "ImageBitmapOptions",
    "ImageOrientation",
    "PremultiplyAlpha",
    "Window",
] }

[dev-dependencies]
koharu-rasterizer = { workspace = true }

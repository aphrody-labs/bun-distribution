[package]
name = "koharu-library"
version = "0.83.5"
edition = "2024"
description = "Headless Koharu SDK for projects, editing, processing, rendering, and agent tools"
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
readme = "README.md"
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = false
[dependencies]
alphanumeric-sort = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
hayro = { workspace = true }
image = { workspace = true }
koharu-config = { workspace = true }
koharu-agent = { workspace = true }
koharu-desktop = { workspace = true }
koharu-ml = { workspace = true }
koharu-pipeline = { workspace = true }
koharu-psd = { workspace = true }
koharu-rasterizer = { workspace = true, features = ["native"] }
koharu-renderer = { workspace = true }
koharu-scene = { workspace = true }
koharu-secrets = { workspace = true }
koharu-storage = { workspace = true }
koharu-translator = { workspace = true }
koharu-runtime = { workspace = true }
koharu-diffusion = { workspace = true }
koharu-llama = { workspace = true }
koharu-torch = { workspace = true }
rars = { workspace = true }
rayon = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
koharu-canvas = { path = "../koharu-canvas" }

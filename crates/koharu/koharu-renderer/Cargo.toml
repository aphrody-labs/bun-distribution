[package]
name = "koharu-renderer"
version = "0.83.5"
edition = "2024"
description = "Manga translation tools"
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
readme = "README.md"
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = false
[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
image = { workspace = true }
koharu-config = { workspace = true }
koharu-rasterizer = { workspace = true, features = ["native"] }
koharu-scene = { workspace = true }
koharu-runtime = { workspace = true }
skrifa = { workspace = true }
harfrust = { workspace = true }
hypher = { workspace = true }
icu_normalizer = { workspace = true }
icu_properties = { workspace = true, features = ["compiled_data"] }
icu_segmenter = { workspace = true, features = ["compiled_data"] }
jieba-rs = { workspace = true }
unicode-bidi = { workspace = true }
fontique = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rayon = { workspace = true }
tracing = { workspace = true }
vello = { workspace = true }
webp = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "rendering"
harness = false

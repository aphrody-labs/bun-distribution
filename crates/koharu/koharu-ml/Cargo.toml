[package]
name = "koharu-ml"
version = "0.83.5"
edition = "2024"
description = "Manga translation tools"
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
readme = "README.md"
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = false
[dependencies]
koharu-diffusion = { workspace = true }
koharu-llama = { workspace = true, features = ["llguidance"] }
koharu-runtime = { workspace = true }
koharu-torch = { workspace = true }
llguidance = { workspace = true }
ab_glyph = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
image = { workspace = true }
imageproc = { workspace = true }
icu_properties = { workspace = true }
encoding_rs = { workspace = true }
fast_image_resize = { workspace = true }
minijinja = { workspace = true }
minijinja-contrib = { workspace = true }
rayon = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rayon = { workspace = true }
tokenizers = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }


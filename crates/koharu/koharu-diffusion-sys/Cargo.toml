[package]
name = "koharu-diffusion-sys"
version = "0.83.5"
edition = "2024"
description = "Low-level dynamically loaded FFI bindings for stable-diffusion.cpp."
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
readme = "README.md"
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
keywords = ["stable-diffusion", "diffusion", "ffi", "bindings", "machine-learning"]
categories = ["external-ffi-bindings", "science"]
publish = true
build = "build.rs"

[dependencies]
libloading = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
koharu-bindgen = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["anyhow", "koharu-bindgen", "libc", "libloading"]

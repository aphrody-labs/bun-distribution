[package]
name = "koharu-app"
version = "0.83.5"
edition = "2024"
description = "Manga translation tools"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = false
license = "MIT OR Apache-2.0"
[dependencies]
alphanumeric-sort = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
hayro = { workspace = true }
image = { workspace = true }
koharu-agent = { workspace = true }
koharu-library = { workspace = true }
koharu-desktop = { workspace = true }
koharu-ml = { workspace = true }
koharu-metrics = { workspace = true }
koharu-pipeline = { workspace = true }
koharu-psd = { workspace = true }
koharu-renderer = { workspace = true }
koharu-rasterizer = { workspace = true, features = ["native"] }
koharu-runtime = { workspace = true }
koharu-scene = { workspace = true }
koharu-secrets = { workspace = true }
koharu-translator = { workspace = true }
open = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
rars = { workspace = true }
rfd = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
strum = { workspace = true }
tauri = { workspace = true, features = ["dynamic-acl", "specta"] }
tauri-runtime-cef = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-specta = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-rayon = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
webp = { workspace = true }
zip = { workspace = true }

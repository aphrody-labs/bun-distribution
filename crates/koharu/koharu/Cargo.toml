[package]
name = "koharu"
default-run = "koharu"
version = "0.83.5"
edition = "2024"
description = "Manga translation tools"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
readme = "README.md"
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = false
license = "MIT OR Apache-2.0"
[dependencies]
clap = { workspace = true }
console = { workspace = true }
koharu-app = { workspace = true, features = ["cef"] }
koharu-metrics = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
sentry = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true, features = ["dynamic-acl", "specta"] }
tauri-runtime-cef = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-process = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_System_Console"] }

[build-dependencies]
tauri-build = { workspace = true }

[package.metadata.cargo-machete]
ignored = [
    "serde_json",
    "tauri-build",
    "tauri-plugin-opener",
    "tauri-plugin-process",
]

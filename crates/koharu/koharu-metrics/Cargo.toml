[package]
name = "koharu-metrics"
version = "0.83.5"
edition = "2024"
description = "Manga translation tools"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = false
license = "MIT OR Apache-2.0"
[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
sys-locale = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Registry"] }

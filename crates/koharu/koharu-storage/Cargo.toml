[package]
name = "koharu-storage"
version = "0.83.5"
edition = "2024"
description = "Filesystem-native snapshot and blob storage for Koharu."
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
readme = "README.md"
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = false
[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
fs4 = { workspace = true }
memmap2 = { workspace = true }
parking_lot = { workspace = true }
revision = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "storage"
harness = false

[package]
name = "koharu-pipeline"
version = "0.83.5"
edition = "2024"
description = "In-process scene-processing workflow for Koharu."
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
readme = "README.md"
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = false
[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
image = { workspace = true }
imageproc = { workspace = true }
koharu-ml = { workspace = true }
koharu-config = { workspace = true }
koharu-renderer = { workspace = true }
koharu-rasterizer = { workspace = true, features = ["native"] }
koharu-scene = { workspace = true }
koharu-translator = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
strum = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tokio-rayon = { workspace = true }
tracing = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[dev-dependencies]
toml = { workspace = true }

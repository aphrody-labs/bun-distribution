[package]
name = "koharu-rasterizer"
version = "0.83.5"
edition = "2024"
description = "Portable prepared frames and shared Vello/WGPU composition for Koharu."
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
readme = "README.md"
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = false
[features]
default = ["native"]
native = [
    "dep:anyhow",
    "dep:fast_image_resize",
    "dep:image",
    "dep:parking_lot",
    "dep:pollster",
]

[dependencies]
anyhow = { workspace = true, optional = true }
blake3 = { workspace = true }
fast_image_resize = { workspace = true, optional = true }
image = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
postcard = { workspace = true }
serde = { workspace = true, features = ["rc"] }
thiserror = { workspace = true }
vello = { workspace = true }

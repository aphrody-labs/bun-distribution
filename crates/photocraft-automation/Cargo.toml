[package]
name = "photocraft-automation"
description = "MCP server (rmcp) over the Photocraft engine, plus a bridge to a running GUI"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
photocraft-geom = { path = "../photocraft-geom", version = "0.8.2" }
photocraft-doc = { path = "../photocraft-doc", version = "0.8.2" }
photocraft-compose = { path = "../photocraft-compose", version = "0.8.2" }
photocraft-codecs = { path = "../photocraft-codecs", version = "0.8.2" }
photocraft-io = { path = "../photocraft-io", version = "0.8.2" }
photocraft-format = { path = "../photocraft-format", version = "0.8.2" }
photocraft-engine = { path = "../photocraft-engine", version = "0.8.2" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time"] }
base64 = "0.22"
schemars = "1"
getrandom = "0.3"
cap-std = "4"

[dev-dependencies]
rmcp = { version = "3.5", default-features = false, features = ["client", "server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time"] }

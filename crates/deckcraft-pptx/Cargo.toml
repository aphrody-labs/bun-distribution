[package]
name = "deckcraft-pptx"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DeckCraft PPTX: Office Open XML (PresentationML/DrawingML) import and export, written from the public ECMA-376 standard"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[dependencies]
deckcraft-model = { path = "../deckcraft-model" }
deckcraft-geom = { path = "../deckcraft-geom" }
deckcraft-color = { path = "../deckcraft-color" }
quick-xml = "0.38"
zip = { version = "3", default-features = false, features = ["deflate"] }
thiserror = "2"
log = "0.4"

[dev-dependencies]
deckcraft-engine = { path = "../deckcraft-engine" }
serde_json = { version = "1", features = ["float_roundtrip"] }
deckcraft-color = { path = "../deckcraft-color" }
deckcraft-geom = { path = "../deckcraft-geom" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
zip = { version = "3", default-features = false, features = ["deflate"] }

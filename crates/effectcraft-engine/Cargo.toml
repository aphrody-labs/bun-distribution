[package]
name = "effectcraft-engine"
description = "The EffectCraft engine: session, undo history, editor state and the command registry every frontend (UI, CLI, control channel, MCP) dispatches through"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-time = { path = "../effectcraft-time" }
effectcraft-geom = { path = "../effectcraft-geom" }
effectcraft-color = { path = "../effectcraft-color" }
effectcraft-keyframe = { path = "../effectcraft-keyframe" }
effectcraft-project = { path = "../effectcraft-project" }
effectcraft-raster = { path = "../effectcraft-raster" }
effectcraft-path = { path = "../effectcraft-path" }
effectcraft-text = { path = "../effectcraft-text" }
effectcraft-effects = { path = "../effectcraft-effects" }
effectcraft-render = { path = "../effectcraft-render" }
effectcraft-segment = { path = "../effectcraft-segment" }
effectcraft-track = { path = "../effectcraft-track" }
effectcraft-model = { path = "../effectcraft-model" }
effectcraft-lottie = { path = "../effectcraft-lottie" }
effectcraft-interchange = { path = "../effectcraft-interchange" }
effectcraft-psd = { path = "../effectcraft-psd" }
kurbo = { version = "0.13", features = ["serde"] }
effectcraft-svg = { path = "../effectcraft-svg" }
effectcraft-pdf = { path = "../effectcraft-pdf" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
log = "0.4"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
web-time = "1"
exr = "1.74"

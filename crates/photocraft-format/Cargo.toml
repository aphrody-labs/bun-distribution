[package]
name = "photocraft-format"
description = "Native .pcraft document bundle: manifest + content-addressed zstd tiles"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
photocraft-geom = { path = "../photocraft-geom", version = "0.8.2" }
photocraft-color = { path = "../photocraft-color", version = "0.8.2" }
photocraft-raster = { path = "../photocraft-raster", version = "0.8.2" }
photocraft-doc = { path = "../photocraft-doc", version = "0.8.2" }
photocraft-codecs = { path = "../photocraft-codecs", version = "0.8.2" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
thiserror = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1.5"
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
ruzstd = "0.9"

[dev-dependencies]
proptest = "1"

[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

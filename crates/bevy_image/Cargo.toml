[package]
name = "bevy_image"
version = "0.20.0"
edition = "2024"
description = "Provides image types for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
default = ["bevy_reflect"]

# bevy_reflect can't optional as it's needed for TypePath
# this feature only control reflection in bevy_image
bevy_reflect = ["bevy_math/bevy_reflect"]

# Image formats
basis-universal = ["dep:basis-universal"]
bmp = ["image/bmp"]
dds = ["ddsfile"]
exr = ["image/exr"]
ff = ["image/ff"]
gif = ["image/gif"]
hdr = ["image/hdr"]
ktx2 = ["dep:ktx2"]
ico = ["image/ico"]
jpeg = ["image/jpeg"]
png = ["image/png"]
pnm = ["image/pnm"]
qoi = ["image/qoi"]
tga = ["image/tga"]
tiff = ["image/tiff"]
webp = ["image/webp"]
serialize = ["bevy_reflect", "bevy_platform/serialize", "wgpu-types/serde"]

# For ktx2 supercompression
zlib = ["flate2"]

# A marker feature indicating zstd support is required for a particular feature.
# A backend must be chosen by enabling either the "zstd_rust" or the "zstd_c" feature.
zstd = []
# Pure-rust zstd implementation (safer)
zstd_rust = ["zstd", "dep:ruzstd"]
# Binding to zstd C implementation (faster)
zstd_c = ["zstd", "dep:zstd"]

# Texture compression asset processor (cross-platform, transcodes to any GPU format at load time)
compressed_image_saver_universal = ["basis-universal"]

# Texture compression asset processor (BCn for desktop, ASTC for mobile via env var)
compressed_image_saver = ["dep:ctt", "ktx2", "zstd"]

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.20.0" }
bevy_asset = { path = "../bevy_asset", version = "0.20.0" }
bevy_color = { path = "../bevy_color", version = "0.20.0", features = [
  "serialize",
  "wgpu-types",
] }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0", default-features = false }
bevy_math = { path = "../bevy_math", version = "0.20.0" }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0" }
bevy_utils = { path = "../bevy_utils", version = "0.20.0" }
bevy_platform = { path = "../bevy_platform", version = "0.20.0", default-features = false, features = [
  "std",
] }

# rendering
image = { version = "0.25.2", default-features = false }

# misc
bitflags = { version = "2.3", features = ["serde"] }
bytemuck = { version = "1.5" }
wgpu-types = { version = "30", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = { version = "2", default-features = false }
futures-lite = "2.0.1"
guillotiere = "0.7.0"
rectangle-pack = "0.4"
ddsfile = { version = "0.6.0", optional = true }
ktx2 = { version = "0.5.0", optional = true }
# For ktx2 supercompression
flate2 = { version = "1.0.22", optional = true }
zstd = { version = "0.13.3", optional = true }
ruzstd = { version = "0.8.0", optional = true }
# For transcoding of UASTC/ETC1S universal formats, and for .basis file support
basis-universal = { version = "0.3.0", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
half = { version = "2.4.1" }
ctt = { version = "0.5", optional = true }

[dev-dependencies]
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0" }
serde_json = "1.0.140"

# Bevy's workspace lints (upstream [workspace.lints]) merged with the Bun OS root lints at
# their stricter level; Cargo cannot inherit two lint sets, so they are explicit per crate.
[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_must_use = "deny"
non_ascii_idents = "warn"

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

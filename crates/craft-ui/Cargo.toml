[package]
name = "craft-ui"
workspace = "../.."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/craft-libs"
description = "Reusable egui controls and icon catalogs for Craft frontends"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
aphrody-m3 = { path = "../aphrody-m3", default-features = false }
aphrody-m3-tokens = { workspace = true }
egui = { workspace = true }
serde = { workspace = true, optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
serde_json = { workspace = true }
egui_extras = { workspace = true, features = ["svg"] }
egui_kittest = { workspace = true, features = ["wgpu"] }
image = { workspace = true, features = ["png"] }

[package]
name = "effectcraft-ui-egui"
description = "The EffectCraft egui frontend (swappable): docking panels, composition viewer, timeline, effect controls, control channel"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
sys-locale = "0.3"
craft-ui = { path = "../craft-ui", version = "1.4.7", features = ["serde"] }
effectcraft-time = { path = "../effectcraft-time", version = "0.9.2" }
effectcraft-geom = { path = "../effectcraft-geom", version = "0.9.2" }
effectcraft-color = { path = "../effectcraft-color", version = "0.9.2" }
effectcraft-keyframe = { path = "../effectcraft-keyframe", version = "0.9.2" }
effectcraft-project = { path = "../effectcraft-project", version = "0.9.2" }
effectcraft-path = { path = "../effectcraft-path", version = "0.9.2" }
effectcraft-text = { path = "../effectcraft-text", version = "0.9.2" }
effectcraft-render = { path = "../effectcraft-render", version = "0.9.2" }
effectcraft-engine = { path = "../effectcraft-engine", version = "0.9.2" }
effectcraft-gpu = { path = "../effectcraft-gpu", version = "0.9.2" }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wgpu", "accesskit"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
web-time = "1"
kurbo = { version = "0.13", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }
pollster = "0.4"
effectcraft-host = { path = "../effectcraft-host" }
exr = "1.74"

[build-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"

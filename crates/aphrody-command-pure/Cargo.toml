# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-command-pure"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
homepage = "https://github.com/aphrody-labs/aphrody"
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description            = "Pure aphrody sub-commands (rag, toolcall, html, text): clap parsing and execution with no network, process, tokio, git or ssh. Shared by the native aphrody-command and the wasm32 targets."

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
aphrody-rag-core = { path = "../aphrody-rag-core", features = [] }
aphrody-toolcall-repair = { path = "../aphrody-toolcall-repair", features = [] }
aphrody-translate-core = { path = "../aphrody-translate-core", features = [] }
aphrody-web-extract = { path = "../../toolchains/bun/src/browser/crates/extract", package = "bun_browser_extract" }
clap = { version = "4.6.6", features = ["derive", "env", "color"] }
serde_json = "1.0.151"

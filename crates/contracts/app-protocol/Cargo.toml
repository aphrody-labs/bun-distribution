[package]
name = "aphrody-app-protocol"
publish                = true
version = "1.4.4"
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
readme                 = "README.md"
description            = "Pure, wasm32-safe Codex app-server v2 protocol types: JSON-RPC wire types, Tier-1 request/response pairs, server notifications, approvals, and aphrody/* protocol extensions."
keywords               = ["codex", "app-server", "json-rpc", "protocol", "wasm"]
categories             = ["encoding", "wasm", "api-bindings"]

[lints]
workspace = true

[dependencies]
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

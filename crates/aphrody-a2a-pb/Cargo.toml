[package]
name = "aphrody-a2a-pb"
publish = true
version = "1.4.4"
description = "A2A v1 protobuf-generated types and conversion layer"
readme = "README.md"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/aphrody"
rust-version = "1.97"
authors = ["aphrody-code"]
homepage = "https://github.com/aphrody-labs/aphrody"
keywords = ["cli", "cross-platform", "rust", "linux", "wasm"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[lib]
name = "aphrody_a2a_pb"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
aphrody-a2a = { path = "../aphrody-a2a", features = [] }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
prost = { version = "0.14", features = [] }
prost-types = "0.14"
pbjson = "0.9"
pbjson-types = "0.9"
serde_json = "1.0.151"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
pbjson-build = "0.9"
protoc-bin-vendored = { version = "3", features = [] }
tonic-prost-build = { version = "0.14", features = [] }

[package.metadata.cargo-machete]
ignored = ["pbjson", "pbjson-build", "protoc-bin-vendored", "tonic-prost-build"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tonic = { version = "0.14", features = [] }
tonic-prost = { version = "0.14", features = [] }

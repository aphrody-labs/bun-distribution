[package]
name = "photocraft-affinity"
description = "Bounded reader for native Affinity documents: archive, object stream and document model"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[features]
# Synthetic-container builders for tests and fuzz seeds; not an Affinity exporter.
synth = []

[dependencies]
crc32fast = "1.5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9"

[dev-dependencies]
proptest = "1"

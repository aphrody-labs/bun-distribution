[package]
name = "aphrody-ml-runtime"
version = "1.4.4"
edition = "2024"
description = "Runtime package discovery, downloading, and dynamic library loading for the Aphrody ML base."
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
repository = "https://github.com/aphrody-labs/aphrody"
keywords = ["aphrody", "runtime", "cuda", "llama", "machine-learning"]
categories = ["development-tools", "science"]
publish = true

[dependencies]
anyhow = "1.0.104"
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
dirs = "7.0.0"
dunce = "1.0.5"
futures = "0.3.34"
fs4 = "1.1.0"
hf-hub = "1.0.0"
aphrody-ml-config = { path = "../aphrody-ml-config", version = "1.4.4" }
petgraph = "0.8.3"
reqwest = { version = "0.13.5", features = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"], default-features = false }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
serde = { version = "1.0.229", features = ["derive", "std"], default-features = false }
zip = { version = "8.6.0", features = ["deflate"] }
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }
walkdir = "2.5.0"
libloading = "0.9.0"
libc = "0.2.189"
flate2 = "1.1.10"
tar = "0.4.46"
fast-glob = "1.1.1"
tempfile = "3.27.0"
tracing = "0.1.44"
strum = { version = "0.28.0", features = ["derive"] }

[dev-dependencies]
toml = "1.1.5"

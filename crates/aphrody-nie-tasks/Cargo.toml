[package]
license-file = "../../docs/licenses/iecode/nie/LICENSE"
name = "aphrody-nie-tasks"
description = "Cancelable, pausable asynchronous job orchestration with progress reporting."
version.workspace = true
edition.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]
host = ["dep:async-trait", "dep:tokio", "dep:tracing", "dep:uuid"]

[dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net"], optional = true }
async-trait = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4", "serde"], optional = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net", "test-util"] }

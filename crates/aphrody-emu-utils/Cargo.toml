[package]
description = "Shared utilities for IECODE emulator cores and adapters."
license-file = "../../docs/licenses/iecode/licenses/dust/LICENSE"
name = "aphrody-emu-utils"
version = "0.0.1"
edition = "2021"
publish = true
[features]
triple-buffer = []
app = ["cocoa", "objc"]

[dependencies]
cfg-if = "1.0"
aphrody-emu-utils-macros = { path = "../aphrody-emu-utils-macros" }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = { version = "0.25", optional = true }
objc = { version = "0.2", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(app_bundle)'] }

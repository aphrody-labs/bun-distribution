[package]
license-file = "../../docs/licenses/iecode/nie/LICENSE"
name = "aphrody-nie-pe-inspect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = true
description = "Bounded PE/COFF inspector over the bun-re triage, string extraction and x86 disassembly primitives."

[features]
default = []
integration = []

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
# Triage, strings, headers and disassembly (re-exported).
bun-re = { path = "../re", default-features = false }
# Multi-format binary parser (Apache-2.0/MIT) behind the PE inspector.
goblin.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
# Structured context for the bounded PE-inspection compatibility contract.
anyhow = { workspace = true }

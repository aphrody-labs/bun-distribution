[package]
license.workspace = true
name = "aphrody-nie-pe-inspect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = true
description = "Reverse-engineering primitives for PE/ELF/Mach-O triage, string extraction, and x86 disassembly."

[features]
default = []
integration = []

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
# Multi-format binary parser (Apache-2.0/MIT).
goblin.workspace = true
# SHA-256 binary fingerprinting and per-section integrity.
sha2 = { version = "0.10" }
# Hexadecimal fingerprints in JSON reports.
hex.workspace = true
# Serialization for the public triage report.
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1" }
# Structured public API errors.
thiserror = { version = "2" }
# Pure Rust x86/x64 disassembler.
iced-x86.workspace = true
# Zero-copy typed views over ELF and DOS/PE headers (`headers` module).
zerocopy = { workspace = true, features = ["derive"] }
# Structured context for the bounded PE-inspection compatibility contract.
anyhow = { version = "1" }

[dev-dependencies]
serde_json = { version = "1" }
# Rich matchers with readable test failure messages.
googletest.workspace = true

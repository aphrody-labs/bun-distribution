# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-term"
description = "Headless VT terminal engine (cell grid, native PTY, screen scraping, quad batching) for Aphrody computer use."
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"

[lib]
name = "aphrody_term"
path = "src/lib.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
portable-pty = "0.8"
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
memchr = "2"
parking_lot = "0.12.5"

[dev-dependencies]
aphrody-terminal-core = { path = "../aphrody-terminal-core", features = [] }

[features]
default = []

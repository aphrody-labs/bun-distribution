[package]
name = "designcraft-engine"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DesignCraft engine: session, documents, history, selection, command registry, tool hosting"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
craft-print = { workspace = true }
designcraft-images = { path = "../designcraft-images" }
designcraft-geom = { path = "../designcraft-geom" }
designcraft-color = { path = "../designcraft-color" }
designcraft-doc = { path = "../designcraft-doc" }
designcraft-fonts = { path = "../designcraft-fonts" }
designcraft-compose = { path = "../designcraft-compose" }
designcraft-render = { path = "../designcraft-render" }
designcraft-format = { path = "../designcraft-format" }
designcraft-epub = { path = "../designcraft-epub" }
designcraft-textimport = { path = "../designcraft-textimport" }
designcraft-pdf = { path = "../designcraft-pdf" }
designcraft-tools = { path = "../designcraft-tools" }
designcraft-idml = { path = "../designcraft-idml" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = "2"
log = "0.4"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
quick-xml = "0.38"
caseless = "0.2"

[dev-dependencies]
designcraft-fonts = { path = "../designcraft-fonts", features = ["testing"] }
zip = { workspace = true }
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { version = "0.13", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

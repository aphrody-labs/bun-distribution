[package]
name = "designcraft-epub"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DesignCraft EPUB 3 (reflowable) export: stories in reading order, CSS from styles, images"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
designcraft-doc = { path = "../designcraft-doc" }
designcraft-color = { path = "../designcraft-color" }
zip = { workspace = true }

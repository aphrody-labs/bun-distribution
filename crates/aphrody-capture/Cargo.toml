# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-capture"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description            = "Native Windows screen and window capture: GDI to PNG and GPU window capture through Windows.Graphics.Capture with frame pacing; SendInput mouse and keyboard."

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
thiserror = "2.0.20"
image = { version = "0.25.10", features = ["png"] }

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation","Globalization","Graphics_Imaging","Media_Ocr","Media_SpeechSynthesis","Media_Core","Storage_Streams","Win32_Foundation","Win32_Media_Audio","Win32_Security","Win32_Graphics_Dwm","Win32_Graphics_Gdi","Win32_Storage_IndexServer","Win32_System_Com","Win32_System_Ole","Win32_System_Search","Win32_System_Threading","Win32_System_IO","Win32_System_Diagnostics_Debug","Win32_System_Memory","Win32_System_SystemInformation","Win32_System_Diagnostics_ToolHelp","Win32_System_Variant","Win32_UI_WindowsAndMessaging","Win32","Win32_System","Win32_System_Console","Win32_UI_Input_KeyboardAndMouse","Win32_Storage_Xps","Win32_UI_HiDpi","Graphics_Capture","Graphics_DirectX","Graphics_DirectX_Direct3D11","Win32_Graphics_Direct3D","Win32_Graphics_Direct3D11","Win32_Graphics_Dxgi","Win32_Graphics_Dxgi_Common","Win32_System_WinRT","Win32_System_WinRT_Direct3D11","Win32_System_WinRT_Graphics_Capture"] }

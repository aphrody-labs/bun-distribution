# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-certificates"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/aphrody"
description = "Native ACME certificate lifecycle using owned OVH DNS challenges"

[dependencies]
anyhow = "1.0.104"
aphrody-ovh = { path = "../aphrody-ovh", version = "1.4.4" }
clap = { version = "4.6.6", features = ["derive", "env", "color"] }
hex = { version = "0.4", features = [] }
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
serde = { version = "1.0.229", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }
uuid = { version = "1.26.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

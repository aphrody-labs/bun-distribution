[package]
name = "lightcraft-pipeline"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "LightCraft develop pipeline: scene-referred, float, resolution independent (CPU reference) (L2)"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[dependencies]
lightcraft-geom = { path = "../lightcraft-geom" }
lightcraft-color = { path = "../lightcraft-color" }
lightcraft-raster = { path = "../lightcraft-raster" }
lightcraft-develop = { path = "../lightcraft-develop" }
lightcraft-raw = { path = "../lightcraft-raw" }
lightcraft-inpaint = { path = "../lightcraft-inpaint" }
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }

[dev-dependencies]
lightcraft-scenes = { path = "../lightcraft-scenes" }
proptest = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

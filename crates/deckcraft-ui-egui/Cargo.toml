[package]
name = "deckcraft-ui-egui"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DeckCraft egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[dependencies]
craft-ui = { workspace = true }
deckcraft-geom = { path = "../deckcraft-geom", version = "0.6.1" }
deckcraft-color = { path = "../deckcraft-color", version = "0.6.1" }
deckcraft-model = { path = "../deckcraft-model", version = "0.6.1" }
deckcraft-fonts = { path = "../deckcraft-fonts", version = "0.6.1" }
deckcraft-text = { path = "../deckcraft-text", version = "0.6.1" }
deckcraft-render = { path = "../deckcraft-render", version = "0.6.1" }
deckcraft-anim = { path = "../deckcraft-anim", version = "0.6.1" }
deckcraft-engine = { path = "../deckcraft-engine", version = "0.6.1" }
deckcraft-media = { path = "../deckcraft-media", version = "0.6.1" }
egui = "0.36"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

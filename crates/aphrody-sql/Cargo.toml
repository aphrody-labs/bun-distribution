# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-sql"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/aphrody"
authors = ["aphrody-code"]
homepage = "https://github.com/aphrody-labs/aphrody"
description = "Shared SQL owner for Aphrody: PostgreSQL pool (TLS by URL, pgvector), SQLite open policy (WAL, sqlite-vec), checksummed plain-SQL migrations and database URL resolution."

[features]
default = ["postgres"]
# PostgreSQL 18 pool over deadpool-postgres + tokio-postgres-rustls, pgvector typed binds.
postgres = [
  "dep:deadpool-postgres",
  "dep:tokio-postgres",
  "dep:tokio-postgres-rustls",
  "dep:pgvector",
  "dep:rustls",
  "dep:rustls-native-certs",
  "dep:webpki-roots",
]
# SQLite (bundled rusqlite): open policy, VACUUM INTO, checkpoint, migrations.
sqlite = ["dep:rusqlite"]
# sqlite-vec `vec0` registered once as a SQLite auto extension.
vec = ["sqlite", "dep:sqlite-vec"]

[dependencies]
sha2 = "0.11.0"
thiserror = "2.0.20"
tracing = "0.1.44"
deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"], optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "native-certs"], optional = true }
pgvector = { version = "0.4", features = ["postgres", "halfvec"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "1", optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
sqlite-vec = { version = "0.1.9", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

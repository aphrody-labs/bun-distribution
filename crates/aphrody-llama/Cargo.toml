[package]
name = "aphrody-llama"
version = "1.4.7"
edition = "2024"
description = "Safe Rust bindings for llama.cpp with runtime dynamic loading."
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
repository = "https://github.com/aphrody-labs/aphrody"
keywords = ["llama", "llm", "inference", "machine-learning", "bindings"]
categories = ["api-bindings", "science"]
publish = true

[dependencies]
encoding_rs = "0.8.41"
enumflags2 = "0.7.12"
aphrody-llama-sys = { path = "../aphrody-llama-sys", version = "1.4.7" }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-core = "0.1.36"
llguidance = { version = "1.8.0", optional = true }
toktrie = { version = "1.8.0", optional = true }

[features]
default = []
sampler = []
llguidance = ["dep:llguidance", "dep:toktrie"]

[dev-dependencies]
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json", "regex", "registry"] }

[package]
name = "bevy_gizmos_render"
version = "0.20.0"
edition = "2024"
description = "Provides gizmos rendering for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
webgl = []
webgpu = []

[dependencies]
# Bevy
bevy_pbr = { path = "../bevy_pbr", version = "0.20.0", optional = true }
bevy_sprite_render = { path = "../bevy_sprite_render", version = "0.20.0", optional = true }
bevy_app = { path = "../bevy_app", version = "0.20.0" }
bevy_gizmos = { path = "../bevy_gizmos", version = "0.20.0" }
bevy_camera = { path = "../bevy_camera", version = "0.20.0" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0" }
bevy_extract = { path = "../bevy_extract", version = "0.20.0" }
bevy_image = { path = "../bevy_image", version = "0.20.0" }
bevy_mesh = { path = "../bevy_mesh", version = "0.20.0" }
bevy_math = { path = "../bevy_math", version = "0.20.0" }
bevy_shape = { path = "../bevy_shape", version = "0.20.0" }
bevy_asset = { path = "../bevy_asset", version = "0.20.0" }
bevy_shader = { path = "../bevy_shader", version = "0.20.0" }
bevy_render = { path = "../bevy_render", version = "0.20.0" }
bevy_utils = { path = "../bevy_utils", version = "0.20.0" }
bevy_core_pipeline = { path = "../bevy_core_pipeline", version = "0.20.0" }
bevy_transform = { path = "../bevy_transform", version = "0.20.0" }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0" }
bevy_color = { path = "../bevy_color", version = "0.20.0" }
bevy_material = { path = "../bevy_material", version = "0.20.0" }
bevy_log = { path = "../bevy_log", version = "0.20.0" }

# other
bytemuck = "1.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }

# Bevy's workspace lints (upstream [workspace.lints]) merged with the Bun OS root lints at
# their stricter level; Cargo cannot inherit two lint sets, so they are explicit per crate.
[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_must_use = "deny"
non_ascii_idents = "warn"

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies]
bevy_render = { path = "../bevy_render" }

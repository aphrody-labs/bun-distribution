[package]
name = "aphrody-nie-index"
description = "Bounded in-memory and host-backed knowledge indexes for nie.exe reverse engineering"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]
host = [
    "dep:ignore",
    "dep:r2d2",
    "dep:redis",
    "dep:rusqlite",
    "dep:serde_json",
    "dep:sha2",
    "dep:tracing",
]

[dependencies]
ignore = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true, features = ["bundled"] }
sha2 = { version = "0.10", optional = true }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", optional = true }
thiserror = { version = "2" }
tracing = { version = "0.1", optional = true }
r2d2 = { workspace = true, optional = true }
redis = { workspace = true, optional = true, features = ["r2d2"] }

[dev-dependencies]
serde_json = { version = "1" }

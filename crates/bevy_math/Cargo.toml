[package]
name = "bevy_math"
version = "0.20.0"
edition = "2024"
description = "Provides math functionality for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]
rust-version = "1.94.0"

[dependencies]
glam = { version = "0.33.2", default-features = false, features = [
  "f64",
  "i32",
  "u32",
  "bytemuck",
] }
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = [
  "from",
  "into",
] }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }
libm = { version = "0.2", optional = true }
approx = { version = "0.5", default-features = false, optional = true }
rand = { version = "0.10", default-features = false, optional = true }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0", default-features = false, features = [
  "glam",
], optional = true }
variadics_please = "2.0"

[dev-dependencies]
approx = "0.5"
# Supply rngs for examples and tests
rand = "0.10"
# Enable the approx feature when testing.
bevy_math = { path = ".", default-features = false, features = ["approx"] }
glam = { version = "0.33.2", default-features = false, features = ["approx"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.4", default-features = false, features = [
  "wasm_js",
] }

[features]
default = ["std", "rand"]
std = [
  "alloc",
  "glam/std",
  "derive_more/std",
  "serde?/std",
  "approx?/std",
  "rand?/std",
  "bevy_reflect?/std",
]
alloc = ["serde?/alloc", "rand?/alloc"]

serialize = ["dep:serde", "glam/serde"]
# Enable approx for glam types to approximate floating point equality comparisons and assertions
approx = ["dep:approx", "glam/approx"]
# Enable interoperation of glam types with mint-compatible libraries
mint = ["glam/mint"]
# Enable libm mathematical functions for glam types to ensure consistent outputs
# across platforms at the cost of losing hardware-level optimization using intrinsics
libm = ["dep:libm", "glam/libm"]
# Enable assertions to check the validity of parameters passed to glam
glam_assert = ["glam/glam-assert"]
# Enable assertions in debug builds to check the validity of parameters passed to glam
debug_glam_assert = ["glam/debug-glam-assert"]
# Enable the rand dependency for shape_sampling
rand = ["dep:rand", "glam/rand"]
# Enable bevy_reflect (requires alloc)
bevy_reflect = ["dep:bevy_reflect", "alloc"]
# Enable libm mathematical functions as a fallback for no_std environments.
# Can be overridden with std feature.
nostd-libm = ["dep:libm", "glam/nostd-libm"]

# Bevy's workspace lints (upstream [workspace.lints]) merged with the Bun OS root lints at
# their stricter level; Cargo cannot inherit two lint sets, so they are explicit per crate.
[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_must_use = "deny"
non_ascii_idents = "warn"

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

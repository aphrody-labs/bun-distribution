[package]
name = "aphrody-tauri-plugin-websocket"
version = "3.0.0-alpha.2"
description = "Expose a WebSocket server to your Tauri frontend."
authors = ["Tauri Programme within The Commons Conservancy"]
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/aphrody-labs/yolo"
links = "tauri-plugin-websocket"
exclude = [
  "/banner.png",
  "/examples",
  "/guest-js",
  "/package.json",
  "/rollup.config.js",
  "/tsconfig.json",
]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }

[lib]
name = "tauri_plugin_websocket"

[build-dependencies]
tauri-plugin = { version = "3.0.0-alpha.3", path = "../aphrody-tauri-plugin", package = "aphrody-tauri-plugin", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "3.0.0-alpha.4", path = "../aphrody-tauri", package = "aphrody-tauri", default-features = false }
log = "0.4.21"
thiserror = "2"
http = "1"
rand = "0.9"
futures-util = "0.3"
tokio = { version = "1", features = ["net", "sync"] }
tokio-tungstenite = { version = "0.29" }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
], optional = true }

[features]
default = ["rustls-tls"]
native-tls = ["tokio-tungstenite/native-tls"]
native-tls-vendored = ["native-tls", "tokio-tungstenite/native-tls-vendored"]
rustls-tls = ["tokio-tungstenite/rustls-tls-webpki-roots", "dep:rustls"]
rustls-tls-native-roots = [
  "tokio-tungstenite/rustls-tls-native-roots",
  "dep:rustls",
]

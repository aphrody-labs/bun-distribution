[package]
name = "aphrody-tauri-plugin-log"
version = "3.0.0-alpha.2"
description = "Configurable logging for your Tauri app."
authors = ["Tauri Programme within The Commons Conservancy"]
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/aphrody-labs/yolo"
links = "tauri-plugin-log"
exclude = [
  "/banner.png",
  "/guest-js",
  "/package.json",
  "/rollup.config.js",
  "/tsconfig.json",
]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }

[lib]
name = "tauri_plugin_log"

[build-dependencies]
tauri-plugin = { version = "3.0.0-alpha.3", path = "../aphrody-tauri-plugin", package = "aphrody-tauri-plugin", features = ["build"] }

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { version = "3.0.0-alpha.4", path = "../aphrody-tauri", package = "aphrody-tauri", default-features = false }
thiserror = { workspace = true }
serde_repr = "0.1"
log = { workspace = true, features = ["kv"] }
time = { version = "0.3", features = [
  "formatting",
  "local-offset",
  "macros",
  "parsing",
] }
fern = "0.7"
tracing = { workspace = true, optional = true }

[target."cfg(target_os = \"android\")".dependencies]
android_logger = "0.15"

[target."cfg(target_os = \"ios\")".dependencies]
swift-rs = { workspace = true }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
] }

[features]
colored = ["fern/colored"]
tracing = ["dep:tracing"]

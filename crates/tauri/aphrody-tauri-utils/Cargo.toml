[package]
name = "aphrody-tauri-utils"
version = "3.0.0-alpha.3"
description = "Utilities for Tauri"
exclude = ["CHANGELOG.md", "/target"]
authors = ["Tauri Programme within The Commons Conservancy"]
homepage = "https://tauri.app/"
repository = "https://github.com/aphrody-labs/yolo"
categories = ["gui", "web-programming"]
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.95"

[lib]
name = "tauri_utils"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
phf = { version = "0.13", features = ["macros"] }
brotli = { version = "9", optional = true, default-features = false, features = [
  "std",
] }
url = { workspace = true, features = ["serde"] }
html5ever = { version = "0.29", optional = true }
kuchiki = { package = "kuchikiki", version = "0.8.8-speedreader", optional = true }
dom_query = { version = "0.28", optional = true, default-features = false }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
schemars = { workspace = true, optional = true, features = ["url2", "uuid1"] }
serde_with = "3"
aes-gcm = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true, features = ["std"] }
serialize-to-javascript = { version = "0.1.2", optional = true }
ctor = { version = "1.0", default-features = false }
json5 = { version = "1.3", optional = true }
# Part of public api in error type
toml = { version = ">=0.9, <=1", features = ["parse"] }
json-patch = "4.0"
# Our code requires at least 0.3.1
glob = { workspace = true }
urlpattern = "0.6"
regex = { workspace = true }
walkdir = { workspace = true, optional = true }
memchr = { workspace = true }
semver = { workspace = true }
infer = "0.22"
dunce = { workspace = true }
log = { workspace = true }
cargo_metadata = { version = "0.23", optional = true }
serde-untagged = "0.1"
uuid = { workspace = true, features = ["serde"] }
http = { workspace = true }
plist = "1"

[target."cfg(target_os = \"macos\")".dependencies]
swift-rs = { workspace = true, optional = true, features = ["build"] }

[dev-dependencies]
getrandom = { version = "0.3", features = ["std"] }
serial_test = "3.5"
# For doc tests
tauri = { path = "../aphrody-tauri", package = "aphrody-tauri", version = "3.0.0-alpha.4" }
tempfile = { workspace = true }

[features]
build = [
  "proc-macro2",
  "quote",
  "cargo_metadata",
  "schema",
  "swift-rs",
  "html-manipulation",
]
# Same as `build` but uses `html-manipulation-2` to avoid the `kuchikiki` dependency.
build-2 = [
  "proc-macro2",
  "quote",
  "cargo_metadata",
  "schema",
  "swift-rs",
  "html-manipulation-2",
]
compression = ["brotli"]
schema = ["schemars"]
isolation = ["aes-gcm", "getrandom", "serialize-to-javascript"]
process-relaunch-dangerous-allow-symlink-macos = []
config-json5 = ["json5"]
config-toml = []
resources = ["walkdir"]
html-manipulation = ["dep:html5ever", "dep:kuchiki"]
html-manipulation-2 = ["dep:dom_query"]

[lints.clippy]
collapsible_if = "allow"
redundant_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"

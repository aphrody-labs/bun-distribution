[package]
name = "aphrody-tao-macros"
description = "Proc macros for tao"
version = "0.1.4"
edition = "2021"
authors = ["Tauri Programme within The Commons Conservancy"]
rust-version = "1.85"
license = "MIT OR Apache-2.0"
readme = "../README.md"
repository = "https://github.com/aphrody-labs/yolo"
documentation = "https://docs.rs/aphrody-tao-macros"

[lib]
name = "tao_macros"
proc-macro = true

[features]
default = []

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { version = "2", features = ["full"] }

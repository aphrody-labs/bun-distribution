[package]
name = "aphrody-tauri-schema-generator"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "tauri-schema-generator"
path = "src/main.rs"

[build-dependencies]
tauri-utils = { version = "~3.0.0-alpha.3", path = "../aphrody-tauri-utils", package = "aphrody-tauri-utils", features = ["schema"] }
schemars = { version = "1", features = ["url2", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }

[lints.clippy]
collapsible_if = "allow"
redundant_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"

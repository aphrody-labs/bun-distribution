[package]
name = "aphrody-tauri-runtime"
version = "3.0.0-alpha.3"
description = "Runtime for Tauri applications"
exclude = ["CHANGELOG.md", "/target"]
authors = ["Tauri Programme within The Commons Conservancy"]
homepage = "https://tauri.app/"
repository = "https://github.com/aphrody-labs/yolo"
categories = ["gui", "web-programming"]
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.95"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-linux-android",
  "x86_64-apple-ios",
]

[lib]
name = "tauri_runtime"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tauri-utils = { version = "~3.0.0-alpha.3", path = "../aphrody-tauri-utils", package = "aphrody-tauri-utils" }
http = { workspace = true }
raw-window-handle = "0.6"
url = { workspace = true }
dpi = { version = "0.1", features = ["serde"] }
# WARNING: cookie::Cookie is re-exported so bumping this is a breaking change, documented to be done as a minor bump
cookie = { workspace = true }

[target."cfg(windows)".dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_System_WinRT"]

[target."cfg(target_os = \"android\")".dependencies]
jni = "0.21"

[target.'cfg(all(target_vendor = "apple", not(target_os = "macos")))'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
  "UIView",
  "UIResponder",
  "UIScene",
  "UISceneOptions",
] }

[target."cfg(target_os = \"macos\")".dependencies]
url = { workspace = true }
objc2 = "0.6"
[features]
default = []
devtools = []

[lints.clippy]
collapsible_if = "allow"
redundant_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"

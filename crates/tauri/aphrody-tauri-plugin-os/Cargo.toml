[package]
name = "aphrody-tauri-plugin-os"
version = "1.4.4"
description = "Read information about the operating system."
edition = "2024"
authors = ["Tauri Programme within The Commons Conservancy"]
license = "Apache-2.0 OR MIT"
rust-version = "1.95"
repository = "https://github.com/aphrody-labs/yolo"
links = "tauri-plugin-os"
exclude = [
  "/banner.png",
  "/guest-js",
  "/package.json",
  "/rollup.config.js",
  "/tsconfig.json",
]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }

[lib]
name = "tauri_plugin_os"

[build-dependencies]
tauri-plugin = { version = "1.4.4", path = "../../../../bun/packages/bun-tauri/crates/aphrody-tauri-plugin", package = "aphrody-tauri-plugin", features = ["build"] }

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { version = "1.4.4", path = "../aphrody-tauri", package = "aphrody-tauri", default-features = false }
log = { workspace = true }
thiserror = { workspace = true }
os_info = "3"
sys-locale = { workspace = true }
gethostname = "1.0"
serialize-to-javascript = "0.1.1"

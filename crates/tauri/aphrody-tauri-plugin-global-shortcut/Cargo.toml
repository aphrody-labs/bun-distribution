[package]
name = "aphrody-tauri-plugin-global-shortcut"
version = "1.4.4"
description = "Register global hotkeys listeners on your Tauri application."
edition = "2024"
authors = ["Tauri Programme within The Commons Conservancy"]
license = "Apache-2.0 OR MIT"
rust-version = "1.95"
repository = "https://github.com/aphrody-labs/yolo"
links = "tauri-plugin-global-shortcut"
exclude = [
  "/banner.png",
  "/guest-js",
  "/package.json",
  "/rollup.config.js",
  "/tsconfig.json",
]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "none", notes = "" }
ios = { level = "none", notes = "" }

[lib]
name = "tauri_plugin_global_shortcut"

[build-dependencies]
tauri-plugin = { version = "1.4.4", path = "../aphrody-tauri-plugin", package = "aphrody-tauri-plugin", features = ["build"] }

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { version = "1.4.4", path = "../aphrody-tauri", package = "aphrody-tauri", default-features = false }
log = { workspace = true }
thiserror = { workspace = true }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
global-hotkey = { version = "0.8", features = ["serde"] }

[package]
name = "aphrody-tauri-plugin-updater"
version = "3.0.0-alpha.2"
description = "In-app updates for Tauri applications."
edition = "2024"
authors = ["Tauri Programme within The Commons Conservancy"]
license = "Apache-2.0 OR MIT"
rust-version = "1.95"
repository = "https://github.com/aphrody-labs/yolo"
links = "tauri-plugin-updater"
exclude = [
  "/banner.png",
  "/guest-js",
  "/package.json",
  "/rollup.config.js",
  "/tests",
  "/tsconfig.json",
]

[package.metadata.docs.rs]
no-default-features = true
features = ["zip"]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "none", notes = "" }
ios = { level = "none", notes = "" }

[lib]
name = "tauri_plugin_updater"

[build-dependencies]
tauri-plugin = { version = "3.0.0-alpha.3", path = "../aphrody-tauri-plugin", package = "aphrody-tauri-plugin", features = ["build"] }

[dependencies]
tauri = { version = "3.0.0-alpha.4", path = "../aphrody-tauri", package = "aphrody-tauri", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
], optional = true }
url = { workspace = true }
http = { workspace = true }
minisign-verify = "0.2"
time = { workspace = true, features = ["parsing", "formatting"] }
base64 = "0.22"
semver = { workspace = true, features = ["serde"] }
futures-util = { workspace = true }
tempfile = { workspace = true }
infer = "0.22"
percent-encoding = "2.3"

[target."cfg(target_os = \"windows\")".dependencies]
zip = { version = "8", default-features = false, optional = true }
windows-sys = { version = "0.60.0", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }

[target."cfg(target_os = \"linux\")".dependencies]
dirs = "6"
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }

[target."cfg(target_os = \"macos\")".dependencies]
tar = { workspace = true }
flate2 = { workspace = true }
osakit = { version = "0.3", features = ["full"] }

[features]
default = ["rustls-tls", "system-proxy", "zip"]
zip = ["dep:zip", "dep:tar", "dep:flate2"]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]
rustls-tls = ["reqwest/rustls-no-provider", "dep:rustls"]
system-proxy = ["reqwest/system-proxy"]

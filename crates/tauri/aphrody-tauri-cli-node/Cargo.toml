[package]
edition = "2024"
name = "aphrody-tauri-cli-node"
description = "Aphrody platform crate aphrody-tauri-cli-node."
license = "Apache-2.0 OR MIT"
repository.workspace = true
version = "0.0.0"

[lib]
name = "tauri_cli_node"
crate-type = ["cdylib"]

[dependencies]
napi = "3.12.2"
napi-derive = "3.6.3"
tauri-cli = { path = "../aphrody-tauri-cli", package = "aphrody-tauri-cli", default-features = false, version = "3.0.0-alpha.4" }
log = { workspace = true }

[build-dependencies]
napi-build = "2.4.1"

[features]
default = ["tauri-cli/default"]
native-tls = ["tauri-cli/native-tls"]
native-tls-vendored = ["tauri-cli/native-tls-vendored"]

[lints.clippy]
collapsible_if = "allow"
redundant_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"

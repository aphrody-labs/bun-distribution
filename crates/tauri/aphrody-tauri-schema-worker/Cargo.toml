[package]
name = "aphrody-tauri-schema-worker"
description = "Aphrody platform crate aphrody-tauri-schema-worker."
license = "Apache-2.0 OR MIT"
repository.workspace = true
version = "0.0.0"
edition = "2024"
[lib]
name = "tauri_schema_worker"
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ['http', 'axum'] }
worker-macros = { version = "0.8", features = ['http'] }
console_error_panic_hook = { workspace = true }
axum = { version = "0.8", default-features = false }
tower-service = "0.3"
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(wasm_bindgen_unstable_test_coverage)',
] }

# https://github.com/rustwasm/wasm-pack/issues/1501
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

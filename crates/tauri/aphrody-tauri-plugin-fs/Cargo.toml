[package]
name = "aphrody-tauri-plugin-fs"
version = "1.4.4"
description = "Access the file system."
authors = ["Tauri Programme within The Commons Conservancy"]
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/aphrody-labs/yolo"
links = "tauri-plugin-fs"
exclude = [
  "/banner.png",
  "/guest-js",
  "/package.json",
  "/rollup.config.js",
  "/tsconfig.json",
]

[package.metadata.platforms.support]
windows = { level = "full", notes = "Apps installed via MSI or NSIS in `perMachine` and `both` mode require admin permissions for write access in `$RESOURCES` folder" }
linux = { level = "full", notes = "No write access to `$RESOURCES` folder" }
macos = { level = "full", notes = "No write access to `$RESOURCES` folder" }
android = { level = "partial", notes = "Access is restricted to Application folder by default" }
ios = { level = "partial", notes = "Access is restricted to Application folder by default" }

[lib]
name = "tauri_plugin_fs"

[build-dependencies]
tauri-plugin = { version = "1.4.4", path = "../../../../bun/packages/bun-tauri/crates/aphrody-tauri-plugin", package = "aphrody-tauri-plugin", features = ["build"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_repr = "0.1"
tauri = { version = "1.4.4", path = "../aphrody-tauri", package = "aphrody-tauri", default-features = false }
thiserror = { workspace = true }
url = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
glob = { workspace = true }
notify = { workspace = true, optional = true, features = ["serde"] }
notify-debouncer-full = { version = "0.6", optional = true }
dunce = { workspace = true }
percent-encoding = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString"] }

[features]
watch = ["notify", "notify-debouncer-full"]

[package]
name = "aphrody-tauri-runtime-wry"
version = "3.0.0-alpha.4"
description = "Wry bindings to the Tauri runtime"
exclude = ["CHANGELOG.md", "/target"]
authors = ["Tauri Programme within The Commons Conservancy"]
homepage = "https://tauri.app/"
repository = "https://github.com/aphrody-labs/yolo"
categories = ["gui", "web-programming"]
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.95"

[lib]
name = "tauri_runtime_wry"

[dependencies]
wry = { version = "0.57.0", path = "../aphrody-wry", package = "aphrody-wry", default-features = false, features = ["os-webview", "linux-body"] }
tao = { version = "0.37.1", path = "../aphrody-tao", package = "aphrody-tao", default-features = false, features = ["rwh_06"] }
tauri = { version = "3.0.0-alpha.4", path = "../aphrody-tauri", package = "aphrody-tauri", default-features = false, features = ["gtk3"] }
tauri-runtime = { version = "~3.0.0-alpha.3", path = "../aphrody-tauri-runtime", package = "aphrody-tauri-runtime" }
tauri-utils = { version = "~3.0.0-alpha.3", path = "../aphrody-tauri-utils", package = "aphrody-tauri-utils" }
raw-window-handle = "0.6"
http = { workspace = true }
url = { workspace = true }
tracing = { workspace = true, optional = true }
log = { workspace = true }

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
softbuffer = { version = "0.4", default-features = false }
once_cell = { workspace = true }

[target."cfg(windows)".dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
]

[target."cfg(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\"))".dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "=2.0", features = ["v2_40"] }
percent-encoding = "2"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "block2",
  "NSApplication",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSScreen",
  "NSGraphics",
] }
objc2-web-kit = { version = "0.3", features = ["objc2-app-kit", "WKWebView"] }

[target."cfg(target_os = \"android\")".dependencies]
jni = "0.21"

[features]
default = ["x11", "dbus"]
# also enables devtools on `tauri` so the feature only needs to be enabled on this crate
devtools = ["wry/devtools", "tauri-runtime/devtools", "tauri/devtools"]
x11 = ["tao/x11", "wry/x11"]
tracing = ["dep:tracing", "wry/tracing"]
macos-proxy = ["wry/mac-proxy"]
# exposes the extension traits for `tauri::webview::WebviewBuilder`
unstable = ["tauri/unstable"]
common-controls-v6 = ["windows/Win32_UI_Controls", "windows/Win32_UI_Shell"]
dbus = ["tao/dbus"]

[lints.clippy]
collapsible_if = "allow"
redundant_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"

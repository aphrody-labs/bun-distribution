[package]
name = "aphrody-tauri-plugin-opener"
version = "3.0.0-alpha.2"
description = "Open files and URLs using their default application."
edition = "2024"
rust-version = "1.95"
authors = ["Tauri Programme within The Commons Conservancy"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/aphrody-labs/yolo"
links = "tauri-plugin-opener"

# Platforms supported by the plugin
# Support levels are "full", "partial", "none", "unknown"
# Details of the support level are left to plugin maintainer
exclude = ["/guest-js", "/package.json", "/rollup.config.js", "/tsconfig.json"]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "partial", notes = "Only allows to open URLs via `open`" }
ios = { level = "partial", notes = "Only allows to open URLs via `open`" }

[lib]
name = "tauri_plugin_opener"

[build-dependencies]
tauri-plugin = { version = "3.0.0-alpha.3", path = "../aphrody-tauri-plugin", package = "aphrody-tauri-plugin", features = ["build"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "3.0.0-alpha.4", path = "../aphrody-tauri", package = "aphrody-tauri", default-features = false }
thiserror = "2"
open = { version = "5", features = ["shellexecute-on-windows"] }
glob = "0.3"
dunce = "1"

[target."cfg(windows)".dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_Storage_FileSystem",
]

[target."cfg(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"netbsd\", target_os = \"openbsd\"))".dependencies]
zbus = "5.9"
url = "2"

[target."cfg(target_os = \"macos\")".dependencies.objc2-app-kit]
version = "0.3"
default-features = false
features = ["std", "NSWorkspace"]

[target."cfg(target_os = \"macos\")".dependencies.objc2-foundation]
version = "0.3"
default-features = false
features = ["std", "NSURL", "NSArray", "NSString"]

[package]
name = "aphrody-tauri-driver"
version = "3.0.0-alpha.1"
authors = ["Tauri Programme within The Commons Conservancy"]
categories = ["gui", "web-programming"]
license = "Apache-2.0 OR MIT"
homepage = "https://tauri.app"
repository = "https://github.com/aphrody-labs/yolo"
description = "Webdriver server for Tauri applications"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "tauri-driver"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
http-body-util = "0.1"
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = [
  "client",
  "client-legacy",
  "http1",
  "server",
  "tokio",
] }
pico-args = { version = "0.5", features = ["eq-separator"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
which = { workspace = true }

[target."cfg(unix)".dependencies]
signal-hook = "0.4"
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }

[target."cfg(windows)".dependencies]
win32job = "2"

[lints.clippy]
collapsible_if = "allow"
redundant_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"

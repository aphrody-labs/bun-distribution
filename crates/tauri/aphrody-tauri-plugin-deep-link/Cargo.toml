[package]
name = "aphrody-tauri-plugin-deep-link"
version = "1.4.4"
description = "Set your Tauri application as the default handler for an URL"
authors = ["Tauri Programme within The Commons Conservancy"]
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/aphrody-labs/yolo"
links = "tauri-plugin-deep-link"
exclude = [
  "/banner.png",
  "/examples",
  "/guest-js",
  "/package.json",
  "/rollup.config.js",
  "/tsconfig.json",
]

[package.metadata.docs.rs]
targets = ["x86_64-linux-android"]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "partial", notes = "Deep links must be registered in config. Dynamic registration at runtime is not supported." }
android = { level = "partial", notes = "Deep links must be registered in config. Dynamic registration at runtime is not supported." }
ios = { level = "partial", notes = "Deep links must be registered in config. Dynamic registration at runtime is not supported." }

[lib]
name = "tauri_plugin_deep_link"

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri-utils = { version = "1.4.4", path = "../aphrody-tauri-utils", package = "aphrody-tauri-utils" }
tauri-plugin = { version = "1.4.4", path = "../../../../bun/packages/bun-tauri/crates/aphrody-tauri-plugin", package = "aphrody-tauri-plugin", features = ["build"] }

[target."cfg(target_os = \"macos\")".build-dependencies]
plist = "1"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { version = "1.4.4", path = "../aphrody-tauri", package = "aphrody-tauri", default-features = false }
tauri-utils = { version = "1.4.4", path = "../aphrody-tauri-utils", package = "aphrody-tauri-utils" }
tracing = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[target."cfg(windows)".dependencies]
dunce = { workspace = true }
windows-registry = "0.5"
windows-result = "0.3"

[target."cfg(target_os = \"linux\")".dependencies]
rust-ini = "0.21"

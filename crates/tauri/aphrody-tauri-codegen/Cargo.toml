[package]
name = "aphrody-tauri-codegen"
version = "3.0.0-alpha.3"
description = "code generation meant to be consumed inside of `tauri` through `tauri-build` or `tauri-macros`"
exclude = ["CHANGELOG.md", "/target"]
authors = ["Tauri Programme within The Commons Conservancy"]
homepage = "https://tauri.app/"
repository = "https://github.com/aphrody-labs/yolo"
categories = ["gui", "web-programming"]
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.95"

[lib]
name = "tauri_codegen"

[dependencies]
sha2 = "0.10"
base64 = "0.22"
proc-macro2 = "1"
quote = "1"
syn = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-utils = { version = "~3.0.0-alpha.3", path = "../aphrody-tauri-utils", package = "aphrody-tauri-utils", features = ["build-2"] }
thiserror = "2"
walkdir = "2"
brotli = { version = "9", optional = true, default-features = false, features = [
  "std",
] }
uuid = { version = "1", features = ["v4"] }
semver = "1"
ico = "0.5"
png = "0.18"
json-patch = "4"
url = "2"

[target."cfg(target_os = \"macos\")".dependencies]
plist = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }

[features]
compression = ["brotli", "tauri-utils/compression"]
isolation = ["tauri-utils/isolation"]
config-json5 = ["tauri-utils/config-json5"]
config-toml = ["tauri-utils/config-toml"]

[lints.clippy]
collapsible_if = "allow"
redundant_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"

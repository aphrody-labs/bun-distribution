# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-toolchains"
description = "Unified Bun / uv / Nushell runtime layer: shell-free discovery, repo-file version pins and consistent launch environment."
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
readme = "README.md"
keywords = ["bun", "uv", "nushell", "toolchain", "discovery"]
categories = ["development-tools"]
publish = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[lib]
path = "src/lib.rs"

[dependencies]
aphrody-proc = { path = "../aphrody-proc", features = [] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.5"

[dev-dependencies]
tempfile = "3.27.0"

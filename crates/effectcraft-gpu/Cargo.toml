[package]
name = "effectcraft-gpu"
description = "The GPU compositor (wgpu compute): layer transforms, masks/mattes, the 38 blend modes, motion blur, bit-depth quantisation and GPU effects, with the CPU renderer as the reference"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
pollster = "1"
effectcraft-time = { path = "../effectcraft-time", version = "0.9.2" }
effectcraft-geom = { path = "../effectcraft-geom", version = "0.9.2" }
effectcraft-color = { path = "../effectcraft-color", version = "0.9.2" }
effectcraft-project = { path = "../effectcraft-project", version = "0.9.2" }
effectcraft-raster = { path = "../effectcraft-raster", version = "0.9.2" }
effectcraft-effects = { path = "../effectcraft-effects", version = "0.9.2" }
effectcraft-render = { path = "../effectcraft-render", version = "0.9.2" }
effectcraft-keyframe = { path = "../effectcraft-keyframe", version = "0.9.2" }
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
bytemuck = "1"
log = "0.4"
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }

[dev-dependencies]
effectcraft-text = { path = "../effectcraft-text" }

[package]
name = "cookie_store_wrapper"
edition = "2024"
version = "0.0.2"
publish = false

[lib]
name = "cookie_store_wrapper"
path = "src/lib.rs"

[features]
default = []
# Implements the wreq `CookieStore` trait on `SharedCookieStore` so a wreq
# client can read from and write Set-Cookie responses into a shared store.
wreq = ["dep:wreq"]

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
url = { version = "2.5.8", features = ["serde"] }
time = "0.3"
wreq = { version = "6.0.0-rc.28", features = ["json", "query", "form", "multipart", "cookies", "ws", "stream", "gzip", "brotli", "zstd", "deflate"], optional = true }
cookie_store = { version = "0.21.1", default-features = false, features = ["serde_json"] }

[dev-dependencies]
serde_derive = "1.0.228"
toml = "1.0.7+spec-1.1.0"

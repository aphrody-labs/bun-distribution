[package]
name = "lightcraft-merge"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "LightCraft Photo Merge: HDR merge (align, deghost) and panorama stitching (L3)"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[dependencies]
lightcraft-geom = { path = "../lightcraft-geom", version = "0.7.1" }
lightcraft-color = { path = "../lightcraft-color", version = "0.7.1" }
lightcraft-raster = { path = "../lightcraft-raster", version = "0.7.1" }
lightcraft-raw = { path = "../lightcraft-raw", version = "0.7.1" }
lightcraft-codecs = { path = "../lightcraft-codecs", version = "0.7.1" }
lightcraft-meta = { path = "../lightcraft-meta", version = "0.7.1" }
lightcraft-scenes = { path = "../lightcraft-scenes", version = "0.7.1" }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
rayon = "1"

[package]
name = "figcraft-svg"
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "FigCraft SVG export (shapes, gradients, images, strokes, effects as filters, text as outlines) and import (via usvg)"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
# Style lints from newer toolchains that fight index-heavy pixel code.
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
# FigCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Never crash). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
figcraft-geom = { path = "../figcraft-geom" }
figcraft-color = { path = "../figcraft-color" }
figcraft-doc = { path = "../figcraft-doc" }
figcraft-render = { path = "../figcraft-render" }
figcraft-text = { path = "../figcraft-text" }
figcraft-pathops = { path = "../figcraft-pathops" }
usvg = "0.48"
base64 = "0.22"

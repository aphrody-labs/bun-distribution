[package]
name = "aphrody-google"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description = "Canonical Rust facade for Aphrody Google Cloud, Gemini, Web and Antigravity integrations."
[[bin]]
name = "aphrody-google"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aphrody-antigravity = { workspace = true }
aphrody-gemini-runtime = { workspace = true }
aphrody-gemini-web = { workspace = true }
aphrody-model-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
rustls = { workspace = true }
futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
obscura-dom = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
rusqlite = { workspace = true }
obscura = { workspace = true }
chrono = { workspace = true }

[package]
name = "aphrody-google-mcp"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Gemini tools of the Aphrody MCP server (Gemini Web chat and image tools) and the Shenron Gemini Web chat backend."

[lints]
workspace = true

[dependencies]
aphrody-gemini-web = { workspace = true }
base64             = { workspace = true }

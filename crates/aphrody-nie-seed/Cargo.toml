[package]
name = "aphrody-nie-seed"
description = "Import du savoir fusionné (index Ghidra aphrody-nie-index.json, RTTI, formats iecode, hash→nom inagle) comme ancres de la boucle RE nie"
version.workspace = true
edition.workspace = true
license-file = "../../docs/licenses/iecode/nie/LICENSE"
publish = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]
host = [
    "dep:anyhow",
    "dep:aphrody-nie-index",
    "dep:rusqlite",
    "dep:tracing",
]

[dependencies]
aphrody-nie-index = { workspace = true, optional = true, default-features = true }
aphrody-nie-formats = { workspace = true, default-features = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true, features = ["bundled"] }

[dev-dependencies]
tempfile = { workspace = true }

# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-term-caps"
description = "Terminal capability detection (environment, DA1, XTVERSION, kitty graphics query) and escape-sequence emission (OSC 8/133/633/7/9;4/52/notifications, Kitty/Sixel/iTerm2 images) for the Aphrody CLI and shell."
version = "1.0.0-canary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["decode", "probe"]
# Decode PNG/JPEG/GIF/WebP files into RGBA for Sixel and Kitty raw transmission.
decode = ["dep:image"]
# Query the controlling terminal (DA1, XTVERSION, kitty graphics) in raw mode.
probe = ["dep:libc", "dep:windows-sys"]

[dependencies]
base64 = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

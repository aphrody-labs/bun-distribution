# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-terminal-backend"
publish                = false
version = "1.0.0-canary"
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Native pty driver and WebSocket server for aphrody-terminal (cross-platform via portable-pty)."

[lints]
workspace = true

[dependencies]
aphrody-a2a-coord = { workspace = true }
portable-pty        = { workspace = true }
aphrody-terminal-core = { workspace = true }
tokio               = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync", "net", "fs", "time"] }
tokio-tungstenite = { workspace = true }
futures-util        = { workspace = true }
anyhow              = { workspace = true }
thiserror           = { workspace = true }
tracing             = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
url                 = { workspace = true }
getrandom           = { workspace = true }

# PATH/PATHEXT lookup for the default shell, in-process instead of spawning `where.exe`.
[target.'cfg(target_os = "windows")'.dependencies]
which               = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["rt", "macros", "io-util", "sync", "net", "fs", "time"] }
tempfile = { workspace = true }

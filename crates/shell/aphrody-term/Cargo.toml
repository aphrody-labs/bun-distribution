# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-term"
description = "Headless VT terminal engine (cell grid, native PTY, screen scraping, quad batching) for Aphrody computer use."
version = "1.4.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "aphrody_term"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
portable-pty = { workspace = true }
serde = { workspace = true, features = ["derive"] }
memchr = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
aphrody-terminal-core = { workspace = true }

[features]
default = []

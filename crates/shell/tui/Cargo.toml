[package]
name = "aphrody-tui"
version = "1.0.0-canary"
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Full-screen interactive agent surface for aphrody, built on Ratatui 0.30 + crossterm. A thin client over the SQ/EQ NDJSON protocol: renders the streamed Event timeline (agent message deltas, reasoning, tool calls, exec output) and turns key input into Submission/UserInput. Inspired by the OpenAI Codex TUI (Apache-2.0)."

[lints]
workspace = true

[dependencies]
aphrody-agent-proto = { workspace = true }
ratatui             = { workspace = true }
crossterm           = { workspace = true, features = ["event-stream"] }
tokio               = { workspace = true }
tokio-stream        = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio             = { workspace = true }

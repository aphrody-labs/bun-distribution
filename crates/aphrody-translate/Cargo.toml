[package]
name = "aphrody-translate"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/aphrody"
authors = ["aphrody-code"]
homepage = "https://github.com/aphrody-labs/aphrody"
keywords = ["cli", "cross-platform", "rust", "linux", "wasm"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
readme                  = "README.md"
description = "aphrody — translate code comments to French, scrub AI-isms and emoji, apply Aphrody prose style"

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
aphrody-translate-core = { path = "../aphrody-translate-core", version = "1.4.4", features = [] }
serde = { version = "1.0.229", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
anyhow = "1.0.104"
tracing = "0.1.44"
sha2 = "0.11.0"
hex = { version = "0.4", features = [] }
dashmap = { version = "6", features = [] }
urlencoding = "2"

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen", "wasm-bindgen-futures"]

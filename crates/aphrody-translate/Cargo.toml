[package]
name = "aphrody-translate"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/aphrody"
authors = ["aphrody-code"]
keywords = ["cli", "cross-platform", "rust", "linux", "wasm"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
readme                  = "README.md"
description = "aphrody — translate code comments to French, scrub AI-isms and emoji, apply Aphrody prose style"

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
aphrody-translate-core = { path = "../aphrody-translate-core", version = "1.4.7", features = [] }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
anyhow = "1.0.104"
tracing = "0.1.44"
sha2 = "0.11.0"
hex = { version = "0.4", features = [] }
dashmap = { version = "6", features = [] }
urlencoding = "2"

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen", "wasm-bindgen-futures"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aphrody-proc = { path = "../aphrody-proc", version = "1.4.7", features = ["tokio"] }
clap = { version = "4.6.6", features = ["derive","env","color"] }
tokio = { version = "1.53.1", features = ["process","rt-multi-thread","macros","time","signal","sync","fs","io-util","full"] }
reqwest = { version = "0.13.5", features = ["rustls-no-provider","json","stream","form","query","charset","http2","system-proxy","blocking","cookies","gzip","brotli","deflate","socks","multipart"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring","std","tls12"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter","fmt","json","regex","registry"] }
ignore = { version = "0.4", features = [] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.52", default-features = false, features = ["sync","macros","io-util","rt","time"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
wasm-bindgen = { version = "0.2.129" }
wasm-bindgen-futures = { version = "0.4.79" }

[package]
name = "vectorcraft-format"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "VectorCraft native .vectorcraft format (versioned JSON, embedded images)"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
# VectorCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
vectorcraft-doc = { path = "../vectorcraft-doc", version = "0.10.0" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
vectorcraft-testkit = { path = "../vectorcraft-testkit" }
proptest = "1"
vectorcraft-geom = { path = "../vectorcraft-geom" }

[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { workspace = true, features = ["std", "fs"] }

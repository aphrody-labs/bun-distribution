[package]
name = "gridcraft-mcp"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "GridCraft MCP server: JSON-RPC 2.0 over stdio, driving a running app or a headless session"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
gridcraft-engine = { path = "../gridcraft-engine", version = "0.6.1" }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"

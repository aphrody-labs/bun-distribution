[package]
name = "figcraft-collab-net"
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "FigCraft live sessions over the network: the WebSocket transport, the session host the app embeds, invite links and presence relay (carries figcraft-collab's messages)"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
# Style lints from newer toolchains that fight index-heavy pixel code.
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
# FigCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Never crash). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
tungstenite = "0.30"
rustls = "0.23"
base64 = "0.23"
webpki-roots = "1"
getrandom = "0.4"
figcraft-engine = { path = "../figcraft-engine" }
figcraft-collab = { path = "../figcraft-collab" }
figcraft-doc = { path = "../figcraft-doc" }
log = "0.4"
web-time = "1"

[dev-dependencies]
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# `wss://`: TLS with ring as the crypto provider and Mozilla's root certificates compiled in (no
# OS certificate store, no OpenSSL). Over our own split reader/writer stream (`tls.rs`), so not
# tungstenite's single-owner TLS stream.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"
getrandom = "0.4"
base64 = { workspace = true }

# The browser client: the page's WebSocket API.

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "WebSocket", "BinaryType", "MessageEvent", "CloseEvent"] }

# Opening invite links: the per-user URL handler registration on Windows.

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[package]
name = "bevy_input_focus"
version = "0.20.0"
edition = "2024"
description = "Keyboard focus management"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]
rust-version = "1.94.0"

[features]
default = [
  "std",
  "bevy_reflect",
  "bevy_ecs/async_executor",
  "gamepad",
  "keyboard",
  "mouse",
]
gamepad = ["bevy_input/gamepad"]
keyboard = ["bevy_input/keyboard"]
mouse = ["bevy_input/mouse"]

# Functionality

## Adds runtime reflection support using `bevy_reflect`.
bevy_reflect = [
  "dep:bevy_reflect",
  "bevy_app/bevy_reflect",
  "bevy_ecs/bevy_reflect",
  "bevy_math/bevy_reflect",
  "bevy_input/bevy_reflect",
  "bevy_window/bevy_reflect",
]

## Adds serialization support through `serde`.
serialize = [
  "bevy_ecs/serialize",
  "bevy_math/serialize",
  "bevy_input/serialize",
  "bevy_window/serialize",
]

# Platform Compatibility

## Allows access to the `std` crate. Enabling this feature will prevent compilation
## on `no_std` targets, but provides access to certain additional features on
## supported platforms.
std = [
  "bevy_app/std",
  "bevy_ecs/std",
  "bevy_math/std",
  "bevy_reflect/std",
  "bevy_input/std",
  "bevy_window/std",
]

## `critical-section` provides the building blocks for synchronization primitives
## on all platforms, including `no_std`.
critical-section = [
  "bevy_app/critical-section",
  "bevy_ecs/critical-section",
  "bevy_reflect?/critical-section",
  "bevy_input/critical-section",
]

## Uses the `libm` maths library instead of the one provided in `std` and `core`.
libm = ["bevy_math/libm", "bevy_window/libm"]

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.20.0", default-features = false }
bevy_camera = { path = "../bevy_camera", version = "0.20.0", default-features = false }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0", default-features = false }
bevy_input = { path = "../bevy_input", version = "0.20.0", default-features = false }
bevy_math = { path = "../bevy_math", version = "0.20.0", default-features = false }
bevy_picking = { path = "../bevy_picking", version = "0.20.0", default-features = false, optional = true }
bevy_window = { path = "../bevy_window", version = "0.20.0", default-features = false }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0", features = [
  "glam",
], default-features = false, optional = true }

# other
thiserror = { version = "2", default-features = false }
log = { version = "0.4", default-features = false }

# Bevy's workspace lints (upstream [workspace.lints]) merged with the Bun OS root lints at
# their stricter level; Cargo cannot inherit two lint sets, so they are explicit per crate.
[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_must_use = "deny"
non_ascii_idents = "warn"

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

[package]
name = "wordcraft-ui-egui"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "WordCraft egui front end (Word-style ribbon UI); swappable: nothing below depends on it"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
craft-ui = { path = "../craft-ui" }
wordcraft-geom = { path = "../wordcraft-geom" }
wordcraft-doc = { path = "../wordcraft-doc" }
wordcraft-fonts = { path = "../wordcraft-fonts" }
wordcraft-layout = { path = "../wordcraft-layout" }
wordcraft-render = { path = "../wordcraft-render" }
wordcraft-engine = { path = "../wordcraft-engine" }
wordcraft-zotero = { path = "../wordcraft-zotero" }
egui = "0.36"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
sys-locale = { version = "0.3", features = ["js"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
zip = { workspace = true }

[build-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"

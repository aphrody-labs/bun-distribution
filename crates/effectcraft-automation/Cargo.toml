[package]
name = "effectcraft-automation"
description = "EffectCraft MCP server (JSON-RPC 2.0 over stdio) over a headless session or bridged to the running app's control channel"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-engine = { path = "../effectcraft-engine", version = "0.9.2" }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
effectcraft-script = { path = "../effectcraft-script" }
effectcraft-host = { path = "../effectcraft-host" }

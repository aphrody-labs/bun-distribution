[package]
workspace = "../.."
name = "craft-fonts-tests"
description = "Assertions on the fonts themselves: checksums, licences, names, script coverage and vertical-text support."
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/storytold/craft-fonts"
rust-version.workspace = true
publish = false

[dependencies]
craft-fonts = { workspace = true }

[dev-dependencies]
skrifa = { workspace = true, features = ["default"] }
sha2 = { workspace = true, default-features = true }

[lints.rust]
unsafe_code = "forbid"

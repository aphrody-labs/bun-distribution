[package]
name = "vectorcraft-effects"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "VectorCraft live effects evaluated to geometry"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
# VectorCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
vectorcraft-geom = { path = "../vectorcraft-geom" }
vectorcraft-three-d = { path = "../vectorcraft-three-d" }
vectorcraft-doc = { path = "../vectorcraft-doc" }
vectorcraft-pathops = { path = "../vectorcraft-pathops" }
vectorcraft-text = { path = "../vectorcraft-text" }
vectorcraft-plugins = { path = "../vectorcraft-plugins" }
kurbo = { version = "0.13", features = ["serde"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
vectorcraft-color = { path = "../vectorcraft-color" }

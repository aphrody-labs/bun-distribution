# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-engine"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
homepage = "https://github.com/aphrody-labs/aphrody"
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description            = "The unified aphrody agent turn loop: drives a ModelClient stream, maps unified ModelStreamEvent into the SQ/EQ EventMsg protocol, runs tool calls via a ToolRegistry, re-injects tool results for multi-turn reasoning, and records the session to a rollout. The single engine shared by every surface (CLI / TUI / desktop / MCP). Inspired by OpenAI Codex (Apache-2.0)."

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
aphrody-agent-proto = { path = "../aphrody-agent-proto", features = [] }
aphrody-agent-home = { path = "../aphrody-agent-home", features = [] }
aphrody-model-client = { path = "../aphrody-model-client", features = [] }
aphrody-toolcall = { path = "../aphrody-toolcall", features = [] }
aphrody-rollout = { path = "../aphrody-rollout", features = [] }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }
tokio-stream = { version = "0.1", features = [] }
futures = "0.3.34"
async-trait = "0.1.92"
base64 = "0.23.1"
tracing = "0.1.44"

[dev-dependencies]
pretty_assertions = { version = "1", features = [] }
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }
tempfile = "3.27.0"

[package]
name = "aphrody-n2b-core"
description = "N2B engine: rules, scanners, reports, audit, run orchestration, manifest handling, report card and llms.txt generation."
version = "0.6.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

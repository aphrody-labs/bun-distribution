[package]
name = "photocraft-raster"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
photocraft-geom = { path = "../photocraft-geom" }
photocraft-color = { path = "../photocraft-color" }
serde = { version = "1", features = ["derive", "rc"] }

[dev-dependencies]
proptest = "1"

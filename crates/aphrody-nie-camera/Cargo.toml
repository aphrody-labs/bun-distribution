[package]
name = "aphrody-nie-camera"
description = "Caméra d'Inazuma Eleven: Victory Road — modèle, contrôleurs portés (CCameraCtrl*), codec G4CM (décode/encode byte-exact), configs cfg.bin, carte RE et pilotage live du process."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
# Outil caméra : carte RE, extraction VFS, décodage/encodage G4CM, dump de configs, live.
name = "nie-cam"
path = "src/bin/nie-cam.rs"
required-features = ["host"]

[features]
default = ["host"]
# Process memory and SQLite indexing are native bindings. The camera model, controllers, G4CM
# codec, configuration parsers and verified RE map remain available to WebAssembly without them.
host = ["dep:anyhow", "dep:clap", "dep:aphrody-nie-index", "dep:aphrody-nie-trace", "dep:sha2"]

[dependencies]
aphrody-nie-formats = { workspace = true, default-features = true }
aphrody-nie-data = { workspace = true, features = ["std"] }
aphrody-nie-trace = { workspace = true, optional = true, default-features = true }
aphrody-nie-index = { workspace = true, optional = true, default-features = true }
sha2 = { version = "0.10", optional = true }
thiserror = { workspace = true }
anyhow = { workspace = true, optional = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
clap = { workspace = true, optional = true, features = ["derive", "color", "env"] }

[package]
name = "lightcraft-raw"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "LightCraft RAW decoding, demosaicing and DNG colour model (L1)"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[dependencies]
lightcraft-tiff = { path = "../lightcraft-tiff" }
lightcraft-meta = { path = "../lightcraft-meta" }
lightcraft-raster = { path = "../lightcraft-raster" }
lightcraft-color = { path = "../lightcraft-color" }
lightcraft-geom = { path = "../lightcraft-geom" }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
rayon = "1"
miniz_oxide = "0.8"
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86", "neon"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
jxl-oxide = { version = "0.12", default-features = false, optional = true }

[features]
default = ["jxl"]
## JPEG XL compressed DNGs (DNG 1.7, compression 52546) via jxl-oxide (pure Rust, MIT OR Apache-2.0).
jxl = ["dep:jxl-oxide"]

[dev-dependencies]
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
proptest = "1"
zune-jpegxl = { version = "0.5", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }

[package]
name = "effectcraft-lottie"
description = "Lottie JSON import and export: compositions, precomps, shape/solid/null/image/text layers, keyframes with temporal and spatial easing, masks, track mattes and a few effects"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-time = { path = "../effectcraft-time" }
effectcraft-color = { path = "../effectcraft-color" }
effectcraft-keyframe = { path = "../effectcraft-keyframe" }
effectcraft-project = { path = "../effectcraft-project" }
effectcraft-path = { path = "../effectcraft-path" }
effectcraft-text = { path = "../effectcraft-text" }
effectcraft-effects = { path = "../effectcraft-effects" }
kurbo = { version = "0.13", features = ["serde"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

[dev-dependencies]
effectcraft-render = { path = "../effectcraft-render" }

[package]
name = "figcraft-ui-egui"
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "FigCraft egui frontend (the Figma-style UI: canvas, toolbar, layers, design and prototype panels, menus); swappable: nothing below depends on it"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
# Style lints from newer toolchains that fight index-heavy pixel code.
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
# FigCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Never crash). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
craft-ui = { workspace = true }
figcraft-geom = { path = "../figcraft-geom", version = "0.5.1" }
figcraft-color = { path = "../figcraft-color", version = "0.5.1" }
figcraft-doc = { path = "../figcraft-doc", version = "0.5.1" }
figcraft-text = { path = "../figcraft-text", version = "0.5.1" }
figcraft-layout = { path = "../figcraft-layout", version = "0.5.1" }
figcraft-render = { path = "../figcraft-render", version = "0.5.1" }
figcraft-pathops = { path = "../figcraft-pathops", version = "0.5.1" }
figcraft-engine = { path = "../figcraft-engine", version = "0.5.1" }
egui = "0.36"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
egui_extras = { version = "0.36", default-features = false }

[build-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"

[dev-dependencies]
wat = "1.261"

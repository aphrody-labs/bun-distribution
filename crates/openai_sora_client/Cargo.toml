[package]
name = "openai_sora_client"
edition = "2024"
version = "0.0.1"
publish = false

[lib]
name = "openai_sora_client"
path = "src/lib.rs"

[dependencies]
errors = { path = "../artcraft-errors", package = "artcraft-errors" }
uuid_utils = { path = "../artcraft-uuid_utils", package = "artcraft-uuid_utils" }
anyhow = "1.0.102"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
cloudflare_errors = { path = "../cloudflare_errors" }
cookie = "0.18.1"
log = "0.4.29"
once_cell = "1.21.4"
rand = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = "1.0.149"
sha3 = "0.10.8"
thiserror = "2.0.18"
toml = "1.0.7+spec-1.1.0"
url = { version = "2.5.8", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
wreq-util = "3.0.0-rc.10"
wreq = { version = "6.0.0-rc.28", features = ["json", "query", "form", "multipart", "cookies", "ws", "stream", "gzip", "brotli", "zstd", "deflate"] }

[dev-dependencies]
test_utils = { path = "../artcraft-test_utils", package = "artcraft-test_utils" }

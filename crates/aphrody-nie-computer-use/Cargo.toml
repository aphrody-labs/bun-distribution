[package]
name = "aphrody-nie-computer-use"
description = "Native, bounded Computer Use probes for nie.exe and Ghidra."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]
# Filesystem/SQLite validation and live process probes are native bindings. The
# offline image inspector remains available without this feature, including on
# `wasm32-unknown-unknown`.
host = ["dep:rusqlite", "aphrody-nie-re/host", "aphrody-nie-trace/host"]

[dependencies]
anyhow = { version = "1" }
hex.workspace = true
rusqlite = { workspace = true, optional = true, features = ["bundled"] }
sha2 = { version = "0.10" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1" }
aphrody-nie-re.workspace = true
aphrody-nie-trace.workspace = true

[dev-dependencies]
aphrody-nie-index = { workspace = true, default-features = true }

[[example]]
name = "verify_session"
required-features = ["host"]

[package]
name = "soundcraft-xtask"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[package]
name = "artcraft-enums"
edition = "2018"
version = "0.0.1"
authors = [
    "Brandon Thomas <bt@brand.io>",
    "Brandon Thomas <echelon@gmail.com>",
]
publish = false

[lib]
name = "enums"
path = "src/lib.rs"

[features]
default = []
database = ["sqlx", "sqlx-core", "sqlx-mysql"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
sqlx = { version = "0.7.4", features = ["mysql", "runtime-tokio-rustls", "chrono"], optional = true }
sqlx-core = { version = "0.7.4", optional = true }
sqlx-mysql = { version = "0.7.4", optional = true }
log = "0.4.29"
utoipa = { version = "5.4.0", features = ["chrono", "actix_extras", "url"] }

[dev-dependencies]
strum = { version = "0.28.0", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.0.7+spec-1.1.0"
regex = "1.12.3"

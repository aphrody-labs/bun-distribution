[package]
name = "effectcraft-pdf"
description = "Vector footage import: PDF and PDF-compatible Illustrator (.ai) pages and EPS (a PostScript subset) parsed into the SVG render tree (paths, fills, strokes, shadings, tiling patterns, clipping, text with embedded fonts, images, blend modes, soft masks, optional-content layers)"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-svg = { path = "../effectcraft-svg", version = "0.9.2" }
kurbo = { version = "0.13", features = ["serde"] }
effectcraft-text = { path = "../effectcraft-text", version = "0.9.2" }
miniz_oxide = "0.8"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
zune-jpeg = "0.5"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
effectcraft-raster = { path = "../effectcraft-raster" }

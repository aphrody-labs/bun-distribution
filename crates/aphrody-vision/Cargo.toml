# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-vision"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description            = "Visual transcription over local GGUF vision models: caption, dense-region description, full-page OCR and VQA."

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[features]
default = []
# Screenshot input. Optional because aphrody-capture only has a real
# implementation on Windows: making it mandatory would force every Linux
# consumer to link a crate whose whole surface returns `Unsupported`.
capture = ["dep:aphrody-capture", "dep:tempfile"]

[dependencies]
aphrody-ocr-vlm = { path = "../aphrody-ocr-vlm", version = "1.4.7", features = [] }
aphrody-ocr-core = { path = "../aphrody-ocr-core", version = "1.4.7", features = [] }
aphrody-models = { path = "../aphrody-models", version = "1.4.7", features = [] }
aphrody-capture = { path = "../aphrody-capture", version = "1.4.7", features = [], optional = true }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.20"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
image = { version = "0.25.10", features = ["png"] }

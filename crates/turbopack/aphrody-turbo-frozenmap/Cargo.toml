[package]
name = "aphrody-turbo-frozenmap"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "turbo_frozenmap"

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
indexmap = "2.14.0"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.149"

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[package]
name = "aphrody-turbopack-bench"
repository.workspace = true
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[lib]
name = "turbopack_bench"
bench = false

[[bench]]
name = "mod"
harness = false

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
anyhow = "1.0.100"
chromiumoxide = { version = "0.5.4", features = ["tokio-runtime"], default-features = false }
criterion = { version = "4.3.0", package = "codspeed-criterion-compat", features = ["async_tokio"] }
futures = "0.3.31"
owo-colors = "4.2.2"
parking_lot = "0.12.1"
portpicker = "0.1.1"
rand = "0.10.1"
regex = "1.12.3"
rustc-hash = "2.1.1"
serde_json = "1.0.149"
tempfile = "3.20.0"
tokio = { version = "1.52.1", features = ["full"] }
tungstenite = "0.20.1"
turbo-tasks = { path = "../aphrody-turbo-tasks", package = "aphrody-turbo-tasks", version = "0.1.0" }
turbo-tasks-testing = { path = "../aphrody-turbo-tasks-testing", package = "aphrody-turbo-tasks-testing", version = "0.1.0" }
turbopack-create-test-app = { path = "../aphrody-turbopack-create-test-app", package = "aphrody-turbopack-create-test-app", version = "0.1.0" }
url = "2.2.2"

[target.'cfg(unix)'.dependencies]
nix = { version="0.30.1", features=["signal"] }

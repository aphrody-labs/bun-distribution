[package]
name = "aphrody-turbopack-create-test-app"
repository.workspace = true
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"

# don't publish this crate (for now)
[[bin]]
name = "turbopack-create-test-app"
path = "src/main.rs"
bench = false

[lib]
name = "turbopack_create_test_app"
bench = false

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.2", features = ["derive"] }
indoc = "2.0.0"
pathdiff = "0.2.1"
serde_json = "1.0.149"
tempfile = "3.20.0"

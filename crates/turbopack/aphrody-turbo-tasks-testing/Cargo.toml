[package]
name = "aphrody-turbo-tasks-testing"
repository.workspace = true
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false
autotests = false

[lib]
name = "turbo_tasks_testing"
bench = false

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
anyhow = "1.0.100"
futures = "0.3.31"
rustc-hash = "2.1.1"
smallvec = { version = "1.15.1", features = ["const_generics", "union", "const_new"] }
tokio = "1.52.1"
turbo-tasks = { path = "../aphrody-turbo-tasks", package = "aphrody-turbo-tasks", features = ["non_operation_vc_strongly_consistent"], version = "0.1.0" }
turbo-tasks-backend = { path = "../aphrody-turbo-tasks-backend", package = "aphrody-turbo-tasks-backend", version = "0.1.0" }

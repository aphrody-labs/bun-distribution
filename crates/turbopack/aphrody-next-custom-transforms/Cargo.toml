[package]
edition = "2024"
name = "aphrody-next-custom-transforms"
description = "Aphrody platform crate aphrody-next-custom-transforms."
license = "MIT"
repository.workspace = true
version = "0.0.0"
[lib]
name = "next_custom_transforms"

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
base64 = "0.22.1"
bytes-str = "0.2.7"
chrono = "0.4"
easy-error = "1.0.0"
either = "1"
hex = "0.4.3"
indexmap = "2.14.0"
indoc = "2.0.0"
pathdiff = "0.2.1"
regex = "1.5"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha1 = "0.10.1"
tracing = "0.1.44"
anyhow = "1.0.100"

swc_core = { version = "79.0.0", default-features = false, features = ["ecma_loader_lru", "ecma_loader_parking_lot", "parallel_rayon", "base", "common_concurrent", "ecma_ast", "ecma_codegen", "ecma_loader_node", "ecma_minifier", "ecma_parser", "ecma_parser_typescript", "ecma_preset_env", "ecma_quote", "ecma_transforms", "ecma_transforms_optimization", "ecma_transforms_react", "ecma_transforms_typescript", "ecma_utils", "ecma_visit"] }
modularize_imports = "18.0.0"
styled_components = "18.0.0"
styled_jsx = "18.0.0"
swc_emotion = "18.0.0"
swc_relay = "18.0.0"
turbo-rcstr = { path = "../aphrody-turbo-rcstr", package = "aphrody-turbo-rcstr", version = "0.1.0" }
urlencoding = "2.1.2"
next-taskless = { path = "../aphrody-next-taskless", package = "aphrody-next-taskless", version = "0.0.1" }

react_remove_properties = "18.0.0"
remove_console = "18.0.0"
preset_env_base = "9.0.0"

[dev-dependencies]
testing = "27.0.0"
swc_core = { version = "79.0.0", default-features = false, features = ["ecma_loader_lru", "ecma_loader_parking_lot", "parallel_rayon", "testing_transform", "__plugin_transform_host", "__plugin_transform_host_schema_v1"] }
swc_plugin_backend_wasmtime = "16.0.0"
turbopack-ecmascript-plugins = { path = "../aphrody-turbopack-ecmascript-plugins", package = "aphrody-turbopack-ecmascript-plugins", default-features = false, version = "0.1.0" }

[package]
name = "aphrody-turbo-tasks-backend"
repository.workspace = true
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[lib]
name = "turbo_tasks_backend"
bench = false

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[features]
default = []
print_cache_item_size_with_compressed = ["print_cache_item_size", "dep:lz4_flex"]
print_cache_item_size = []
no_fast_stale = []
aggregation_update_no_batch = []
verify_serialization = []
verify_aggregation_graph = []
verify_immutable = []
verify_determinism = ["turbo-tasks/verify_determinism"]
hanging_detection = ["turbo-tasks/hanging_detection"]
task_dirty_cause = ["turbo-tasks/task_dirty_cause"]
trace_aggregation_update_stats = []
trace_aggregation_update_queue = []
trace_aggregation_update = ["trace_aggregation_update_queue"]
trace_leaf_distance_update = []
trace_find_and_schedule = ["trace_aggregation_update_queue"]
trace_task_completion = []
trace_task_modification = []
trace_task_dirty = ["trace_aggregation_update_queue", "task_dirty_cause"]
trace_task_output_dependencies = []
trace_task_details = []
trace_prepare_tasks = []

[dependencies]
anyhow = "1.0.100"
bincode = { version = "2.0.1", features = ["serde"] }
auto-hash-map = { path = "../aphrody-auto-hash-map", package = "aphrody-auto-hash-map", version = "0.1.0" }
bitfield = "0.19.4"
crossbeam-utils = "0.8"
dashmap = { version = "7.0.0-rc2", features = ["raw-api"] }
fs-err = "3.1.1"
hashbrown = "0.15.4"
indexmap = "2.14.0"
jiff = "0.2.10"
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "checked-decode"], optional = true }
parking_lot = "0.12.1"
rand = "0.10.1"
ringmap = { version = "0.2.5", features = ["serde"] }
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_path_to_error = "0.1.20"
smallvec = { version = "1.15.1", features = ["const_generics", "union", "const_new"] }
tokio = "1.52.1"
tracing = "0.1.44"
turbo-bincode = { path = "../aphrody-turbo-bincode", package = "aphrody-turbo-bincode", version = "0.0.0" }
turbo-rcstr = { path = "../aphrody-turbo-rcstr", package = "aphrody-turbo-rcstr", version = "0.1.0" }
turbo-tasks = { path = "../aphrody-turbo-tasks", package = "aphrody-turbo-tasks", version = "0.1.0" }
turbo-tasks-hash = { path = "../aphrody-turbo-tasks-hash", package = "aphrody-turbo-tasks-hash", version = "0.1.0" }
turbo-tasks-malloc = { path = "../aphrody-turbo-tasks-malloc", package = "aphrody-turbo-tasks-malloc", default-features = false, version = "0.1.0" }
thread_local = "1.1.8"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
turbo-persistence = { path = "../aphrody-turbo-persistence", package = "aphrody-turbo-persistence", version = "0.1.0" }

[target.'cfg(target_family = "wasm")'.dependencies]
turbo-persistence = { path = "../aphrody-turbo-persistence", package = "aphrody-turbo-persistence", default-features = false, version = "0.1.0" }

[dev-dependencies]
async-trait = "0.1.64"
futures = "0.3.31"
indoc = "2.0.0"
regex = "1.12.3"
tempfile = "3.20.0"
triomphe = { git = "https://github.com/sokra/triomphe", branch = "sokra/unstable" }
thiserror = "1.0.48"
turbo-tasks-malloc = { path = "../aphrody-turbo-tasks-malloc", package = "aphrody-turbo-tasks-malloc", default-features = false, features = ["custom_allocator"], version = "0.1.0" }
rstest = "0.16.0"
turbo-tasks-testing = { path = "../aphrody-turbo-tasks-testing", package = "aphrody-turbo-tasks-testing", version = "0.1.0" }
# The read-outcome tests assert on the counters, so they need them compiled in. Only for tests —
# normal builds of this crate get the default (disabled) turbo-tasks.
turbo-tasks = { path = "../aphrody-turbo-tasks", package = "aphrody-turbo-tasks", features = ["inline_execution_stats"], version = "0.1.0" }

# Only used by the benchmarks, which don't run on wasm. Gated by target so that
# `cargo test -p turbo-tasks-backend --lib --target wasm32-wasip1-threads` can build: criterion pulls
# in rayon, which refuses to compile for wasi, and cargo resolves dev-dependencies even for `--lib`.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { version = "4.3.0", package = "codspeed-criterion-compat", features = ["async_tokio"] }

[[bench]]
name = "mod"
harness = false

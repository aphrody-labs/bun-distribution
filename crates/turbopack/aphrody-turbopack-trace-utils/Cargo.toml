[package]
name = "aphrody-turbopack-trace-utils"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[lib]
name = "turbopack_trace_utils"
bench = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
crossbeam-utils = { version = "0.8.20" }
crossbeam-channel = "0.5.8"
parking_lot = "0.12.1"
postcard = { version = "1.0.4", features = ["alloc", "use-std"] }
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["macros", "signal", "sync", "rt"] }
thread_local = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.16"
turbo-tasks-malloc = { path = "../aphrody-turbo-tasks-malloc", package = "aphrody-turbo-tasks-malloc", default-features = false }

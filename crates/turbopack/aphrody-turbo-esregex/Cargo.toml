[package]
name = "aphrody-turbo-esregex"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "turbo_esregex"

[dependencies]
anyhow = "1.0.100"
bincode = { version = "2.0.1", features = ["serde"] }
regex = "1.12.3"
regress = "0.11.1"
turbo-tasks = { path = "../aphrody-turbo-tasks", package = "aphrody-turbo-tasks" }

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

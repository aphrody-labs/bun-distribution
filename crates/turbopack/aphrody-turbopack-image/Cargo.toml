[package]
name = "aphrody-turbopack-image"
repository.workspace = true
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[lib]
name = "turbopack_image"
bench = false

[features]

# [NOTE]: Before enable this, ensure this can build all of the target platforms we support.
avif = ["image/avif"]
webp = ["image/webp"]

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.64"
base64 = "0.22.1"
bincode = { version = "2.0.1", features = ["serde"] }
image = { version = "0.25.8", default-features = false, features = ["gif", "png", "jpeg", "ico", "bmp", "tga"] }
mime = "0.3.16"
phf = { version = "0.11", features = ["macros"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
turbo-bincode = { path = "../aphrody-turbo-bincode", package = "aphrody-turbo-bincode", version = "0.0.0" }
turbo-rcstr = { path = "../aphrody-turbo-rcstr", package = "aphrody-turbo-rcstr", version = "0.1.0" }
turbo-tasks = { path = "../aphrody-turbo-tasks", package = "aphrody-turbo-tasks", version = "0.1.0" }
turbo-tasks-fs = { path = "../aphrody-turbo-tasks-fs", package = "aphrody-turbo-tasks-fs", version = "0.1.0" }
turbopack-core = { path = "../aphrody-turbopack-core", package = "aphrody-turbopack-core", version = "0.1.0" }

[package]
name = "aphrody-turbo-tasks-bytes"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"

[lib]
name = "turbo_tasks_bytes"
bench = false

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
anyhow = "1.0.100"
bincode = { version = "2.0.1", features = ["serde"] }
bytes = "1.11.1"
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
turbo-tasks = { path = "../aphrody-turbo-tasks", package = "aphrody-turbo-tasks" }

[package]
name = "aphrody-turbopack-lightningcss-napi"
description = "Aphrody platform crate aphrody-turbopack-lightningcss-napi."
repository.workspace = true
version = "0.0.0"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "turbopack_lightningcss_napi"

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
cssparser = "0.37.0"
lightningcss = { version = "1.0.0-alpha.72", features = ["serde", "visitor", "into_owned", "browserslist", "nodejs"] }
napi = { version = "3.10.0", default-features = false, features = ["napi3", "serde-json", "tokio_rt", "error_anyhow", "napi4", "napi5"] }
parcel_sourcemap = { version = "2.1.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-content = { version = "0.1.2", features = ["serde"] }
serde-detach = "0.0.1"
serde_bytes = "0.11.5"
smallvec = { version = "1.15.1", features = ["const_generics", "union", "const_new"] }

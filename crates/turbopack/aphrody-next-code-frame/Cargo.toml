[package]
name = "aphrody-next-code-frame"
repository.workspace = true
version = "0.0.1"
description = "Fast, scalable code frame rendering for Next.js error reporting"
license = "MIT"
edition = "2024"

[lib]
name = "next_code_frame"
bench = false

[[bin]]
name = "code_frame"
path = "src/bin/code_frame.rs"

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.2", features = ["derive"] }
memchr = "2.8.0"
phf = { version = "0.11", features = ["macros"] }
regex = "1.12.3"
regex-automata = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
unicode-width = "0.2"

[dev-dependencies]
criterion = { version = "4.3.0", package = "codspeed-criterion-compat" }
insta = { version = "1.43.1", features = ["yaml"] }

[[bench]]
name = "code_frame_bench"
harness = false

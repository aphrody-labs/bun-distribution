[package]
name = "aphrody-turbo-tasks-macros"
repository.workspace = true
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"

[lib]
name = "turbo_tasks_macros"
proc-macro = true
bench = false

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
either = "1.15.0"
indexmap = "2.14.0"
proc-macro-error = "1.0.4"
proc-macro2 = "1.0.79"
quote = "1.0.45"
regex = "1.12.3"
rustc-hash = "2.1.1"
syn = { version = "2.0.100", features = ["full", "extra-traits", "visit", "visit-mut"] }

[dev-dependencies]
rstest = "0.16.0"

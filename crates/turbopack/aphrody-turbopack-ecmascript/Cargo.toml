[package]
name = "aphrody-turbopack-ecmascript"
repository.workspace = true
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[lib]
name = "turbopack_ecmascript"
bench = false

[[bench]]
name = "analyzer"
harness = false

[[bench]]
name = "references"
harness = false

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
allocator-api2 = "0.2.21"
anyhow = "1.0.100"
async-trait = "0.1.64"
auto-hash-map = { path = "../aphrody-auto-hash-map", package = "aphrody-auto-hash-map", version = "0.1.0" }
bincode = { version = "2.0.1", features = ["serde"] }
bumpalo = { version = "3.19.0", features = ["boxed", "collections", "allocator-api2"] }
bytes-str = "0.2.7"
data-encoding = "2.3.3"
either = "1.15.0"
indexmap = "2.14.0"
indoc = "2.0.0"
itertools = "0.10.5"
num-bigint = "0.4"
num-traits = "0.2.15"
parking_lot = "0.12.1"
phf = { version = "0.11", features = ["macros"] }
petgraph = "0.8.3"
dashmap = "7.0.0-rc2"
regex = "1.12.3"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
serde_qs = "1.1.1"
swc_ecma_react_compiler = "25.0.0"
react_compiler = "0.1.0"
next-custom-transforms = { path = "../aphrody-next-custom-transforms", package = "aphrody-next-custom-transforms", default-features = false, version = "0.0.0" }
swc_sourcemap = "10.0.2"
smallvec = { version = "1.15.1", features = ["const_generics", "union", "const_new"] }
strsim = "0.11.1"
thread_local = "1.1.8"
tokio = "1.52.1"
tracing = "0.1.44"
turbo-bincode = { path = "../aphrody-turbo-bincode", package = "aphrody-turbo-bincode", version = "0.0.0" }
turbo-esregex = { path = "../aphrody-turbo-esregex", package = "aphrody-turbo-esregex", version = "0.1.0" }
turbo-frozenmap = { path = "../aphrody-turbo-frozenmap", package = "aphrody-turbo-frozenmap", version = "0.1.0" }
turbo-rcstr = { path = "../aphrody-turbo-rcstr", package = "aphrody-turbo-rcstr", version = "0.1.0" }
turbo-tasks = { path = "../aphrody-turbo-tasks", package = "aphrody-turbo-tasks", version = "0.1.0" }
turbo-tasks-fs = { path = "../aphrody-turbo-tasks-fs", package = "aphrody-turbo-tasks-fs", version = "0.1.0" }
turbo-tasks-hash = { path = "../aphrody-turbo-tasks-hash", package = "aphrody-turbo-tasks-hash", version = "0.1.0" }
turbopack-core = { path = "../aphrody-turbopack-core", package = "aphrody-turbopack-core", version = "0.1.0" }
turbopack-resolve = { path = "../aphrody-turbopack-resolve", package = "aphrody-turbopack-resolve", version = "0.1.0" }
turbopack-swc-utils = { path = "../aphrody-turbopack-swc-utils", package = "aphrody-turbopack-swc-utils", version = "0.1.0" }
url = "2.2.2"
urlencoding = "2.1.2"

swc_core = { version = "79.0.0", default-features = false, features = ["ecma_loader_lru", "ecma_loader_parking_lot", "parallel_rayon", "ecma_ast", "ecma_ast_serde", "common", "common_concurrent", "common_sourcemap", "ecma_ast_shrink", "ecma_codegen", "ecma_helpers_inline", "ecma_lints", "ecma_minifier", "ecma_parser", "ecma_preset_env", "ecma_transforms", "ecma_transforms_react", "ecma_transforms_optimization", "ecma_transforms_typescript", "ecma_transforms_proposal", "ecma_quote", "ecma_visit", "ecma_visit_path", "ecma_visit_serde", "ecma_utils", "testing", "base"] }

[features]
default = []

[dev-dependencies]
criterion = { version = "4.3.0", package = "codspeed-criterion-compat", features = ["async_tokio"] }
rstest = "0.16.0"
turbo-tasks-backend = { path = "../aphrody-turbo-tasks-backend", package = "aphrody-turbo-tasks-backend", version = "0.1.0" }
turbo-tasks-malloc = { path = "../aphrody-turbo-tasks-malloc", package = "aphrody-turbo-tasks-malloc", default-features = false, features = ["custom_allocator"], version = "0.1.0" }
turbo-tasks-testing = { path = "../aphrody-turbo-tasks-testing", package = "aphrody-turbo-tasks-testing", version = "0.1.0" }
turbopack-test-utils = { path = "../aphrody-turbopack-test-utils", package = "aphrody-turbopack-test-utils", version = "0.1.0" }

[package]
name = "aphrody-turbo-tasks-fs"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"

[lib]
name = "turbo_tasks_fs"
bench = false

[[bench]]
name = "mod"
harness = false

[features]
default = []
# Enables dynamic linking (and hot reloading) of embedded files/dirs.
# A binary built with this option **is not portable**, the directory
# path will be embedded into the binary.
dynamic_embed_contents = []

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.64"
auto-hash-map = { path = "../aphrody-auto-hash-map", package = "aphrody-auto-hash-map" }
bincode = { version = "2.0.1", features = ["serde"] }
bitflags = "1.3.2"
bytes = "1.11.1"
concurrent-queue = "2.5.0"
dashmap = "7.0.0-rc2"
fs-err = "3.1.1"
futures = "0.3.31"
include_dir = { version = "0.7.3", features = ["nightly"] }
indexmap = "2.14.0"
jsonc-parser = { version = "0.26.3", features = ["serde"] }
mime = "0.3.16"
notify = "9.0.0-rc.5"
parking_lot = "0.12.1"
pathdiff = "0.2.1"
regex = "1.12.3"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
serde_path_to_error = "0.1.20"
smallvec = { version = "1.15.1", features = ["const_generics", "union", "const_new"] }
thiserror = "1.0.48"
tokio = "1.52.1"
tracing = "0.1.44"
triomphe = { git = "https://github.com/sokra/triomphe", branch = "sokra/unstable" }
turbo-bincode = { path = "../aphrody-turbo-bincode", package = "aphrody-turbo-bincode" }
turbo-frozenmap = { path = "../aphrody-turbo-frozenmap", package = "aphrody-turbo-frozenmap" }
turbo-rcstr = { path = "../aphrody-turbo-rcstr", package = "aphrody-turbo-rcstr" }
turbo-tasks = { path = "../aphrody-turbo-tasks", package = "aphrody-turbo-tasks" }
turbo-tasks-hash = { path = "../aphrody-turbo-tasks-hash", package = "aphrody-turbo-tasks-hash" }
turbo-unix-path = { path = "../aphrody-turbo-unix-path", package = "aphrody-turbo-unix-path" }
url = "2.2.2"
urlencoding = "2.1.2"

[target.'cfg(windows)'.dependencies]
omnipath = "0.1.6"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }

[dev-dependencies]
criterion = { version = "4.3.0", package = "codspeed-criterion-compat", features = ["async_tokio"] }
rand = "0.10.1"
rstest = "0.16.0"
sha2 = "0.10.2"
tempfile = "3.20.0"
turbo-tasks-testing = { path = "../aphrody-turbo-tasks-testing", package = "aphrody-turbo-tasks-testing" }
turbo-tasks-backend = { path = "../aphrody-turbo-tasks-backend", package = "aphrody-turbo-tasks-backend" }

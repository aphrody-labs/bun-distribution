# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-app-server"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description = "Local Codex-shaped app server for Aphrody threads and turns."

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[features]
default = []
rag = ["dep:aphrody-rag", "aphrody-agent-runtime/rag"]
# Managed local models run inside the host process (no re-executed daemon).
in-process = ["aphrody-agent-runtime/in-process"]
# Compose the shared native product site on the app-server listener.
site = ["dep:aphrody-site"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "http2"] }
async-trait = "0.1.92"
futures = "0.3.34"
aphrody-agent-runtime = { path = "../aphrody-agent-runtime", features = [] }
aphrody-agent-proto = { path = "../aphrody-agent-proto", features = [] }
aphrody-app-protocol = { path = "../aphrody-app-protocol", features = [] }
aphrody-site = { path = "../aphrody-site", optional = true }
aphrody-llama-server = { path = "../aphrody-llama-server", features = [] }
aphrody-config = { path = "../aphrody-config", features = [] }
aphrody-google = { path = "../aphrody-google", features = [] }
aphrody-model-client = { path = "../aphrody-model-client", features = [] }
aphrody-models = { path = "../aphrody-models", features = [] }
aphrody-rollout = { path = "../aphrody-rollout", features = [] }
aphrody-rag = { path = "../aphrody-rag", features = [], optional = true }
aphrody-toolcall = { path = "../aphrody-toolcall", features = [] }
chrono = { version = "0.4", features = ["serde"] }
aphrody-engine = { path = "../aphrody-engine", features = [] }
aphrody-agent-home = { path = "../aphrody-agent-home", features = [] }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
jsonschema = { version = "0.58", default-features = false, features = [] }
thiserror = "2.0.20"
toml = "1.1.5"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full", "rt"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }

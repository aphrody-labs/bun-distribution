[package]
name = "soundcraft-ui-egui"
description = "SoundCraft's egui user interface: Edit and Mix windows, transport, dialogs, control channel"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/soundcraft"

[dependencies]
craft-ui = { path = "../craft-ui", version = "0.1.0", features = ["serde"] }
soundcraft-time = { path = "../soundcraft-time" }
soundcraft-audio-io = { path = "../soundcraft-audio-io" }
soundcraft-midi = { path = "../soundcraft-midi" }
soundcraft-dsp = { path = "../soundcraft-dsp" }
soundcraft-clap-host = { path = "../soundcraft-clap-host" }
soundcraft-vst3-host = { path = "../soundcraft-vst3-host" }
soundcraft-au-host = { path = "../soundcraft-au-host" }
soundcraft-model = { path = "../soundcraft-model" }
soundcraft-mix = { path = "../soundcraft-mix" }
soundcraft-engine = { path = "../soundcraft-engine" }
soundcraft-playback = { path = "../soundcraft-playback" }
soundcraft-video = { path = "../soundcraft-video" }
egui = "0.36"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[build-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"

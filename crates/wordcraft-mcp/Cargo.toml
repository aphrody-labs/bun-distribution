[package]
name = "wordcraft-mcp"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "WordCraft MCP server: every command as a tool, headless or bridged to the running app"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
wordcraft-doc = { path = "../wordcraft-doc" }
wordcraft-engine = { path = "../wordcraft-engine" }
wordcraft-render = { path = "../wordcraft-render" }
wordcraft-control-key = { path = "../wordcraft-control-key" }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"

[package]
name = "filmcraft-edit"
description = "Pure timeline edit algebra: insert, overwrite, razor, ripple, roll, slip, slide, rate stretch, lift, extract"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
filmcraft-time = { path = "../filmcraft-time" }
filmcraft-project = { path = "../filmcraft-project" }
thiserror = "2"

[dev-dependencies]
proptest = "1"
filmcraft-geom = { path = "../filmcraft-geom" }
filmcraft-media = { path = "../filmcraft-media" }
serde_json = "1"

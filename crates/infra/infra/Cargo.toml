[package]
name = "aphrody-infra"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified Aphrody infrastructure, workflow, development environment and deployment orchestrator"

[lib]
name = "aphrody_infra"
path = "src/lib.rs"

[dependencies]
aphrody-proc = { workspace = true }
anyhow.workspace = true
aphrody-git = { workspace = true }
aphrody-ssh = { workspace = true }
aphrody-ovh = { path = "../ovh", version = "0.1.0" }
aphrody-vpn = { workspace = true }
aphrody-remote-desktop = { workspace = true, features = ["vnc"] }
aphrody-wireguard = { workspace = true }
aphrody-yolo = { path = "../yolo", version = "0.1.0" }
base64.workspace = true
chrono.workspace = true
clap.workspace = true
gix.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
ignore.workspace = true
opendal.workspace = true
rcgen.workspace = true
regex.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
tokio.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_TaskScheduler"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Services"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

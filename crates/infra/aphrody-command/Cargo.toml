[package]
name = "aphrody-command"
publish               = false  # flip to true once base/backend/a2a-* are on crates.io
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
authors.workspace     = true
license.workspace     = true
homepage.workspace    = true
repository.workspace  = true
description           = "Reusable in-process Aphrody command parser and dispatch for CLI and FFI hosts."

# Shared command implementation; apps/cli and the FFI are thin consumers.

[lints]
workspace = true

[features]
default = []
koharu = ["aphrody-manga/koharu"]
native = ["aphrody-rag/native"]
rag = ["dep:aphrody-rag", "aphrody-rag/ort", "aphrody-rag/native", "aphrody-agent-runtime/rag", "aphrody-app-server/rag", "native"]
train = ["dep:aphrody-train", "aphrody-train/registry"]
memory-lancedb = ["aphrody-memory/lancedb"]
# Native Google Magika deep-learning file-type classification, exposed via
# `aphrody re classify <path>`. Opt-in because it links the ONNX Runtime
# (`ort`), which fetches a prebuilt backend at build time — host-only, not
# hermetic-offline, not wasm. Build with:
#   cargo build -p aphrody --features magika
magika = ["aphrody-re/magika", "dep:ort"]

# Reproducible forensic extraction, exposed via `aphrody forensics ...`.
# Opt-in because it links `rusqlite` with the `bundled` libsqlite3 C source,
# which requires a C compiler at build time (host-only, not hermetic-offline,
# not wasm). The command maps + classifies + dumps schema ONLY; it never
# emits secret values (tokens / cookie bytes / `secret://` rows). Build with:
#   cargo build -p aphrody --features forensics
forensics = ["dep:rusqlite", "dep:sha2", "dep:hex"]

# Persistent local-filesystem search index (`aphrody index build/search`),
# backed by aphrody-fsindex (SQLite FTS5, bundled libsqlite3 — host-only, not
# wasm). Build with: cargo build -p aphrody --features index
index = ["dep:aphrody-fsindex"]

# Local ONNX inference (`aphrody infer runtime/probe`), backed by aphrody-infer.
# Opt-in because it links ONNX Runtime through `ort` in load-dynamic mode: the
# shared library is discovered at RUNTIME under ~/.aphrody/runtimes (aphrody
# forces +crt-static on MSVC while every prebuilt ORT is /MD, so static linking
# is impossible — CLAUDE.md §7). Host-only, not wasm. Build with:
#   cargo build -p aphrody --features infer
infer = ["dep:aphrody-infer"]

# Image-to-text via a local vision-language model (`aphrody ocr page/batch`),
# backed by aphrody-ocr. Drives llama.cpp's llama-mtmd-cli, which is resolved
# at RUNTIME under ~/.aphrody/runtimes — nothing is linked, so this feature is
# cheap; it is opt-in only because the command is useless without a vision
# model pulled. Build with: cargo build -p aphrody --features ocr
ocr = ["dep:aphrody-ocr", "aphrody-ocr/sqlite", "dep:sha2", "infer"]

# Persistent background job queue (`aphrody job submit/run/status/logs`),
# backed by aphrody-jobs. Opt-in because it links `rusqlite` with the bundled
# libsqlite3 C source, which needs a C compiler at build time — host-only, not
# wasm, same reason as `forensics` and `index`. Build with:
#   cargo build -p aphrody --features jobs
jobs = ["dep:aphrody-jobs"]


# Adobe Firefly Services image generation to disk (`aphrody firefly generate`),
# backed by aphrody-firefly (IMS OAuth S2S + v3 async generate). Host-only.
#   cargo build -p aphrody --features firefly
firefly = ["dep:aphrody-firefly"]

# YARA-X pattern matching (`aphrody re yara --rules <rules.yara> <binary>`).
# Pure Rust (BSD-3-Clause). Activates the `yara` feature in aphrody-re.
# Host-only (reads files + compiles rules at runtime). Build with:
#   cargo build -p aphrody --features yara
yara = ["aphrody-re/yara"]

# Cross-platform note (Linux > Windows > wasm) :
# - `cli` ships a full native binary on Linux/Windows/macOS.
# - On wasm32-*, only a minimal stub (Version + help) is built, because
#   backend/a2a* pull tokio "full" + mio + reqwest + rustls + ring which
#   do not compile on wasm. The cfg-gated dep sets below keep both ends
#   buildable from the same crate.

[dependencies]
webbrowser = { workspace = true }
clap          = { workspace = true }
# clap_complete is unconditional: Shell is referenced in the Commands enum which
# compiles on all targets. clap_complete itself has no OS-specific code and
# builds fine on wasm32.
clap_complete = { workspace = true }
miette        = { workspace = true }
async-trait   = { workspace = true }
aphrody-base          = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
chrono        = { workspace = true, features = ["serde"] }

# --- Native targets (Linux/Windows/macOS) ----------------------------------
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
toml_edit                 = { workspace = true }
tempfile                  = { workspace = true }
tokio                     = { workspace = true }
aphrody-git               = { workspace = true }
aphrody-ssh               = { workspace = true }
reqwest                   = { workspace = true }
regex                     = { workspace = true }
which                     = { workspace = true }
indicatif                 = { workspace = true }
colored                   = { workspace = true }
mimalloc                  = { workspace = true }
# `scraper` had exactly one consumer: the hand-rolled DuckDuckGo SERP scraper
# in `SearchCommand`, now delegated to `bxc search --json`. Kept declared (and
# ignored by cargo-machete below) rather than removed, because dropping a
# workspace dependency is a lockfile-wide change and this pass is about routing,
# not about pruning; the crate is no longer referenced by any `use` in `cli`.
scraper                   = { workspace = true }
# The single door to bxc: SERP retrieval for `aphrody search`, the resolution
# chain behind `aphrody bxc`, and the in-process HTML→Markdown cdylib.
aphrody-web-bridge                = { workspace = true }
aphrody-web-crawl                 = { workspace = true }
aphrody-web-detect                = { workspace = true }
aphrody-web-extract               = { workspace = true }
aphrody-web-frames                = { workspace = true }
aphrody-x                         = { workspace = true }
obscura                           = { workspace = true }
obscura-net                       = { workspace = true }
aphrody-n2b                       = { workspace = true }
aphrody-translate         = { workspace = true }
aphrody-manga             = { workspace = true }
aphrody-ecosystem         = { workspace = true }
aphrody-backend                   = { workspace = true }
aphrody-toolchains                = { workspace = true }
rustls                    = { workspace = true }
aphrody-ai                = { workspace = true }
aphrody-native            = { workspace = true }
aphrody-terminal-backend  = { workspace = true }
# Natural-language fallback (`auto_command`) routes prompts to a running
# A2A agent over JSON-RPC; reqwest-backed transports are native-only.
aphrody-a2a                       = { workspace = true }
aphrody-a2a-client                = { workspace = true }
aphrody-a2a-coord                 = { workspace = true }
futures                   = { workspace = true }
thiserror                 = { workspace = true }
aphrody-vpn               = { workspace = true }
# `aphrody winclean` — in-process aphrody-winclean crate (Windows computer use + OS control).
aphrody-winclean          = { workspace = true }
aphrody-kernel            = { workspace = true }
# Messaging (outbound connectors + bidirectional channels: Slack/Telegram/Matrix/Discord/X).
# Native-only because reqwest + tokio do not compile on wasm32.
aphrody-messaging         = { workspace = true }
aphrody-discord-compiler  = { workspace = true }
# `aphrody hermes` voice-to-voice agent — STT (Whisper/ElevenLabs) + TTS (ElevenLabs).
aphrody-voice             = { workspace = true }
# `aphrody scan {tree, manifests}` — parallel filesystem walk + manifest parse.
walkdir                   = { workspace = true }
ignore                    = { workspace = true }
rayon                     = { workspace = true }
# `aphrody mcp {list, call}` — MCP client + tool registry.
aphrody-gemini-runtime            = { workspace = true }
# `aphrody re triage` — reverse engineering primitives (pure Rust, goblin-based,
# zero GPL). Native-only because it reads binaries from disk (std::fs::read).
aphrody-re                = { workspace = true }
# ONNX Runtime backend for the Magika classifier (`--features magika`). Default
# features pull `download-binaries` (prebuilt runtime fetched at build time) so
# `aphrody re classify` works out of the box once the feature is enabled.
ort                       = { version = "=2.0.0-rc.12", optional = true }
# `aphrody forensics sqlite` — read-only SQLite schema dump (`--features
# forensics`). Reuses the workspace-pinned `rusqlite` (0.37, `bundled`
# libsqlite3 C source) so the command works without a system sqlite and shares
# a single resolved version + `links = "sqlite3"` with `aphrody-memory`
# (cargo-deny bans duplicates). The DB is opened SQLITE_OPEN_READ_ONLY and only
# the `sqlite_master` schema is read — value columns are NEVER selected.
rusqlite                  = { workspace = true, optional = true }
# `aphrody index build/search` — persistent local-filesystem FTS5 index
# (`--features index`). Bundled libsqlite3 via the workspace rusqlite.
aphrody-fsindex           = { workspace = true, optional = true }
# `aphrody firefly generate` — Adobe Firefly image gen (`--features firefly`).
aphrody-firefly           = { workspace = true, optional = true }
# `aphrody forensics map` — SHA-256 of small files + hex encoding for the
# `tree.json` map. Optional, gated by the `forensics` feature (shared with the
# read-only SQLite schema dump). Reuses the workspace pins so no new
# supply-chain surface is introduced.
sha2                      = { workspace = true, optional = true }
hex                       = { workspace = true, optional = true }
# `aphrody logo` — canonical icon (identity/assets/logo/aphrody.webp) -> .ico / .svg / M3
# maskable PNG + pixel-perfect terminal rendering (module `aphrody_identity::logo`).
# Native-only (image+ico).
aphrody-identity          = { workspace = true }
# `aphrody design tokens [--fusion]` — Material 3 color tokens as CSS custom
# properties (+ shadcn/Tailwind fusion sheet). Native-only (std export).
aphrody-m3-tokens                 = { workspace = true }
# `aphrody chat` — unified turn-loop REPL composing every aphrody building
# block (gemini-runtime + tools + memory + session + permissions + hooks +
# prompts + router + cost + context + events). Phase 1 wires --prompt
# one-shot mode; ratatui REPL + slash-commands land in Phase 2.
aphrody-chat              = { workspace = true }
# Pre-main process hardening (no-dump / no-ptrace / strip LD_*-DYLD_*) wired into
# the binary's `main`. Native-only effect; no-op on wasm. cf. CLAUDE.md §0.1.
aphrody-guard             = { workspace = true }
# `aphrody memory migrate` — provider-to-provider migration (R3.4). Native-only
# because the SqliteLocal provider uses rusqlite (libsqlite3 bundled C lib) and
# the Mem0/Honcho providers use reqwest, neither of which compile on wasm32.
aphrody-memory            = { workspace = true }
# `aphrody ai sync-sessions` — external agent session mirror (agy, Codex,
# Claude Code) + its feed into the local memory store (`memory` feature).
aphrody-session           = { workspace = true, features = ["memory"] }
# `aphrody model {...}` — local model lifecycle (catalog / pull / verify / gc).
# Native-only: the store needs a filesystem and the downloader a reqwest client
# (rustls/ring), neither of which links on wasm32.
aphrody-models            = { workspace = true }
aphrody-secrets           = { workspace = true }
# `aphrody infer {...}` — ONNX Runtime session loading with CUDA/DirectML/CPU
# fallback. Optional: only linked by the `infer` feature.
aphrody-infer             = { workspace = true, optional = true }
# `aphrody ocr {...}` — image -> markdown through a local vision model.
aphrody-ocr               = { workspace = true, optional = true }
aphrody-jobs              = { workspace = true, optional = true }
# Default sqlite path `$HOME/.aphrody/memory.sqlite` for `aphrody memory migrate`
# resolution. `dirs` is portable across Linux/Windows/macOS.
dirs                      = { workspace = true }
# `aphrody notebooklm {...}` — Google NotebookLM Boq RPC client (native HTTP,
# no browser automation in-process).
aphrody-notebooklm                = { workspace = true }
# `aphrody antigravity {...}` — native Google AI Ultra / Gemini client (WS3).
# Reads the OAuth token at runtime (Windows Credential Manager); never embeds a
# secret. Native-only: it builds a reqwest::Client (rustls/ring) and reads the
# credential store, neither of which links on wasm32.
aphrody-antigravity           = { workspace = true }
aphrody-google                = { workspace = true }
# `aphrody oc-onboard` seeds the agent-home file-map (SOUL/IDENTITY/USER/TOOLS/
# AGENTS/HEARTBEAT/BOOT/BOOTSTRAP + memory/ + skills/) via aphrody-agent-home,
# and `aphrody doctor` reports its bootstrap-budget health. The `git` feature
# lets oc-onboard git-back the seeded workspace.
aphrody-agent-home        = { workspace = true, features = ["git"] }
# aphrody-prompts — source of the unified BXC/YOLO doctrine prepended to every
# agent session's system prompt (see exec_cmd::runtime_config).
aphrody-prompts           = { workspace = true }
# In-process stdout/stderr capture backing `aphrody::run_captured` (the
# structured entry the Tauri app + aphrody-ffi consume). Host-only.
aphrody-stdio-capture     = { workspace = true }
# `aphrody agent "..."` — the flagship autonomous-agent surface (Antigravity
# rewrite, docs/VISION.md Phase 3b). aphrody-agent-runtime is the wiring/factory
# that assembles a ready-to-run agent (model client + tool registry + engine);
# aphrody-tui is the Ratatui full-screen surface; aphrody-agent-proto carries the
# SQ/EQ Op/Event wire the TUI bridge forwards. All three are native-only
# (reqwest / rustls / ring / crossterm) and never link on wasm32.
aphrody-agent-runtime     = { workspace = true }
aphrody-config            = { workspace = true }
aphrody-diagnostics       = { workspace = true }
aphrody-engine            = { workspace = true }
aphrody-toolcall          = { workspace = true }
tracing                  = { workspace = true }
toml                     = { workspace = true }
aphrody-model-client      = { workspace = true }
jsonschema                = { workspace = true }
aphrody-project-doc       = { workspace = true }
aphrody-rollout           = { workspace = true }
aphrody-exec-events       = { workspace = true }
aphrody-rag               = { workspace = true, optional = true }
aphrody-llama-server      = { workspace = true }
aphrody-train             = { workspace = true, optional = true }
aphrody-app-server        = { workspace = true }
aphrody-gateway           = { workspace = true }
aphrody-tui               = { workspace = true }
aphrody-agent-proto       = { workspace = true }

# --- Windows-only deps (HKCU registry edit for `aphrody self install-path`) -
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security_Credentials",
] }

# --- WebAssembly targets ---------------------------------------------------
# Minimal tokio surface (the only features supported on wasm).
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio         = { version = "1.52", default-features = false, features = ["sync", "macros", "io-util", "rt", "time"] }

# --- Dev/test dependencies (integration tests only, native targets) --------
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
assert_cmd    = { workspace = true }
predicates    = { workspace = true }
serde_json    = { workspace = true }
tempfile      = { workspace = true }
tokio         = { workspace = true, features = ["macros", "rt"] }
# `cold_start` bench — measures `aphrody version` p50/p95/p99 (PLAN R-A R1.5).
criterion     = { workspace = true }


[package.metadata.cargo-machete]
ignored = ["ort", "scraper"]

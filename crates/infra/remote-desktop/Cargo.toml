# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-remote-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform remote-desktop server (JPEG over WebSocket, embedded browser viewer) for `aphrody infra remote serve`."

[lib]
name = "aphrody_remote_desktop"

[dependencies]
anyhow = { workspace = true }
aphrody-capture = { workspace = true }
axum = { workspace = true, features = ["ws"] }
getrandom = { workspace = true }
jpeg-encoder = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { workspace = true, features = ["xtest"] }

[lints]
workspace = true

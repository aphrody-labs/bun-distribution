# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-sql"
version = "1.4.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Shared SQL owner for Aphrody: PostgreSQL pool (TLS by URL, pgvector), SQLite open policy (WAL, sqlite-vec), checksummed plain-SQL migrations and database URL resolution."

[features]
default = ["postgres"]
# PostgreSQL 18 pool over deadpool-postgres + tokio-postgres-rustls, pgvector typed binds.
postgres = [
  "dep:deadpool-postgres",
  "dep:tokio-postgres",
  "dep:tokio-postgres-rustls",
  "dep:pgvector",
  "dep:rustls",
  "dep:rustls-native-certs",
  "dep:webpki-roots",
]
# SQLite (bundled rusqlite): open policy, VACUUM INTO, checkpoint, migrations.
sqlite = ["dep:rusqlite"]
# sqlite-vec `vec0` registered once as a SQLite auto extension.
vec = ["sqlite", "dep:sqlite-vec"]

[dependencies]
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
deadpool-postgres = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
pgvector = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
sqlite-vec = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

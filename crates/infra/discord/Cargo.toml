# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-discord"
version = "1.4.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Aphrody Discord engine: Ed25519 interaction verification, REST client, AI answer embeds, Web extraction and timed shell receipts."

[dependencies]
aphrody-web-source.workspace = true
aphrody-proc = { workspace = true, features = ["tokio"] }
anyhow = { workspace = true }
aphrody-web-extract = { workspace = true, optional = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"], optional = true }
hex = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["cli", "web-extract"]
cli = ["dep:clap"]
web-extract = ["dep:aphrody-web-extract"]

[lints]
workspace = true

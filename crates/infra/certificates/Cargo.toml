[package]
name = "aphrody-certificates"
version = "1.4.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native ACME certificate lifecycle using owned OVH DNS challenges"

[dependencies]
anyhow.workspace = true
aphrody-ovh.workspace = true
clap = { workspace = true, features = ["derive"] }
hex.workspace = true
instant-acme.workspace = true
rcgen.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Foundation", "Win32_System_Memory"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

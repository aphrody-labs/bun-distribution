# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-wireguard"
version = "1.4.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native WireGuard for Aphrody: keys, wg-quick configuration, Linux kernel/userspace and WireGuardNT backends, private tunnel inventory."

[dependencies]
aphrody-proc = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
ipnet = { workspace = true, features = ["serde"] }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
x25519-dalek = { workspace = true }
zip = { workspace = true }

# Linux kernel (netlink) and userspace (boringtun) WireGuard, plus BSD/macOS userspace.
[target.'cfg(unix)'.dependencies]
defguard_wireguard_rs = { workspace = true }

# WireGuardNT kernel driver through its documented wireguard.h API only.
[target.'cfg(windows)'.dependencies]
wireguard-nt = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

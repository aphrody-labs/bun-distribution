[package]
name = "wordcraft-render"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "WordCraft rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
wordcraft-geom = { path = "../wordcraft-geom" }
wordcraft-doc = { path = "../wordcraft-doc" }
wordcraft-fonts = { path = "../wordcraft-fonts" }
wordcraft-layout = { path = "../wordcraft-layout" }
craft-metafile = { path = "../craft-metafile" }
vello_cpu = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
log = "0.4"

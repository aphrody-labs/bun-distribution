# SPDX-License-Identifier: Apache-2.0
[package]
name = "libm3"
description = "Material 3 tokens, components and application patterns for Bun OS and COSMIC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["m3-tokens/std"]
cosmic = ["std", "dep:cosmic"]
cosmic-wgpu = ["cosmic", "cosmic/wgpu"]
cosmic-x11 = ["cosmic", "cosmic/x11"]
cosmic-wayland = ["cosmic", "cosmic/wayland"]
cosmic-a11y = ["cosmic", "cosmic/a11y"]

[dependencies]
m3-tokens = { package = "aphrody-m3-tokens", path = "../m3-tokens", version = "1.4.4", default-features = false }
cosmic = { package = "libcosmic", git = "https://github.com/aphrody-labs/libcosmic", rev = "7f715bc5d2d383a070fd8c760aa52c5627df96b6", default-features = false, features = ["winit", "tokio"], optional = true }

[lints]
workspace = true

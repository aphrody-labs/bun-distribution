[package]
name = "aphrody-nie-net"
description = "nie online mode — multiplayer networking engine, Inacode room lobby, matchmaking, and deterministic rollback/lockstep synchronization"
version.workspace = true
edition.workspace = true
license-file = "../../docs/licenses/iecode/nie/LICENSE"
publish = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["transport"]
transport = ["dep:tokio", "dep:futures-util", "dep:tokio-tungstenite", "dep:uuid", "dep:anyhow"]

[dependencies]
aphrody-nie-runtime.workspace = true
aphrody-nie-core.workspace = true
aphrody-nie-geom.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"], optional = true }
futures-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }

[dev-dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

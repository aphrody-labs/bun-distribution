[package]
name = "aphrody-nie-net"
description = "nie online mode — multiplayer networking engine, Inacode room lobby, matchmaking, and deterministic rollback/lockstep synchronization"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["transport"]
transport = ["dep:tokio", "dep:futures-util", "dep:tokio-tungstenite", "dep:uuid", "dep:anyhow"]

[dependencies]
aphrody-nie-runtime.workspace = true
aphrody-nie-core.workspace = true
aphrody-nie-geom.workspace = true
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false }
thiserror = { version = "2" }
tracing = { version = "0.1" }
anyhow = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"], optional = true }
futures-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
anyhow = { version = "1" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

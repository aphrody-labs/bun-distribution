[package]
name = "yolo-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Versioned C ABI of the precompiled YOLO native runtime (first slice: system stats and cancellable benchmark)"

[lib]
name = "yolo_runtime"
# The dynamic library is the single `aphrody_ffi` cdylib, which re-exports the yolo_* ABI.
crate-type = ["rlib"]

# Default ABI graph remains light. Browser releases opt into the pinned Obscura/V8 owner.
[features]
default = []
browser = ["dep:obscura-browser", "dep:obscura-net", "dep:tokio", "dep:url", "dep:base64", "dep:async-trait"]
# Process-wide GPU hub (wgpu) shared with Obscura and Tauri hosts in the same process.
gpu = ["dep:aphrody-gpu-backend", "aphrody-gpu-backend/hub", "dep:base64"]
# NVIDIA CUDA through the official driver, loaded at run time.
cuda = ["gpu", "aphrody-gpu-backend/cuda"]

[dependencies]
obscura-browser = { workspace = true, features = ["render"], optional = true }
obscura-net = { workspace = true, optional = true }
aphrody-gpu-backend = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
yolo-core = { path = "../yolo-core", version = "1.0.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Process groups are signalled on Unix; nothing else is pulled in.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[package]
name = "yolo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["benchmark", "hardware", "system-metrics", "bun", "tauri"]
categories = ["development-tools", "hardware-support"]
description = "Core native engine and system benchmarking logic for YOLO Monorepo"

[dependencies]
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

anyhow = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
dunce = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
globset = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
oxc_allocator = { workspace = true, optional = true }
oxc_parser = { workspace = true, optional = true }
oxc_span = { workspace = true, optional = true }
oxc_ast = { workspace = true, optional = true }
oxc_ast_visit = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
repository-tools = ["dep:anyhow", "dep:blake3", "dep:chrono", "dep:dashmap", "dep:dunce", "dep:notify", "dep:notify-debouncer-full", "dep:parking_lot", "dep:tracing", "dep:globset", "dep:ignore", "dep:regex", "dep:tokio", "dep:oxc_allocator", "dep:oxc_parser", "dep:oxc_span", "dep:oxc_ast", "dep:oxc_ast_visit"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

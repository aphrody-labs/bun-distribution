[package]
name = "aphrody-a2a-client"
publish = true
version = "1.4.7"
description = "A2A v1 async client with protocol binding factory"
readme = "README.md"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/aphrody"
rust-version = "1.97"
authors = ["aphrody-code"]
keywords = ["cli", "cross-platform", "rust", "linux", "wasm"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[lib]
name = "aphrody_a2a_client"

# Pure-Rust port of `.claude/plugins/aphrody/skills/a2a-duel-loop/scripts/duel-cycle.ts`
# (PLAN_RUST_ONLY.md Phase 4.5). Native-only — depends on tokio + reqwest for
# the optional POST /msg mirror plus chrono/clap/getrandom/hex (all native-only
# in the cfg-gated target block below). The example is a no-op on wasm targets
# (examples/a2a_duel_loop.rs).

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
aphrody-a2a = { path = "../aphrody-a2a", version = "1.4.7", features = [] }
aphrody-a2a-pb = { path = "../aphrody-a2a-pb", version = "1.4.7" }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
futures = "0.3.34"
async-trait = "0.1.92"
auto_impl = "1"
bytes = "1.12.1"
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4", "v7", "serde"] }

[features]
default = ["rustls-tls"]
native-tls = ["reqwest/native-tls"]
# rustls-tls: only meaningful on native targets; wasm uses browser fetch (no TLS crate).
rustls-tls = ["reqwest/rustls-no-provider", "dep:rustls"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.53.1", features = ["process","rt-multi-thread","macros","time","signal","sync","fs","io-util","full"] }
reqwest = { version = "0.13.5", features = ["rustls-no-provider","json","stream","form","query","charset","http2","system-proxy","blocking","cookies","gzip","brotli","deflate","socks","multipart"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring","std","tls12"], optional = true }
clap = { version = "4.6.6", features = ["derive","env","color"] }
chrono = { version = "0.4", features = ["serde"] }
getrandom = { version = "0.4" }
hex = { version = "0.4", features = [] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto","pem","ring"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
tokio = { version = "1.52", default-features = false, features = ["sync","macros","rt","time"] }
reqwest = { version = "0.13", default-features = false, features = ["json","stream","query"] }

[target.'cfg(target_os = "wasi")'.dependencies]
tokio = { version = "1.52", default-features = false, features = ["sync","macros","rt","time"] }

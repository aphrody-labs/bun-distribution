[package]
name = "filmcraft-isobmff"
description = "Clean-room ISO BMFF (MP4) and QuickTime (MOV) demuxer and muxer"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
filmcraft-bitstream = { path = "../filmcraft-bitstream" }
thiserror = "2"

[dev-dependencies]
filmcraft-testkit = { path = "../filmcraft-testkit" }
proptest = "1"
serde_json = "1"

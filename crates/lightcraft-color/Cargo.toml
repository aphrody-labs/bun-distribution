[package]
name = "lightcraft-color"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "LightCraft color (L0)"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
lightcraft-geom = { path = "../lightcraft-geom" }

[dev-dependencies]
proptest = "1"

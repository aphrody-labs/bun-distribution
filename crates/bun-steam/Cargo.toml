# SPDX-License-Identifier: Apache-2.0
# Canonical Steam owner of Bun OS: VDF (text and binary), Steam install discovery and client
# configuration, Proton launch tuning, Remote Play state, and (opt-in features) the native depot
# client absorbed from bun-re and the in-process Steamworks emulator.
[package]
name = "bun-steam"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-dev <contact@aphrody.com>"]
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os"
description = "Bun OS Steam owner: VDF text/binary parser and writer, install and library discovery, client configuration, Proton launch tuning, Remote Play state and the native depot client."

[lib]
name = "bun_steam"

[lints]
workspace = true

[features]
default = []
# Native Steam depot client (steamroom CM session, PICS, CDN download) and `bun-steam-depot`.
depot = [
    "dep:anyhow",
    "dep:bytes",
    "dep:clap",
    "dep:dirs-next",
    "dep:hex",
    "dep:steamroom",
    "dep:steamroom-client",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:zip",
]
# In-process Steamworks API emulator over the nie netcode types.
emulator = ["dep:aphrody-nie-net"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true, features = ["std"] }
aphrody-nie-net = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true, features = ["std"] }
bytes = { workspace = true, optional = true }
clap = { workspace = true, optional = true, features = ["derive", "color", "env"] }
dirs-next = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }
steamroom = { workspace = true, optional = true }
steamroom-client = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tracing = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"], optional = true }
zip = { workspace = true, optional = true, features = ["aes-crypto", "bzip2", "deflate64", "lzma", "time", "zstd", "xz"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "bun-steam-depot"
path = "src/bin/bun-steam-depot.rs"
required-features = ["depot"]

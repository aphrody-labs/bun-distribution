# SPDX-License-Identifier: Apache-2.0
[package]
workspace = "../.."
name = "aphrody-config"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors = ["aphrody-code"]
homepage = "https://source.aphrody.app/aphrody-dev/bun-crate-aphrody-config"
repository = "https://source.aphrody.app/aphrody-dev/bun-crate-aphrody-config"
license = "Apache-2.0"
description            = "Codex-compatible config.toml model for aphrody: ConfigToml, model providers (managed llama-server, Ollama, LM Studio, vLLM, Antigravity, OpenAI, Anthropic, ChatGPT), layered merge (built-ins < Codex-compat < user < project < profile < -c overrides < CLI flags), dotted -c override parsing, and the No-Human-In-The-Loop policy defaults. Pure, no filesystem access in the core, wasm32-safe."

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true, features = ["default"] }
toml       = { workspace = true, features = ["default"] }

[dev-dependencies]
pretty_assertions = { workspace = true, features = ["default"] }
tempfile          = { workspace = true, features = ["default"] }

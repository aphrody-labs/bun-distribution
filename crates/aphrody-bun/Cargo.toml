# SPDX-License-Identifier: Apache-2.0
# ============================================================================
#  Bun-RS — High-Performance native FFI plugin for Bun (bun:ffi)
# ============================================================================

[package]
name = "aphrody-bun"
repository = "https://github.com/aphrody-labs/aphrody"
version = "1.4.7"
edition = "2024"
license = "Apache-2.0"
description = "Native Rust plugin for Bun applications using bun:ffi."

[lib]
name = "bun_rs"
crate-type = ["rlib"]

[features]
# Render 3D frames on the GPU (`wgpu`) when an adapter exists; without it
# `bun_rs_render3d_png` always uses the deterministic CPU rasterizer.
gpu = ["aphrody-render/gpu"]

[dependencies]
memchr = "2"
aphrody-m3-tokens = { path = "../aphrody-m3-tokens", features = [] }
aphrody-m3-reproduce = { path = "../aphrody-m3-reproduce", features = ["crawl", "network"] }
aphrody-svg = { path = "../aphrody-svg", default-features = false, features = ["raster", "glyph", "m3", "symbols"] }
base64 = "0.23.1"
aphrody-render = { path = "../aphrody-render" }
grass = "0.13"
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
ts-rs = { version = "12", features = ["serde-compat"] }

[build-dependencies]
serde_json = "1.0.151"
sha2 = "0.11.0"

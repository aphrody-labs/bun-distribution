[package]
name = "bun-engine-nds"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Canonical Nintendo DS cartridge and tooling contracts for Bun Engine"
repository = "https://github.com/aphrody-labs/bun-engine"

[lib]
path = "src/lib.rs"

[dependencies]

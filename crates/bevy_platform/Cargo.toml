[package]
name = "bevy_platform"
version = "0.20.0"
edition = "2024"
description = "Provides common platform agnostic APIs, as well as platform-specific features for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
default = ["std"]

# Functionality

## Adds serialization support through `serde`.
serialize = ["dep:serde", "hashbrown/serde"]

## Adds integration with Rayon.
rayon = ["dep:rayon", "hashbrown/rayon"]

# Platform Compatibility

## Provides an implementation of `block_on` from `futures-lite`.
futures-lite = ["std", "dep:futures-lite", "futures-lite?/std"]

## Provides an implementation of `block_on` from `async-io`.
async-io = ["std", "dep:async-io"]

## Allows access to the `std` crate. Enabling this feature will prevent compilation
## on `no_std` targets, but provides access to certain additional features on
## supported platforms.
std = [
  "alloc",
  "critical-section?/std",
  "portable-atomic/std",
  "portable-atomic-util/std",
  "spin/std",
  "foldhash/std",
  "serde?/std",
  "wasm-bindgen-futures?/std",
  "futures-channel/std",
  "wasm-bindgen?/std",
  "js-sys?/std",
]

## Allows access to the `alloc` crate.
alloc = ["portable-atomic-util/alloc", "dep:hashbrown", "serde?/alloc"]

## `critical-section` provides the building blocks for synchronization primitives
## on all platforms, including `no_std`.
critical-section = ["dep:critical-section", "portable-atomic/critical-section"]

## Enables use of browser APIs if the build is a `wasm32` target.
web = [
  "dep:web-time",
  "dep:wasm-bindgen-futures",
  "dep:wasm-bindgen",
  "dep:js-sys",
]

## Enable APIs that require `bytemuck`
bytemuck = ["dep:bytemuck"]

[dependencies]
critical-section = { version = "1.2.0", default-features = false, optional = true }
spin = { version = "0.12.2", default-features = false, features = [
  "mutex",
  "spin_mutex",
  "rwlock",
  "once",
  "lazy",
  "barrier",
] }
foldhash = { version = "0.2.0", default-features = false }
hashbrown = { version = "0.16.1", features = [
  "equivalent",
  "raw-entry",
], optional = true, default-features = false }
serde = { version = "1", default-features = false, optional = true }
rayon = { version = "1", default-features = false, optional = true }
futures-lite = { version = "2.0.1", default-features = false, optional = true }
async-io = { version = "2.0.0", optional = true }
bytemuck = { version = "1.5", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { version = "1.1", default-features = false, optional = true }
wasm-bindgen-futures = { version = "0.4.46", default-features = false, optional = true }
futures-channel = { version = "0.3", default-features = false }
js-sys = { version = "0.3", default-features = false, optional = true }
wasm-bindgen = { version = "0.2", default-features = false, optional = true }

[target.'cfg(not(all(target_has_atomic = "8", target_has_atomic = "16", target_has_atomic = "32", target_has_atomic = "64", target_has_atomic = "ptr")))'.dependencies]
portable-atomic = { version = "1", default-features = false, features = [
  "fallback",
] }
spin = { version = "0.12.2", default-features = false, features = [
  "portable-atomic",
] }

[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
portable-atomic-util = { version = "0.2.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = ">= 0.59.0", features = [
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Com",
] }

[dev-dependencies]
bytemuck = { version = "1.5", default-features = false, features = [
  "derive",
  "min_const_generics",
] }

# Bevy's workspace lints (upstream [workspace.lints]) merged with the Bun OS root lints at
# their stricter level; Cargo cannot inherit two lint sets, so they are explicit per crate.
[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_must_use = "deny"
non_ascii_idents = "warn"

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

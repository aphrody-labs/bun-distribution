[package]
name = "effectcraft-plugin"
description = "EffectCraft effect plug-ins: loads sandboxed WebAssembly effect modules (plug-in API v1) into the effect registry"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[features]
# The WebAssembly runtime (wasmi, a pure-Rust interpreter). Hosts enable it on native; without
# it `load_wasm` reports that WebAssembly plug-ins are unavailable.
wasm = ["dep:wasmi"]

[dependencies]
effectcraft-effects = { path = "../effectcraft-effects", version = "0.9.2" }
serde_json = { version = "1", features = ["float_roundtrip"] }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "wat", "deterministic", "portable-dispatch"], optional = true }

[dev-dependencies]
effectcraft-keyframe = { path = "../effectcraft-keyframe" }
effectcraft-project = { path = "../effectcraft-project" }
effectcraft-raster = { path = "../effectcraft-raster" }

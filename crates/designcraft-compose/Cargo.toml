[package]
name = "designcraft-compose"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DesignCraft text composition: paragraph composer (Knuth–Plass), hyphenation, justification, columns, threading, wrap"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
unicode-bidi = "0.3"
unicode-bidi-mirroring = "0.4"
designcraft-geom = { path = "../designcraft-geom", version = "0.7.1" }
designcraft-color = { path = "../designcraft-color", version = "0.7.1" }
designcraft-doc = { path = "../designcraft-doc", version = "0.7.1" }
designcraft-fonts = { path = "../designcraft-fonts", version = "0.7.1" }
log = "0.4"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
miniz_oxide = "0.8"
hypher = { version = "0.1.8", default-features = false, features = ["alloc", "portuguese", "spanish"] }

[dev-dependencies]
designcraft-fonts = { path = "../designcraft-fonts", features = ["testing"] }
proptest = "1"

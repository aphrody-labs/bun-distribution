[package]
name = "photocraft-cms"
description = "Pure-Rust ICC v2/v4 colour management: profile parsing and writing, transforms, rendering intents, black point compensation"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
rayon = { workspace = true }

[dev-dependencies]
moxcms = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

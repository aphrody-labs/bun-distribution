[package]
name = "vectorcraft-engine"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "VectorCraft engine: sessions, history, selection, the command registry"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
# VectorCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
vectorcraft-geom = { path = "../vectorcraft-geom", version = "0.10.0" }
vectorcraft-color = { path = "../vectorcraft-color", version = "0.10.0" }
vectorcraft-doc = { path = "../vectorcraft-doc", version = "0.10.0" }
vectorcraft-tools = { path = "../vectorcraft-tools", version = "0.10.0" }
vectorcraft-text = { path = "../vectorcraft-text", version = "0.10.0" }
vectorcraft-render = { path = "../vectorcraft-render", version = "0.10.0" }
vectorcraft-pathops = { path = "../vectorcraft-pathops", version = "0.10.0" }
vectorcraft-brush = { path = "../vectorcraft-brush", version = "0.10.0" }
vectorcraft-trace = { path = "../vectorcraft-trace", version = "0.10.0" }
vectorcraft-svg = { path = "../vectorcraft-svg", version = "0.10.0" }
vectorcraft-format = { path = "../vectorcraft-format", version = "0.10.0" }
vectorcraft-pdf = { path = "../vectorcraft-pdf", version = "0.10.0" }
vectorcraft-cad = { path = "../vectorcraft-cad", version = "0.10.0" }
vectorcraft-eps = { path = "../vectorcraft-eps", version = "0.10.0" }
vectorcraft-metafile = { path = "../vectorcraft-metafile", version = "0.10.0" }
vectorcraft-plugins = { path = "../vectorcraft-plugins", version = "0.10.0" }
vectorcraft-affinity = { path = "../vectorcraft-affinity", version = "0.10.0" }
vectorcraft-scriptcheck = { path = "../vectorcraft-scriptcheck", version = "0.10.0" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
log = "0.4"

[dev-dependencies]
vectorcraft-affinity = { path = "../vectorcraft-affinity", features = ["synth"] }
crc32fast = "1.5"
vectorcraft-testkit = { path = "../vectorcraft-testkit" }
proptest = "1"
wat = "1.228"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }

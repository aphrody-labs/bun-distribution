[package]
name = "iecode-tasks"
description = "Cancelable, pausable asynchronous job orchestration with progress reporting."
version = "1.0.0"
edition = "2024"
publish = true
repository = "https://github.com/aphrody-code/iecode"
rust-version = "1.97"

[lints]
workspace = true

[features]
default = ["host"]
host = ["dep:async-trait", "dep:tokio", "dep:tracing", "dep:uuid"]

[dependencies]
tokio = { workspace = true, optional = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net"] }
async-trait = { workspace = true, optional = true }
uuid = { workspace = true, optional = true, features = ["v4", "serde"] }
thiserror.workspace = true
tracing = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net", "test-util"] }

[package]
name = "iecode-ffi"
description = "Stable C ABI for the IECODE core, consumed by Bun and .NET"
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/aphrody-code/iecode"
publish = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
iecode-core = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[package]
name = "filmcraft-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
filmcraft-time = { path = "../filmcraft-time" }
filmcraft-frame = { path = "../filmcraft-frame" }
filmcraft-color = { path = "../filmcraft-color" }
filmcraft-media = { path = "../filmcraft-media" }
filmcraft-project = { path = "../filmcraft-project" }
filmcraft-render = { path = "../filmcraft-render" }
filmcraft-audio-dsp = { path = "../filmcraft-audio-dsp" }
filmcraft-geom = { path = "../filmcraft-geom" }
filmcraft-text = { path = "../filmcraft-text" }
filmcraft-isobmff = { path = "../filmcraft-isobmff" }
filmcraft-prores = { path = "../filmcraft-prores" }
filmcraft-dnx = { path = "../filmcraft-dnx" }
filmcraft-apv = { path = "../filmcraft-apv" }
filmcraft-mxf = { path = "../filmcraft-mxf" }
filmcraft-aac = { path = "../filmcraft-aac" }
filmcraft-flac = { path = "../filmcraft-flac" }
filmcraft-h264enc = { path = "../filmcraft-h264enc" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
filmcraft-testkit = { path = "../filmcraft-testkit" }
filmcraft-codecs = { path = "../filmcraft-codecs" }

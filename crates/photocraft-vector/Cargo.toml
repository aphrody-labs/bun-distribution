[package]
name = "photocraft-vector"
description = "Vector paths, shape layers, strokes and vector masks → anti-aliased coverage and surfaces"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
rayon = "1"
photocraft-geom = { path = "../photocraft-geom", version = "0.8.2" }
photocraft-color = { path = "../photocraft-color", version = "0.8.2" }
photocraft-raster = { path = "../photocraft-raster", version = "0.8.2" }
photocraft-doc = { path = "../photocraft-doc", version = "0.8.2" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

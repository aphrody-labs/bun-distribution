uu_yes = { version = "0.12", optional = true }

[target.'cfg(unix)'.dependencies]
uu_chmod = { version = "0.12", optional = true }
uu_chown = { version = "0.12", optional = true }
uu_chgrp = { version = "0.12", optional = true }
uu_id = { version = "0.12", optional = true }
uu_install = { version = "0.12", optional = true }
uu_kill = { version = "0.12", optional = true }
uu_mkfifo = { version = "0.12", optional = true }
uu_nohup = { version = "0.12", optional = true }
uu_stat = { version = "0.12", optional = true }

[package]
name = "wordcraft-docbin"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "WordCraft reader for the Word 97-2003 binary file format (.doc, [MS-DOC])"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
wordcraft-doc = { path = "../wordcraft-doc" }
wordcraft-geom = { path = "../wordcraft-geom" }
cfb = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
miniz_oxide = "0.8"
thiserror = "2"
log = "0.4"

[dev-dependencies]
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

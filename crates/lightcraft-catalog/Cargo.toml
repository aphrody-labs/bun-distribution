[package]
name = "lightcraft-catalog"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "LightCraft library: photos, albums, ratings/flags, search/filter/sort, op-log persistence (L3)"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[dependencies]
lightcraft-develop = { path = "../lightcraft-develop" }
lightcraft-meta = { path = "../lightcraft-meta" }
lightcraft-raw = { path = "../lightcraft-raw" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
crc32fast = "1"
log = "0.4"
web-time = "1"

[dev-dependencies]
lightcraft-geom = { path = "../lightcraft-geom" }
proptest = "1"

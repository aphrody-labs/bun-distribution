[package]
name = "lightcraft-meta"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "LightCraft metadata: EXIF, XMP, IPTC (L1)"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[dependencies]
lightcraft-tiff = { path = "../lightcraft-tiff", version = "0.7.1" }
lightcraft-geom = { path = "../lightcraft-geom", version = "0.7.1" }
serde = { version = "1", features = ["derive", "rc"] }
quick-xml = "0.38"

[dev-dependencies]
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

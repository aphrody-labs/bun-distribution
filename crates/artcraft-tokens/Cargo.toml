[package]
name = "artcraft-tokens"
edition = "2018"
version = "0.0.1"
authors = [
    "Brandon Thomas <bt@brand.io>",
    "Brandon Thomas <echelon@gmail.com>",
]
publish = false

[lib]
name = "tokens"
path = "src/lib.rs"

[features]
default = []
database = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
rand = { version = "0.8.5", features = ["std_rng"] }
once_cell = "1.21.4"
utoipa = { version = "5.4.0", features = ["chrono", "actix_extras", "url"] }

[dev-dependencies]
strum = { version = "0.28.0", features = ["derive"] }
serde_json = "1.0.149"

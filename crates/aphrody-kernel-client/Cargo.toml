# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-kernel-client"
description = "Cross-platform local JSON-RPC client for the Aphrody OS kernel endpoint served by aphrody-mcp."
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
readme = "README.md"
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full", "test-util"] }

[package]
name = "aphrody-nie-steam"
description = "Acquisition Steam native (download/dump des depots IEVR) en Rust pur, sur steamroom — port du Steam/ C# d'iecode (remplace SteamKit2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]
host = [
    "dep:anyhow",
    "dep:base64",
    "dep:clap",
    "dep:dirs-next",
    "dep:regex",
    "dep:serde_json",
    "dep:steamroom",
    "dep:steamroom-client",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:zip",
]

[dependencies]
aphrody-nie-net = { workspace = true }
steamroom = { workspace = true, optional = true }
steamroom-client = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"], optional = true }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", optional = true }
thiserror = { version = "2" }
anyhow = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
regex = { version = "1.9.1", optional = true }
base64 = { version = "0.22.1", optional = true }
# Nécessaire pour TokenStore (default_path) et decompress_if_zipped (manifest CDN).
dirs-next = { workspace = true, optional = true }
zip = { workspace = true, optional = true, features = ["aes-crypto", "bzip2", "deflate64", "lzma", "time", "zstd", "xz"] }
clap = { workspace = true, optional = true, features = ["derive", "color", "env"] }
# Central pin narrows ^0.3 to =0.3.22; the existing unified lock already selects 0.3.22.
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"], optional = true }

[dev-dependencies]
tempfile = { version = "3" }

[[bin]]
name = "aphrody-nie-steam"
path = "src/bin/nie_steam.rs"
required-features = ["host"]

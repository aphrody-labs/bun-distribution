[package]
name = "bevy_clipboard"
version = "0.20.0"
edition = "2024"
description = "Provides clipboard support for Bevy Engine"
homepage = "https://bevyengine.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "clipboard"]

[features]
default = []
system_clipboard = ["dep:arboard"]
image = [
  "system_clipboard",
  "dep:bevy_asset",
  "dep:bevy_image",
  "dep:wgpu-types",
  "arboard/image-data",
]
wayland = ["arboard?/wayland-data-control"]

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.20.0", default-features = false }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0", default-features = false }
bevy_log = { path = "../bevy_log", version = "0.20.0", default-features = false }
bevy_platform = { path = "../bevy_platform", version = "0.20.0", default-features = false }

[target.'cfg(any(windows, unix))'.dependencies]
bevy_asset = { path = "../bevy_asset", version = "0.20.0", default-features = false, optional = true }
bevy_image = { path = "../bevy_image", version = "0.20.0", default-features = false, optional = true }
wgpu-types = { version = "30", default-features = false, optional = true }
arboard = { version = "3.6.1", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2" }
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard"] }
wasm-bindgen-futures = "0.4"

# Bevy's workspace lints (upstream [workspace.lints]) merged with the Bun OS root lints at
# their stricter level; Cargo cannot inherit two lint sets, so they are explicit per crate.
[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_must_use = "deny"
non_ascii_idents = "warn"

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition"]
all-features = true

# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-command-wasm"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description            = "wasm-bindgen adapter running the pure aphrody sub-commands (aphrody-command-pure) in the browser; no logic of its own."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aphrody-command-pure = { path = "../aphrody-command-pure", features = [] }
aphrody-rag-core = { path = "../aphrody-rag-core", features = [] }
console_error_panic_hook = { version = "0.1.7", optional = true }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

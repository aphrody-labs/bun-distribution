[package]
name = "lightcraft-gpu"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "LightCraft GPU develop pipeline: wgpu compute (WGSL) twin of the CPU pipeline, which stays the reference (L3)"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[dependencies]
lightcraft-denoise = { path = "../lightcraft-denoise", version = "0.7.1", default-features = false, optional = true }
lightcraft-geom = { path = "../lightcraft-geom", version = "0.7.1" }
lightcraft-color = { path = "../lightcraft-color", version = "0.7.1" }
lightcraft-raster = { path = "../lightcraft-raster", version = "0.7.1" }
lightcraft-develop = { path = "../lightcraft-develop", version = "0.7.1" }
lightcraft-pipeline = { path = "../lightcraft-pipeline", version = "0.7.1" }
log = "0.4"

[features]
default = []
denoise = ["dep:lightcraft-denoise", "lightcraft-denoise/runtime"]

[dev-dependencies]
lightcraft-scenes = { path = "../lightcraft-scenes" }
lightcraft-raw = { path = "../lightcraft-raw" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }

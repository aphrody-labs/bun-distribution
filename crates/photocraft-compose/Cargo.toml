[package]
name = "photocraft-compose"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
photocraft-geom = { path = "../photocraft-geom" }
photocraft-color = { path = "../photocraft-color" }
photocraft-raster = { path = "../photocraft-raster" }
photocraft-doc = { path = "../photocraft-doc" }
photocraft-vector = { path = "../photocraft-vector" }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false }
photocraft-paint = { path = "../photocraft-paint" }

[[bench]]
name = "compose"
harness = false

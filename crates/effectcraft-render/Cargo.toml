[package]
name = "effectcraft-render"
description = "The CPU compositor: property evaluation, layer sources (solids, footage, text, shapes, precomps), masks, effects, track mattes, 2D/3D transforms, motion blur and blending"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-time = { path = "../effectcraft-time", version = "0.9.2" }
effectcraft-geom = { path = "../effectcraft-geom", version = "0.9.2" }
effectcraft-color = { path = "../effectcraft-color", version = "0.9.2" }
effectcraft-keyframe = { path = "../effectcraft-keyframe", version = "0.9.2" }
effectcraft-project = { path = "../effectcraft-project", version = "0.9.2" }
effectcraft-raster = { path = "../effectcraft-raster", version = "0.9.2" }
effectcraft-path = { path = "../effectcraft-path", version = "0.9.2" }
effectcraft-text = { path = "../effectcraft-text", version = "0.9.2" }
effectcraft-effects = { path = "../effectcraft-effects", version = "0.9.2" }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
effectcraft-model = { path = "../effectcraft-model", version = "0.9.2" }
kurbo = { version = "0.13", features = ["serde"] }
rayon = "1"
web-time = "1"
serde = { version = "1", features = ["derive", "rc"] }
log = "0.4"

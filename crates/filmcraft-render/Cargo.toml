[package]
name = "filmcraft-render"
description = "Sequence evaluation and CPU reference compositor (linear-light premultiplied f32)"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
rustix = "1"
filmcraft-time = { path = "../filmcraft-time" }
filmcraft-geom = { path = "../filmcraft-geom" }
filmcraft-color = { path = "../filmcraft-color" }
filmcraft-frame = { path = "../filmcraft-frame" }
filmcraft-media = { path = "../filmcraft-media" }
filmcraft-project = { path = "../filmcraft-project" }
filmcraft-audio-dsp = { path = "../filmcraft-audio-dsp" }
filmcraft-captions = { path = "../filmcraft-captions" }
filmcraft-text = { path = "../filmcraft-text" }
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

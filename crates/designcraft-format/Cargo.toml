[package]
name = "designcraft-format"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DesignCraft native file format: zip with document.json and embedded assets; versioned"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
designcraft-doc = { path = "../designcraft-doc", version = "0.7.1" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
zip = { workspace = true }
thiserror = "2"

[package]
name = "lightcraft-faces"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "LightCraft faces (L1): bounded ONNX CPU inference, face-model manifests, validation and detection"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[features]
default = []

[dependencies]
ndarray = { version = "=0.17.2", default-features = false, features = ["std"] }
matrixmultiply = { version = "=0.3.11", default-features = false, features = ["std", "avx512"] }
web-time = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
proptest = "1"

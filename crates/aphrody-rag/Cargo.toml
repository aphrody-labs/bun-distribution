# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-rag"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description            = "Unified RAG storage, embedding, vector scan, hybrid search, and agent tools for aphrody (P8)."

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[features]
default = []
ort = ["dep:aphrody-embed", "aphrody-embed/embeddings"]
# In-process pure-Rust CPU embedder + cross-encoder (no Python, no HTTP, no Mutex).
native = ["dep:aphrody-embed", "aphrody-embed/native"]

[dependencies]
aphrody-embed = { path = "../aphrody-embed", default-features = false, features = [], optional = true }
aphrody-rag-core = { path = "../aphrody-rag-core", features = [] }
aphrody-toolcall = { path = "../aphrody-toolcall", features = [] }
aphrody-config = { path = "../aphrody-config", features = [] }
aphrody-models = { path = "../aphrody-models", features = [] }
aphrody-code-graph = { path = "../aphrody-code-graph", features = [] }
aphrody-store = { path = "../aphrody-store", features = [] }
aphrody-sql = { path = "../aphrody-sql", default-features = false, features = ["postgres", "sqlite"] }
async-trait = "0.1.92"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive", "env", "color"] }
dirs = "7.0.0"
ignore = { version = "0.4", features = [] }
rayon = "1.12.0"
reqwest = { version = "0.13.5", features = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full", "rt"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tracing = "0.1.44"

[dev-dependencies]
pretty_assertions = { version = "1", features = [] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }

[package]
name = "effectcraft-expr"
description = "After Effects-compatible expressions: a boa JavaScript runtime with the AE object model (thisComp, thisLayer, wiggle, loopOut, valueAtTime…) and array maths"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-time = { path = "../effectcraft-time", version = "0.9.2" }
effectcraft-geom = { path = "../effectcraft-geom", version = "0.9.2" }
effectcraft-keyframe = { path = "../effectcraft-keyframe", version = "0.9.2" }
serde_json = { version = "1", features = ["float_roundtrip"] }
effectcraft-project = { path = "../effectcraft-project", version = "0.9.2" }
effectcraft-path = { path = "../effectcraft-path", version = "0.9.2" }
effectcraft-render = { path = "../effectcraft-render", version = "0.9.2" }
boa_engine = { version = "0.22", default-features = false }

[dev-dependencies]
effectcraft-color = { path = "../effectcraft-color" }
effectcraft-effects = { path = "../effectcraft-effects" }
effectcraft-text = { path = "../effectcraft-text" }

[package]
name = "lightcraft-scenes"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Procedurally generated photographic demo scenes (HDR, linear Rec.2020) for LightCraft demos and tests (L1)"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[dependencies]
lightcraft-color = { path = "../lightcraft-color", version = "0.7.1" }
lightcraft-raster = { path = "../lightcraft-raster", version = "0.7.1" }
serde = { version = "1", features = ["derive", "rc"] }
rayon = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }

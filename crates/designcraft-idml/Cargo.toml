[package]
name = "designcraft-idml"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DesignCraft IDML (InDesign Markup Language) import and export"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
designcraft-geom = { path = "../designcraft-geom", version = "0.7.1" }
designcraft-color = { path = "../designcraft-color", version = "0.7.1" }
designcraft-doc = { path = "../designcraft-doc", version = "0.7.1" }
thiserror = "2"
quick-xml = "0.38"
zip = { workspace = true }

[dev-dependencies]
designcraft-compose = { path = "../designcraft-compose" }

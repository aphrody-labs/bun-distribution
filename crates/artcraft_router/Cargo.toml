[package]
name = "artcraft_router"
edition = "2024"
version = "0.0.1"
publish = false

[lib]
name = "artcraft_router"
path = "src/lib.rs"

[[bin]]
name = "artcraft-cli"
path = "src/cli.rs"

[dependencies]
midjourney_client = { path = "../midjourney_client" }
browser_emulation = { path = "../browser_emulation" }
artcraft_api_defs = { path = "../artcraft_api_defs" }
enums = { path = "../artcraft-enums", package = "artcraft-enums" }
artcraft_client = { path = "../artcraft_client" }
fal_client = { path = "../fal_client" }
gmicloud_client = { path = "../gmicloud_client" }
grok_api_client = { path = "../grok_api_client" }
kinovi_web_client = { path = "../kinovi_web_client" }
tokens = { path = "../artcraft-tokens", package = "artcraft-tokens" }
url_utils = { path = "../artcraft-url_utils", package = "artcraft-url_utils" }
worldlabs_api_client = { path = "../worldlabs_api_client" }
anyhow = "1.0.102"
log = "0.4.29"
reqwest = { version = "0.12.23", default-features = false, features = ["charset", "http2", "system-proxy", "json", "cookies", "rustls-tls", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
wreq = { version = "6.0.0-rc.28", features = ["json", "query", "form", "multipart", "cookies", "ws", "stream", "gzip", "brotli", "zstd", "deflate"] }
serde_derive = "1.0.228"
tokio = { version = "1.50.0", features = ["macros", "rt", "time", "io-std", "io-util"] }
uuid = "1.22.0"
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }

[dev-dependencies]
test_data = { path = "../artcraft-test_data", package = "artcraft-test_data" }
test_utils = { path = "../artcraft-test_utils", package = "artcraft-test_utils" }

[package]
name = "bevy_feathers"
version = "0.20.0"
edition = "2024"
description = "A collection of UI widgets for building editors and utilities in Bevy"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[dependencies]
# bevy
bevy_a11y = { path = "../bevy_a11y", version = "0.20.0" }
bevy_app = { path = "../bevy_app", version = "0.20.0" }
bevy_asset = { path = "../bevy_asset", version = "0.20.0" }
bevy_camera = { path = "../bevy_camera", version = "0.20.0" }
bevy_color = { path = "../bevy_color", version = "0.20.0" }
bevy_ui_widgets = { path = "../bevy_ui_widgets", version = "0.20.0" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0" }
bevy_input = { path = "../bevy_input", version = "0.20.0" }
bevy_input_focus = { path = "../bevy_input_focus", version = "0.20.0", features = [
  "bevy_picking",
] }
bevy_log = { path = "../bevy_log", version = "0.20.0" }
bevy_math = { path = "../bevy_math", version = "0.20.0" }
bevy_picking = { path = "../bevy_picking", version = "0.20.0", features = [
  "custom_cursor",
] }
bevy_shader = { path = "../bevy_shader", version = "0.20.0" }
bevy_platform = { path = "../bevy_platform", version = "0.20.0" }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0" }
bevy_render = { path = "../bevy_render", version = "0.20.0" }
bevy_scene = { path = "../bevy_scene", version = "0.20.0" }
bevy_text = { path = "../bevy_text", version = "0.20.0" }
bevy_ui = { path = "../bevy_ui", version = "0.20.0", features = [
  "bevy_picking",
] }
bevy_ui_render = { path = "../bevy_ui_render", version = "0.20.0" }
bevy_window = { path = "../bevy_window", version = "0.20.0" }
bevy_derive = { path = "../bevy_derive", version = "0.20.0" }
smol_str = { version = "0.2", default-features = false }

# other
accesskit = "0.24"

[features]
default = []
webgl = []
webgpu = []

# Bevy's workspace lints (upstream [workspace.lints]) merged with the Bun OS root lints at
# their stricter level; Cargo cannot inherit two lint sets, so they are explicit per crate.
[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_must_use = "deny"
non_ascii_idents = "warn"

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies]
bevy_render = { path = "../bevy_render", version = "0.20.0" }
bevy_ui_render = { path = "../bevy_ui_render", version = "0.20.0" }

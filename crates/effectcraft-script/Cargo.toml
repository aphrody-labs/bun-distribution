[package]
name = "effectcraft-script"
description = "EffectCraft scripting: JavaScript (boa) with an After Effects-style object model (app, project, CompItem, Layer, Property…) over the engine's undoable commands"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-engine = { path = "../effectcraft-engine", version = "0.9.2" }
effectcraft-project = { path = "../effectcraft-project", version = "0.9.2" }
effectcraft-keyframe = { path = "../effectcraft-keyframe", version = "0.9.2" }
effectcraft-time = { path = "../effectcraft-time", version = "0.9.2" }
effectcraft-render = { path = "../effectcraft-render", version = "0.9.2" }
effectcraft-path = { path = "../effectcraft-path", version = "0.9.2" }
serde_json = { version = "1", features = ["float_roundtrip"] }
boa_engine = { version = "0.22", default-features = false }
web-time = "1"

[dev-dependencies]
effectcraft-expr = { path = "../effectcraft-expr" }
effectcraft-psd = { path = "../effectcraft-psd" }

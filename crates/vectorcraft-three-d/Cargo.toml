[package]
name = "vectorcraft-three-d"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Portable 3D effect geometry (revolve, extrude and bevel, inflate, rotate) and projected vector shading"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
# VectorCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
vectorcraft-geom = { path = "../vectorcraft-geom" }
vectorcraft-pathops = { path = "../vectorcraft-pathops" }

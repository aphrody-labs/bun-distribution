# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-sandbox"
version = "1.0.0-canary"
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Deterministic command and filesystem sandboxing for aphrody: SandboxPolicy, capability probing (Enforced/BestEffort/Unavailable), denial classification, and platform sandbox backends (Linux Landlock/seccomp, Windows Low-IL/Job Objects, macOS seatbelt)."

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
serde       = { workspace = true, features = ["derive"] }
thiserror   = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio       = { workspace = true, features = ["process", "io-util", "time", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

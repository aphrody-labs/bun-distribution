[package]
name = "aphrody-a2a-grpc"
publish = true
version = "1.4.4"
description = "A2A v1 gRPC protocol binding for client and server"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace  = true
authors.workspace       = true
homepage.workspace      = true
keywords.workspace      = true
categories.workspace    = true

[lib]
name = "aphrody_a2a_grpc"

[lints]
workspace = true

[dependencies]
aphrody-a2a = { workspace = true }
aphrody-a2a-client = { workspace = true, default-features = false }
aphrody-a2a-server = { workspace = true, default-features = false }
aphrody-a2a-pb = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
futures = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
tokio-rustls    = { workspace = true, optional = true }
tonic-tls       = { workspace = true, optional = true }
rcgen           = { workspace = true, optional = true }

[features]
default = ["rustls-tls"]
native-tls = ["aphrody-a2a-client/native-tls", "aphrody-a2a-server/native-tls"]
rustls-tls = ["aphrody-a2a-client/rustls-tls", "aphrody-a2a-server/rustls-tls"]
rustls = ["dep:tokio-rustls", "dep:tonic-tls", "dep:rcgen", "rustls-tls"]

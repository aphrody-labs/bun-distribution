# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-jobs"
version = "1.4.4"
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Persistent background job queue (SQLite): submission, leased claims, crash recovery, retries, NDJSON logs."

[lints]
workspace = true

[dependencies]
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
chrono      = { workspace = true, features = ["serde"] }
async-trait = { workspace = true }
tokio       = { workspace = true, features = ["rt", "time", "macros", "sync"] }
# Bundled libsqlite3 — shares the workspace-pinned rusqlite and the single
# `links = "sqlite3"` with aphrody-memory / aphrody-fsindex / cli forensics.
rusqlite    = { workspace = true }
# Job ids must survive a restart and never collide across concurrent workers.
uuid        = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile    = { workspace = true }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[package.metadata.cargo-machete]
ignored = []

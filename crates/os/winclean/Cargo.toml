# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-winclean"
version = "1.0.0-canary"
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Rust-owned compatibility surface for 166 WinClean Windows tools."

[lints]
workspace = true

[dependencies]
aphrody-capture = { workspace = true }
aphrody-fsindex = { workspace = true }
aphrody-proc = { workspace = true }
aphrody-re = { workspace = true }
aphrody-subsystem = { workspace = true }
base64     = { workspace = true }
image      = { workspace = true, features = ["png", "bmp"] }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2      = { workspace = true }
sysinfo    = { workspace = true, features = ["disk", "network", "system"] }
thiserror  = { workspace = true }
reqwest    = { workspace = true, features = ["blocking"] }
rustls     = { workspace = true }
rusqlite  = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
ort = { workspace = true, features = ["load-dynamic"] }
pollster = "1.0"
uiautomation = { workspace = true, features = ["input"] }
vigem-rust = { workspace = true }
# Native Win32 backends replace the former reg/sc/netstat/wevtutil/powershell/where/explorer
# subprocesses: DataExchange+Memory+Ole (clipboard), Registry, Services (SCM),
# NetworkManagement_IpHelper (TCP table), EventLog (EvtQuery), Wmi+Variant (Defender),
# Storage_FileSystem (SearchPathW) and UI_Shell (ShellExecuteW).
windows = { workspace = true, features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Media_SpeechSynthesis", "Media_Core", "Storage_Streams", "Win32_Foundation", "Win32_Media_Audio", "Win32_NetworkManagement_IpHelper", "Win32_Security", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_EventLog", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Variant", "Win32_System_Wmi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
sha2       = { workspace = true }
tokio      = { workspace = true }

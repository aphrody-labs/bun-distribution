[package]
name = "aphrody-subsystem"
description = "The Aphrody subsystem contract: MCP tools, skills (parameterised tool sequences), a sub-agent routine and the shared event bus."
version = "1.0.0-canary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["mcp", "agent", "subsystem", "skills", "event-bus"]
categories = ["asynchronous", "api-bindings"]
publish = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

# The agent bus is a tokio broadcast channel: wasm32 needs only `sync` (the workspace tokio pulls mio).
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.52", default-features = false, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true }

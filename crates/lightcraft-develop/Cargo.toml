[package]
name = "lightcraft-develop"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "LightCraft develop settings: the non-destructive edit model, control specs, presets (L1)"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[dependencies]
lightcraft-geom = { path = "../lightcraft-geom", version = "0.7.1" }
lightcraft-color = { path = "../lightcraft-color", version = "0.7.1" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
miniz_oxide = "0.8"

[dev-dependencies]
proptest = "1"

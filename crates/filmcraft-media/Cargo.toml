[package]
name = "filmcraft-media"
description = "Media sources: probing, decoding traits, frame cache, generators, stills"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
filmcraft-time = { path = "../filmcraft-time" }
filmcraft-color = { path = "../filmcraft-color" }
filmcraft-frame = { path = "../filmcraft-frame" }
filmcraft-dng = { path = "../filmcraft-dng" }
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }

[dev-dependencies]
filmcraft-testkit = { path = "../filmcraft-testkit" }
filmcraft-dng = { path = "../filmcraft-dng", features = ["writer"] }
png = "0.18"

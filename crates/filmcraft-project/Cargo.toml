[package]
name = "filmcraft-project"
description = "FilmCraft document model: projects, bins, clips, sequences, tracks, effects, keyframes, markers"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
filmcraft-time = { path = "../filmcraft-time", version = "0.7.2" }
filmcraft-geom = { path = "../filmcraft-geom", version = "0.7.2" }
filmcraft-color = { path = "../filmcraft-color", version = "0.7.2" }
filmcraft-media = { path = "../filmcraft-media", version = "0.7.2" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"

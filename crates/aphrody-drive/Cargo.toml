# SPDX-License-Identifier: FSL-1.1-ALv2
#
# aphrody-drive: Aphrody Drive, the file explorer of Aphrody OS, as a Tauri 3 plugin hosted by
# the desktop (crates/ui/app). Derived from the Spacedrive desktop app (drive/apps/tauri).
# The explorer core runs out of process (`sd-daemon`, built from the drive/ workspace) and is
# reached over its local newline-delimited JSON socket, so this crate never links the core.

[package]
name = "aphrody-drive"
description = "Aphrody Drive, the Aphrody OS file explorer: Tauri 3 plugin that supervises the sd-daemon core and bridges it to the explorer webview."
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
# Derived from the FSL-licensed Spacedrive source in `drive/`. This is deliberately not inherited
# from the Apache-2.0 root workspace.
license = "FSL-1.1-ALv2"
authors = ["aphrody-code"]
homepage = "https://github.com/aphrody-labs/aphrody"
repository = "https://github.com/aphrody-labs/aphrody"
# Tauri plugin convention: `links` names the plugin, tauri-build reads its permission files
# through `DEP_APHRODY_DRIVE_PERMISSION_FILES_PATH`.
links = "aphrody-drive"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[build-dependencies]
tauri-plugin = { package = "aphrody-tauri-plugin", path = "../../toolchains/bun/packages/bun-tauri/crates/aphrody-tauri-plugin", version = "1.4.4", features = ["build"] }

[dependencies]
aphrody-proc = { path = "../aphrody-proc", version = "1.4.4", features = [] }
aphrody-kernel = { path = "../aphrody-kernel", version = "1.4.4", default-features = false, features = [] }
aphrody-subsystem = { path = "../aphrody-subsystem", version = "1.4.4" }
tauri = { package = "aphrody-tauri", path = "../../toolchains/bun/packages/bun-tauri/crates/aphrody-tauri", version = "1.4.4", default-features = false, features = ["compression"] }
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "http2"] }
serde = { version = "1.0.229", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
log = "0.4.34"
dirs = "7.0.0"
parking_lot = "0.12.5"
uuid = { version = "1.26.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[package]
name = "deckcraft-media"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DeckCraft media: probing, audio decoding (MP3, AAC/M4A, WAV, AIFF, FLAC, ALAC, Vorbis, Opus) to f32 PCM, H.264/HEVC/VP9/AV1 video decoding, poster frames, trim/fade/volume and the playback mixer and clock"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[dependencies]
deckcraft-isobmff = { path = "../deckcraft-isobmff" }
deckcraft-matroska = { path = "../deckcraft-matroska" }
deckcraft-ogg = { path = "../deckcraft-ogg" }
deckcraft-opus = { path = "../deckcraft-opus" }
deckcraft-h264 = { path = "../deckcraft-h264" }
deckcraft-hevc = { path = "../deckcraft-hevc" }
deckcraft-vp9 = { path = "../deckcraft-vp9" }
deckcraft-av1 = { path = "../deckcraft-av1" }
thiserror = "2"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "adpcm", "alac", "flac", "mp1", "mp2", "mp3", "pcm", "vorbis", "wav", "aiff", "caf", "ogg", "mkv", "isomp4"] }

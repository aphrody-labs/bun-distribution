# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-llama-server"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
homepage = "https://github.com/aphrody-labs/aphrody"
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description            = "Managed local inference: a supervisor for llama.cpp's `llama-server`, driven as an external binary (never linked). Reads GGUF facts, probes what the installed build supports, plans the launch (context, KV precision, MoE/layer placement, LoRA), runs the server under a detached idle-timeout daemon that holds the GPU lease, and gives clients attach-or-spawn access to an OpenAI-compatible endpoint plus the tokenize / LoRA hot-swap / props side channels."

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[features]
# Builds the fake `llama-server` and the daemon host used by the integration tests.
test-support = []
# In-process llama.cpp through `aphrody-llama` (libllama / libmtmd are loaded at
# RUNTIME through libloading, nothing is linked): a `ModelClient` over a GGUF
# file, embeddings, multimodal (mtmd), and a loopback OpenAI-compatible endpoint
# so the HTTP-shaped entry points (`Supervisor::ensure`, `ManagedLlamaServer`)
# keep working without spawning `llama-server`. Off by default: it needs
# libclang at build time (aphrody-llama-sys runs bindgen). With it on, the
# supervisor/daemon/`--help` paths are an explicit opt-in
# (`APHRODY_LLAMA_BACKEND=spawn`), see `Backend`.
in-process = [
    "dep:aphrody-infer",
    "dep:aphrody-model-client",
    "dep:aphrody-toolcall-repair",
    "dep:async-trait",
    "dep:base64",
    "dep:bytes",
    "dep:chrono",
    "dep:encoding_rs",
    "dep:futures",
    "dep:aphrody-llama",
    "dep:aphrody-ml-runtime",
    "dep:libloading",
    "dep:minijinja",
    "dep:minijinja-contrib",
]

[[bin]]
name              = "aphrody-llama-daemon"
path              = "tests/support/llama_daemon.rs"
test              = false
doc               = false
required-features = ["test-support"]

[[bin]]
name              = "aphrody-fake-llama-server"
path              = "tests/support/fake_llama_server.rs"
test              = false
doc               = false
required-features = ["test-support"]

[dependencies]
aphrody-gemini-web = { path = "../../toolchains/bun/packages/bun-google/aphrody/crates/gemini-web", features = [] }
aphrody-models = { path = "../aphrody-models", features = [] }
aphrody-proc = { path = "../aphrody-proc", features = [] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "http2"] }
reqwest = { version = "0.13.5", features = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full", "rt", "net"] }
tracing = "0.1.44"
aphrody-infer = { path = "../aphrody-infer", features = ["onnx"], optional = true }
aphrody-model-client = { path = "../aphrody-model-client", features = [], optional = true }
aphrody-toolcall-repair = { path = "../aphrody-toolcall-repair", features = [], optional = true }
async-trait = { version = "0.1.92", optional = true }
base64 = { version = "0.23.1", optional = true }
bytes = { version = "1.12.1", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
encoding_rs = { version = "0.8.41", optional = true }
futures = { version = "0.3.34", optional = true }
aphrody-llama = { path = "../aphrody-llama", optional = true }
aphrody-ml-runtime = { path = "../aphrody-ml-runtime", optional = true }
libloading = { version = "0.9.0", optional = true }
minijinja = { version = "2.24.0", optional = true, features = ["json"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"], optional = true }

[dev-dependencies]
aphrody-model-client = { path = "../aphrody-model-client", features = [] }
futures = "0.3.34"
pretty_assertions = { version = "1", features = [] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full", "rt"] }

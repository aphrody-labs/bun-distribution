[package]
name = "pdfcraft-engine"
description = "PdfCraft engine façade: session, documents, command/tool catalogue"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Our own crates
# keep full debug info. Dependencies keep only line tables, so backtraces still
# show file and line, but debug info for the whole dependency graph stays out of
# every test binary (each UI test binary had a 500-600 MB PDB on Windows, #454).

[dependencies]
pdfcraft-measure = { path = "../pdfcraft-measure" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
pdfcraft-render = { path = "../pdfcraft-render" }
pdfcraft-cos = { path = "../pdfcraft-cos" }
pdfcraft-organize = { path = "../pdfcraft-organize" }
pdfcraft-annot = { path = "../pdfcraft-annot" }
pdfcraft-forms = { path = "../pdfcraft-forms" }
pdfcraft-xfa = { path = "../pdfcraft-xfa" }
pdfcraft-edit = { path = "../pdfcraft-edit" }
pdfcraft-audit = { path = "../pdfcraft-audit" }
pdfcraft-redact = { path = "../pdfcraft-redact" }
pdfcraft-print = { path = "../pdfcraft-print" }
pdfcraft-xfdf = { path = "../pdfcraft-xfdf" }
pdfcraft-sign = { path = "../pdfcraft-sign" }
pdfcraft-optimize = { path = "../pdfcraft-optimize" }
pdfcraft-a11y = { path = "../pdfcraft-a11y" }
pdfcraft-ocr = { path = "../pdfcraft-ocr" }
pdfcraft-js = { path = "../pdfcraft-js" }
pdfcraft-compare = { path = "../pdfcraft-compare" }
pdfcraft-preflight = { path = "../pdfcraft-preflight" }
pdfcraft-export = { path = "../pdfcraft-export" }
pdfcraft-fonts = { path = "../pdfcraft-fonts" }
pdfcraft-create = { path = "../pdfcraft-create" }
pdfcraft-model = { path = "../pdfcraft-model" }
pdfcraft-geom = { path = "../pdfcraft-geom" }
thiserror = "2"
png = "0.18"
url = "2.5"
idna = "1.1"
icu_properties = "2.3"

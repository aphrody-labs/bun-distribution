[package]
name = "worldlabs_consumer_client"
edition = "2024"
version = "0.0.1"
publish = false

[lib]
name = "worldlabs_consumer_client"
path = "src/lib.rs"

[dependencies]
cloudflare_errors = { path = "../cloudflare_errors" }
cloudflare_mitigation = { path = "../cloudflare_mitigation" }
cookie_store = { path = "../artcraft-cookie_store", package = "artcraft-cookie_store" }
errors = { path = "../artcraft-errors", package = "artcraft-errors" }
filesys = { path = "../artcraft-filesys", package = "artcraft-filesys" }
http_headers = { path = "../artcraft-http_headers", package = "artcraft-http_headers" }
jwt_light = { path = "../artcraft-jwt_light", package = "artcraft-jwt_light" }
anyhow = "1.0.102"
base64 = "0.22.1"
bstr = "1.12.1"
byteorder = "1.5.0"
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
indexmap = "2.13.0"
log = "0.4.29"
once_cell = "1.21.4"
regex = "1.12.3"
scraper = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0-rc.5"
tokio = { version = "1", features = ["full"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = "1.22.0"
wreq-util = "3.0.0-rc.10"
wreq = { version = "6.0.0-rc.28", features = ["json", "query", "form", "multipart", "cookies", "ws", "stream", "gzip", "brotli", "zstd", "deflate"] }

[dev-dependencies]
filesys = { path = "../artcraft-filesys", package = "artcraft-filesys" }
test_data = { path = "../artcraft-test_data", package = "artcraft-test_data" }
test_utils = { path = "../artcraft-test_utils", package = "artcraft-test_utils" }
log4rs = "1.4.0"
env_logger = "0.11.9"
env = "1.0.1"
chrono = { version = "0.4.44", features = ["serde"] }

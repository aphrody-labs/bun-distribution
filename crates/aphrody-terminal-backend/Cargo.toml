# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-terminal-backend"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description            = "Native pty driver and WebSocket server for aphrody-terminal (cross-platform via portable-pty)."

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
aphrody-a2a-coord = { path = "../aphrody-a2a-coord", features = [] }
portable-pty = "0.8"
aphrody-terminal-core = { path = "../aphrody-terminal-core", features = [] }
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full", "net"] }
tokio-tungstenite = { version = "0.30", features = [] }
futures-util = { version = "0.3", features = [] }
anyhow = "1.0.104"
thiserror = "2.0.20"
tracing = "0.1.44"
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
url = { version = "2.5.8", features = ["serde"] }
getrandom = "0.4"
which = { version = "8", features = [] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full", "rt", "net"] }
tempfile = "3.27.0"

[package]
name = "lightcraft-lensdb"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Lens correction profiles: distortion, TCA and vignetting models, lensfun-format database loader (L2)"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[dependencies]
lightcraft-develop = { path = "../lightcraft-develop", version = "0.7.1" }
lightcraft-geom = { path = "../lightcraft-geom", version = "0.7.1" }
quick-xml = "0.38"

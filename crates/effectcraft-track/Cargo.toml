[package]
name = "effectcraft-track"
description = "Motion tracking: feature/search region point tracking (pyramid normalized cross-correlation + Lucas-Kanade refinement), confidence, corner-pin / transform solves, stabilization, Roto Brush segmentation (graph cut, matting) and 3D camera solving (structure from motion)"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-raster = { path = "../effectcraft-raster" }
effectcraft-segment = { path = "../effectcraft-segment" }
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
web-time = "1"

[package]
name = "aphrody-turbo-tasks-hash"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[lib]
name = "turbo_tasks_hash"
bench = false

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
data-encoding = "2.3.3"
smallvec = { version = "1.15.1", features = ["const_generics", "union", "const_new"] }
sha2 = "0.10.2"
turbo-tasks-macros = { path = "../aphrody-turbo-tasks-macros", package = "aphrody-turbo-tasks-macros" }
xxhash-rust = { version = "0.8.12", features = ["xxh3"] }

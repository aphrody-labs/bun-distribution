[package]
name = "aphrody-turbo-rcstr-macros"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "turbo_rcstr_macros"
proc-macro = true
bench = false

[features]
# Mirror the threshold-affecting feature of `turbo-rcstr`. The consuming crate
# routes it via `turbo-rcstr/atom_size_128` -> `turbo-rcstr-macros/atom_size_128`
# so the proc macro can compute the correct `MAX_INLINE_LEN` at expansion time
# instead of leaving an ambiguous range that needs a runtime const branch.
atom_size_128 = []

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
# Intentionally minimal: the only dependency is the standard `proc_macro`
# API. Dropping `syn` and `quote` removes ~hundreds of milliseconds of
# per-invocation overhead and a large slice of the proc-macro crate's
# build time. See the crate-level docs for the reasoning.

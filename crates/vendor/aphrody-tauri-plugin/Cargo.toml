[package]
name = "aphrody-tauri-plugin"
version = "3.0.0-alpha.3"
description = "Build script and runtime Tauri plugin definitions"
authors = ["Tauri Programme within The Commons Conservancy"]
homepage = "https://tauri.app/"
repository = "https://github.com/aphrody-labs/yolo"
categories = ["gui", "web-programming"]
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.95"

[package.metadata.docs.rs]
features = ["build", "runtime"]

[lib]
name = "tauri_plugin"

[features]
build = [
  "dep:anyhow",
  "dep:serde",
  "dep:serde_json",
  "dep:glob",
  "dep:plist",
  "dep:walkdir",
]
runtime = []

[dependencies]
anyhow = { version = "1", optional = true }
serde = { version = "1", optional = true }
tauri-utils = { version = "~3.0.0-alpha.3", path = "../aphrody-tauri-utils", package = "aphrody-tauri-utils", features = ["build-2"] }
serde_json = { version = "1", optional = true }
glob = { version = "0.3", optional = true }
schemars = { version = "1", features = ["preserve_order"] }
walkdir = { version = "2", optional = true }

[target."cfg(target_os = \"macos\")".dependencies]
plist = { version = "1", optional = true }

[lints.clippy]
collapsible_if = "allow"
redundant_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"

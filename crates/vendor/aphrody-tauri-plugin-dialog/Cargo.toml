[package]
name = "aphrody-tauri-plugin-dialog"
version = "3.0.0-alpha.2"
description = "Native system dialogs for opening and saving files along with message dialogs on your Tauri application."
edition = "2024"
authors = ["Tauri Programme within The Commons Conservancy"]
license = "Apache-2.0 OR MIT"
rust-version = "1.95"
repository = "https://github.com/aphrody-labs/yolo"
links = "tauri-plugin-dialog"
exclude = [
  "/banner.png",
  "/guest-js",
  "/package.json",
  "/rollup.config.js",
  "/test",
  "/tsconfig.json",
]

[features]
default = ["gtk3"]
xdg-portal = ["rfd/xdg-portal", "rfd/tokio", "rfd/wayland"]
gtk3 = ["rfd/gtk3"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-linux-android"]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "partial", notes = "Does not support folder picker" }
ios = { level = "partial", notes = "Does not support folder picker" }

[lib]
name = "tauri_plugin_dialog"

[build-dependencies]
tauri-plugin = { version = "3.0.0-alpha.3", path = "../aphrody-tauri-plugin", package = "aphrody-tauri-plugin", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "3.0.0-alpha.4", path = "../aphrody-tauri", package = "aphrody-tauri", default-features = false }
log = "0.4.21"
thiserror = "2"
url = "2"
tauri-plugin-fs = { version = "3.0.0-alpha.2", path = "../aphrody-tauri-plugin-fs", package = "aphrody-tauri-plugin-fs" }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\"))".dependencies]
rfd = { version = "0.16", default-features = false, features = [
  "common-controls-v6",
] }

raw-window-handle = "0.6"

[package]
name = "aphrody-next-core"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"

[lib]
name = "next_core"
bench = false

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.64"
base64 = "0.22.1"
allsorts = { version = "0.14.0", default-features = false, features = ["flate2_rust"] }
bincode = { version = "2.0.1", features = ["serde"] }
either = { version = "1.15.0", features = ["serde"] }
futures = "0.3.31"
indexmap = { version = "2.14.0", features = ["serde"] }
indoc = "2.0.0"
itertools = "0.10.5"
lightningcss = { version = "1.0.0-alpha.72", features = ["serde", "visitor", "into_owned", "browserslist"] }
mime_guess = "2.0.4"
percent-encoding = "2.3.1"
phf = { version = "0.11", features = ["macros"] }
qstring = "0.7.2"
react_remove_properties = "18.0.0"
regex = "1.12.3"
regress = "0.11.1"
remove_console = "18.0.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
serde_path_to_error = "0.1.20"
smallvec = { version = "1.15.1", features = ["const_generics", "union", "const_new"] }
swc_sourcemap = "10.0.2"
thiserror = "1.0.48"
tracing = "0.1.44"

swc_core = { version = "79.0.0", default-features = false, features = ["ecma_loader_lru", "ecma_loader_parking_lot", "parallel_rayon", "base", "common_concurrent", "ecma_ast", "ecma_loader_node", "ecma_minifier", "ecma_parser", "ecma_parser_typescript", "ecma_preset_env", "ecma_transforms", "ecma_transforms_optimization", "ecma_transforms_react", "ecma_transforms_typescript", "ecma_utils", "ecma_visit"] }
modularize_imports = "18.0.0"

next-custom-transforms = { path = "../aphrody-next-custom-transforms", package = "aphrody-next-custom-transforms", default-features = false }
next-taskless = { path = "../aphrody-next-taskless", package = "aphrody-next-taskless" }

turbo-bincode = { path = "../aphrody-turbo-bincode", package = "aphrody-turbo-bincode" }
turbo-rcstr = { path = "../aphrody-turbo-rcstr", package = "aphrody-turbo-rcstr" }
turbo-esregex = { path = "../aphrody-turbo-esregex", package = "aphrody-turbo-esregex" }
turbo-tasks = { path = "../aphrody-turbo-tasks", package = "aphrody-turbo-tasks" }
turbo-tasks-bytes = { path = "../aphrody-turbo-tasks-bytes", package = "aphrody-turbo-tasks-bytes" }
turbo-tasks-env = { path = "../aphrody-turbo-tasks-env", package = "aphrody-turbo-tasks-env" }
turbo-tasks-fetch = { path = "../aphrody-turbo-tasks-fetch", package = "aphrody-turbo-tasks-fetch" }
turbo-tasks-fs = { path = "../aphrody-turbo-tasks-fs", package = "aphrody-turbo-tasks-fs" }
turbo-tasks-hash = { path = "../aphrody-turbo-tasks-hash", package = "aphrody-turbo-tasks-hash" }
turbopack = { path = "../aphrody-turbopack", package = "aphrody-turbopack" }
turbopack-browser = { path = "../aphrody-turbopack-browser", package = "aphrody-turbopack-browser" }
turbopack-core = { path = "../aphrody-turbopack-core", package = "aphrody-turbopack-core" }
turbopack-css = { path = "../aphrody-turbopack-css", package = "aphrody-turbopack-css" }
turbopack-ecmascript = { path = "../aphrody-turbopack-ecmascript", package = "aphrody-turbopack-ecmascript" }
turbopack-ecmascript-plugins = { path = "../aphrody-turbopack-ecmascript-plugins", package = "aphrody-turbopack-ecmascript-plugins", default-features = false, features = ["transform_emotion"] }
turbopack-ecmascript-runtime = { path = "../aphrody-turbopack-ecmascript-runtime", package = "aphrody-turbopack-ecmascript-runtime" }
turbopack-image = { path = "../aphrody-turbopack-image", package = "aphrody-turbopack-image" }
turbopack-node = { path = "../aphrody-turbopack-node", package = "aphrody-turbopack-node", default-features = false }
turbopack-nodejs = { path = "../aphrody-turbopack-nodejs", package = "aphrody-turbopack-nodejs" }
turbopack-resolve = { path = "../aphrody-turbopack-resolve", package = "aphrody-turbopack-resolve" }
turbopack-static = { path = "../aphrody-turbopack-static", package = "aphrody-turbopack-static" }
turbopack-trace-utils = { path = "../aphrody-turbopack-trace-utils", package = "aphrody-turbopack-trace-utils" }
turbopack-wasm = { path = "../aphrody-turbopack-wasm", package = "aphrody-turbopack-wasm" }

[dev-dependencies]
tokio = "1.52.1"
turbo-tasks-backend = { path = "../aphrody-turbo-tasks-backend", package = "aphrody-turbo-tasks-backend" }

[features]
default = ["process_pool"]
process_pool = ["turbopack-node/process_pool"]
worker_pool = ["turbopack-node/worker_pool"]
next-font-local = []
image-webp = ["turbopack-image/webp"]
image-avif = ["turbopack-image/avif"]

# enable "HMR" for embedded assets
dynamic_embed_contents = [
  "turbo-tasks-fs/dynamic_embed_contents",
  "turbopack-browser/dynamic_embed_contents",
]

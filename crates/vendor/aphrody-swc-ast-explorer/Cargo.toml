[package]
name = "aphrody-swc-ast-explorer"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"

# don't publish this crate (for now)
publish = false

[[bin]]
name = "swc-ast-explorer"
path = "src/main.rs"
bench = false

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.2", features = ["derive"] }
owo-colors = "4.2.2"
regex = "1.12.3"
swc_core = { version = "79.0.0", default-features = false, features = ["ecma_loader_lru", "ecma_loader_parking_lot", "parallel_rayon", "base", "common", "ecma_ast", "ecma_parser"] }

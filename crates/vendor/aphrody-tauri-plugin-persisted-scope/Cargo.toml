[package]
name = "aphrody-tauri-plugin-persisted-scope"
version = "3.0.0-alpha.2"
description = "Save filesystem and asset scopes and restore them when the app is reopened."
authors = ["Tauri Programme within The Commons Conservancy"]
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/aphrody-labs/yolo"
exclude = ["/banner.png"]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }

[lib]
name = "tauri_plugin_persisted_scope"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "3.0.0-alpha.4", path = "../aphrody-tauri", package = "aphrody-tauri", default-features = false }
log = "0.4.21"
thiserror = "2"
aho-corasick = "1"
bincode = "1"
tauri-plugin-fs = { version = "3.0.0-alpha.2", path = "../aphrody-tauri-plugin-fs", package = "aphrody-tauri-plugin-fs" }

[features]
protocol-asset = ["tauri/protocol-asset"]

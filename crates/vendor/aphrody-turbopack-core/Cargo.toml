[package]
name = "aphrody-turbopack-core"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[lib]
name = "turbopack_core"
bench = false

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.64"
auto-hash-map = { path = "../aphrody-auto-hash-map", package = "aphrody-auto-hash-map" }
bincode = { version = "2.0.1", features = ["serde"] }
bitfield = "0.19.4"
browserslist-rs = "0.20.0"
bytes-str = "0.2.7"
const_format = "0.2.30"
data-encoding = "2.3.3"
either = "1.15.0"
erased-serde = "0.4.5"
indexmap = "2.14.0"
itertools = "0.10.5"
num-bigint = "0.4"
patricia_tree = { version = "0.10.1", features = ["serde"] }
petgraph = { version = "0.8.3", features = ["serde-1"] }
roaring = { version = "0.11.4", features = ["serde"] }
ref-cast = "1.0.20"
rustc-hash = "2.1.1"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["preserve_order", "raw_value"] }
smallvec = { version = "1.15.1", features = ["const_generics", "union", "const_new"] }
swc_sourcemap = "10.0.2"
swc_core = { version = "79.0.0", default-features = false, features = ["ecma_loader_lru", "ecma_loader_parking_lot", "parallel_rayon", "ecma_preset_env", "common"] }
tracing = "0.1.44"
turbo-bincode = { path = "../aphrody-turbo-bincode", package = "aphrody-turbo-bincode" }
turbo-esregex = { path = "../aphrody-turbo-esregex", package = "aphrody-turbo-esregex" }
turbo-frozenmap = { path = "../aphrody-turbo-frozenmap", package = "aphrody-turbo-frozenmap" }
turbo-prehash = { path = "../aphrody-turbo-prehash", package = "aphrody-turbo-prehash" }
turbo-rcstr = { path = "../aphrody-turbo-rcstr", package = "aphrody-turbo-rcstr" }
turbo-tasks = { path = "../aphrody-turbo-tasks", package = "aphrody-turbo-tasks" }
turbo-tasks-env = { path = "../aphrody-turbo-tasks-env", package = "aphrody-turbo-tasks-env" }
turbo-tasks-fs = { path = "../aphrody-turbo-tasks-fs", package = "aphrody-turbo-tasks-fs" }
turbo-tasks-hash = { path = "../aphrody-turbo-tasks-hash", package = "aphrody-turbo-tasks-hash" }
turbo-unix-path = { path = "../aphrody-turbo-unix-path", package = "aphrody-turbo-unix-path" }
url = "2.2.2"
urlencoding = "2.1.2"
uuid = "1.18.1"

[dev-dependencies]
rstest = "0.16.0"
tokio = "1.52.1"
turbo-tasks-testing = { path = "../aphrody-turbo-tasks-testing", package = "aphrody-turbo-tasks-testing" }
turbo-tasks-backend = { path = "../aphrody-turbo-tasks-backend", package = "aphrody-turbo-tasks-backend" }
tempfile = "3.20.0"

[features]
default = []

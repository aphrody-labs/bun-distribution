[package]
name = "aphrody-auto-hash-map"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"

[lib]
name = "auto_hash_map"

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
hashbrown = { version = "0.15.4", features = ["raw-entry", "serde"] }
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
shrink-to-fit = { version = "0.2.10", features = ["hashbrown"] }

[dev-dependencies]
criterion = { version = "4.3.0", package = "codspeed-criterion-compat" }
turbo-tasks-malloc = { path = "../aphrody-turbo-tasks-malloc", package = "aphrody-turbo-tasks-malloc", default-features = false }

[[bench]]
name = "tiny_vec"
harness = false

[package]
edition = "2024"
name = "aphrody-next-napi-bindings"
version = "0.0.0"
publish = false

[lib]
name = "next_napi_bindings"
crate-type = ["cdylib"]

[features]
image-webp = ["next-core/image-webp"]
image-avif = ["next-core/image-avif"]
# Enable all the available image codec support.
# Currently this is identical to `image-webp`, as we are not able to build
# other codecs easily yet.
image-extended = ["image-webp"]

# Enable dhat profiling allocator for heap profiling.
__internal_dhat-heap = ["dhat"]
# Enable dhat profiling allocator for ad hoc profiling.
# [Note]: we do not have any ad hoc event in the codebase yet, so enabling this
# effectively does nothing.
__internal_dhat-ad-hoc = ["dhat"]

# Enable support for the tokio console: https://github.com/tokio-rs/console
tokio-console = ["dep:console-subscriber"]

[lints.clippy]
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(fuzzing)", "cfg(codspeed)"] }

[package.metadata.cargo-shear]
ignored = [
    # we need to set features on these packages when building for WASM, but we don't directly use them
    "getrandom",
    "iana-time-zone",
]

[dependencies]
anyhow = "1.0.100"
bincode = { version = "2.0.1", features = ["serde"] }
console-subscriber = { version = "0.4.1", optional = true }
dhat = { version = "0.3.2", optional = true }
flate2 = "1.0.28"
futures-util = "0.3.31"
owo-colors = "4.2.2"
napi = { version = "3.10.0", default-features = false, features = ["napi3", "serde-json", "tokio_rt", "error_anyhow", "napi4", "napi5"] }
napi-derive = "3.5.8"
next-code-frame = { path = "../aphrody-next-code-frame", package = "aphrody-next-code-frame" }
next-custom-transforms = { path = "../aphrody-next-custom-transforms", package = "aphrody-next-custom-transforms", default-features = false }
next-taskless = { path = "../aphrody-next-taskless", package = "aphrody-next-taskless" }
rand = "0.10.1"
rustc-hash = "2.1.1"
serde = "1"
serde_json = "1"
supports-hyperlinks = "3.1.0"
terminal_size = "0.3.0"
terminal_hyperlink = "0.1.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.16"
tracing-chrome = "0.7.2"
url = "2.2.2"
urlencoding = "2.1.2"
regex = "1.12.3"

swc_core = { version = "79.0.0", default-features = false, features = ["ecma_loader_lru", "ecma_loader_parking_lot", "parallel_rayon", "base", "base_module", "common_concurrent", "ecma_ast", "ecma_ast_serde", "ecma_codegen", "ecma_helpers_inline", "ecma_loader_node", "ecma_minifier", "ecma_parser", "ecma_parser_typescript", "ecma_transforms", "ecma_transforms_optimization", "ecma_transforms_react", "ecma_transforms_typescript", "ecma_utils", "ecma_visit"] }

# Turbopack.
turbo-rcstr = { path = "../aphrody-turbo-rcstr", package = "aphrody-turbo-rcstr", features = ["napi"] }
turbo-tasks = { path = "../aphrody-turbo-tasks", package = "aphrody-turbo-tasks" }
turbo-tasks-backend = { path = "../aphrody-turbo-tasks-backend", package = "aphrody-turbo-tasks-backend" }
turbo-tasks-fs = { path = "../aphrody-turbo-tasks-fs", package = "aphrody-turbo-tasks-fs" }
turbo-unix-path = { path = "../aphrody-turbo-unix-path", package = "aphrody-turbo-unix-path" }
next-api = { path = "../aphrody-next-api", package = "aphrody-next-api", features = ["worker_pool"] }
next-build = { path = "../aphrody-next-build", package = "aphrody-next-build" }
next-core = { path = "../aphrody-next-core", package = "aphrody-next-core" }
turbopack-core = { path = "../aphrody-turbopack-core", package = "aphrody-turbopack-core" }
turbopack-ecmascript-hmr-protocol = { path = "../aphrody-turbopack-ecmascript-hmr-protocol", package = "aphrody-turbopack-ecmascript-hmr-protocol" }
turbopack-trace-utils = { path = "../aphrody-turbopack-trace-utils", package = "aphrody-turbopack-trace-utils" }
turbopack-trace-server = { path = "../aphrody-turbopack-trace-server", package = "aphrody-turbopack-trace-server" }
turbopack-node = { path = "../aphrody-turbopack-node", package = "aphrody-turbopack-node", default-features = false, features = ["worker_pool"] }

mdxjs = { version = "1.0.4", features = ["serializable"] }

swc_ecma_react_compiler = "25.0.0"
turbopack-lightningcss-napi = { path = "../aphrody-turbopack-lightningcss-napi", package = "aphrody-turbopack-lightningcss-napi" }
lightningcss = { version = "1.0.0-alpha.72", features = ["serde", "visitor", "into_owned", "browserslist"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `swc/plugin` compiles SWC's wasm32 plugin path, and SWC can't run wasm plugins from inside wasm
# (https://github.com/swc-project/swc/issues/3934). The filesystem cache is native-only too.
swc_core = { version = "79.0.0", default-features = false, features = ["ecma_loader_lru", "ecma_loader_parking_lot", "parallel_rayon", "__plugin_transform_host", "__plugin_transform_host_schema_v1", "plugin_transform_host_native_filesystem_cache"] }
# Can't run inside wasm; see `turbopack-ecmascript-plugins`.
swc_plugin_backend_wasmtime = "16.0.0"
# `full` pulls in `process` and `signal`, which don't exist on wasi.
tokio = { version = "1.52.1", features = ["full"] }

turbo-tasks-malloc = { path = "../aphrody-turbo-tasks-malloc", package = "aphrody-turbo-tasks-malloc", default-features = false, features = ["custom_allocator"] }

[target.'cfg(windows)'.dependencies]
windows-sys = "0.60"

# Dependencies for the wasm32 build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.9", default-features = false, features = ["js"] }
iana-time-zone = { version = "*", features = ["fallback"] }
# `turbo-tasks-malloc`'s `custom_allocator` feature uses mimalloc, which isn't compatible with wasm
turbo-tasks-malloc = { path = "../aphrody-turbo-tasks-malloc", package = "aphrody-turbo-tasks-malloc", default-features = false }

# wasi-only dependencies.
[target.wasm32-wasip1-threads.dependencies]
# this requires tokio_unstable currently.
tokio = { version = "1.52.1", features = ["full"] }

[build-dependencies]
anyhow = "1.0.100"
napi-build = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
vergen-gitcl = { version = "1.0.8", features = ["cargo"] }

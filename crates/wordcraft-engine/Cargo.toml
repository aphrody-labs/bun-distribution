[package]
name = "wordcraft-engine"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "WordCraft engine: session, selection, undo, the command registry (every action is a command), Word's command catalog, file I/O dispatch"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
wordcraft-geom = { path = "../wordcraft-geom", version = "0.6.1" }
wordcraft-doc = { path = "../wordcraft-doc", version = "0.6.1" }
wordcraft-fonts = { path = "../wordcraft-fonts", version = "0.6.1" }
wordcraft-layout = { path = "../wordcraft-layout", version = "0.6.1" }
wordcraft-render = { path = "../wordcraft-render", version = "0.6.1" }
wordcraft-proof = { path = "../wordcraft-proof", version = "0.6.1" }
wordcraft-docx = { path = "../wordcraft-docx", version = "0.6.1" }
wordcraft-docbin = { path = "../wordcraft-docbin", version = "0.6.1" }
wordcraft-pdf = { path = "../wordcraft-pdf", version = "0.6.1" }
wordcraft-formats = { path = "../wordcraft-formats", version = "0.6.1" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
log = "0.4"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "unicode"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
zeroize = "1"

[dev-dependencies]
zip = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock for `now_iso` (`SystemTime::now()` panics on wasm32).
js-sys = "0.3"

[package]
name = "soundcraft-playback"
description = "SoundCraft audio device I/O: realtime playback and recording through the mix engine"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/storytold/soundcraft"

[dependencies]
soundcraft-time = { path = "../soundcraft-time" }
soundcraft-audio-io = { path = "../soundcraft-audio-io" }
soundcraft-model = { path = "../soundcraft-model" }
soundcraft-mix = { path = "../soundcraft-mix" }
soundcraft-dsp = { path = "../soundcraft-dsp" }
log = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

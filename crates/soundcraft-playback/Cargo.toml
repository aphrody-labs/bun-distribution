[package]
name = "soundcraft-playback"
description = "SoundCraft audio device I/O: realtime playback and recording through the mix engine"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/storytold/soundcraft"

[dependencies]
soundcraft-time = { path = "../soundcraft-time", version = "0.6.1" }
soundcraft-audio-io = { path = "../soundcraft-audio-io", version = "0.6.1" }
soundcraft-model = { path = "../soundcraft-model", version = "0.6.1" }
soundcraft-mix = { path = "../soundcraft-mix", version = "0.6.1" }
soundcraft-dsp = { path = "../soundcraft-dsp", version = "0.6.1" }
log = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.16"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.16", features = ["wasm-bindgen"] }

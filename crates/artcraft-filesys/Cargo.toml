[package]
name = "artcraft-filesys"
edition = "2018"
version = "0.0.1"
authors = [
    "Brandon Thomas <bt@brand.io>",
    "Brandon Thomas <echelon@gmail.com>",
]
publish = false

[lib]
# NB: Public "filesys" crate does not exist, so it's safe to use for now.
name = "filesys"
path = "src/lib.rs"

[dependencies]
errors = { path = "../artcraft-errors", package = "artcraft-errors" }
log = "0.4.29"
walkdir = "2.4.0"

[dev-dependencies]
test_utils = { path = "../artcraft-test_utils", package = "artcraft-test_utils" }

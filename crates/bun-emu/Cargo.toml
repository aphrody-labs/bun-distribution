[package]
name = "bun-emu"
version = "0.1.0"
edition.workspace = true
publish = false
license-file = "../../docs/licenses/iecode/licenses/dust/LICENSE"
description = "Native multi-system emulation for Bun OS: one Machine interface over in-tree CPU and system cores."

[[bin]]
name = "bun-emu"
path = "src/main.rs"

[dependencies]
aphrody-dust-core = { path = "../aphrody-dust-core" }
aphrody-dust-soft-2d = { path = "../aphrody-dust-soft-2d" }
aphrody-dust-soft-3d = { path = "../aphrody-dust-soft-3d" }

rdynarmic = { path = "../rdynarmic" }

[lints]
workspace = true

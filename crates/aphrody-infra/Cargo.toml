[package]
name = "aphrody-infra"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/aphrody"
description = "Unified Aphrody infrastructure, workflow, development environment and deployment orchestrator"

[lib]
name = "aphrody_infra"
path = "src/lib.rs"

[dependencies]
aphrody-proc = { path = "../aphrody-proc", version = "1.4.4", features = [] }
anyhow = "1.0.104"
aphrody-git = { package = "bun_git", path = "../../toolchains/bun/src/bun-os/git" }
aphrody-ssh = { path = "../aphrody-ssh", version = "1.4.4", features = [] }
aphrody-ovh = { path = "../aphrody-ovh", version = "1.4.4" }
aphrody-vpn = { path = "../aphrody-vpn", version = "1.4.4", features = [] }
aphrody-remote-desktop = { path = "../aphrody-remote-desktop", version = "1.4.4", features = ["vnc"] }
aphrody-wireguard = { path = "../aphrody-wireguard", version = "1.4.4", features = [] }
aphrody-yolo = { path = "../aphrody-yolo", version = "1.4.4" }
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env", "color"] }
gix = { version = "0.88", default-features = false, features = ["sha1", "basic", "extras", "comfort", "max-performance-safe", "revision", "index", "worktree-mutation"] }
reqwest = { version = "0.13.5", features = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"], default-features = false }
ignore = { version = "0.4", features = [] }
opendal = { version = "0.59", default-features = false, features = ["executors-tokio", "services-fs"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
regex = { version = "1.11", features = [] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }
toml = "1.1.5"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

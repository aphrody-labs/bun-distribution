[package]
name = "soundcraft-engine"
description = "SoundCraft command engine: commands, undo, editing operations, import/export, bounce, parity catalog"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/storytold/soundcraft"

[dependencies]
soundcraft-time = { path = "../soundcraft-time", version = "0.6.1" }
soundcraft-audio-io = { path = "../soundcraft-audio-io", version = "0.6.1" }
soundcraft-midi = { path = "../soundcraft-midi", version = "0.6.1" }
soundcraft-dsp = { path = "../soundcraft-dsp", version = "0.6.1" }
soundcraft-clap-host = { path = "../soundcraft-clap-host", version = "0.6.1" }
soundcraft-vst3-host = { path = "../soundcraft-vst3-host", version = "0.6.1" }
soundcraft-au-host = { path = "../soundcraft-au-host", version = "0.6.1" }
soundcraft-model = { path = "../soundcraft-model", version = "0.6.1" }
soundcraft-mix = { path = "../soundcraft-mix", version = "0.6.1" }
soundcraft-video = { path = "../soundcraft-video", version = "0.6.1" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
log = "0.4"
zip = { workspace = true }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[package]
name = "aphrody-nie-data"
description = "Modèles de données de jeu IEVR portés en Rust pur (skills, auras, chara_param, items, growth/exp tables, passifs) depuis le pipeline inagle — no_std+alloc, wasm-friendly"
version.workspace = true
edition.workspace = true
license-file = "../../docs/licenses/iecode/nie/LICENSE"
publish = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# serde_json en mode no_std+alloc (parse des dumps cfg.bin.json) — pas de std requis.
# Version alignée sur la racine (Cargo.lock = 1.0.150) ; on ne peut pas hériter du workspace
# tout en désactivant default-features, d'où la déclaration directe.
serde_json = { workspace = true, features = ["alloc"] }
serde = { workspace = true, features = ["std", "derive"], optional = true }

[features]
default = []
# Dérive Serialize/Deserialize sur les structs publiques.
serde = ["dep:serde"]
# Active std pour les binaires (réactive les features std de serde_json).
std = ["serde_json/std"]

[[bin]]
name = "export_passives"
path = "src/bin/export_passives.rs"
required-features = ["serde", "std"]

[[bin]]
name = "export_formations"
path = "src/bin/export_formations.rs"
required-features = ["serde", "std"]

[[bin]]
name = "export_skills"
path = "src/bin/export_skills.rs"
required-features = ["serde", "std"]

# `aphrody-nie-data` n'active par defaut que `std` : `serde` est optionnelle, et tout
# `aphrody_nie_data::typed` est derriere elle. Ces 24 tests l'appellent sans la declarer, si bien que
# `cargo clippy -p aphrody-nie-data --lib --tests` — le portail de verification documente dans
# CLAUDE.md — ECHOUAIT a compiler (E0433), au lieu de sauter proprement. Avec
# `required-features`, le harnais saute le test ET dit pourquoi.

[[test]]
name = "avatar_resolve_golden"
path = "tests/avatar_resolve_golden.rs"
required-features = ["serde"]

[[test]]
name = "ai_type_golden"
path = "tests/ai_type_golden.rs"
required-features = ["serde", "std"]


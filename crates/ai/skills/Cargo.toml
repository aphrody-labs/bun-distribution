# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-skills"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Unified skills infrastructure: SKILL.md runtime + lifecycle hooks + tool-level permissions."

[lints]
workspace = true

[dependencies]
# The single authority for `~/.aphrody` (`aphrody_models::paths`). This crate
# resolved the state root on its own and never consulted `$APHRODY_HOME`, so
# the override moved the inference toolbox while leaving this crate's files in
# the real home — a split tree with nothing raised to say so.
aphrody-models = { workspace = true }
# --- shared ---
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }

# --- runtime-specific ---
anyhow     = { workspace = true }
clap       = { workspace = true }
serde_yaml = { workspace = true }
walkdir    = { workspace = true }
dirs       = { workspace = true }
tempfile   = { workspace = true }

# --- hooks-specific ---
tokio      = { workspace = true, features = ["macros", "rt", "process", "io-util", "time", "sync", "fs"] }
globset    = { workspace = true }

# --- permissions-specific ---
glob       = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio    = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "process", "io-util", "time", "sync", "fs", "test-util"] }

[package.metadata.cargo-machete]
# tracing is now detected as used by machete -- removed from ignored 2026-05-21.
ignored = []

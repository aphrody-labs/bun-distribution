# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-rag"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Unified RAG storage, embedding, vector scan, hybrid search, and agent tools for aphrody (P8)."

[lints]
workspace = true

[features]
default = []
ort = ["dep:aphrody-embed", "aphrody-embed/embeddings"]
# In-process pure-Rust CPU embedder + cross-encoder (no Python, no HTTP, no Mutex).
native = ["dep:aphrody-embed", "aphrody-embed/native"]

[dependencies]
aphrody-embed    = { workspace = true, optional = true }
aphrody-rag-core = { workspace = true }
aphrody-toolcall = { workspace = true }
aphrody-config   = { workspace = true }
aphrody-models   = { workspace = true }
aphrody-code-graph = { workspace = true }
aphrody-store    = { workspace = true }
aphrody-sql      = { workspace = true, features = ["postgres", "sqlite"] }
async-trait      = { workspace = true }
blake3           = { workspace = true }
clap             = { workspace = true, features = ["derive"] }
dirs             = { workspace = true }
ignore           = { workspace = true }
rayon            = { workspace = true }
reqwest          = { workspace = true, features = ["json"] }
rustls           = { workspace = true }
rusqlite         = { workspace = true }
serde            = { workspace = true, features = ["derive"] }
serde_json       = { workspace = true }
sha2             = { workspace = true }
thiserror        = { workspace = true }
tokio            = { workspace = true, features = ["sync", "fs", "io-util", "time", "rt"] }
tokio-postgres   = { workspace = true }
tracing          = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile          = { workspace = true }
tokio             = { workspace = true, features = ["macros", "rt-multi-thread"] }

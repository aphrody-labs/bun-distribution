# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-ocr"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Image-to-text pipeline for aphrody: drives a local vision-language model over one image or a whole directory, parses its DocTags output into markdown, and reports which pages carry no text at all."

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[features]
default = []
# Durable SQLite deposit of results, forwarded to the contract crate.
sqlite = ["aphrody-ocr-core/sqlite"]

[dependencies]
aphrody-ocr-core = { workspace = true }
aphrody-ocr-onnx = { workspace = true }
aphrody-ocr-vlm = { workspace = true }
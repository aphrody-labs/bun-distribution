# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-train"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Training surface for aphrody: exclusive GPU lease, job runner, streaming event protocol, and measured promotion gates (P10, docs/plans/codex-oss.md)."

[lints]
workspace = true

[features]
default = []
# Generic training registry (ADR D11): dataset lineage, runs, artifacts, metrics and
# promotions in PostgreSQL through `aphrody-sql`. Inert unless
# `APHRODY_TRAINING_DATABASE_URL[_POOLED]` is set.
registry = ["dep:aphrody-sql"]

[dependencies]
aphrody-models   = { workspace = true }
aphrody-agent-home = { workspace = true }
aphrody-proc     = { workspace = true }
aphrody-rag-core = { workspace = true }
aphrody-sql      = { workspace = true, features = ["postgres"], optional = true }
# uv resolution (`$APHRODY_UV_BIN`, else PATH) owned by aphrody-os.
aphrody-toolchains = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
tokio            = { workspace = true, features = ["rt", "macros", "process", "io-util", "time", "fs"] }
tracing          = { workspace = true }
blake3           = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile          = { workspace = true }
tokio             = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "fs"] }

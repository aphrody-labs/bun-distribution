# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-voice"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Voice I/O (TTS + STT) provider traits + ElevenLabs/Whisper adapters + Discord shim."

[features]
# Run Whisper *in-process* through whisper-rs instead of driving the upstream
# whisper.cpp binary. This is a backend choice, not an on/off switch: with the
# feature off, `stt::whisper_cpp` still transcribes locally by spawning the
# release binary (same posture as `aphrody-infer` towards llama.cpp).
# Cost of turning it on: a C++ toolchain at build time.
local-whisper = ["dep:whisper-rs"]

[lints]
workspace = true

# Dependencies available on all targets (wasm-compatible).
[dependencies]
aphrody-web-source.workspace = true
async-trait = { workspace = true }
futures     = { workspace = true }
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }
bytes       = { workspace = true }
thiserror   = { workspace = true }

# Native-only deps: tokio + reqwest pull mio which does not compile for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aphrody-proc = { workspace = true, features = ["tokio"] }
tokio  = { workspace = true, features = ["rt", "macros", "io-util", "fs", "process"] }
reqwest = { workspace = true, features = ["json", "stream", "multipart", "rustls-no-provider"] }
whisper-rs = { version = "0.16", optional = true }
# Weight lifecycle for the driven whisper.cpp backend: a catalog id resolves to
# a verified file in `~/.aphrody/models` instead of a path the caller must know.
aphrody-models = { workspace = true }
# The driven backend hands whisper.cpp a file; the WAV it reads is written to a
# per-call temporary directory that is removed when the call returns.
tempfile = { workspace = true }

# Browser-native deps: only compiled when targeting wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys       = { workspace = true }
web-sys      = { workspace = true, features = [
    "Window",
    "SpeechSynthesis",
    "SpeechSynthesisUtterance",
    "SpeechSynthesisVoice",
] }

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen", "js-sys", "web-sys"]

[dev-dependencies]
tokio       = { workspace = true, features = ["rt", "macros"] }
serde_json  = { workspace = true }

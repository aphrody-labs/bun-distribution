# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-app-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description = "Local Codex-shaped app server for Aphrody threads and turns."

[lints]
workspace = true

[features]
default = []
rag = ["dep:aphrody-rag", "aphrody-agent-runtime/rag"]
# Managed local models run inside the host process (no re-executed daemon).
in-process = ["aphrody-agent-runtime/in-process"]

[dependencies]
axum = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
aphrody-agent-runtime = { workspace = true }
aphrody-agent-proto = { workspace = true }
aphrody-app-protocol = { workspace = true }
aphrody-llama-server = { workspace = true }
aphrody-config = { workspace = true }
aphrody-model-client = { workspace = true }
aphrody-models = { workspace = true }
aphrody-rollout = { workspace = true }
aphrody-rag = { workspace = true, optional = true }
aphrody-toolcall = { workspace = true }
chrono = { workspace = true }
aphrody-engine = { workspace = true }
aphrody-agent-home = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
jsonschema = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }

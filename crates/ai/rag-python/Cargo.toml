# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-rust"
description = "PyO3 extension module aphrody.aphrody_rust (RAG vector kernels and rank fusion), built into the aphrody Python wheel."
repository.workspace = true
version = "0.1.0"
edition.workspace = true
license.workspace = true
[lib]
name = "aphrody_rust"
crate-type = ["cdylib"]

[dependencies]
aphrody-rag-core = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module", "abi3-py311"] }

[lints]
workspace = true

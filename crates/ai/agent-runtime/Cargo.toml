# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-agent-runtime"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Wiring/factory layer that assembles a ready-to-run aphrody agent: builds a ModelClient (Gemini or stub), a ToolRegistry preloaded with the shell-exec + apply-patch tools, an optional rollout recorder, and spawns an aphrody-engine session. The ergonomic entry point every surface (CLI / TUI / desktop) uses to start an autonomous agent."

[lints]
workspace = true

[features]
default = []
rag = ["dep:aphrody-rag"]
# Managed local models run inside this process (libllama through koharu-llama) instead of a
# detached `llama-server` daemon that re-executes the host executable. Needs libclang to build.
in-process = ["aphrody-llama-server/in-process"]

[dependencies]
aphrody-engine       = { workspace = true }
aphrody-agent-proto  = { workspace = true }
aphrody-agent-tools  = { workspace = true }
aphrody-model-client = { workspace = true }
aphrody-toolcall     = { workspace = true }
aphrody-toolcall-repair = { workspace = true }
aphrody-rollout      = { workspace = true }
aphrody-models       = { workspace = true }
aphrody-llama-server = { workspace = true }
aphrody-config       = { workspace = true }
aphrody-mcp-client   = { workspace = true }
aphrody-rag          = { workspace = true, optional = true }
aphrody-model-antigravity = { workspace = true }
aphrody-antigravity      = { workspace = true }
serde_json          = { workspace = true }
thiserror           = { workspace = true }
tokio               = { workspace = true }
futures             = { workspace = true }
async-trait         = { workspace = true }
rustls              = { workspace = true }
which               = { workspace = true }
tracing             = { workspace = true }

[dev-dependencies]
aphrody-jev       = { workspace = true }
pretty_assertions = { workspace = true }
tempfile          = { workspace = true }
tokio             = { workspace = true }

# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-ocr-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Portable versioned OCR result contract, provenance and quality states for aphrody."

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[features]
default = []
# Durable deposit of results into a SQLite corpus. Off by default so the
# contract keeps compiling for the wasm targets, which have no rusqlite.
sqlite = ["dep:rusqlite", "dep:chrono", "dep:aphrody-agent-home"]

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
# Bundled libsqlite3 — shares the workspace-pinned rusqlite and the single
# `links = "sqlite3"` with aphrody-jobs / aphrody-memory / aphrody-fsindex.
rusqlite   = { workspace = true, optional = true }
chrono     = { workspace = true, optional = true }
aphrody-agent-home = { workspace = true, optional = true }
[dev-dependencies]
tempfile = { workspace = true }

# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-session"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Conversation session tracker for aphrody — turns + tool calls + token usage + cost, persisted as JSONL with atomic writes and deterministic replay; incremental mirror of external agent sessions (Antigravity CLI, Codex, Claude Code)."

[lints]
workspace = true

[features]
default = []
# `external::sync_into_memory` / `feed_memory`: feed synced external-agent
# records into an aphrody-memory `MemoryProvider` (the chat loop's store).
memory = ["dep:aphrody-memory"]

[dependencies]
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
chrono     = { workspace = true }

# `external` (host-only): home directory, the state-dir authority, and the
# process table for live-agent enrichment.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The JSONL file store (tokio::fs) is host-only; the wasm32 build keeps the pure session model.
tokio          = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync"] }
dirs           = { workspace = true }
sysinfo        = { workspace = true }
aphrody-models = { workspace = true }
aphrody-memory = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "test-util"] }

[package.metadata.cargo-machete]
# tracing is consumed via macros (debug!/info!) only; keep it explicit so
# machete does not misfire when the crate is built without log capture.
ignored = ["tracing"]

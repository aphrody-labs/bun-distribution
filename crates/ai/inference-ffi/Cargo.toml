# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-inference-ffi"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Asynchronous C ABI over Aphrody's shared in-process inference and Agent Home"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
aphrody-agent-home = { workspace = true }
aphrody-llama-server = { workspace = true, features = ["in-process"] }
aphrody-model-client = { workspace = true }
aphrody-models = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }

# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-ocr-core"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description            = "Portable versioned OCR result contract, provenance and quality states for aphrody."

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[features]
default = []
# Durable deposit of results into a SQLite corpus. Off by default so the
# contract keeps compiling for the wasm targets, which have no rusqlite.
sqlite = ["dep:rusqlite", "dep:chrono", "dep:aphrody-agent-home"]

[dependencies]
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
tracing = "0.1.44"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
aphrody-agent-home = { path = "../aphrody-agent-home", version = "1.4.7", features = [], optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[package]
name = "midjourney_client"
edition = "2024"
version = "0.0.1"
publish = false

[lib]
name = "midjourney_client"
path = "src/lib.rs"

[dependencies]
browser_emulation = { path = "../browser_emulation" }
cloudflare_errors = { path = "../cloudflare_errors" }
cookie_store_wrapper = { path = "../cookie_store_wrapper", features = ["wreq"] }
errors = { path = "../artcraft-errors", package = "artcraft-errors" }
uuid_utils = { path = "../artcraft-uuid_utils", package = "artcraft-uuid_utils" }
anyhow = "1.0.102"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }
toml = "1.0.7+spec-1.1.0"
url = { version = "2.5.8", features = ["serde"] }
wreq-util = "3.0.0-rc.10"
wreq = { version = "6.0.0-rc.28", features = ["json", "query", "form", "multipart", "cookies", "ws", "stream", "gzip", "brotli", "zstd", "deflate"] }
dom_query = "0.20.2"
ciborium = "0.2"

[dev-dependencies]
filesys = { path = "../artcraft-filesys", package = "artcraft-filesys" }
test_data = { path = "../artcraft-test_data", package = "artcraft-test_data" }
test_utils = { path = "../artcraft-test_utils", package = "artcraft-test_utils" }

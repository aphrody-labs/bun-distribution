[package]
name = "worldlabs_api_client"
edition = "2024"
version = "0.0.1"
publish = false

[lib]
name = "worldlabs_api_client"
path = "src/lib.rs"

[dependencies]
errors = { path = "../artcraft-errors", package = "artcraft-errors" }
filesys = { path = "../artcraft-filesys", package = "artcraft-filesys" }
anyhow = "1.0.102"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["full"] }
uuid = "1.22.0"
wreq = { version = "6.0.0-rc.28", features = ["json", "query", "form", "multipart", "cookies", "ws", "stream", "gzip", "brotli", "zstd", "deflate"] }

[dev-dependencies]
filesys = { path = "../artcraft-filesys", package = "artcraft-filesys" }
env_logger = "0.11.9"
env = "1.0.1"
chrono = { version = "0.4.44", features = ["serde"] }
strum = { version = "0.28.0", features = ["derive"] }
test_data = { path = "../artcraft-test_data", package = "artcraft-test_data" }

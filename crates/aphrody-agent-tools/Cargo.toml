# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-agent-tools"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description            = "Concrete ToolExecutor implementations for the aphrody agent engine: a streaming sandboxed shell-exec tool and an apply_patch tool that wraps aphrody-patch. These are the real capabilities the engine's ToolRegistry exposes to the model."

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
axum = "0.8"
aphrody-toolcall = { path = "../aphrody-toolcall", features = [] }
aphrody-patch = { path = "../aphrody-patch", features = [] }
aphrody-jev = { path = "../aphrody-jev", version = "1.4.4", default-features = false, features = ["client"] }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
async-trait = "0.1.92"

[dev-dependencies]
pretty_assertions = { version = "1", features = [] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aphrody-proc = { path = "../aphrody-proc", features = ["tokio"] }
aphrody-agent-proto = { path = "../aphrody-agent-proto", features = [] }
aphrody-guard = { path = "../aphrody-guard", features = [] }
aphrody-winclean = { package = "bun-windows-winclean", path = "../../packages/bun-windows-winclean", features = [] }
aphrody-google = { path = "../aphrody-google", features = [] }
aphrody-web-service = { path = "../../toolchains/bun/src/browser/crates/service", package = "bun_browser_service", features = ["render"] }
aphrody-gemini-web = { path = "../aphrody-gemini-web", features = [] }
obscura-net = { path = "../../toolchains/bun/src/browser/crates/net", package = "bun_browser_net", features = [] }
aphrody-remote-desktop = { path = "../aphrody-remote-desktop", features = ["vnc-client"] }
aphrody-term = { path = "../aphrody-term", features = [] }
anyhow = { version = "1.0.104" }
thiserror = { version = "2.0.20" }
tokio = { version = "1.53.1", features = ["process","rt-multi-thread","macros","time","signal","sync","fs","io-util","full"] }
base64 = { version = "0.23.1" }
reqwest = { version = "0.13.5", features = ["rustls-no-provider","json","stream","form","query","charset","http2","system-proxy","blocking","cookies","gzip","brotli","deflate","socks","multipart"], default-features = false }
tracing = { version = "0.1.44" }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.189" }

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.39.6", features = ["system","disk"], default-features = false }

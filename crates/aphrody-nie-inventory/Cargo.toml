[package]
name                   = "aphrody-nie-inventory"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license-file = "../../docs/licenses/iecode/nie/LICENSE"
publish = true
description            = "IEVR (Inazuma Eleven Victory Road) reverse-engineering analysis tools — consumes binary inventory JSON for static catalog work."

[[bin]]
name = "ievr-tools"
path = "src/main.rs"

[lib]
name = "ievr_tools"
path = "src/lib.rs"

[features]
default = []
integration = [] # Legacy feature selector; aphrody-re has no integration feature.

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
aphrody-re.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
clap = { workspace = true, features = ["derive", "color", "env"] }
byteorder.workspace = true
hex.workspace = true

[package.metadata.cargo-machete]
ignored = []

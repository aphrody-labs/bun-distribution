# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-dragon-pixel-core"
description = "Deterministic Dragon Pixel combat simulation shared by the browser and Rust services."
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
publish = false

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }

# Hors du workspace racine (exclude) : la pile Bevy et le service de jeu ne pèsent plus sur le Cargo.lock racine.
[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-web-game-server"
description = "Local-authoritative multiplayer room service for Dragon Pixel."
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
publish = false

[[bin]]
name = "aphrody-web-game-server"
path = "src/main.rs"

[dependencies]
aphrody-dragon-pixel-core = { path = "../dragon-pixel-core" }
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "http2", "ws"] }
futures-util = "0.3"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tokio-tungstenite = "0.30"

# Hors du workspace racine (exclude) : la pile Bevy et le service de jeu ne pèsent plus sur le Cargo.lock racine.
[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[package]
name = "aphrody-dragon-pixel-wasm"
description = "Browser WebAssembly adapter for the shared Dragon Pixel combat simulation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aphrody-dragon-pixel-core = { path = "../dragon-pixel-core" }
serde_json.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "web", "webgpu"] }
bevy_ecs = { version = "0.19.1", default-features = false }
serde.workspace = true

[lints]
workspace = true

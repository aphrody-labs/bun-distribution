# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-dragon-pixel-wasm"
description = "Browser WebAssembly adapter for the shared Dragon Pixel combat simulation."
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aphrody-dragon-pixel-core = { path = "../dragon-pixel-core" }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "web", "webgpu"] }
bevy_ecs = { version = "0.19.1", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }

# Hors du workspace racine (exclude) : la pile Bevy et le service de jeu ne pèsent plus sur le Cargo.lock racine.
[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "aphrody-web-service"
description = "Canonical web execution contract for Aphrody OS: OXC analysis, Bun tooling and Obscura V8 pages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
[features]
default = []
render = ["obscura-mcp/render"]
stealth = ["render", "obscura-mcp/stealth", "obscura/stealth"]

[lints]
workspace = true

[dependencies]
aphrody-web-extract.workspace = true
obscura-dom.workspace = true
obscura-mcp.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

# The in-process page fetch and the shared browser session (modules `fetch`, `session`) are
# native-only: they need sockets, threads and the Obscura engine.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
obscura.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio.workspace = true

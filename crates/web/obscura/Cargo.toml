[package]
name = "aphrody-obscura"
version = "1.4.4"
edition = "2021"
description = "Rust API for the Obscura headless browser"
readme = "README.md"
repository = "https://github.com/aphrody-labs/obscura"
license = "Apache-2.0"
[features]
default = ["api"]
api = ["obscura-browser", "obscura-net", "tokio"]
stealth = ["api", "obscura-browser/stealth"]
render = ["api", "obscura-browser/render"]

[dependencies]
obscura-browser = { workspace = true, optional = true }
obscura-net = { workspace = true, optional = true }
anyhow = { workspace = true }
tokio = { workspace = true, optional = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[[example]]
name = "basic"
required-features = ["stealth"]

# Vendored upstream code (h4ckf0r0day/obscura): not held to the aphrody lint
# set, so the workspace -D warnings gate does not rewrite upstream style.
[lints.rust]
warnings = "allow"
unexpected_cfgs = "allow"
# `-D warnings` on the command line outranks the group above; name the groups
# upstream code actually trips so the vendored tree stays out of the gate.
unused = { level = "allow", priority = -1 }
deprecated = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[lib]
name = "obscura"

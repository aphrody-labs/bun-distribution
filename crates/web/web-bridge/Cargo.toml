# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-web-bridge"
version = "1.0.0-canary"
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description = "Aphrody Web bridge: in-process Rust content conversion, native DOM/DNS compatibility and browser subprocess."

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
aphrody-web-extract = { workspace = true }
aphrody-web-service = { workspace = true, features = ["render"] }
aphrody-translate = { workspace = true }
obscura = { workspace = true }
obscura-dom = { workspace = true }
obscura-net = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
serde          = { workspace = true }
dirs           = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest        = { workspace = true }
# Direct dep so `fetch::client` can install the `ring` provider itself. rustls
# 0.23 with the workspace `rustls-no-provider` pin PANICS at first request when
# no provider is installed ("No provider set"), which would take an MCP server
# down; `install_default` is idempotent, so installing here is a safety net over
# the startup call the binaries already make (CLAUDE.md §7).
rustls         = { workspace = true }
tokio          = { workspace = true }
serde_json     = { workspace = true, features = ["std"] }

[features]
default = []
stealth = ["obscura/stealth"]

[dev-dependencies]
tempfile       = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio          = { workspace = true }

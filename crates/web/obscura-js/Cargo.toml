[package]
name = "obscura-js"
description = "Aphrody platform crate obscura-js."
version = "1.4.4"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/obscura"

[features]
default = []
# Builds obscura-net with its stealth (wreq) HTTP client and lets scripted
# fetch()/XHR be routed through it so JS-level requests carry the same Chrome
# TLS fingerprint and client hints as stealth navigation.
stealth = ["obscura-net/stealth"]
# Builds the obscura-render layout layer and exposes real box geometry to JS
# (getBoundingClientRect, elementFromPoint, offset*), and with paint enabled,
# rasterizes screenshots. Off by default so the scraping build stays lean.
render = ["dep:obscura-render", "obscura-render/paint"]

[build-dependencies]
deno_core = "0.412"

[dependencies]
obscura-dom = { workspace = true }
obscura-net = { workspace = true }
deno_core = "0.412"
tokio = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
# document.domain must reject public suffixes (including private suffixes such
# as github.io), not just compare dotted strings.  `psl` embeds the Mozilla
# Public Suffix List and adds no runtime I/O.
psl = "2"
tracing = { workspace = true }
reqwest = { workspace = true }
html5ever = { workspace = true }
deno_error = "0.7"
base64 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
# WebCrypto (crypto.subtle) primitives. RustCrypto, pure Rust, no CMake/OpenSSL,
# and they unify on the digest 0.11 / cipher 0.5 stack already in the tree.
hmac = "0.13"
aes = { workspace = true }
aes-gcm = { workspace = true }
cbc = { version = "0.2", features = ["alloc"] }
ctr = "0.10"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
hkdf = "0.13"
# CSPRNG for getRandomValues / randomUUID (replaces Math.random).
getrandom = { workspace = true }
obscura-render = { workspace = true, optional = true }
# Vendored upstream code (h4ckf0r0day/obscura): not held to the aphrody lint
# set, so the workspace -D warnings gate does not rewrite upstream style.
[lints.rust]
warnings = "allow"
unexpected_cfgs = "allow"
# `-D warnings` on the command line outranks the group above; name the groups
# upstream code actually trips so the vendored tree stays out of the gate.
unused = { level = "allow", priority = -1 }
deprecated = "allow"
linker_messages = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }

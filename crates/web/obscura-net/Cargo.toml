[package]
name = "obscura-net"
description = "Aphrody platform crate obscura-net."
# Transitional version avoids a same-name/same-version collision with the
# retained source checkout while its MCP consumers still compile there.
version = "1.4.4"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/obscura"

[features]
default = []
stealth = ["wreq", "wreq-util", "futures-util"]

[dependencies]
obscura-ssrf = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# aphrody addition: error type of the local dns.rs module.
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
encoding_rs = { workspace = true }
tempfile = { workspace = true }
psl = "2"
cookie = { workspace = true }
futures-util = { workspace = true, optional = true }
# wreq and wreq-util are pre-release crates whose API changes between rc builds
# (CertStore moved out of `tls`, `cert_store` renamed to `tls_cert_store`, the
# Emulation builder reshuffled). A caret requirement let a fresh resolve pull a
# newer, incompatible rc and broke `cargo build --features stealth` (issue #234).
# Pin exact versions so the build always resolves to the API wreq_client.rs targets.
wreq-util = { version = "=3.0.0-rc.14", optional = true, features = ["emulation-compression"] }

[dev-dependencies]
socket2 = "0.6"
# TLS fixtures for the configured-roots tests: rcgen mints a throwaway CA + leaf,
# tokio-rustls serves one HTTPS response with them. Pinned to the ring
# provider so the test binary has a single rustls CryptoProvider (reqwest's
# rustls also uses ring; adding aws-lc-rs would make provider auto-selection
# panic). The workspace pin is rcgen 0.14 with `crypto`, `pem` and `ring` only.
rcgen = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# `prefix-symbols` renames BoringSSL exports to avoid clashes with system OpenSSL,
# but the renaming is only correct on Linux and Android (per wreq's README).
# Enabling it on other platforms produces unresolved `build_script_main_*`
# symbols at link time (see issue #39).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wreq = { version = "=6.0.0-rc.31", optional = true, features = ["prefix-symbols", "socks", "stream", "gzip", "brotli", "deflate", "zstd"] }

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
wreq = { version = "=6.0.0-rc.31", optional = true, features = ["socks", "stream", "gzip", "brotli", "deflate", "zstd"] }

# Vendored upstream code (h4ckf0r0day/obscura): not held to the aphrody lint
# set, so the workspace -D warnings gate does not rewrite upstream style.
[lints.rust]
warnings = "allow"
unexpected_cfgs = "allow"
# `-D warnings` on the command line outranks the group above; name the groups
# upstream code actually trips so the vendored tree stays out of the gate.
unused = { level = "allow", priority = -1 }
deprecated = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }

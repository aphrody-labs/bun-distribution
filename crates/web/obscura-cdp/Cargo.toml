[package]
name = "obscura-cdp"
description = "Aphrody platform crate obscura-cdp."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/h4ckf0r0day/obscura"

[features]
default = []
stealth = ["obscura-browser/stealth"]
# Enable Page.captureScreenshot via obscura-render. Propagates render to
# obscura-browser so Page::screenshot is available.
render = ["obscura-browser/render", "dep:image", "dep:png"]

[dependencies]
obscura-dom = { workspace = true }
obscura-browser = { workspace = true }
obscura-js = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = "0.30"
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
futures-util = "0.3"
obscura-net = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
png = { version = "0.18", optional = true }

[target.'cfg(target_env = "gnu")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = "0.30"
futures-util = "0.3"

# Vendored upstream code (h4ckf0r0day/obscura): not held to the aphrody lint
# set, so the workspace -D warnings gate does not rewrite upstream style.
[lints.rust]
warnings = "allow"
unexpected_cfgs = "allow"
# `-D warnings` on the command line outranks the group above; name the groups
# upstream code actually trips so the vendored tree stays out of the gate.
unused = { level = "allow", priority = -1 }
deprecated = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }

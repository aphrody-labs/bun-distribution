[package]
name = "obscura-mcp"
description = "Aphrody platform crate obscura-mcp."
version = "0.1.0"
build = "build.rs"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/h4ckf0r0day/obscura"

[features]
default = []
stealth = ["obscura-browser/stealth", "obscura-net/stealth"]
render = ["obscura-browser/render", "dep:base64"]

[dependencies]
aphrody-web-extract = { workspace = true }
obscura-browser = { workspace = true }
obscura-dom = { workspace = true }
obscura-net = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true, optional = true }

# Vendored upstream code (h4ckf0r0day/obscura): not held to the aphrody lint
# set, so the workspace -D warnings gate does not rewrite upstream style.
[lints.rust]
warnings = "allow"
unexpected_cfgs = "allow"
# `-D warnings` on the command line outranks the group above; name the groups
# upstream code actually trips so the vendored tree stays out of the gate.
unused = { level = "allow", priority = -1 }
deprecated = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }

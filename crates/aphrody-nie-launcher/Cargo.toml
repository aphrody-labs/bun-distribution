[package]
name = "aphrody-nie-launcher"
description = "Native Rust launcher, save editor, and mod package manager for Inazuma Eleven: Victory Road"
version.workspace = true
edition.workspace = true
license-file = "../../docs/licenses/iecode/nie/LICENSE"
publish = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aphrody-nie-save = { workspace = true, features = ["serde"] }
aphrody-nie-formats = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"] }
uuid = { workspace = true, features = ["v4", "serde"] }
base64 = { version = "0.22.1" }
hex.workspace = true
sha2 = { version = "0.10" }
hmac.workspace = true
pbkdf2.workspace = true
aes-gcm.workspace = true
aes.workspace = true
byteorder.workspace = true
rusqlite = { workspace = true }
rand = { workspace = true, features = ["thread_rng", "std_rng"] }

[dev-dependencies]
tempfile = { workspace = true }

# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-ocr-vlm"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description            = "llama.cpp VLM backends for Aphrody OCR: one-shot and resident document transcription."

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
aphrody-proc = { path = "../aphrody-proc", features = [] }
aphrody-infer = { path = "../aphrody-infer", features = ["onnx"] }
aphrody-models = { path = "../aphrody-models", features = [] }
aphrody-ocr-core = { path = "../aphrody-ocr-core", features = [] }
reqwest = { version = "0.13.5", features = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"

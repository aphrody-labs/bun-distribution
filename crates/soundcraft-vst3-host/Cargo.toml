[package]
name = "soundcraft-vst3-host"
description = "SoundCraft VST3 plugin host: scans, loads and runs third-party VST3 plugins behind the safe soundcraft-dsp Plugin trait (an isolated unsafe FFI crate)"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/storytold/soundcraft"

[dependencies]
soundcraft-dsp = { path = "../soundcraft-dsp" }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
log = "0.4"

[[test]]
name = "editor_main_thread"
harness = false

[[test]]
name = "module_exit"
harness = false

[[test]]
name = "module_exit_live_instance"
harness = false

[[test]]
name = "module_exit_worker_thread"
harness = false

[[test]]
name = "module_exit_shutdown"
harness = false

# An isolated unsafe helper crate (craftrules never-crash), like soundcraft-clap-host: this crate
# opts out of the workspace `unsafe_code = "forbid"` for itself only. It denies unsafe everywhere
# and allows it solely on the FFI module (`src/ffi.rs`). The rest mirrors `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

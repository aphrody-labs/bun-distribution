[package]
name = "effectcraft-host"
description = "Builds a fully wired EffectCraft session: media decoding (FilmCraft codecs), importer, the expression engine and scripting"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-engine = { path = "../effectcraft-engine" }
effectcraft-project = { path = "../effectcraft-project" }
effectcraft-media = { path = "../effectcraft-media" }
effectcraft-expr = { path = "../effectcraft-expr" }
effectcraft-script = { path = "../effectcraft-script" }
effectcraft-export = { path = "../effectcraft-export" }
effectcraft-plugin = { path = "../effectcraft-plugin" }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
effectcraft-psd = { path = "../effectcraft-psd" }
effectcraft-svg = { path = "../effectcraft-svg" }
effectcraft-pdf = { path = "../effectcraft-pdf" }
effectcraft-raster = { path = "../effectcraft-raster" }
effectcraft-time = { path = "../effectcraft-time" }
effectcraft-interchange = { path = "../effectcraft-interchange" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gif = "0.14"
exr = "1.74"
rayon = "1"

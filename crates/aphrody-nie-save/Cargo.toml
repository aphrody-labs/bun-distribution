[package]
name = "aphrody-nie-save"
description = "Déchiffrement, lecture et édition des saves IEVR (Lives format CRC32-keyed XOR)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aphrody-nie-formats = { workspace = true, default-features = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["std", "derive"], optional = true }

[features]
default = []
serde = ["dep:serde", "aphrody-nie-formats/serde"]
# Active le test d'intégration qui lit les saves réelles du VPS (chemin data/saves/).
# Désactivé par défaut (CI n'a pas accès aux fichiers).
real-saves = []

[dev-dependencies]
tempfile = { workspace = true }

[package]
name = "bun-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Unified Rust engine and emulator kernel: plugins, binary inspection, one Machine trait, one input, one wgpu/winit window and one CLI over every in-tree core"
repository = "https://github.com/aphrody-labs/bun-engine"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

# Every consumer selects what it shares; nothing is duplicated in another crate.
[features]
default = ["window", "nds", "nes", "gba", "psx", "host", "arm", "x86", "wii", "cartridge"]
# Nintendo DS machine on Dust with software 2D/3D rendering.
nds = ["dep:aphrody-dust-soft-2d", "dep:aphrody-dust-soft-3d"]
# Bevy scheduling of the DS core (wasm and desktop hosts).
host = ["nds", "dep:bevy_app", "dep:bevy_ecs"]
bevy-web = ["host", "bevy_app/web"]
# AArch64 firmware machine on the rdynarmic JIT.
arm = ["dep:rdynarmic"]
# Game Boy Advance on RustBoyAdvance-NG with its free BIOS.
gba = ["dep:rustboyadvance-core"]
# PlayStation on StarPSX.
psx = ["dep:starpsx-core"]
# NES on TetaNES.
nes = ["dep:tetanes-core"]
# Nintendo 3DS on Zakuro (software PICA renderer); boots CXI/CCI/CIA and converted 3DSX.
ctr = ["dep:zakuro-core", "dep:zakuro-common"]
# Nintendo Switch on Ruzu (rdynarmic JIT, null renderer with CPU framebuffer readback).
switch = ["dep:ruzu-core", "dep:ruzu-common", "dep:video_core", "dep:hid_core", "dep:log"]
# GameCube and Wii on the Gekko/Broadway interpreter.
wii = ["dep:aphrody-wii-runtime", "dep:aphrody-wii-image"]
# x86 guests on the Windows Hypervisor Platform.
x86 = ["dep:windows"]
# The single winit window and wgpu presenter.
window = ["dep:winit", "dep:wgpu", "dep:aphrody-gpu-backend", "dep:pollster"]
# Nintendo DS cartridge inspection (`bun-engine info`).
cartridge = ["aphrody-dust-core/nds-complete", "dep:serde_json"]

[dependencies]
aphrody-dust-core = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
aphrody-dust-soft-2d = { path = "../aphrody-dust-soft-2d", optional = true }
aphrody-dust-soft-3d = { path = "../aphrody-dust-soft-3d", optional = true }
bevy_app = { workspace = true, optional = true }
bevy_ecs = { workspace = true, optional = true }
rdynarmic = { path = "../rdynarmic", optional = true }
tetanes-core = { path = "../../vendor/tetanes/tetanes-core", optional = true }
starpsx-core = { path = "../../vendor/starpsx/core", optional = true }
ruzu-core = { package = "core", path = "../ruzu-core", default-features = false, optional = true }
ruzu-common = { package = "common", path = "../ruzu-common", optional = true }
video_core = { path = "../ruzu-video-core", optional = true }
hid_core = { path = "../ruzu-hid-core", optional = true }
log = { workspace = true, optional = true }
zakuro-core = { path = "../../vendor/zakuro/crates/zakuro-core", optional = true }
zakuro-common = { path = "../../vendor/zakuro/crates/zakuro-common", optional = true }
rustboyadvance-core = { path = "../../vendor/rustboyadvance-ng/core", default-features = false, optional = true }
aphrody-wii-runtime = { path = "../aphrody-wii-runtime", optional = true }
aphrody-wii-image = { path = "../aphrody-wii-image", default-features = false, optional = true }
wgpu = { workspace = true, optional = true }
winit = { workspace = true, features = ["rwh_06"], optional = true }
aphrody-gpu-backend = { path = "../aphrody-gpu-backend", optional = true }
pollster = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Hypervisor", "Win32_System_Memory"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[[bin]]
name = "bun-engine"
path = "src/bin/bun-engine.rs"
required-features = ["window", "nds", "nes", "gba", "psx", "arm", "wii", "cartridge"]

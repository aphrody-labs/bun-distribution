# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-fsindex"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
homepage = "https://github.com/aphrody-labs/aphrody"
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description            = "Persistent local-filesystem search index (SQLite FTS5), mirroring the Google desktop app's local_files.db. Metadata-only, privacy-bounded."

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
aphrody-web-source = { path = "../../toolchains/bun/packages/web/rust", version = "1.4.4" }
serde = { version = "1.0.229", features = ["derive", "std"], default-features = false }
thiserror = "2.0.20"
walkdir = "2.5.0"
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.cargo-machete]
ignored = []

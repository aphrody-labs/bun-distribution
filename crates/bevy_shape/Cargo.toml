[package]
description = "Provides primitive shape data definitions for Bevy Engine"
edition = "2024"
homepage = "https://bevy.org"
keywords = ["bevy"]
license = "MIT OR Apache-2.0"
name = "bevy_shape"
repository = "https://github.com/bevyengine/bevy"
rust-version = "1.94.0"
version = "0.20.0"

[dependencies]
bevy_math = { path = "../bevy_math", version = "0.20.0", default-features = false }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0", default-features = false, features = [
  "glam",
], optional = true }

arrayvec = { version = "0.7", default-features = false }
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = [
  "from",
  "into",
] }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }
approx = { version = "0.5", default-features = false, optional = true }
rand = { version = "0.10", default-features = false, optional = true }
rand_distr = { version = "0.6", optional = true }

[dev-dependencies]
approx = "0.5"
# Enable the approx feature when testing.
bevy_math = { path = "../bevy_math", version = "0.20.0", default-features = false, features = [
  "approx",
] }
# Supply rngs for examples and tests
chacha20 = { version = "0.10.0", default-features = false, features = ["rng"] }
rand = "0.10"

[features]
alloc = ["bevy_math/alloc", "rand_distr?/alloc"]
default = ["rand", "std"]
std = [
  "alloc",
  "bevy_math/std",
  "bevy_reflect?/std",
  "derive_more/std",
  "rand?/std",
  "rand_distr?/std",
  "serde?/std",
]

serialize = ["bevy_math/serialize", "dep:serde"]
# Enable approx for glam types to approximate floating point equality comparisons and assertions
approx = ["bevy_math/approx", "dep:approx"]
# Enable bevy_reflect (requires alloc)
bevy_reflect = ["alloc", "bevy_math/bevy_reflect", "dep:bevy_reflect"]
# Enable the rand dependency for shape_sampling
rand = ["bevy_math/rand", "dep:rand", "dep:rand_distr"]

# Bevy's workspace lints (upstream [workspace.lints]) merged with the Bun OS root lints at
# their stricter level; Cargo cannot inherit two lint sets, so they are explicit per crate.
[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_must_use = "deny"
non_ascii_idents = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
  "--generate-link-to-definition",
  "--generate-macro-expansion",
  "-Zunstable-options",
]

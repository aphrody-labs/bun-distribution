[package]
name = "bevy_picking"
version = "0.20.0"
edition = "2024"
description = "Provides screen picking functionality for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"

[features]
# Provides a mesh picking backend
mesh_picking = ["dep:bevy_mesh", "dep:crossbeam-channel"]
custom_cursor = ["bevy_window/custom_cursor"]

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.20.0" }
bevy_asset = { path = "../bevy_asset", version = "0.20.0" }
bevy_derive = { path = "../bevy_derive", version = "0.20.0" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0" }
bevy_input = { path = "../bevy_input", version = "0.20.0" }
bevy_math = { path = "../bevy_math", version = "0.20.0" }
bevy_mesh = { path = "../bevy_mesh", version = "0.20.0", optional = true }
bevy_camera = { path = "../bevy_camera", version = "0.20.0" }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0" }
bevy_shape = { path = "../bevy_shape", version = "0.20.0" }
bevy_time = { path = "../bevy_time", version = "0.20.0" }
bevy_transform = { path = "../bevy_transform", version = "0.20.0" }
bevy_window = { path = "../bevy_window", version = "0.20.0" }
bevy_platform = { path = "../bevy_platform", version = "0.20.0", default-features = false, features = [
  "std",
] }

# other
crossbeam-channel = { version = "0.5", optional = true }
uuid = { version = "1.21.0", features = ["v4"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.
uuid = { version = "1.21.0", default-features = false, features = ["js"] }

# Bevy's workspace lints (upstream [workspace.lints]) merged with the Bun OS root lints at
# their stricter level; Cargo cannot inherit two lint sets, so they are explicit per crate.
[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_must_use = "deny"
non_ascii_idents = "warn"

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options"]
all-features = true

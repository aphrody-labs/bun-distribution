[package]
name = "effectcraft-effects"
description = "Effect registry (specs, parameters, categories) and CPU implementations of the effects library"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-geom = { path = "../effectcraft-geom", version = "0.9.2" }
effectcraft-color = { path = "../effectcraft-color", version = "0.9.2" }
effectcraft-keyframe = { path = "../effectcraft-keyframe", version = "0.9.2" }
effectcraft-project = { path = "../effectcraft-project", version = "0.9.2" }
effectcraft-raster = { path = "../effectcraft-raster", version = "0.9.2" }
effectcraft-segment = { path = "../effectcraft-segment", version = "0.9.2" }
effectcraft-track = { path = "../effectcraft-track", version = "0.9.2" }
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"

[package]
name = "bevy_gltf"
version = "0.20.0"
edition = "2024"
description = "Bevy Engine GLTF loading"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
pbr_transmission_textures = []
pbr_multi_layer_material_textures = []
pbr_anisotropy_texture = []
pbr_specular_textures = []

[dependencies]
# bevy
bevy_animation = { path = "../bevy_animation", version = "0.20.0", optional = true, features = [
  "bevy_mesh",
] }
bevy_app = { path = "../bevy_app", version = "0.20.0" }
bevy_asset = { path = "../bevy_asset", version = "0.20.0" }
bevy_color = { path = "../bevy_color", version = "0.20.0" }
bevy_curve = { path = "../bevy_curve", version = "0.20.0" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0" }
bevy_image = { path = "../bevy_image", version = "0.20.0" }
bevy_light = { path = "../bevy_light", version = "0.20.0" }
bevy_camera = { path = "../bevy_camera", version = "0.20.0" }
bevy_math = { path = "../bevy_math", version = "0.20.0" }
bevy_mesh = { path = "../bevy_mesh", version = "0.20.0", features = [
  "serialize",
  "morph",
  "bevy_mikktspace",
] }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0" }
bevy_material = { path = "../bevy_material", version = "0.20.0" }
bevy_world_serialization = { path = "../bevy_world_serialization", version = "0.20.0" }
bevy_transform = { path = "../bevy_transform", version = "0.20.0" }
bevy_tasks = { path = "../bevy_tasks", version = "0.20.0" }
bevy_platform = { path = "../bevy_platform", version = "0.20.0", default-features = false, features = [
  "std",
  "serialize",
] }

# other
gltf = { version = "1.4.0", default-features = false, features = [
  "KHR_lights_punctual",
  "KHR_materials_transmission",
  "KHR_materials_ior",
  "KHR_materials_specular",
  "KHR_materials_volume",
  "KHR_materials_unlit",
  "KHR_materials_emissive_strength",
  "KHR_texture_transform",
  "extras",
  "extensions",
  "names",
  "utils",
] }
async-lock = { version = "3.0", default-features = false }
thiserror = { version = "2", default-features = false }
base64 = { version = "0.23.0", default-features = false, features = ["std"] }
fixedbitset = "0.5"
itertools = "0.14"
percent-encoding = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
smallvec = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
wgpu-types = { version = "30", default-features = false }

[dev-dependencies]
bevy_log = { path = "../bevy_log", version = "0.20.0" }

# Bevy's workspace lints (upstream [workspace.lints]) merged with the Bun OS root lints at
# their stricter level; Cargo cannot inherit two lint sets, so they are explicit per crate.
[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_must_use = "deny"
non_ascii_idents = "warn"

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

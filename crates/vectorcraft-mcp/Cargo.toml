[package]
name = "vectorcraft-mcp"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "VectorCraft MCP server: JSON-RPC 2.0 over stdio, driving a running app or a headless session"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
# VectorCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
vectorcraft-engine = { path = "../vectorcraft-engine", version = "0.10.0" }
vectorcraft-render = { path = "../vectorcraft-render", version = "0.10.0" }
vectorcraft-svg = { path = "../vectorcraft-svg", version = "0.10.0" }
vectorcraft-format = { path = "../vectorcraft-format", version = "0.10.0" }
vectorcraft-tools = { path = "../vectorcraft-tools", version = "0.10.0" }
vectorcraft-geom = { path = "../vectorcraft-geom", version = "0.10.0" }
vectorcraft-doc = { path = "../vectorcraft-doc", version = "0.10.0" }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }

[dev-dependencies]
vectorcraft-testkit = { path = "../vectorcraft-testkit" }
proptest = "1"
socket2 = "0.6"

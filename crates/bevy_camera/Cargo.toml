[package]
name = "bevy_camera"
version = "0.20.0"
edition = "2024"
description = "Provides a camera abstraction for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.20.0" }
bevy_asset = { path = "../bevy_asset", version = "0.20.0" }
bevy_image = { path = "../bevy_image", version = "0.20.0" }
bevy_mesh = { path = "../bevy_mesh", version = "0.20.0" }
bevy_math = { path = "../bevy_math", version = "0.20.0" }
bevy_shape = { path = "../bevy_shape", version = "0.20.0" }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0", features = [
  "wgpu-types",
] }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0" }
bevy_transform = { path = "../bevy_transform", version = "0.20.0" }
bevy_derive = { path = "../bevy_derive", version = "0.20.0" }
bevy_utils = { path = "../bevy_utils", version = "0.20.0" }
bevy_color = { path = "../bevy_color", version = "0.20.0", features = [
  "serialize",
] }
bevy_window = { path = "../bevy_window", version = "0.20.0" }

# other
wgpu-types = { version = "30", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }
downcast-rs = { version = "2", default-features = false, features = ["std"] }
derive_more = { version = "2", default-features = false, features = ["from"] }
smallvec = { version = "1", default-features = false, features = ["const_new"] }

[dev-dependencies]
bevy_scene = { path = "../bevy_scene", version = "0.20.0" }

[features]
default = []

# Bevy's workspace lints (upstream [workspace.lints]) merged with the Bun OS root lints at
# their stricter level; Cargo cannot inherit two lint sets, so they are explicit per crate.
[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_must_use = "deny"
non_ascii_idents = "warn"

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

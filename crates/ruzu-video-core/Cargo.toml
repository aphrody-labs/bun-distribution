[package]
name = "video_core"
version.workspace = true
edition.workspace = true

[features]
metal-spirv-validation = ["dep:spirv-cross2"]

[dependencies]
aphrody-switch = { path = "../aphrody-switch" }
common.workspace = true
ruzu_core = { package = "core", path = "../ruzu-core" }
shader_recompiler.workspace = true
gl.workspace = true
log = { version = "0.4.28", default-features = false }
thiserror = { version = "2" }
anyhow = { version = "1" }
ash.workspace = true
vk-mem.workspace = true
raw-window-handle.workspace = true
parking_lot.workspace = true
rspirv.workspace = true
spirv.workspace = true
bitflags.workspace = true
bytemuck.workspace = true
libc = "0.2"
smallvec = { version = "1", features = ["const_generics"] }
# rxbyak = { path = "../../externals/rxbyak" }  # externals/ not present in the iecode source tree

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = { version = "0.6.3" }
objc2-metal.workspace = true
objc2-quartz-core.workspace = true
objc2-foundation.workspace = true
spirv-cross2 = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
spirv-cross2.workspace = true

[build-dependencies]
cc = "1"
pkg-config = "0.3"

# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-wireguard"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/aphrody"
description = "Native WireGuard for Aphrody: keys, wg-quick configuration, Linux kernel/userspace and WireGuardNT backends, private tunnel inventory."

[dependencies]
aphrody-proc = { path = "../aphrody-proc", version = "1.4.4", features = [] }
base64 = "0.23.1"
getrandom = "0.4"
ipnet = { version = "2.12", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"], default-features = false }
serde = { version = "1.0.229", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zip = { version = "8.6.0", features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[target.'cfg(unix)'.dependencies]
defguard_wireguard_rs = { version = "0.12.2", default-features = false }

[target.'cfg(windows)'.dependencies]
wireguard-nt = { version = "0.5" }

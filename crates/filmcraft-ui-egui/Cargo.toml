[package]
name = "filmcraft-ui-egui"
description = "The FilmCraft egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
craft-ui = { path = "../craft-ui", version = "0.1.0", features = ["serde"] }
filmcraft-time = { path = "../filmcraft-time" }
filmcraft-geom = { path = "../filmcraft-geom" }
filmcraft-color = { path = "../filmcraft-color" }
filmcraft-frame = { path = "../filmcraft-frame" }
filmcraft-media = { path = "../filmcraft-media" }
filmcraft-project = { path = "../filmcraft-project" }
filmcraft-tts = { path = "../filmcraft-tts" }
filmcraft-edit = { path = "../filmcraft-edit" }
filmcraft-render = { path = "../filmcraft-render" }
filmcraft-text = { path = "../filmcraft-text" }
filmcraft-audio-dsp = { path = "../filmcraft-audio-dsp" }
filmcraft-engine = { path = "../filmcraft-engine" }
filmcraft-export = { path = "../filmcraft-export" }
filmcraft-gpu = { path = "../filmcraft-gpu" }
filmcraft-scopes = { path = "../filmcraft-scopes" }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
rayon = "1"
web-time = "1"
unicode-bidi = "0.3.18"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
pollster = "0.4"
filmcraft-codecs = { path = "../filmcraft-codecs" }
filmcraft-platform = { path = "../filmcraft-platform" }
filmcraft-interchange = { path = "../filmcraft-interchange" }
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }

[build-dependencies]
serde_json = "1"
toml = "1"

[package]
name = "deckcraft-render"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DeckCraft renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[dependencies]
deckcraft-geom = { path = "../deckcraft-geom", version = "0.6.1" }
deckcraft-color = { path = "../deckcraft-color", version = "0.6.1" }
craft-metafile = { path = "../craft-metafile", version = "0.6.1" }
deckcraft-model = { path = "../deckcraft-model", version = "0.6.1" }
deckcraft-fonts = { path = "../deckcraft-fonts", version = "0.6.1" }
deckcraft-text = { path = "../deckcraft-text", version = "0.6.1" }
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
log = "0.4"
kurbo = { version = "0.13", features = ["serde"] }
skrifa = "0.47"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { version = "0.2", features = ["multithreading"] }

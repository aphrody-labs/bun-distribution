[package]
# crate was originally published as bevy-settings and can't be renamed on crates.io
name = "bevy-settings"
version = "0.20.0"
edition = "2024"
description = "User settings framework for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.20.0" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0" }
bevy_ecs_macros = { path = "../bevy_ecs/macros", version = "0.20.0" }
bevy_log = { path = "../bevy_log", version = "0.20.0" }
bevy_platform = { path = "../bevy_platform", version = "0.20.0" }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0" }
bevy_tasks = { path = "../bevy_tasks", version = "0.20.0" }
bevy_time = { path = "../bevy_time", version = "0.20.0" }

serde = "1.0.217"
thiserror = "2.0.18"
toml = { version = "1.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", default-features = false, features = [
  "Window",
  "Storage",
] }

[features]
default = []

# Bevy's workspace lints (upstream [workspace.lints]) merged with the Bun OS root lints at
# their stricter level; Cargo cannot inherit two lint sets, so they are explicit per crate.
[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_must_use = "deny"
non_ascii_idents = "warn"

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition"]
all-features = true

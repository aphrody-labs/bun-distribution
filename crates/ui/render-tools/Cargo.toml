# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-render3d"
description = "Native 3D for Aphrody agents: glTF/OBJ inspection, M3 scene modelling, GPU/CPU rendering to PNG, GLB export and live native views, as a kernel subsystem."
version = "1.0.0-canary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aphrody-m3-tokens = { workspace = true }
aphrody-render = { workspace = true, features = ["gpu"] }
aphrody-subsystem = { workspace = true }
aphrody-softraster = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# The `aphrody-render3d-mcp` plugin binary: `aphrody-kernel serve` (aphrody-os, a lower layer)
# spawns it instead of linking this crate.
aphrody-kernel = { workspace = true }
anyhow = { workspace = true }

[[bin]]
name = "aphrody-render3d-mcp"
path = "src/bin/aphrody-render3d-mcp.rs"

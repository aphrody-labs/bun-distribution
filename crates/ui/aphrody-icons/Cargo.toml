[package]
name = "aphrody-icons"
version = "1.0.0-canary"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Material Design Icons & Symbols (Web Fonts, CSS, JSON) as a workspace crate"
publish = false

[features]
default = []
serde = ["dep:serde"]
# Pure-Rust variable-font instancing + pixel-perfect SVG path generation.
# Pulls in `std` (the crate is `no_std` by default); keep it out of the default
# feature set so every other consumer keeps the light, embed-only build.
svg = ["dep:aphrody-svg", "dep:skrifa", "dep:read-fonts", "dep:woff2", "dep:thiserror"]

[dependencies]
base64.workspace = true
serde = { workspace = true, optional = true }
aphrody-svg = { workspace = true, optional = true, features = ["glyph"] }
skrifa = { workspace = true, optional = true }
read-fonts = { workspace = true, optional = true }
woff2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
# Pixel parity against Google exports goes through the shared rasterizer/diff.
aphrody-svg = { workspace = true, features = ["raster"] }

[lints]
workspace = true

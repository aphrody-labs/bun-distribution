# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-render"
version = "1.0.0-canary"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description = "Unified Aphrody native renderer contract: M3 layout, 2D GPU backends and CPU fallback."

[features]
default = ["cpu", "parallel"]
cpu = []
# Multi-threaded CPU 3D rasterization (row bands + per-instance vertex
# stage). Output is bit-identical with or without it.
parallel = ["dep:rayon"]
# `gpu` is the single real backend switch: a headless wgpu offscreen pipeline
# used for parity testing and native-scene rendering. Individual backend
# names stay declarative until wgpu selects them at `request_adapter` time.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
vulkan = ["gpu"]
dx12 = ["gpu"]
metal = ["gpu"]
webgpu = ["gpu"]
webgl = ["gpu"]
all-gpu = ["vulkan", "dx12", "metal", "webgpu", "webgl"]

[lints]
workspace = true

[dependencies]
aphrody-m3-tokens = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
png = { workspace = true }
fontdue = { workspace = true }
rayon = { workspace = true, optional = true }

base64 = { workspace = true }
gltf = { workspace = true }
tobj = { workspace = true }
wgpu = { workspace = true, optional = true, features = ["wgsl", "dx12", "vulkan", "metal", "webgpu", "webgl"] }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "frame"
harness = false

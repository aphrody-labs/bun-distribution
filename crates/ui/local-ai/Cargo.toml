# SPDX-License-Identifier: Apache-2.0
#
# Toolkit-free local-AI model hub. Owns the desktop-facing view of the model store (catalog,
# installed models, recommendations, verification, resumable pulls) by calling `aphrody-models`
# in process. Adapters (Tauri, COSMIC, egui, web) live in their own crates and only translate.

[package]
name = "aphrody-local-ai"
description = "Toolkit-free local-AI model hub for Aphrody GUIs: typed, in-process access to the model catalog, store, hardware profile and resumable pulls."
version = "1.0.0-canary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
[lints]
workspace = true

[dependencies]
aphrody-models = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

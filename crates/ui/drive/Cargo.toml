# SPDX-License-Identifier: FSL-1.1-ALv2
#
# aphrody-drive: Aphrody Drive, the file explorer of Aphrody OS, as a Tauri 3 plugin hosted by
# the desktop (crates/ui/app). Derived from the Spacedrive desktop app (drive/apps/tauri).
# The explorer core runs out of process (`sd-daemon`, built from the drive/ workspace) and is
# reached over its local newline-delimited JSON socket, so this crate never links the core.

[package]
name = "aphrody-drive"
description = "Aphrody Drive, the Aphrody OS file explorer: Tauri 3 plugin that supervises the sd-daemon core and bridges it to the explorer webview."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Derived from the FSL-licensed Spacedrive source in `drive/`. This is deliberately not inherited
# from the Apache-2.0 root workspace.
license = "FSL-1.1-ALv2"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
# Tauri plugin convention: `links` names the plugin, tauri-build reads its permission files
# through `DEP_APHRODY_DRIVE_PERMISSION_FILES_PATH`.
links = "aphrody-drive"

[lints]
workspace = true

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { workspace = true, features = ["build"] }

[dependencies]
aphrody-kernel = { workspace = true }
aphrody-subsystem = { workspace = true }
tauri = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
open = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
swift-rs = { workspace = true, features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = { workspace = true }

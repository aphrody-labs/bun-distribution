# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-m3-tokens"
version                = "1.0.0-canary"
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Material Design 3 baseline design tokens: color roles, type scale, elevation, motion."

[lints]
workspace = true

[features]
# `std` enables String-returning helpers (CSS export).  Without this feature
# the crate is fully `no_std` + `no_alloc` — safe on wasm32-unknown-unknown,
# embedded, and every other target.
default = ["std"]
std     = ["dep:base64"]
embedded-fonts = []
# PNG/JPEG decode for `image::decode_image` / `image::source_color_from_image_bytes`.
image   = ["std", "dep:image"]

[dependencies]
base64 = { workspace = true, optional = true }
image  = { workspace = true, optional = true, features = ["png", "jpeg"] }

[dev-dependencies]
serde      = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }

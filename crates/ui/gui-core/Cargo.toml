[package]
name = "aphrody-gui-core"
repository.workspace = true
version = "1.0.0-canary"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Neutral GUI abstractions for Aphrody OS: WindowHost, SurfaceProvider, ThemeProvider, KernelBridge"

[lints]
workspace = true

[dependencies]
aphrody-m3-tokens = { workspace = true, features = ["serde"] }

# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-tauri-m3"
description = "Material Design 3 for native Tauri v2 apps: M3 sheets rendered in Rust, the OS accent colour as dynamic-colour seed, and the window surface kept in the scheme."
version = "1.0.0-canary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
# Tauri plugin convention: tauri-build reads the permission files through
# `DEP_APHRODY_TAURI_M3_PERMISSION_FILES_PATH`.
links = "aphrody-tauri-m3"

[lints]
workspace = true

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
aphrody-m3-tokens = { workspace = true }
serde = { workspace = true }
tauri = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

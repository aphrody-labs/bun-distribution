# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-native"
description = "Host hardware topology and monotonic clock probes for Aphrody."
version = "1.4.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["hardware", "topology", "cuda", "system"]
categories = ["hardware-support"]
publish = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# The CUDA driver is loaded at run time so the crate builds and runs on hosts without CUDA.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
libloading = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation"] }

[package]
name = "vectorcraft-eps"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "VectorCraft Encapsulated PostScript: a hand-written EPS writer (PostScript Level 2 and 3) with TIFF previews"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
# VectorCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
vectorcraft-geom = { path = "../vectorcraft-geom" }
vectorcraft-color = { path = "../vectorcraft-color" }
vectorcraft-doc = { path = "../vectorcraft-doc" }
vectorcraft-effects = { path = "../vectorcraft-effects" }
vectorcraft-brush = { path = "../vectorcraft-brush" }
vectorcraft-text = { path = "../vectorcraft-text" }
vectorcraft-metafile = { path = "../vectorcraft-metafile" }
vectorcraft-pdf = { path = "../vectorcraft-pdf" }
vectorcraft-render = { path = "../vectorcraft-render" }
kurbo = { version = "0.13", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
vectorcraft-testkit = { path = "../vectorcraft-testkit" }

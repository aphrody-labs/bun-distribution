[package]
name = "vectorcraft-geom"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "VectorCraft geom"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
# VectorCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"

[dev-dependencies]
vectorcraft-testkit = { path = "../vectorcraft-testkit" }
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

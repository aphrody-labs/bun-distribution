[package]
name = "grok_api_client"
edition = "2024"
version = "0.0.1"
publish = false

[lib]
name = "grok_api_client"
path = "src/lib.rs"

[dependencies]
errors = { path = "../artcraft-errors", package = "artcraft-errors" }
log = "0.4.29"
reqwest = { version = "0.12.23", default-features = false, features = ["charset", "http2", "system-proxy", "json", "cookies", "rustls-tls", "gzip", "multipart"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = "1.0.149"

[dev-dependencies]
anyhow = "1.0.102"
env_logger = "0.11.9"
test_data = { path = "../artcraft-test_data", package = "artcraft-test_data" }
tokio = { version = "1", features = ["full"] }

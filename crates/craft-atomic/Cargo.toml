[package]
name = "craft-atomic"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true
repository = "https://github.com/aphrody-labs/craft-libs"
description = "Crash-safe atomic file writing and replacement for the Craft suite"
workspace = "../.."

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { workspace = true, features = ["std", "fs"] }

[package]
name = "aphrody-kernel"
description = "The Aphrody OS privileged user-space control plane: administration, MCP tools, skills and bus events over local IPC."
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[features]
default = ["builtins"]
# The `aphrody kernel` entry point (`aphrody_kernel::cli_main`) and its built-in subsystems. Higher layers that only host one
# subsystem over the kernel transport (aphrody-web's browser plugin) disable it.
builtins = [
    "dep:anyhow",
    "dep:aphrody-bun-docs",
    "dep:aphrody-nu",
    "dep:clap",
]

[dependencies]
bun-steam = { workspace = true }
aphrody-proc = { path = "../aphrody-proc", features = ["tokio"] }
aphrody-subsystem = { path = "../aphrody-subsystem" }
aphrody-kernel-client = { path = "../aphrody-kernel-client" }
aphrody-toolchains = { path = "../aphrody-toolchains", features = [] }
aphrody-winclean = { package = "bun-windows-winclean", path = "../../packages/bun-windows-winclean", features = [] }
async-trait = "0.1.92"
gix = { version = "0.88", default-features = false, features = ["sha1", "basic", "extras", "comfort", "max-performance-safe", "revision", "index", "worktree-mutation"] }
reqwest = { version = "0.13.5", features = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full", "rt"] }
tracing = "0.1.44"
log = "0.4.34"
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
shlex = "2.0"
anyhow = { version = "1.0.104", optional = true }
aphrody-bun-docs = { path = "../aphrody-bun-docs", features = [], optional = true }
aphrody-nu = { path = "../aphrody-nu", features = [], optional = true }
clap = { version = "4.6.6", features = ["derive", "env", "color"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full", "net", "test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.189" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation","Win32_Networking_WinSock","Win32_System_Services","Win32_System_HostComputeSystem"] }

[package]
name = "vectorcraft-pathops"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "VectorCraft path operations: booleans (Pathfinder), shape builder regions, offset, outline stroke, simplify"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
# VectorCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
vectorcraft-geom = { path = "../vectorcraft-geom" }
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
linesweeper = "0.5"

[dev-dependencies]
vectorcraft-testkit = { path = "../vectorcraft-testkit" }
proptest = "1"

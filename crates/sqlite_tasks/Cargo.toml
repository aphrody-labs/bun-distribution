[package]
name = "sqlite_tasks"
edition = "2024"
version = "0.0.1"
publish = false

[lib]
name = "sqlite_tasks"
path = "src/lib.rs"

[dependencies]
enums = { path = "../artcraft-enums", package = "artcraft-enums" }
errors = { path = "../artcraft-errors", package = "artcraft-errors" }
tokens = { path = "../artcraft-tokens", package = "artcraft-tokens" }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
log = "0.4.29"
sqlx = { package = "sqlx", version = "0.7.4", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
once_cell = "1.21.4"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = "1.0.149"

[dev-dependencies]

[build-dependencies]
tempfile = "3.27.0"
sqlx = { package = "sqlx", version = "0.7.4", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }

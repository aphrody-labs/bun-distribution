[package]
name = "gridcraft-chart"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "GridCraft charts: data resolution, layout into toolkit-free primitives, sparklines and a small rasteriser"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
gridcraft-core = { path = "../gridcraft-core" }
gridcraft-model = { path = "../gridcraft-model" }
gridcraft-calc = { path = "../gridcraft-calc" }
gridcraft-numfmt = { path = "../gridcraft-numfmt" }
serde = { version = "1", features = ["derive", "rc"] }

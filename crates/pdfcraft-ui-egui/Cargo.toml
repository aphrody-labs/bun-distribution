[package]
name = "pdfcraft-ui-egui"
description = "The egui shell of PdfCraft"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Our own crates
# keep full debug info. Dependencies keep only line tables, so backtraces still
# show file and line, but debug info for the whole dependency graph stays out of
# every test binary (each UI test binary had a 500-600 MB PDB on Windows, #454).

[dependencies]
craft-ui = { path = "../craft-ui", version = "1.4.7", features = ["serde"] }
pdfcraft-fonts = { path = "../pdfcraft-fonts", version = "0.7.1" }
pdfcraft-engine = { path = "../pdfcraft-engine", version = "0.7.1" }
pdfcraft-cos = { path = "../pdfcraft-cos", version = "0.7.1" }
pdfcraft-render = { path = "../pdfcraft-render", version = "0.7.1" }
pdfcraft-model = { path = "../pdfcraft-model", version = "0.7.1" }
pdfcraft-platform = { path = "../pdfcraft-platform", version = "0.7.1" }
egui = { version = "0.36", features = ["bytemuck"] }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence", "links"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
rfd = "0.17"
png = "0.18"
base64 = "0.22"
unicode-bidi = "0.3"

[dev-dependencies]
pdfcraft-xfa = { path = "../pdfcraft-xfa" }
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
skrifa = "0.44"

[build-dependencies]
serde_json = "1"
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Control-channel tokens.
getrandom = "0.4"
# Create ▸ Clipboard (images; already in the tree through egui-winit).
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# Waits for native file pickers off the UI thread (already in the tree through wgpu).
pollster = "1.0"
# Checks that an installed fallback font parses and has the glyphs; the same skrifa egui uses.
skrifa = "0.44"

[target.'cfg(target_os = "macos")'.dependencies]
# Where the pointer is while files are dragged over the window (winit doesn't say): safe AppKit
# calls only. All three are already in the tree through arboard and rfd.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry"] }
# A plain fsync where a volume refuses the full flush `sync_all` asks for (SMB, FUSE); already in
# the tree through pdfcraft-cli.
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# Auto interface language: the Windows display language, without starting a process.
sys-locale = "0.3"
# Region ▸ Measurement system for the default Units, read from the registry without starting reg.exe.
winsafe = { version = "0.0.29", default-features = false, features = ["advapi"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rfd = { workspace = true, features = ["file-handle-inner"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "HtmlIFrameElement", "HtmlImageElement", "HtmlCollection", "Node", "EventTarget"] }

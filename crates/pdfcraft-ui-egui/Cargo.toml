[package]
name = "pdfcraft-ui-egui"
description = "The egui shell of PdfCraft"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Our own crates
# keep full debug info. Dependencies keep only line tables, so backtraces still
# show file and line, but debug info for the whole dependency graph stays out of
# every test binary (each UI test binary had a 500-600 MB PDB on Windows, #454).

[dependencies]
craft-ui = { path = "../craft-ui", version = "0.1.0", features = ["serde"] }
pdfcraft-fonts = { path = "../pdfcraft-fonts", version = "0.7.0" }
pdfcraft-engine = { path = "../pdfcraft-engine", version = "0.7.0" }
pdfcraft-cos = { path = "../pdfcraft-cos", version = "0.7.0" }
pdfcraft-render = { path = "../pdfcraft-render", version = "0.7.0" }
pdfcraft-model = { path = "../pdfcraft-model", version = "0.7.0" }
pdfcraft-platform = { path = "../pdfcraft-platform", version = "0.7.0" }
egui = { version = "0.36", features = ["bytemuck"] }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence", "links"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
rfd = "0.17"
png = "0.18"
base64 = "0.22"
unicode-bidi = "0.3"

[dev-dependencies]
pdfcraft-xfa = { path = "../pdfcraft-xfa", version = "0.7.0" }
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
skrifa = "0.44"

[build-dependencies]
serde_json = "1"
toml = "1"

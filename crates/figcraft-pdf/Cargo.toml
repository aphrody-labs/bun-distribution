[package]
name = "figcraft-pdf"
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "FigCraft PDF export (krilla): vector shapes, gradients, embedded images, aligned strokes as outlines, clips, masks, blend modes, real selectable text, effects as rasters, print options (bleed, marks, page boxes, CMYK)"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
# Style lints from newer toolchains that fight index-heavy pixel code.
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
# FigCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Never crash). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
figcraft-geom = { path = "../figcraft-geom", version = "0.5.1" }
figcraft-color = { path = "../figcraft-color", version = "0.5.1" }
figcraft-doc = { path = "../figcraft-doc", version = "0.5.1" }
figcraft-text = { path = "../figcraft-text", version = "0.5.1" }
figcraft-render = { path = "../figcraft-render", version = "0.5.1" }
figcraft-pathops = { path = "../figcraft-pathops", version = "0.5.1" }
krilla = "0.8"
tiny-skia = "0.12"
thiserror = "2"
log = "0.4"

[dev-dependencies]
flate2 = "1"

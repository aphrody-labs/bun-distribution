# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-session"
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
homepage = "https://github.com/aphrody-labs/aphrody"
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description            = "Conversation session tracker for aphrody — turns + tool calls + token usage + cost, persisted as JSONL with atomic writes and deterministic replay; incremental mirror of external agent sessions (Antigravity CLI, Codex, Claude Code)."

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[features]
default = []
# `external::sync_into_memory` / `feed_memory`: feed synced external-agent
# records into an aphrody-memory `MemoryProvider` (the chat loop's store).
memory = ["dep:aphrody-memory"]

[dependencies]
serde = { version = "1.0.229", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full", "rt", "test-util"] }

[package.metadata.cargo-machete]
# tracing is consumed via macros (debug!/info!) only; keep it explicit so
# machete does not misfire when the crate is built without log capture.
ignored = ["tracing"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.1", features = ["process","rt-multi-thread","macros","time","signal","sync","fs","io-util","full","rt"] }
dirs = { version = "7.0.0" }
sysinfo = { version = "0.39.6", features = ["system","disk"], default-features = false }
aphrody-models = { path = "../aphrody-models", version = "1.4.4", features = [] }
aphrody-memory = { path = "../aphrody-memory", version = "1.4.4", features = [], optional = true }

[package]
name = "aphrody-torch-sys"
version = "0.83.5"
edition = "2024"
description = "Low-level FFI bindings for the LibTorch C++ API."
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
repository.workspace = true
keywords = ["pytorch", "libtorch", "ffi", "deep-learning", "machine-learning"]
publish = true
build = "build.rs"

categories = ["external-ffi-bindings", "science"]

[dependencies]
libloading = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
aphrody-bindgen = { workspace = true }

[package.metadata.cargo-machete]
ignored = [
    "anyhow",
    "aphrody-bindgen",
    "libc",
    "libloading",
]

[package]
name = "aphrody-llama-sys"
version = "1.4.4"
edition = "2024"
description = "Low-level dynamically loaded FFI bindings for llama.cpp."
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
repository.workspace = true
keywords = ["llama", "llm", "ffi", "bindings", "machine-learning"]
categories = ["external-ffi-bindings", "science"]
publish = true
build = "build.rs"

[dependencies]
libloading = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
aphrody-bindgen = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["anyhow", "aphrody-bindgen", "libc", "libloading"]

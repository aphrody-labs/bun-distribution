[package]
name = "aphrody-torch"
version = "0.83.5"
edition = "2021"
description = "Rust bindings for LibTorch with a dynamically loaded C++ shim."
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
readme = "README.md"
repository.workspace = true
keywords = ["pytorch", "libtorch", "tensor", "deep-learning", "machine-learning"]
categories = ["api-bindings", "science"]
publish = true

[dependencies]
half = { workspace = true }
image = { workspace = true, optional = true }
aphrody-torch-sys = { workspace = true }
lazy_static = { workspace = true }
libc = { workspace = true }
ndarray = { workspace = true }
rand = { workspace = true }
safetensors = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }

[features]
cuda-tests = []

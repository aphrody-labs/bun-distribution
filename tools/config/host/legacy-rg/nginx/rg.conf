# RG production gateway. The service catalog owns hosts and loopback ports.
# TLS certificates are provisioned on the VPS; no credentials live in this file.

# One host-aware audience stream for the unified RG gateway. The older split
# vhosts used 00-rg-stats.conf; this release-managed config must define it
# itself because only rg.conf is installed during atomic deployment.
log_format rg_stats escape=json
    '$time_iso8601\t$host\t$request_method\t$uri\t$status\t$body_bytes_sent\t'
    '$request_time\t$upstream_response_time\t$upstream_cache_status\t'
    '$http_referer\t$http_user_agent\t$remote_addr';
access_log /var/log/nginx/rg-stats.log rg_stats buffer=32k flush=5s;

server {
    listen 80;
    server_name rosegriffon.fr www.rosegriffon.fr api.rosegriffon.fr cdn.rosegriffon.fr achillea.rosegriffon.fr ranked.rosegriffon.fr
                azalee.rosegriffon.fr rpbey.fr www.rpbey.fr api.rpbey.fr cdn.rpbey.fr play.rpbey.fr;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:8811;
    server_name _;
    location = /health { return 200 'ok'; }
    location ^~ /storage/v1/ { proxy_pass http://127.0.0.1:8800; }
    location ^~ /realtime/v1/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    server_name rosegriffon.fr www.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    client_max_body_size 512m;
    location ^~ /storage/v1/ { proxy_pass http://127.0.0.1:8800; }
    location ^~ /realtime/v1/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location ~ ^/llms?(-full)?\.(txt|md|html)$ {
        root /srv/rg/shared/cron/seo;
        try_files $uri @rg_website;
    }
    location @rg_website {
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name api.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/api.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rosegriffon.fr/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name cdn.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/cdn.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.rosegriffon.fr/privkey.pem;
    client_max_body_size 512m;
    # Assets statiques publiés sur disque (rg-cron `cdn` pour /static/rg/public,
    # pipeline Azalée pour /static/azalee) : servis par nginx, jamais par rg-cdn.
    location ^~ /static/ {
        root /var/www/cdn;
        gzip_static on;
        brotli_static on;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # Content-addressed uploads that rg-cdn (/upload) stores in /var/www/cdn/images.
    location ~* "^/[a-f0-9]{16}\.(png|jpg|jpeg|webp|gif|svg)$" {
        root /var/www/cdn/images;
        expires 365d;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @rg_cdn;
    }
    location @rg_cdn {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Inazuma Eleven Cross assets extracted to disk.
    location ^~ /cross/ {
        alias /var/www/cdn/cross/;
        expires 30d;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
    }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /upload\nAllow: /\n";
    }
    # NIE and the IECode game asset origin were retired on 2026-09-25.
    location ^~ /dx11/ {
        return 410;
    }
    # NIE decoded texture/container API is unavailable until the service is redeployed.
    location ^~ /g4tx/ {
        return 410;
    }
    # Raw/source game bytes are never public; NIE is retired and these stay closed.
    location ~ ^/(raw|depot)(/|$) {
        return 404;
    }
    # VFS tree API is unavailable until NIE is redeployed.
    location ~ ^/vfs(/|$) {
        return 410;
    }
    # Converted game exports are unavailable until NIE is redeployed.
    location ~ ^/export/ {
        return 410;
    }
    # Decoded game data, models and menu renders are unavailable until NIE returns.
    location ~ ^/(cfg|typed|tex|tex-info|audio|audio-info|video|lip|menu-render|model-full|model-chr|model-edit|model-avatar|model-map|avatar|icons|ui)/ {
        return 410;
    }
    # Assembled 3D models and previews are unavailable until NIE returns.
    location ~ ^/model/[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+\.(glb|png)$ {
        return 410;
    }
    location ~ ^/(menu-tree|story-scene)(/|\.json$|$) {
        return 410;
    }
    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name achillea.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/achillea.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/achillea.rosegriffon.fr/privkey.pem;
    location ^~ /storage/v1/ { proxy_pass http://127.0.0.1:8800; }
    location ^~ /realtime/v1/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /health/check { proxy_pass http://127.0.0.1:4000; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 301 https://rosegriffon.fr/achillea; }
}

server {
    listen 443 ssl;
    server_name ranked.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/ranked.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ranked.rosegriffon.fr/privkey.pem;
    location = /health/check { proxy_pass http://127.0.0.1:4000; }
    # The ranked service is an API/WebSocket backend; its UI lives on the website.
    # Plain page loads of the root redirect there; WebSocket upgrades still pass.
    location = / {
        if ($http_upgrade = "") { return 301 https://rosegriffon.fr/achillea/ranked; }
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

# Legacy Azalee host: public storage objects are still referenced by stored
# content and by the Next image optimizer; the site itself moved to rosegriffon.fr.
server {
    listen 443 ssl;
    server_name azalee.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/azalee.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azalee.rosegriffon.fr/privkey.pem;
    location ^~ /storage/v1/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /dashboard {
        rewrite ^/dashboard/?$ https://rosegriffon.fr/admin permanent;
        rewrite ^/dashboard/(.*)$ https://rosegriffon.fr/admin/$1 permanent;
    }
    location ~ ^/(chara|skill|item|aura|passive|tactic|equipe|quete|stade|succes|niveau|drops|invocation|entraineur|capsule|gallery|textures|sons|videos|modeles|mode|keshin|tools|save|demo|cross|patch-notes|vroid|avatar)(/|$) {
        return 301 https://rosegriffon.fr/wiki$request_uri;
    }
    location = / { return 301 https://rosegriffon.fr/wiki; }
    location / { return 301 https://rosegriffon.fr$request_uri; }
}

# RPB (rpbey.fr) has no application deployed on this host: every name answers
# the maintenance page with 503 so clients and crawlers retry later.
server {
    listen 443 ssl;
    server_name rpbey.fr www.rpbey.fr api.rpbey.fr cdn.rpbey.fr play.rpbey.fr;
    ssl_certificate /etc/letsencrypt/live/rpbey.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpbey.fr/privkey.pem;
    root /var/www/maintenance-rpb;
    error_page 503 /index.html;
    location ~ ^/(bg|logo)\.webp$ { expires 1d; try_files $uri =404; }
    location = /index.html {
        internal;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }
    location / { return 503; }
}


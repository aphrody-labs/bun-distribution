# SPDX-License-Identifier: Apache-2.0
log:
  level: warn
  job:
    max_size: 16777216
    retention: 24h
runner:
  file: /data/.runner
  capacity: 1
  timeout: 720m
  shutdown_timeout: 30s
  labels:
    - aphrody-bun-linux:docker://sha256:0d1de271d32fdaf226b683c3178667d469194fc7a724bd8c60dda8ecbb1c5eec
  envs:
    BUN_EXECUTABLE: /usr/local/bin/bun
  action_shallow_clone: true
  idle_cleanup_interval: 0s
container:
  network: aphrody_default
  privileged: false
  force_pull: false
  options: --cpus=2 --memory=8g --pids-limit=512 --volume=${APHRODY_HOST_HOME}/.bun/bin/bun:/usr/local/bin/bun:ro
  valid_volumes: []
  sweep: true
cache:
  enabled: false

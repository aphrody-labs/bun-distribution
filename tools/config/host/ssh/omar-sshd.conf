# Installed as /etc/ssh/sshd_config.d/60-omar.conf on vps and dbfr. Applies to Omar only: nothing global changes.
# (`sshd -T -C user=omar,host=x,addr=92.170.252.46` shows the effective values after install.)
# Key only, from the root-owned file, no forwarding of any kind (the tunnel is WireGuard, not ssh), key fingerprint
# logged on every login (LogLevel VERBOSE, journald).
Match User omar
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no
    PermitTTY yes
    LogLevel VERBOSE
    MaxAuthTries 3
    ClientAliveInterval 60
    ClientAliveCountMax 3

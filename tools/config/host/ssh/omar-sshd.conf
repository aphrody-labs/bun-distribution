# Installed as /etc/ssh/sshd_config.d/60-omar.conf on vps and dbfr. Applies to Omar only: nothing global changes.
# (`sshd -T -C user=omar,host=x,addr=92.170.252.46` shows the effective values after install.)
# Key only, from the root-owned file, key fingerprint logged on every login (LogLevel VERBOSE, journald).
# Forwarding: remote (-R) only, onto three loopback ports, so Omar's PC can publish its SSH (22010), remote desktop
# (28795) and MCP HTTP (28793) to the host while wg1 is down (owner directive 2026-10-08). No local forwarding,
# no socket forwarding, nothing bound outside 127.0.0.1.
Match User omar
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:22010 127.0.0.1:28795 127.0.0.1:28793
    PermitOpen none
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no
    PermitTTY yes
    LogLevel VERBOSE
    MaxAuthTries 3
    ClientAliveInterval 60
    ClientAliveCountMax 3

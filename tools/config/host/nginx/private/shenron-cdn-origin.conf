# SPDX-License-Identifier: Apache-2.0
# Private disk origin for the public manga/databook projection; no protected store.
server {
    listen 80;
    server_name shenron-cdn-origin.internal;
    root /home/ubuntu/apps/shenron-cdn;
    allow 10.200.77.3;
    allow 127.0.0.1;
    deny all;
    disable_symlinks on;
    autoindex off;
    server_tokens off;

    location ~ ^/_next/static/[a-zA-Z0-9_/-]+\.(?:js|css|woff|woff2|ttf)$ {
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/assets/wiki/(?:banners|databooks)/[a-zA-Z0-9_/-]+\.(?:jpg|jpeg|png|webp|avif|gif)$ {
        rewrite ^/assets/wiki/(.*)$ /wiki/$1 last;
    }

    location ~ ^/(?:assets/(?:manga|ext|dragonballcn)|wiki/(?:databooks|banners))/[a-zA-Z0-9_/-]+\.(?:jpg|jpeg|png|webp|avif|gif)$ {
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~ ^/banners/[a-zA-Z0-9_-]+\.(?:jpg|jpeg|png|webp|avif|gif)$ {
        root /home/ubuntu/apps/shenron-cdn/site;
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / { return 404; }
}

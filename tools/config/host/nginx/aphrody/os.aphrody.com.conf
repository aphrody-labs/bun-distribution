# Active VPS vhost (sites-available), deployed 2026-10-10; TLS by Let's Encrypt webroot. Security headers: snippets/aphrody-security.inc.
server {
    listen 80;
    listen [::]:80;
    server_name os.aphrody.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://os.aphrody.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name os.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aphrody_tls:10m;
    ssl_session_timeout 1d;

    include snippets/aphrody-security.inc;

    root /var/www/os.aphrody.com;
    index index.html;

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        include snippets/aphrody-security.inc;
        try_files $uri =404;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
        include snippets/aphrody-security.inc;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include snippets/aphrody-security.inc;
        try_files $uri /index.html;
    }
}

# SPDX-License-Identifier: Apache-2.0
#
# bun.aphrody.com: static site of the Bun runtime fork aphrody-labs/bun ("Aphrody Bun": home from the fork's APHRODY.md,
# /runtime, the full documentation of docs/ under /docs with search, downloads, release notes, benchmarks and the
# installers /install, /install.sh, /install.ps1). The fork owns the generator (scripts/aphrody/site/ of aphrody-labs/bun);
# its publish.ts runs on the vps (user timer aphrody-site-publish) and flips /var/www/bun.aphrody.com/current, a symlink to
# releases/<UTC>-<sha12>, atomically. No application origin. Public and unauthenticated by design, GET and HEAD only.
# aphrody.com stays the Aphrody app page; it does not serve this site.
# TLS: Let's Encrypt webroot, certificate /etc/letsencrypt/live/aphrody.com.
# Rollback: remove sites-enabled/bun.aphrody.com, `nginx -t`, reload; releases stay on disk.

limit_req_zone $binary_remote_addr zone=aphrody_bun:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=aphrody_bun_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name bun.aphrody.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bun.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aphrody_tls:10m;
    ssl_session_timeout 1d;

    root /var/www/bun.aphrody.com/current;
    index index.html;
    autoindex off;
    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;
    error_page 404 /404.html;

    # Pages load the M3 tokens and fonts from cdn.aphrody.com, release data from api.github.com and documentation
    # media (images, video embeds) from their public hosts.
    set $bun_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.aphrody.com; font-src 'self' https://cdn.aphrody.com; img-src 'self' https: data:; media-src 'self' https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    # add_header is not inherited once a location sets its own: shared headers are repeated where needed.
    include snippets/aphrody-security.inc;
    add_header Content-Security-Policy $bun_csp always;

    limit_req zone=aphrody_bun burst=60 nodelay;
    limit_conn aphrody_bun_conn 32;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/markdown text/css application/javascript application/json application/xml image/svg+xml;

    # Installers: plain text, never cached, so `curl -fsSL https://bun.aphrody.com/install | bash` gets the current one.
    location ~ ^/(install|install\.sh|install\.ps1|bun/setup\.sh|bun/setup\.ps1)$ {
        default_type text/plain;
        types { }
        include snippets/aphrody-security.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Markdown variants of every page (/docs/<page>.md, llms.txt, llms-full.txt).
    location ~ \.md$ {
        default_type text/markdown;
        types { }
        include snippets/aphrody-security.inc;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /assets/ {
        include snippets/aphrody-security.inc;
        add_header Content-Security-Policy $bun_csp always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
        include snippets/aphrody-security.inc;
        add_header Content-Security-Policy $bun_csp always;
        add_header Cache-Control "no-cache";
    }

    location / {
        include snippets/aphrody-security.inc;
        add_header Content-Security-Policy $bun_csp always;
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri.html $uri/index.html =404;
    }
}

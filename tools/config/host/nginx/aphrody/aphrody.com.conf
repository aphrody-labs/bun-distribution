# Active VPS vhost (sites-available), deployed 2026-10-10; TLS by Let's Encrypt webroot. Security headers: snippets/aphrody-security.inc.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name aphrody.com www.aphrody.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://aphrody.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aphrody_tls:10m;
    ssl_session_timeout 1d;

    include snippets/aphrody-security.inc;
    return 301 https://aphrody.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aphrody.com;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aphrody_tls:10m;
    ssl_session_timeout 1d;

    include snippets/aphrody-security.inc;

    root /var/www/aphrody.com;
    index index.html;

    location = / {
        add_header Cache-Control "no-cache";
        include snippets/aphrody-security.inc;
        try_files /index.html =404;
    }

    location ~* ^/(app\.js|app\.css)$ {
        add_header Cache-Control "public, max-age=3600";
        include snippets/aphrody-security.inc;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        include snippets/aphrody-security.inc;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# SPDX-License-Identifier: Apache-2.0
# One public MCP transport, provided by the production Shenron API host.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.dragonballfr.com;
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.dragonballfr.com;
    ssl_certificate /etc/letsencrypt/live/mcp.dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.dragonballfr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 4m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location = / { return 308 /mcp; }
    location /mcp {
        proxy_pass http://shenron_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host dragonballfr.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location / { return 404; }
}

#
# cdn.aphrody.com: the Aphrody CDN origin. Google Fonts keep their paths here:
#   /css2 /css /icon      fonts.googleapis.com CSS APIs (M3 families and Material Symbols)
#   /s/<id>/v<N>/<file>   fonts.gstatic.com font files (immutable)
#   /s/i/...              Material Symbols SVGs
#   /h/<sha16>.<ext>      asset CDN release tree (tools/config/asset-catalog.json), immutable
#   /s/<scope>/<path>     same tree, stable URLs; /s/manifest.json lists every file
# all served by aphrody-fonts-proxy (127.0.0.1:8796, `bun fonts-serve.ts`: @aphrody/google
# fonts-proxy on the yolo-core edge cache, disk cache /home/ubuntu/apps/cdn/google; `--static` serves the
# release tree /home/ubuntu/apps/cdn/current of scripts/tools/infra/cdn.ts first). nginx adds TLS,
# HTTP/3, a shared response cache keyed per encoding and request limits on the CSS APIs.
# Other paths are reserved for the Aphrody asset namespaces and answer 404 until they ship.
#
# Install (vps):
#   sudo scripts/tools/infra/issue-cdn-certificate.sh        # HTTP-01, challenge webroot /var/www/letsencrypt
#   sudo install -d -o www-data -g www-data /var/cache/nginx/aphrody-cdn
#   sudo install -m 644 nginx/aphrody/cdn.aphrody.com.conf /etc/nginx/conf.d/cdn.aphrody.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Rollback: remove /etc/nginx/conf.d/cdn.aphrody.com.conf, `nginx -t`, reload.

proxy_cache_path /var/cache/nginx/aphrody_cdn levels=1:2 keys_zone=aphrody_cdn:32m max_size=48m inactive=30d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=aphrody_cdn_css:10m rate=30r/s;

upstream aphrody_fonts_proxy {
    server 127.0.0.1:8796;
    keepalive 32;
}

# The proxy only distinguishes brotli from identity: one cache entry per variant.
map $http_accept_encoding $aphrody_cdn_encoding {
    "~*\bbr\b"  br;
    default     "";
}

server {
    listen 80;
    listen [::]:80;
    server_name cdn.aphrody.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # QUIC sockets (reuseport) are owned by the default server, nginx/shared/00-default.conf.
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    quic_gso on;
    server_name cdn.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/cdn.aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.aphrody.com/privkey.pem;
    # GET/HEAD only: 0-RTT replay cannot change state.
    ssl_early_data on;

    server_tokens off;
    more_clear_headers Server;
    access_log off;

    # Every location below inherits these: none declares its own add_header.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Cache $upstream_cache_status always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding $aphrody_cdn_encoding;
    proxy_set_header Early-Data $ssl_early_data;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    proxy_cache aphrody_cdn;
    proxy_cache_key "$uri$is_args$args|$aphrody_cdn_encoding";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 15s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_revalidate on;
    proxy_cache_valid 403 404 1m;
    proxy_ignore_headers Set-Cookie;

    limit_req_status 429;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /health {
        proxy_cache off;
        proxy_pass http://aphrody_fonts_proxy;
    }

    location ~ ^/(css2?|icon)$ {
        limit_req zone=aphrody_cdn_css burst=60 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://aphrody_fonts_proxy;
    }

    location ^~ /s/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://aphrody_fonts_proxy;
    }

    location ^~ /h/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://aphrody_fonts_proxy;
    }

    location / {
        return 404;
    }
}

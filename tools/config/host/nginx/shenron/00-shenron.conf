# SPDX-License-Identifier: Apache-2.0
#
# Shenron (dragonballfr.com, bot.dragonballfr.com, cdn.dragonballfr.com): http-level
# state shared by the three vhosts, loaded once as /etc/nginx/conf.d/00-shenron.conf (vps).
#
# Static-first plane: every Shenron asset is a file of the CDN root /home/ubuntu/apps/shenron-cdn, the
# lossless-optimized, deduplicated tree that scripts/release/cdn-optimize.ts writes from the
# mirror /home/ubuntu/apps/shenron-cdn-src, itself pulled from dbfr by shenron-cdn-sync.timer
# (systemd/shenron/shenron-cdn-sync.service). Same layout in both trees:
#   wiki/          wiki media             (dbfr /home/ubuntu/apps/shenron/shared/site/wiki)
#   assets/        bot assets             (dbfr /home/ubuntu/apps/shenron/shared/bot/assets)
#   site/          site public/           (seeded from the deployed release)
#   site-extra/    generated public files (dbfr /home/ubuntu/apps/shenron/shared/site/public-extra)
#   _next/static/  Next build chunks      (seeded from the deployed release, additive)
# nginx serves them from disk, so Next and the bot only see dynamic requests, and the
# assets stay reachable when no Shenron release runs: an upstream that does not listen
# fails fast (connection refused) and the vhosts answer the branded maintenance page
# (HTML) or a JSON 503 (APIs).

proxy_cache_path /var/cache/nginx/shenron_images
    levels=1:2
    keys_zone=shenron_images:20m
    max_size=2000m
    inactive=7d
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/shenron_hls
    levels=1:2
    keys_zone=shenron_hls:10m
    max_size=1500m
    inactive=12h
    use_temp_path=off;

limit_req_zone $binary_remote_addr zone=shenron_api:10m rate=20r/s;

# Missing from the distribution mime.types (merged with it at http level).
types {
    application/manifest+json webmanifest;
    text/javascript mjs;
}

# Files of an rsync run in progress (shenron-cdn-sync) are never published.
map $uri $shenron_mirror_tmp {
    default 0;
    "~(^|/)(\.rsync-partial|\.~tmp~)(/|$)" 1;
}

upstream shenron_site {
    server 127.0.0.1:5011;
    keepalive 64;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

upstream shenron_bot {
    server 127.0.0.1:5006;
    keepalive 32;
}

# Session-bound responses are never served from a shared cache.
map $http_cookie $bypass_user_cache {
    default 0;
    ~*better-auth\.session_token 1;
    ~*__Secure-better-auth 1;
}

# Credentialed CORS is limited to the Shenron front hosts.
map $http_origin $shenron_cors_origin {
    default "";
    "~*^https://(dragonballfr\.com|[a-z0-9-]+\.dragonballfr\.com)$" $http_origin;
}

# Origin of a next/image request (`url` argument, still percent-encoded): a local path
# or an absolute dragonballfr.com URL. Used to redirect to the original file on the CDN
# when the Next image optimizer is not running; the CDN decodes the path itself.
map $arg_url $shenron_image_origin {
    default "";
    "~^(?:https?(?:%3A|:)(?:%2F|/){2}(?:cdn\.|www\.)?dragonballfr\.com)?(?:%2F|/)(?<path>[A-Za-z0-9_][^?#]*)$" $path;
}

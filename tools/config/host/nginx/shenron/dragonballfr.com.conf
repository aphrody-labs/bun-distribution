# SPDX-License-Identifier: Apache-2.0
#
# dragonballfr.com: static-first apex of the Shenron site (vps). A request resolves to
#   1. a file of the CDN root /home/ubuntu/apps/shenron-cdn (site public, site-extra, Next chunks, media);
#   2. otherwise the Next site (shenron-site.service, 127.0.0.1:5011) when a release runs;
#   3. otherwise the branded maintenance page (503, Retry-After; JSON 503 under /api/).
# Shared state (upstreams, zones, maps): nginx/shenron/00-shenron.conf.
# Route declared in nginx/routes.json ("dragonballfr.com").
#
# Install (vps), from tools/config/host:
#   sudo install -m 644 nginx/shenron/00-shenron.conf /etc/nginx/conf.d/00-shenron.conf
#   sudo install -m 644 nginx/shenron/dragonballfr.com.conf /etc/nginx/conf.d/dragonballfr.com.conf
#   sudo install -D -m 644 nginx/shenron/errorpages/dragonballfr/50x.html /var/www/shenron/50x.html
#   sudo nginx -t && sudo systemctl reload nginx
# Rollback: remove the installed conf files, `sudo nginx -t`, reload.

server {
    listen 80;
    listen [::]:80;
    server_name dragonballfr.com www.dragonballfr.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://dragonballfr.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    quic_gso on;
    quic_retry on;
    server_name www.dragonballfr.com;

    ssl_certificate     /etc/letsencrypt/live/dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dragonballfr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_dbfr:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
    more_set_headers 'Alt-Svc: h3=":443"; ma=86400';
    return 301 https://dragonballfr.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    quic_gso on;
    quic_retry on;
    server_name dragonballfr.com;

    ssl_certificate     /etc/letsencrypt/live/dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dragonballfr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_dbfr:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    # headers-more: inherited by every location, added on every status.
    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
    more_set_headers 'Alt-Svc: h3=":443"; ma=86400';
    # Server-level add_header stops the http-level set of nginx.conf (X-XSS-Protection,
    # Referrer-Policy no-referrer-when-downgrade) from leaking into locations without their own.
    add_header X-Frame-Options "SAMEORIGIN" always;
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

    access_log /var/log/nginx/dragonballfr-access.log;
    error_log  /var/log/nginx/dragonballfr-error.log warn;

    # Wiki-admin editor uploads (multipart and base64 JSON).
    client_max_body_size 60m;

    root /home/ubuntu/apps/shenron-cdn;
    sendfile on;
    # .br/.gz siblings written by scripts/release/cdn-optimize.ts.
    brotli_static on;
    gzip_static on;
    tcp_nopush on;
    open_file_cache max=20000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    brotli on;
    brotli_comp_level 5;
    brotli_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain text/xml application/xml;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain text/xml application/xml;

    # @site -> @maintenance -> /50x.html is a chain of error pages.
    recursive_error_pages on;

    if ($shenron_mirror_tmp) { return 404; }

    # Scanner probes: the site serves none of these paths.
    location ~* "\.(env|git/|aws/|ssh/|sql|bak|old|swp|DS_Store)$" { return 410; }

    # Branded page, also published at /maintenance for preview.
    location = /50x.html {
        root /var/www/shenron;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "600" always;
        add_header X-Robots-Tag "noindex" always;
    }
    location = /maintenance {
        alias /var/www/shenron/50x.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    # Next build chunks: immutable files from disk; a chunk of a newer release that is
    # not mirrored yet goes to Next.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri @site;
    }

    # Next image optimizer when it runs; otherwise the original file on the CDN.
    location /_next/image {
        proxy_pass http://shenron_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_cache shenron_images;
        proxy_cache_key "$scheme$request_method$host$uri$is_args$args$http_accept";
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $bypass_user_cache;
        proxy_no_cache $bypass_user_cache;
        add_header X-Cache-Status $upstream_cache_status always;
        error_page 502 504 = @image_origin;
    }
    location @image_origin {
        if ($shenron_image_origin = "") { return 404; }
        return 302 https://cdn.dragonballfr.com/$shenron_image_origin;
    }

    # API and auth routes (better-auth, telemetry, streamed LLM chat).
    location /api/ {
        limit_req zone=shenron_api burst=30 nodelay;
        proxy_pass http://shenron_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        error_page 502 504 = @api_down;
    }
    location @api_down {
        default_type application/json;
        more_set_headers "Retry-After: 600" "Cache-Control: no-store";
        return 503 '{"error":"maintenance","message":"dragonballfr.com est en maintenance, réessayez plus tard."}\n';
    }

    # Directory-style URLs are pages: straight to Next.
    location ~ /$ {
        try_files /.shenron-page @site;
    }

    # Public files (site, site-extra) and media from disk, everything else to Next.
    location / {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files /site$uri /site-extra$uri $uri @site;
    }

    # Pages (SSR/ISR/RSC streaming). X-Forwarded-Proto https keeps better-auth cookies
    # `Secure` and OAuth on https.
    location @site {
        proxy_pass http://shenron_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        error_page 502 504 = @maintenance;
    }
    location @maintenance {
        error_page 503 /50x.html;
        return 503;
    }
}

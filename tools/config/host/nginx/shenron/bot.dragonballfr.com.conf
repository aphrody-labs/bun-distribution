# SPDX-License-Identifier: Apache-2.0
#
# bot.dragonballfr.com: public Shenron API (REST/GraphQL/OpenAPI), one process with the
# Discord bot (shenron-bot.service, 127.0.0.1:5006), on the vps. Static-first: bot assets
# and wiki media are files of the CDN root /home/ubuntu/apps/shenron-cdn (nginx/shenron/00-shenron.conf);
# a request the disk cannot answer goes to the bot, and to a JSON 503 when the bot does
# not run.
# Route declared in nginx/routes.json ("bot.dragonballfr.com").
#
# Install (vps), from tools/config/host:
#   sudo install -m 644 nginx/shenron/bot.dragonballfr.com.conf /etc/nginx/conf.d/bot.dragonballfr.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Rollback: remove /etc/nginx/conf.d/bot.dragonballfr.com.conf, `sudo nginx -t`, reload.

server {
    listen 80;
    listen [::]:80;
    server_name bot.dragonballfr.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    quic_gso on;
    quic_retry on;
    server_name bot.dragonballfr.com;

    ssl_certificate     /etc/letsencrypt/live/bot.dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.dragonballfr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_botdbfr:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    # headers-more: inherited by every location, added on every status. An empty
    # $shenron_cors_origin (foreign origin) leaves the header unset.
    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
    more_set_headers 'Alt-Svc: h3=":443"; ma=86400';
    # Server-level add_header stops the http-level set of nginx.conf (X-XSS-Protection,
    # Referrer-Policy no-referrer-when-downgrade) from leaking into locations without their own.
    add_header X-Frame-Options "SAMEORIGIN" always;
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    more_set_headers "Access-Control-Allow-Origin: $shenron_cors_origin";
    more_set_headers "Access-Control-Allow-Methods: GET, POST, PUT, PATCH, DELETE, OPTIONS";
    more_set_headers "Access-Control-Allow-Headers: Authorization, Content-Type";
    more_set_headers "Access-Control-Max-Age: 86400";
    if ($request_method = OPTIONS) { return 204; }
    if ($shenron_mirror_tmp) { return 404; }

    access_log /var/log/nginx/bot-dragonballfr-access.log;
    error_log  /var/log/nginx/bot-dragonballfr-error.log warn;
    # Above the application cap on wiki image uploads (50 MB).
    client_max_body_size 60m;

    root /home/ubuntu/apps/shenron-cdn;
    sendfile on;
    # .br/.gz siblings written by scripts/release/cdn-optimize.ts.
    brotli_static on;
    gzip_static on;
    tcp_nopush on;
    open_file_cache max=20000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    location ~* "\.(env|git/|aws/|ssh/|sql|bak|old|swp|DS_Store)$" { return 410; }

    # Wiki uploads: the site links them as /assets/wiki/<path> on this host, but the files live
    # in the wiki media tree (/home/ubuntu/apps/shenron-cdn/wiki = shared/site/wiki), which the bot container
    # does not mount. Bot assets wiki/ first, then the wiki media, then the bot.
    location ~ "^/assets/wiki/(.+)$" {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000";
        try_files $uri /wiki/$1 @bot;
    }

    # Bot assets (images, fonts, banners) from disk; a missing file goes to the bot.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri @bot;
    }

    # Wiki clips and illustrations from disk (Range).
    location ^~ /wiki/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000";
        try_files $uri =404;
    }

    # Canvas (Skia): longer timeout, short cache.
    location ~ "^/api/canvas/" {
        limit_req zone=shenron_api burst=20 nodelay;
        proxy_pass http://shenron_bot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        error_page 502 504 = @bot_down;
    }

    # HLS playlists and segments produced by the bot, cached with distinct TTLs.
    location ~ "^/api/hls/[^/]+/master\.m3u8$" {
        limit_req zone=shenron_api burst=20 nodelay;
        proxy_pass http://shenron_bot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_cache shenron_hls;
        proxy_cache_key "$scheme$host$uri$is_args$args";
        proxy_cache_valid 200 10s;
        proxy_cache_lock on;
        proxy_cache_bypass $bypass_user_cache;
        proxy_no_cache $bypass_user_cache;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=10, stale-while-revalidate=60" always;
        add_header X-Cache-Status $upstream_cache_status always;
        error_page 502 504 = @bot_down;
    }
    location ~ "^/api/hls/[^/]+/seg$" {
        proxy_pass http://shenron_bot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_cache shenron_hls;
        proxy_cache_key "$scheme$host$uri$is_args$args";
        proxy_cache_valid 200 1d;
        proxy_cache_lock on;
        proxy_cache_bypass $bypass_user_cache;
        proxy_no_cache $bypass_user_cache;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=86400, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
        error_page 502 504 = @bot_down;
    }

    # Everything else: the bot (public API and Bearer admin).
    location / {
        limit_req zone=shenron_api burst=50 nodelay;
        try_files /.shenron-api @bot;
    }

    location @bot {
        proxy_pass http://shenron_bot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        error_page 502 504 = @bot_down;
    }
    location @bot_down {
        default_type application/json;
        more_set_headers "Retry-After: 600" "Cache-Control: no-store";
        return 503 '{"error":"maintenance","message":"L\'API Shenron est en maintenance, réessayez plus tard."}\n';
    }
}

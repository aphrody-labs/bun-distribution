# Installed as /etc/sysctl.d/90-wsl-resource-tuning.conf. Tuned for Rust/Cargo builds in WSL (20 GiB, 16 CPUs).
# Bias toward reclaimable file cache before swapping anonymous memory (rustc, linkers).
vm.swappiness = 10
# Write back early and in small batches: the ratio defaults let ~4 GiB of dirty pages pile up, then stall every
# process while a link or a target/ wipe flushes them to the VHD.
vm.dirty_background_bytes = 268435456
vm.dirty_bytes = 1073741824
# Cargo and rust-analyzer stat hundreds of thousands of files: keep dentries and inodes cached longer.
vm.vfs_cache_pressure = 50
# Watchers (rust-analyzer, bun --watch, cargo watch) per user.
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches = 1048576

# Overlay for the private runtime token produced by scripts/tools/secrets/vault.ts runtime.
services:
  api:
    environment:
      # Clear a legacy host token so only the mounted file supplies the value.
      APHRODY_MCP_HTTP_TOKEN: ""
      APHRODY_MCP_HTTP_TOKEN_FILE: /run/secrets/aphrody_mcp_http_token
    secrets:
      - aphrody_mcp_http_token

secrets:
  aphrody_mcp_http_token:
    file: ${APHRODY_API_TOKEN_FILE:?Set the private runtime token path}

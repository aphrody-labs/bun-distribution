# SPDX-License-Identifier: Apache-2.0
# Aphrody services in containers. From the repository root:
#   docker compose -f tools/config/container/compose.yaml up --build api
#   docker compose -f tools/config/container/compose.yaml run --rm dev            # interactive build shell
#   docker compose -f tools/config/container/compose.yaml run --rm -T mcp         # MCP over stdio for a client
# Secrets come from the environment or an untracked env file (tools/config/container/.env), never from the image.

name: aphrody

x-build: &build
  context: ../../..
  dockerfile: tools/config/container/Dockerfile
  args:
    APHRODY_RELEASE: ${APHRODY_RELEASE:-}

x-runtime: &runtime
  build:
    <<: *build
    target: runtime
  image: ${APHRODY_RUNTIME_IMAGE:-aphrody:runtime}
  init: true
  volumes:
    - aphrody-home:/home/aphrody/.aphrody
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  api:
    <<: *runtime
    command: ["api"]
    environment:
      # Only the API entrypoint requires the token; other profiles can run without it.
      APHRODY_MCP_HTTP_TOKEN: ${APHRODY_MCP_HTTP_TOKEN:-}
      PORT: "8999"
    ports:
      # Published on the host loopback only; put a reverse proxy with TLS in front for anything wider.
      - "127.0.0.1:8999:8999"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8999/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Complete Aphrody (API + MCP surfaces) as a long-running PC service. The Windows service registered by
  # scripts/install/container-service.ps1 starts it with `--profile pc` on the owner PC and on Omar's PC.
  pc:
    <<: *runtime
    container_name: aphrody-pc
    command: ["api"]
    environment:
      APHRODY_MCP_HTTP_TOKEN: ${APHRODY_MCP_HTTP_TOKEN:-}
      PORT: "8999"
      APHRODY_PC: ${APHRODY_PC:-local}
    ports:
      - "127.0.0.1:${APHRODY_PC_PORT:-8999}:8999"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8999/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    profiles: [pc]

  # Production (dbfr): the image shipped by the VPS build service (release-image.ts ship), never built on dbfr.
  prod:
    <<: *runtime
    build: !reset null
    container_name: aphrody-prod
    pull_policy: never
    command: ["api"]
    environment:
      APHRODY_MCP_HTTP_TOKEN: ""
      APHRODY_MCP_HTTP_TOKEN_FILE: /run/secrets/aphrody_mcp_http_token
      PORT: "8999"
    secrets:
      - aphrody_mcp_http_token
    ports:
      - "127.0.0.1:${APHRODY_PROD_PORT:-8999}:8999"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8999/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    profiles: [prod]

  # Build service (VPS): the shared aphrody-build image, reached over SSH (`aphrody infra ssh exec --host vps`).
  # It idles; builds enter through `docker exec` or scripts/build/container/aphrody-build.ts run (bounded, locked).
  build:
    image: aphrody-build:latest
    container_name: aphrody-build
    command: ["sleep", "infinity"]
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: ${APHRODY_BUILD_CPUS:-6}
    mem_limit: ${APHRODY_BUILD_MEMORY:-16g}
    pids_limit: 8192
    working_dir: /work
    user: "${APHRODY_BUILD_UID:-1000}:1500"
    volumes:
      - ${APHRODY_BUILD_REPO:-/srv/aphrody-build/workspaces/aphrody}:/work
      - aphrody-build-cargo:/cache/cargo
      - aphrody-build-sccache:/cache/sccache
      - aphrody-build-bun:/cache/bun
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cargo --version >/dev/null && bun --version >/dev/null && test -w /cache/cargo",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles: [build]

  mcp:
    <<: *runtime
    command: ["mcp"]
    stdin_open: true
    profiles: [tools]

  dev:
    build:
      <<: *build
      target: dev
    image: aphrody:dev
    command: ["shell"]
    stdin_open: true
    tty: true
    working_dir: /app
    volumes:
      # The checkout is bind mounted over the image copy; caches live in named volumes so they survive rebuilds.
      - ../../..:/app
      - aphrody-home:/home/aphrody/.aphrody
      - cargo-registry:/home/aphrody/.cargo/registry
      - cargo-git:/home/aphrody/.cargo/git
      - cargo-target:/app/target
      - bun-cache:/home/aphrody/.bun/install/cache
    environment:
      APHRODY_CLOUD: "1"
    profiles: [dev]
    init: true

  release-builder:
    build:
      <<: *build
      target: release-builder
    image: aphrody:release-builder
    command: ["shell"]
    stdin_open: true
    tty: true
    working_dir: /app
    volumes:
      - ../../..:/app
      - aphrody-home:/home/aphrody/.aphrody
      - cargo-registry:/home/aphrody/.cargo/registry
      - cargo-git:/home/aphrody/.cargo/git
      - cargo-target:/app/target
      - bun-cache:/home/aphrody/.bun/install/cache
      - uv-cache:/home/aphrody/.cache/uv
    profiles: [release]
    init: true

volumes:
  aphrody-home:
  cargo-registry:
  cargo-git:
  cargo-target:
  bun-cache:
  uv-cache:
  aphrody-build-cargo:
    external: true
  aphrody-build-sccache:
    external: true
  aphrody-build-bun:
    external: true

secrets:
  aphrody_mcp_http_token:
    file: ${APHRODY_API_TOKEN_FILE:-/etc/aphrody/aphrody_mcp_http_token}

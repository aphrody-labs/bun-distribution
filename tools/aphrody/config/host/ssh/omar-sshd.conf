# Installed as /etc/ssh/sshd_config.d/60-omar.conf on vps and dbfr. Applies to Omar only: nothing global changes.
# (`sshd -T -C user=omar,host=x,addr=92.170.252.46` shows the effective values after install.)
# Key only, from the root-owned file, key fingerprint logged on every login (LogLevel VERBOSE, journald).
# Forwarding: remote (-R) only, onto loopback ports, so Omar's PC can publish its Windows SSH (22010), remote desktop
# (28795) and MCP HTTP (28793) to the host while wg1 is down (owner directive 2026-10-08), plus its WSL Ubuntu SSH
# (22011) and VNC (25900) since 2026-10-09, then his A2A listener (28788) and the container MCP (28999) since
# 2026-10-09 (owner directive). Local forwarding is limited to the hub A2A (23888) and hub MCP HTTP (23889) of the
# vps loopback (both bearer protected) and the loopback-only Japan SOCKS bridge (1080). No socket forwarding,
# nothing bound outside 127.0.0.1.
Match User omar
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u
    AllowTcpForwarding yes
    PermitListen 127.0.0.1:22010 127.0.0.1:28795 127.0.0.1:28793 127.0.0.1:25900 127.0.0.1:28788 127.0.0.1:28999 127.0.0.1:28080
    PermitOpen 127.0.0.1:23888 127.0.0.1:23889 127.0.0.1:1080
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no
    PermitTTY yes
    LogLevel VERBOSE
    MaxAuthTries 3
    ClientAliveInterval 60
    ClientAliveCountMax 3

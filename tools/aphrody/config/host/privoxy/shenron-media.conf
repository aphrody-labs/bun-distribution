# /etc/privoxy/config - Shenron media bridge configuration
# Managed centrally here (tools/config/host/privoxy/shenron-media.conf), installed by deploy/install-media-vpn-proxy.sh of aphrody-labs/shenron
confdir /etc/privoxy
logdir /var/log/privoxy
listen-address 127.0.0.1:8119
permit-access 127.0.0.1
toggle 1
enable-remote-toggle 0
enable-remote-http-toggle 0
enable-edit-actions 0
forwarded-connect-retries 2
forward-socks5t / 10.8.0.1:1080 .

server {
    listen 80;
    listen [::]:80;
    server_name app-video.aphrody.app app-generation.aphrody.app app-images.aphrody.app app-vectors.aphrody.app app-compositing.aphrody.app app-photo-processing.aphrody.app app-pdf.aphrody.app app-documents.aphrody.app app-audio.aphrody.app app-layout.aphrody.app app-cad.aphrody.app app-slides.aphrody.app app-tables.aphrody.app app-interface-layouts.aphrody.app filmcraft.aphrody.app video.aphrody.app artcraft.aphrody.app photocraft.aphrody.app vectorcraft.aphrody.app effectcraft.aphrody.app lightcraft.aphrody.app pdfcraft.aphrody.app wordcraft.aphrody.app soundcraft.aphrody.app designcraft.aphrody.app cadcraft.aphrody.app deckcraft.aphrody.app gridcraft.aphrody.app figcraft.aphrody.app git.aphrody.app source.aphrody.app deploy.aphrody.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app-video.aphrody.app app-generation.aphrody.app app-images.aphrody.app app-vectors.aphrody.app app-compositing.aphrody.app app-photo-processing.aphrody.app app-pdf.aphrody.app app-documents.aphrody.app app-audio.aphrody.app app-layout.aphrody.app app-cad.aphrody.app app-slides.aphrody.app app-tables.aphrody.app app-interface-layouts.aphrody.app filmcraft.aphrody.app video.aphrody.app artcraft.aphrody.app photocraft.aphrody.app vectorcraft.aphrody.app effectcraft.aphrody.app lightcraft.aphrody.app pdfcraft.aphrody.app wordcraft.aphrody.app soundcraft.aphrody.app designcraft.aphrody.app cadcraft.aphrody.app deckcraft.aphrody.app gridcraft.aphrody.app figcraft.aphrody.app;
    ssl_certificate /etc/letsencrypt/live/aphrody-control/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody-control/privkey.pem;
    http2 on;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 512m;
    include snippets/aphrody-security.inc;
    include snippets/bun-os-product-api.inc;

    location = /install {
        return 404;
    }

    location / {
        default_type application/json;
        return 503 '{"error":"Native artifact is not installed"}';
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name git.aphrody.app;
    ssl_certificate /home/ubuntu/.aphrody/secrets/tls/source-origin/fullchain.pem;
    ssl_certificate_key /home/ubuntu/.aphrody/secrets/tls/source-origin/privkey.pem;
    http2 on;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 512m;
    include snippets/aphrody-security.inc;
    include snippets/bun-os-product-api.inc;

    location = /install {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:29020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-WEBAUTH-USER "";
        proxy_set_header X-WEBAUTH-EMAIL "";
        proxy_set_header X-WEBAUTH-FULLNAME "";
        proxy_set_header X-Aphrody-Tunnel-User "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}


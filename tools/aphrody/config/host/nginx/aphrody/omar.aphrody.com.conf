# SPDX-License-Identifier:Apache-2.0
server {
    listen 80;
    listen [::]:80;
    server_name omar.aphrody.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = / {
        return 403;
    }

    location / {
        return 403;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name omar.aphrody.com;
    ssl_certificate /etc/letsencrypt/live/omar.aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omar.aphrody.com/privkey.pem;
    http2 on;
    ssl_protocols TLSv1.2 TLSv1.3;
    include snippets/aphrody-security.inc;

    location = / {
        return 403;
    }

    location / {
        return 403;
    }
}


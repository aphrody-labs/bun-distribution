# Active VPS vhost (sites-available), deployed 2026-10-10; TLS by Let's Encrypt webroot. Security headers: snippets/aphrody-security.inc.
server {
    listen 80;
    listen [::]:80;
    server_name os.aphrody.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://os.aphrody.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name os.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aphrody_tls:10m;
    ssl_session_timeout 1d;

    include snippets/aphrody-security.inc;

    root /var/www/os.aphrody.com;
    index index.html;

    location = /desktop { return 308 /desktop/; }

    location ^~ /desktop/api/ { return 403; }

    location ^~ /desktop/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18804/;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        include snippets/aphrody-security.inc;
    }

    location = /api/webos/capabilities {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18804;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    location = /dist/workers/repl.js {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18804;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        include snippets/aphrody-security.inc;
    }

    location = /dist/wasm/bun/bun_wasm.wasm {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18804;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        add_header Cross-Origin-Resource-Policy same-origin always;
        include snippets/aphrody-security.inc;
    }

    location = /api/search {
        limit_except GET { deny all; }
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"error":"Public search backend is not yet qualified"}';
    }

    location ^~ /api/os/ { return 403; }
    location ^~ /api/explorer/ { return 403; }
    location ^~ /api/webos/ { return 403; }
    location = /api/metrics { return 403; }
    location ^~ /dist/workers/ { return 404; }
    location ^~ /dist/wasm/bun/ { return 404; }

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        include snippets/aphrody-security.inc;
        try_files $uri =404;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
        include snippets/aphrody-security.inc;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include snippets/aphrody-security.inc;
        try_files $uri /index.html;
    }
}

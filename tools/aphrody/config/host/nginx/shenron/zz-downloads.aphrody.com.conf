# Migré du VPS vers dbfr le 2026-10-09 (chantier P) ; servi par le conteneur shenron-gateway (network host).
# SPDX-License-Identifier: Apache-2.0
#
# downloads.aphrody.com, aphrody.com, www.aphrody.com: the Aphrody download site (index page, latest.json,
# SHA256SUMS, install.sh, install.ps1 and the artifacts). Origin: aphrody-downloads (127.0.0.1:8797, Bun,
# read-only). The artifacts under /files/ are sent by nginx itself from the published release tree
# (sendfile, ranges); everything else is proxied. Public and unauthenticated by design: it serves
# published, checksummed release files and nothing else.
#
# Install (vps), as in docs/operations/infra/DOWNLOADS.md:
#   sudo scripts/tools/infra/issue-downloads-certificate.sh        # HTTP-01, certificate downloads.aphrody.com
#   sudo install -m 644 nginx/aphrody/downloads.aphrody.com.conf /etc/nginx/conf.d/downloads.aphrody.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Rollback: remove /etc/nginx/conf.d/downloads.aphrody.com.conf, `nginx -t`, reload.

upstream aphrody_downloads {
    server 127.0.0.1:8797;
    keepalive 8;
}

limit_req_zone $binary_remote_addr zone=aphrody_downloads:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=aphrody_downloads_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name downloads.aphrody.com aphrody.com www.aphrody.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name downloads.aphrody.com aphrody.com www.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/downloads.aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/downloads.aphrody.com/privkey.pem;

    # nosniff, referrer and CSP headers come from the Bun origin; /files/ sets its own below.
    add_header Strict-Transport-Security "max-age=63072000" always;

    limit_req zone=aphrody_downloads burst=40 nodelay;
    limit_conn aphrody_downloads_conn 16;

    # Only GET and HEAD exist on this site.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/json text/plain text/x-shellscript;

    # Artifacts: served from the `current` release (a symlink flipped atomically by the publisher).
    location /files/ {
        alias /home/ubuntu/apps/downloads/current/files/;
        default_type application/octet-stream;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        gzip off;
        limit_rate_after 50m;
        limit_rate 40m;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment";
    }

    location / {
        proxy_pass http://aphrody_downloads;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

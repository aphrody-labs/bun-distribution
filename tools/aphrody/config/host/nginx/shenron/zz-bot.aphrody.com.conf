# Migré du VPS vers dbfr le 2026-10-09 (chantier P) ; servi par le conteneur shenron-gateway (network host).
# Dedicated test Discord application. Keep HTTP-01 available for unattended
# certificate renewal; bot.aphrody.com has its own certificate and upstream.
upstream aphrody_discord_dev {
    server 127.0.0.1:4010;
    keepalive 16;
}

server {
    listen 80;
    server_name bot.aphrody.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://bot.aphrody.com$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bot.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/bot.aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.aphrody.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2m;

    location / {
        proxy_pass http://aphrody_discord_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}

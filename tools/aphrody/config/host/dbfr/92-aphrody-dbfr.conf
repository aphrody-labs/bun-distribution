# dbfr (OVH VPS, 6 vCPU, 11 GiB RAM, zram + 4 GiB disk swap), read after
# 90-aphrody-bun.conf and 91-aphrody-server.conf (Aphrody Alpine profiles).
# Host short of RAM: zram (priority 100) takes cold anonymous pages before the
# disk swap; keep reclaim of dentry/inode caches at the kernel default.
vm.swappiness = 20
vm.vfs_cache_pressure = 100
vm.page-cluster = 0
# IPv6 routes are static (netplan, accept_ra 0): never turn the host into an IPv6 router.
net.ipv6.conf.all.forwarding = 0

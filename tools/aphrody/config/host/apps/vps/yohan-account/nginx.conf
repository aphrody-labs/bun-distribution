# SPDX-License-Identifier: Apache-2.0
server {
    listen 80;
    listen [::]:80;
    server_name yohan.aphrody.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://yohan.aphrody.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yohan.aphrody.com;
    ssl_certificate /etc/letsencrypt/live/yohan.aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yohan.aphrody.com/privkey.pem;
    http2 on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:yohan_tls:10m;
    ssl_session_timeout 1d;
    include snippets/aphrody-security.inc;

    location = /auth/google/login {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"Google sign-in unavailable"}';
    }

    location = /auth/google/callback {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"Google sign-in unavailable"}';
    }

    location = /auth/session {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"Google sign-in unavailable"}';
    }

    location = /auth/scopes {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"Google sign-in unavailable"}';
    }

    location = /auth/logout {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"Google sign-in unavailable"}';
    }

    location = /rpc {
        return 404;
    }

    location = /events {
        return 404;
    }

    location ^~ /api/mail {
        return 404;
    }

    location ^~ /api/gmail {
        return 404;
    }

    location / {
        proxy_pass http://10.200.77.3:18803;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        include snippets/proxy-client-ip.inc;
    }
}

[install]
linker = "isolated"
hoist = false
# react-selecto 1.26 imports the first two without declaring them, swiper 14 imports react (phantom dependencies).
publicHoistPattern = ["@daybrush/utils", "framework-utils", "react", "react-dom"]
saveTextLockfile = true
minimumReleaseAge = 259200
# Owner-published forks use exact pins. Security fixes (next, nodemailer, undici) and Tauri v3 alphas must track the Rust crates in real time (config/update, tauri sync).
minimumReleaseAgeExcludes = [
  "@aphrody/ag-ui-client",
  "@aphrody/mcp-ui",
  "@aphrody/material-web",
  "next",
  "@next/env",
  "@next/swc-linux-x64-gnu",
  "@next/swc-linux-x64-musl",
  "@next/swc-win32-x64-msvc",
  "@next/swc-darwin-arm64",
  "@next/swc-darwin-x64",
  "@next/swc-linux-arm64-gnu",
  "@next/swc-linux-arm64-musl",
  "@next/swc-win32-arm64-msvc",
  "nodemailer",
  "undici",
  "@tauri-crates/infra/aphrody",
  "@aphrody/api",
  "@tauri-crates/infra/aphrody-linux-x64-gnu",
  "@modelcontextprotocol/sdk",
  "@modelcontextprotocol/ext-apps",
  "@modelcontextprotocol/client",
  "@modelcontextprotocol/core",
]

[jsx]
runtime = "automatic"
importSource = "react"

[loader]
".svg" = "text"
".css" = "css"

[test]
preload = ["./scripts/test-dom.ts"]

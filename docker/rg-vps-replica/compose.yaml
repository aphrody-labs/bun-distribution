name: vps-replica

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: vps-replica-postgres:local
    container_name: vps-replica-postgres
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/usr/local/bin/vps-replica-entrypoint.sh"]
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - shared_preload_libraries=pg_net
      - -c
      - wal_level=replica
      - -c
      - max_connections=200
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-extensions:/replica-extensions:ro
      - ./postgres-entrypoint.sh:/usr/local/bin/vps-replica-entrypoint.sh:ro
    networks: [edge, backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.0.5
    container_name: vps-replica-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--dbfilename", "dump.rdb"]
    ports:
      - "127.0.0.1:16380:6379"
    volumes:
      - redis-data:/data
    networks: [edge, backend]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.12
    container_name: vps-replica-postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator@postgres:5432/rg
      PGRST_DB_SCHEMAS: public,storage,graphql_public,achillea
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?Provide SUPABASE_JWT_SECRET in the invoking process}
      PGRST_SERVER_PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8809:3000"
    networks: [edge, backend]

  storage:
    build:
      context: ${RG_ROOT:-../../../rg}
      dockerfile: ../aphrody-infra/docker/rg-vps-replica/Dockerfile.bun
    image: vps-replica-bun-services:local
    container_name: vps-replica-storage
    restart: unless-stopped
    entrypoint: ["bun", "run", "apps/storage/server.ts"]
    environment:
      DATABASE_URL: postgres://rg@postgres:5432/rg
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?Provide SUPABASE_JWT_SECRET in the invoking process}
      RG_STORAGE_HOST: 0.0.0.0
      RG_STORAGE_PORT: "8810"
      RG_STORAGE_ROOT: /var/www/rg-storage
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - www-data:/var/www
    ports:
      - "127.0.0.1:8810:8810"
    networks: [edge, backend]

  achillea-storage:
    image: vps-replica-bun-services:local
    container_name: vps-replica-achillea-storage
    restart: unless-stopped
    entrypoint: ["bun", "run", "apps/storage/server.ts"]
    environment:
      DATABASE_URL: postgres://rg@postgres:5432/rg
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?Provide SUPABASE_JWT_SECRET in the invoking process}
      RG_STORAGE_HOST: 0.0.0.0
      RG_STORAGE_PORT: "8810"
      RG_STORAGE_ROOT: /var/www/achillea-storage
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    volumes:
      - www-data:/var/www
    ports:
      - "127.0.0.1:8821:8810"
    networks: [edge, backend]

  realtime:
    image: vps-replica-bun-services:local
    container_name: vps-replica-realtime
    restart: unless-stopped
    entrypoint: ["bun", "run", "apps/realtime/server.ts"]
    environment:
      DATABASE_URL: postgres://rg@postgres:5432/rg
      RG_REALTIME_HOST: 0.0.0.0
      RG_REALTIME_PORT: "8812"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8812:8812"
      - "127.0.0.1:8822:8812"
    networks: [edge, backend]

  aphrody-site:
    image: ubuntu:26.04
    container_name: vps-replica-aphrody-site
    restart: unless-stopped
    init: true
    user: "1000:1000"
    entrypoint: ["/srv/aphrody/current/bin/aphrody-site"]
    environment:
      APHRODY_SITE_BIND: "0.0.0.0:8083"
      RUST_LOG: "aphrody_site=info"
      MAIL_PROVIDER: "disabled"
    volumes:
      - website-release:/srv/aphrody/current:ro
      - www-data:/var/www:ro
    networks: [backend]

  nginx:
    image: nginx:1.28-alpine
    container_name: vps-replica-nginx
    restart: unless-stopped
    depends_on:
      - aphrody-site
      - postgrest
      - storage
      - achillea-storage
      - realtime
    ports:
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8811:82"
      - "127.0.0.1:8823:81"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - www-data:/var/www:ro
    networks: [edge, backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  edge: {}
  backend:
    internal: true

volumes:
  postgres-data:
    name: vps-replica-postgres-data
    external: true
  postgres-extensions:
    name: vps-replica-postgres-extensions
    external: true
  redis-data:
    name: vps-replica-redis-data
    external: true
  website-release:
    name: vps-replica-website-release
    external: true
  www-data:
    name: vps-replica-www-data
    external: true

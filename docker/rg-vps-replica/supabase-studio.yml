# ══════════════════════════════════════════════════════════
# Supabase Studio auto-hébergé — tableau de bord de la pile
# ══════════════════════════════════════════════════════════
#
# Deux conteneurs seulement : le reste de la pile (Postgres, PostgREST,
# Storage, Realtime) tourne nativement sur l'hôte, cf. docs/self-host-supabase.md.
#
#   rg-pg-meta  8813  introspection Postgres consommée par Studio
#               8814  port d'admin, NON configurable (= PG_META_PORT + 1)
#   rg-studio   8815  interface Next, publiée par nginx sur studio.rosegriffon.fr
#
# `network_mode: host` : les deux conteneurs doivent joindre des services qui
# n'écoutent que sur la boucle locale de l'hôte (Postgres 5432, la passerelle
# interne 8811). Ils s'y lient eux-mêmes en 127.0.0.1 — rien n'est exposé, et
# ufw ne laisse de toute façon passer que 22/80/443.
#
# Secrets : /etc/rg-studio-stack.env (0600 root).
#
# Usage :
#   sudo docker compose --env-file /etc/rg-studio-stack.env \
#        -f infra/docker/supabase-studio.yml up -d

services:
  meta:
    image: supabase/postgres-meta:v0.91.0
    container_name: rg-pg-meta
    restart: unless-stopped
    network_mode: host
    environment:
      PG_META_HOST: 127.0.0.1
      PG_META_PORT: "8813"
      PG_META_DB_HOST: 127.0.0.1
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: rg
      PG_META_DB_USER: rg
      PG_META_DB_PASSWORD: ${RG_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8813/schemas').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  studio:
    image: supabase/studio:2025.06.30-sha-6f5982d
    container_name: rg-studio
    restart: unless-stopped
    network_mode: host
    depends_on:
      - meta
    environment:
      HOSTNAME: 127.0.0.1
      PORT: "8815"
      STUDIO_PG_META_URL: http://127.0.0.1:8813
      POSTGRES_PASSWORD: ${RG_DB_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: Rose Griffon
      DEFAULT_PROJECT_NAME: rg
      # Passerelle interne : /rest/v1 + /storage/v1 + /realtime/v1.
      SUPABASE_URL: http://127.0.0.1:8811
      SUPABASE_PUBLIC_URL: https://supabase.rosegriffon.fr
      SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      # Pas de Logflare dans notre pile : la section Logs resterait vide.
      NEXT_PUBLIC_ENABLE_LOGS: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8815/api/platform/profile').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

limit_req_zone $binary_remote_addr zone=aphrody_site:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=aphrody_conn:10m;

upstream aphrody_site {
    server aphrody-site:8083;
    keepalive 32;
}

upstream supabase_rest {
    server postgrest:3000;
    keepalive 16;
}

upstream supabase_storage {
    server storage:8810;
    keepalive 16;
}

upstream achillea_storage {
    server achillea-storage:8810;
    keepalive 16;
}

upstream supabase_realtime {
    server realtime:8812;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 aphrody.local www.aphrody.local aphrody.com www.aphrody.com;
    client_max_body_size 64m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/xml application/manifest+json text/plain text/css text/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    limit_req zone=aphrody_site burst=60 nodelay;
    limit_conn aphrody_conn 24;
    limit_req_status 429;
    limit_conn_status 429;

    location = /healthz {
        proxy_pass http://aphrody_site/healthz;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://aphrody_site/healthz;
        proxy_set_header Host $host;
    }

    location = /mcp {
        proxy_pass http://aphrody_site/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /rest/v1 {
        return 308 /rest/v1/;
    }

    location ^~ /rest/v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://supabase_rest/;
    }

    location ^~ /storage/v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://supabase_storage;
    }

    location ^~ /realtime/v1/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://supabase_realtime;
    }

    location = /graphql/v1 {
        proxy_set_header Accept-Profile graphql_public;
        proxy_set_header Content-Profile graphql_public;
        proxy_pass http://supabase_rest/rpc/graphql;
    }

    location ^~ /auth/v1/ {
        default_type application/json;
        return 410 '{"status":"retired","service":"supabase-auth"}';
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_pass http://aphrody_site;
    }
}

server {
    listen 80;
    server_name mcp.aphrody.local mcp.aphrody.com;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = / { return 308 http://localhost:8088/mcp; }
    location = /mcp {
        proxy_pass http://aphrody_site/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location / { return 404; }
}

server {
    listen 81;
    server_name _;

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"service":"achillea-supabase-internal"}';
    }
    location ^~ /rest/v1/ {
        proxy_set_header Accept-Profile achillea;
        proxy_set_header Content-Profile achillea;
        proxy_pass http://supabase_rest/;
    }
    location ^~ /storage/v1/ {
        client_max_body_size 16m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://achillea_storage;
    }
    location ^~ /realtime/v1/ {
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_pass http://supabase_realtime;
    }
    location ^~ /auth/v1/ {
        default_type application/json;
        return 410 '{"status":"retired","service":"achillea-gotrue"}';
    }
    location / { return 404; }
}

server {
    listen 82;
    server_name _;

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"service":"supabase-internal"}';
    }
    location ^~ /rest/v1/ { proxy_pass http://supabase_rest/; }
    location ^~ /storage/v1/ { proxy_pass http://supabase_storage; }
    location ^~ /realtime/v1/ {
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_pass http://supabase_realtime;
    }
    location = /graphql/v1 {
        proxy_set_header Accept-Profile graphql_public;
        proxy_set_header Content-Profile graphql_public;
        proxy_pass http://supabase_rest/rpc/graphql;
    }
    location ^~ /auth/v1/ {
        default_type application/json;
        return 410 '{"status":"retired","service":"supabase-auth"}';
    }
    location / { return 404; }
}

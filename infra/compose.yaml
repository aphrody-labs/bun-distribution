name: bun-control-plane

x-service: &service
  restart: unless-stopped
  init: true
  labels:
    komodo.skip: "true"
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "1"

services:
  database:
    <<: *service
    image: ${POSTGRES_DOCUMENTDB_IMAGE:?Resolve the immutable reference from control-plane.json}
    platform: ${DEPLOYMENT_PLATFORM:?Qualify linux/amd64 or linux/arm64}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER_FILE: /run/secrets/database_username
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets:
      - database_username
      - database_password
    volumes:
      - type: bind
        source: ${DEPLOYMENT_STATE_ROOT:?Qualify an owned persistent build-disk apps directory}/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks: [database]
    healthcheck:
      test: [CMD, pg_isready, --host, 127.0.0.1, --dbname, postgres]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    stop_grace_period: 1m

  ferretdb:
    <<: *service
    image: ${FERRETDB_IMAGE:?Resolve the immutable reference from control-plane.json}
    platform: ${DEPLOYMENT_PLATFORM:?Qualify linux/amd64 or linux/arm64}
    depends_on:
      database:
        condition: service_healthy
    environment:
      FERRETDB_POSTGRESQL_URL_FILE: /run/secrets/ferretdb_postgresql_uri
      FERRETDB_TELEMETRY: disabled
    secrets:
      - ferretdb_postgresql_uri
    volumes:
      - type: bind
        source: ${DEPLOYMENT_STATE_ROOT:?Qualify an owned persistent build-disk apps directory}/ferretdb
        target: /state
        bind:
          create_host_path: false
    networks: [database]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The pinned production image provides /ferretdb ping as its native readiness probe.
    stop_grace_period: 30s

  core:
    <<: *service
    image: ${KOMODO_CORE_IMAGE:?Resolve the immutable reference from control-plane.json}
    platform: ${DEPLOYMENT_PLATFORM:?Qualify linux/amd64 or linux/arm64}
    depends_on:
      ferretdb:
        condition: service_healthy
    environment:
      KOMODO_HOST: ${KOMODO_PUBLIC_URL:?Resolve the deploy HTTPS route from apps.json}
      KOMODO_BIND_IP: 0.0.0.0
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      KOMODO_DATABASE_USERNAME_FILE: /run/secrets/database_username
      KOMODO_DATABASE_PASSWORD_FILE: /run/secrets/database_password
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_ADMIN_USERNAME:?Resolve the actual owner account}
      KOMODO_INIT_ADMIN_PASSWORD_FILE: /run/secrets/komodo_admin_password
      KOMODO_JWT_SECRET_FILE: /run/secrets/komodo_jwt
      KOMODO_WEBHOOK_SECRET_FILE: /run/secrets/komodo_webhook
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_DISABLE_LOCAL_USER_REGISTRATION: "true"
      KOMODO_DISABLE_OIDC_USER_REGISTRATION: "true"
      KOMODO_DISABLE_INIT_RESOURCES: "true"
      KOMODO_FIRST_SERVER_NAME: ${KOMODO_SERVER_NAME:?Resolve the shared server name from control-plane.json}
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
    secrets:
      - database_username
      - database_password
      - komodo_admin_password
      - komodo_jwt
      - komodo_webhook
    ports:
      - 127.0.0.1:${KOMODO_LOCAL_PORT:?Resolve the loopback port from the component profile}:9120
    volumes:
      - type: bind
        source: ${DEPLOYMENT_STATE_ROOT:?Qualify an owned persistent build-disk apps directory}/keys
        target: /config/keys
        bind:
          create_host_path: false
    networks: [database, control]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, "4", http://127.0.0.1:9120/version]
      interval: 30s
      timeout: 5s
      start_period: 1m
      retries: 5
    stop_grace_period: 30s

  periphery:
    <<: *service
    image: ${KOMODO_PERIPHERY_IMAGE:?Resolve the immutable reference from control-plane.json}
    platform: ${DEPLOYMENT_PLATFORM:?Qualify linux/amd64 or linux/arm64}
    depends_on:
      core:
        condition: service_started
    environment:
      PERIPHERY_CORE_ADDRESS: ws://core:9120
      PERIPHERY_CONNECT_AS: ${KOMODO_SERVER_NAME:?Resolve the shared server name from control-plane.json}
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_ROOT_DIRECTORY: ${DEPLOYMENT_MANAGED_ROOT:?Qualify the owned managed apps root}
      PERIPHERY_DISABLE_TERMINALS: "true"
      PERIPHERY_DISABLE_CONTAINER_TERMINALS: "true"
    volumes:
      - type: bind
        source: ${DEPLOYMENT_STATE_ROOT:?Qualify an owned persistent build-disk apps directory}/keys
        target: /config/keys
        bind:
          create_host_path: false
      - type: bind
        source: ${DEPLOYMENT_DOCKER_SOCKET:?Qualify the dedicated persistent deployment daemon}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: ${DEPLOYMENT_MANAGED_ROOT:?Qualify the owned managed apps root}
        target: ${DEPLOYMENT_MANAGED_ROOT:?Qualify the owned managed apps root}
        bind:
          create_host_path: false
      - type: bind
        source: /proc
        target: /proc
        read_only: true
        bind:
          create_host_path: false
    networks: [control]
    stop_grace_period: 30s

  forgejo:
    <<: *service
    image: ${FORGEJO_IMAGE:?Resolve the immutable LTS reference from control-plane.json}
    platform: ${DEPLOYMENT_PLATFORM:?Qualify linux/amd64 or linux/arm64}
    user: 1000:1000
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: ${FORGEJO_PUBLIC_URL:?Resolve the git HTTPS route from apps.json}
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_SSH_HOST:?Resolve the qualified SSH access host}
      FORGEJO__server__SSH_PORT: ${FORGEJO_PUBLIC_SSH_PORT:?Resolve the actual qualified SSH port}
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__actions__ARTIFACT_RETENTION_DAYS: "7"
      FORGEJO__actions__LOG_RETENTION_DAYS: "7"
    volumes:
      - type: bind
        source: ${DEPLOYMENT_STATE_ROOT:?Qualify an owned persistent build-disk apps directory}/forgejo
        target: /var/lib/gitea
        bind:
          create_host_path: false
    ports:
      - 127.0.0.1:${FORGEJO_LOCAL_PORT:?Resolve the loopback port from the component profile}:3000
      - 127.0.0.1:${FORGEJO_LOCAL_SSH_PORT:?Resolve the loopback SSH port from the component profile}:2222
    networks: [control]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, "4", http://127.0.0.1:3000/api/healthz]
      interval: 30s
      timeout: 5s
      start_period: 1m
      retries: 5
    stop_grace_period: 1m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  runner:
    <<: *service
    profiles: [ci]
    image: ${FORGEJO_RUNNER_IMAGE:?Resolve the immutable reference from control-plane.json}
    platform: ${DEPLOYMENT_PLATFORM:?Qualify linux/amd64 or linux/arm64}
    user: 1000:1000
    working_dir: /data
    entrypoint: [forgejo-runner]
    command: [daemon, --config, /etc/forgejo-runner/config.yaml]
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    group_add:
      - ${CI_DOCKER_SOCKET_GID:-1000}
    secrets:
      - forgejo_runner_token
    configs:
      - source: runner_config
        target: /etc/forgejo-runner/config.yaml
    volumes:
      - type: bind
        source: ${DEPLOYMENT_STATE_ROOT:?Qualify an owned persistent build-disk apps directory}/runner
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${CI_DOCKER_SOCKET:-${DEPLOYMENT_STATE_ROOT:?Qualify the owned state root}/ci-engine/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    networks: [control]
    stop_grace_period: 1m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  database:
    internal: true
  control: {}

secrets:
  database_username:
    file: ${DEPLOYMENT_DATABASE_USERNAME_FILE:?Supply the isolated credential-owner file}
  database_password:
    file: ${DEPLOYMENT_DATABASE_PASSWORD_FILE:?Supply the isolated credential-owner file}
  ferretdb_postgresql_uri:
    file: ${FERRETDB_POSTGRESQL_URI_FILE:?Supply the isolated encoded PostgreSQL URI file}
  komodo_admin_password:
    file: ${KOMODO_ADMIN_PASSWORD_FILE:?Supply the actual isolated bootstrap credential file}
  komodo_jwt:
    file: ${KOMODO_JWT_SECRET_FILE:?Supply the isolated persistent JWT secret file}
  komodo_webhook:
    file: ${KOMODO_WEBHOOK_SECRET_FILE:?Supply the isolated webhook secret file}
  forgejo_runner_token:
    file: ${FORGEJO_RUNNER_TOKEN_FILE:-${DEPLOYMENT_SECRETS_ROOT:?Qualify the isolated secret-owner root}/forgejo-runner-token}

configs:
  runner_config:
    # Render runner.configuration from control-plane.json only after registration/job-image qualification.
    file: ${FORGEJO_RUNNER_CONFIG_FILE:-${DEPLOYMENT_STATE_ROOT:?Qualify the owned state root}/runner/config.yaml}

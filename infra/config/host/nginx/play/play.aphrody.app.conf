# play.aphrody.app - Bun OS gaming web app (apps/play), TLS front of the bun:nginx engine.
#
# Chain: Cloudflare (proxied, SSL strict) -> this distro NGINX vhost (TLS 1.2/1.3, HTTP/2, HTTP/3)
# -> the play NGINX engine owned by bun:nginx (engine.conf, 127.0.0.1:18480) -> the Bun server of
# bun-os-play.service (127.0.0.1:18481).
#
# Why a loopback hop and not SNI pass-through: this NGINX build ships the stream module as a
# dynamic module that is not installed, and every other vhost terminates TLS on the shared http
# *:443 listener. ssl_preread would need a stream listener owning :443 and all other vhosts moved
# behind it; the loopback proxy keeps them untouched. The engine still owns every HTTP policy of
# the site (headers, caching, static files, limits, WebSocket, module).
#
# DNS: Cloudflare zone aphrody.app, A play -> vps public address, proxied.
# TLS: Let's Encrypt `play.aphrody.app` (certbot dns-cloudflare, /etc/letsencrypt/cloudflare.ini,
# ECDSA). No OCSP stapling: Let's Encrypt certificates no longer carry an OCSP responder URL.
# cloudflare-realip.conf (conf.d) restores the client address; proxy-client-ip.inc forwards it.
#
# Install:
#   sudo install -m 644 nginx/play/play.aphrody.app.conf /etc/nginx/conf.d/play.aphrody.app.conf
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=play_edge:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=play_edge_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name play.aphrody.app;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/3: the only QUIC listener of this host, hence reuseport here.
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    http3 on;
    server_name play.aphrody.app;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/play.aphrody.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.aphrody.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:play_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_early_data off;

    # Security and isolation headers come from the engine; only the protocol advertisement is here.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    client_max_body_size 1m;
    limit_req zone=play_edge burst=100 nodelay;
    limit_conn play_edge_conn 64;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        proxy_pass http://127.0.0.1:18480;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Identity headers are only ever set by the engine's mesh listener.
        proxy_set_header X-Aphrody-Tunnel-User "";
        proxy_set_header X-WEBAUTH-USER "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;
    }
}

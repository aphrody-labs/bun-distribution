# Host-wide catch-all. A request whose Host matches no installed vhost is closed instead of
# falling through to the first server block, which would serve (or redirect to) an unrelated
# site: with only aphrody-apex.conf installed, http://nie.aphrody.com/ was redirected to
# https://aphrody.com/ and https://nie.aphrody.com/ was answered by aphrody.com.
# Install as /etc/nginx/conf.d/00-default.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

# The default server also owns the QUIC sockets of this nginx (UDP 443, reuseport): every vhost
# adds a plain `listen 443 quic;`. Its key-exchange groups apply to every TLS 1.3 handshake on
# the shared listeners (hybrid post-quantum X25519MLKEM768 first, OpenSSL >= 3.5).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic reuseport default_server;
    listen [::]:443 quic reuseport default_server;
    server_name _;
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
    access_log off;
    ssl_reject_handshake on;
}

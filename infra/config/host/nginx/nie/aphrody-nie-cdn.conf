# Retired 2026-09-25: nie.aphrody.com's origins (nie-site, nie-model-serve) and its certificate were removed from vps (config/nginx-routes.json status:retired; docs/PLAN.md). Kept as a redeploy template for the Aphrody convergence plan (superproject docs/architecture/APHRODY-CONVERGENCE.md).
# nie.aphrody.com (nie backend) and cdn.aphrody.com (aphrody shared static CDN).
#
# Split out of aphrody.com.conf on 2026-09-23 so both hosts install and validate on their own,
# next to aphrody-apex.conf (aphrody.com), without the hosts that still lack an origin.
#
# Origins:
#   127.0.0.1:8085  nie-site          (systemd/nie/nie-site.service)
#   127.0.0.1:8792  nie-model-serve   (systemd/nie/nie-model-serve.service), public as /cdn/ here and
#                                     at the root of cdn.rosegriffon.fr (scripts/rg/nginx-gen.ts)
#   /home/ubuntu/apps/cdn/current          static release tree (scripts/assets/cdn.ts publish)
#   /home/ubuntu/nie/var/releases/inacord/public   Inacord updater feed and artefacts
#                                     (nie scripts/release-inacord.ts; `public` is its pointer)
#
# Install:
#   sudo install -m 644 nginx/nie/aphrody-nie-cdn.conf /etc/nginx/conf.d/aphrody-nie-cdn.conf
#   sudo install -m 644 nginx/aphrody/aphrody-cdn-static.inc /etc/nginx/conf.d/aphrody-cdn-static.inc
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file defines the `nie_assets` / `nie_conn` zones.
#
# Rollback: remove /etc/nginx/conf.d/aphrody-nie-cdn.conf, `nginx -t`, reload.

limit_req_zone $binary_remote_addr zone=nie_assets:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=nie_conn:10m;

# --- nie: backend (API, CDN, raw VFS), on `nie.aphrody.com` only ----------------------------
# A backend, not a site: decoded data and API (`/api/`), derived game assets (`/cdn/`,
# nie-model-serve: `/cdn/cfg/<vfs>.json`, `/cdn/tex/<vfs>.png`, `/cdn/audio/<vfs>`, …), the
# signed Inacord artefacts (`/downloads/`), and the raw VFS spaces (`/f/`, `/b`), which
# nie-site closes unless a bearer token is configured (NIE_RAW_VFS_TOKEN). nie-model-serve's
# raw and listing routes (`/raw/`, `/vfs/`, `/depot/`, `/export/` without a derived format)
# have no authentication and answer 404 here. No HTML front-end is served: `/` answers 404.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nie.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 10m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Installed Inacord clients poll this updater feed; it stays on the single nie host.
    # `/downloads/channels/stable/latest.json` is the channel-shaped alias older clients use.
    location = /downloads/inacord/latest.json {
        alias /home/ubuntu/nie/var/releases/inacord/public/channels/stable/latest.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /downloads/channels/stable/latest.json {
        alias /home/ubuntu/nie/var/releases/inacord/public/channels/stable/latest.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
    }

    # The artefacts latest.json and catalog.json point to (nie scripts/release-inacord.ts):
    # NSIS/MSI installers and their `.sig`, CLI and MCP archives, plugins. Files only — no
    # listing, and a directory answers 404. Names carry the version but a rebuild of the same
    # version keeps its name, and the updater checks the bytes against the signature in
    # latest.json, so the cache stays short rather than immutable.
    location ^~ /downloads/files/ {
        alias /home/ubuntu/nie/var/releases/inacord/public/files/;
        autoindex off;
        limit_conn nie_conn 4;
        limit_conn_status 429;
        default_type application/octet-stream;
        types {
            application/octet-stream exe msi sig;
            application/zip zip;
            application/gzip gz;
        }
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        location ~ /$ {
            return 404;
        }
    }

    location = /health {
        proxy_pass http://127.0.0.1:8085/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Decoded data, GraphQL, Lua, cfg.bin encode/decode: bounded by nie-site's own limiter.
    location /api/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding $http_accept_encoding;
    }

    # Raw VFS spaces: forwarded with the Authorization header; nie-site answers 404 without
    # a matching bearer token.
    location ~ ^/(f/|b(/|$)) {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nie-model-serve routes that hand out the game itself rather than a derived asset:
    # `/raw/<vfs>` (original bytes), `/vfs/{ls,find,stat,stats}` (listing of the whole installed
    # game), `/depot/` (project source, when enabled). They have no authentication, and nothing
    # needs them here: nie-site reaches nie-model-serve on loopback, not through this vhost.
    # A regex location wins over the `/cdn/` prefix below.
    location ~ ^/cdn/(raw|vfs|depot)(/|$) {
        return 404;
    }

    # Converted downloads: derived formats only. nie-model-serve defaults `/export/` to `raw`
    # when `format` is absent and matches the key exactly, while nginx matches argument names
    # case-insensitively, so the WHOLE query string is checked.
    location ^~ /cdn/export/ {
        if ($args !~ "^format=(png|webp|gif|jpg|bmp|tga|tiff|qoi|json|glb|wav|mp4|webm|h264|m2v)(&id=[0-9]+)?$") {
            return 404;
        }
        limit_req zone=nie_assets burst=20 nodelay;
        limit_conn nie_conn 8;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8792/export/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Derived assets decoded on demand (textures, assembled models, cfg.bin JSON, audio):
    # nie-model-serve, rate limited here because one model assembly costs seconds of CPU.
    location /cdn/ {
        limit_req zone=nie_assets burst=20 nodelay;
        limit_conn nie_conn 8;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8792/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

# --- cdn.aphrody.com: aphrody's shared static CDN only (nothing from nie) --------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdn.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_req zone=nie_assets burst=20 nodelay;
    limit_req_status 429;

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # `/s/<scope>/…`, `/h/<hash>`, `/s/manifest.json` (tools/config/asset-catalog.json).
    include /etc/nginx/conf.d/aphrody-cdn-static.inc;

    location / {
        return 404;
    }
}

# --- HTTP -> HTTPS for the two hosts of this file ---------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nie.aphrody.com cdn.aphrody.com;
    access_log off;
    return 301 https://$host$request_uri;
}

# SPDX-License-Identifier: Apache-2.0
# nie.aphrody.app — public IEVR asset origin for iecode and rg (Vercel: NEXT_PUBLIC_CDN_ORIGIN).
#
# Origin: 127.0.0.1:8792 nie-model-serve (systemd/nie/nie-model-serve.service), served at the
# root of this host (`/model-full/<code>.glb`, `/tex/<vfs>.png`, `/avatar/catalog.json`, …).
# DNS: Cloudflare zone aphrody.app, A nie -> vps public address, proxied.
# TLS: Let's Encrypt `nie.aphrody.app` (certbot dns-cloudflare, /etc/letsencrypt/cloudflare.ini).
#
# Install:
#   sudo install -m 644 nginx/nie/nie.aphrody.app.conf /etc/nginx/conf.d/nie.aphrody.app.conf
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=nie_assets:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=nie_conn:10m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nie.aphrody.app;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/nie.aphrody.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nie.aphrody.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /health {
        proxy_pass http://127.0.0.1:8792/health;
        proxy_http_version 1.1;
        access_log off;
    }

    # Routes that hand out the game itself rather than a derived asset (original bytes,
    # listing of the installed game, project source): never public.
    location ~ ^/(raw|vfs|depot)(/|$) {
        return 404;
    }

    # Converted downloads: derived formats only. nie-model-serve defaults `/export/` to `raw`
    # when `format` is absent, and nginx matches argument names case-insensitively, so the
    # whole query string is checked.
    location ^~ /export/ {
        if ($args !~ "^format=(png|webp|gif|jpg|bmp|tga|tiff|qoi|json|glb|wav|mp4|webm|h264|m2v)(&id=[0-9]+)?$") {
            return 404;
        }
        limit_req zone=nie_assets burst=20 nodelay;
        limit_conn nie_conn 8;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Derived assets decoded on demand (models, textures, cfg.bin JSON, audio, video), rate
    # limited because one model assembly costs seconds of CPU.
    location / {
        limit_req zone=nie_assets burst=40 nodelay;
        limit_conn nie_conn 8;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "*" always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name nie.aphrody.app;
    access_log off;
    return 301 https://$host$request_uri;
}

# Migré du VPS vers dbfr le 2026-10-09 (chantier P) ; servi par le conteneur shenron-gateway (network host).
# Rose Griffon: no application on this host; every name answers the maintenance page (503).
server {
    listen 80;
    listen [::]:80;
    server_name rosegriffon.fr www.rosegriffon.fr api.rosegriffon.fr cdn.rosegriffon.fr azalee.rosegriffon.fr mcp.rosegriffon.fr ranked.rosegriffon.fr;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rosegriffon.fr www.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    root /var/www/maintenance;
    error_page 503 /index.html;
    location ~ ^/(bg|logo)\.webp$ { expires 1d; try_files $uri =404; }
    location = /index.html {
        internal;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }
    location / { return 503; }
}


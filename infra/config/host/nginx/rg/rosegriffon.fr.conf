# rosegriffon.fr (www redirects) — Rose Griffon website (systemd/rg/rg-website.service, 127.0.0.1:3100).
# DNS: Cloudflare zone rosegriffon.fr, A @ and www -> vps public address, proxied.
# TLS: Let's Encrypt `rosegriffon.fr` (certbot dns-cloudflare, /etc/letsencrypt/cloudflare.ini).
# Game assets come from nie.aphrody.app (NEXT_PUBLIC_CDN_ORIGIN).
#
# Install:
#   sudo install -m 644 nginx/rg/rosegriffon.fr.conf /etc/nginx/conf.d/rosegriffon.fr.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 301 https://rosegriffon.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 25m;

    location ^~ /_next/static/ {
        alias /home/ubuntu/apps/rg/current/apps/rg-website/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name rosegriffon.fr www.rosegriffon.fr;
    return 301 https://rosegriffon.fr$request_uri;
}

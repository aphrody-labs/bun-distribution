# SPDX-License-Identifier: Apache-2.0
# rg-core (systemd/rg/rg-core.service, 127.0.0.1:8810) — one Bun process for the Discord gateways,
# the Achilléa ranked Colyseus server (+ legacy `/api/*` → unified API in process), the supervised
# nie-model-serve child and the in-process cron.
#   ranked.rosegriffon.fr  wss + REST (Colyseus matchmaking, rooms, `/api/*`)
#   bot.rosegriffon.fr     `/health`, `/<profil>/…` bot admin servers (Bearer BOT_ADMIN_TOKEN)
#   cdn.rosegriffon.fr     IEVR assets (snippets/nie-assets.inc), heavy media from disk
#                          (`/storage/v1/object/public/{tweets,assets}/`, Supabase fallback), `/static/`
# DNS: Cloudflare zone rosegriffon.fr, A ranked/bot/cdn -> vps public address, proxied.
# TLS: Let's Encrypt `rg-core` (certbot dns-cloudflare, /etc/letsencrypt/cloudflare.ini):
#   sudo certbot certonly --dns-cloudflare --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     --cert-name rg-core -d ranked.rosegriffon.fr -d bot.rosegriffon.fr -d cdn.rosegriffon.fr
# Requires the `nie_assets` / `nie_conn` zones of nginx/nie/nie.aphrody.app.conf.
#
# Install:
#   sudo install -m 644 nginx/rg/rg-core.conf /etc/nginx/conf.d/rg-core.conf
#   sudo install -m 644 nginx/snippets/nie-assets.inc /etc/nginx/snippets/nie-assets.inc
#   sudo nginx -t && sudo systemctl reload nginx

# Audience stream read by the `stats:achillea` cron task (tab-separated, see its parser).
log_format rg_stats escape=json
    '$time_iso8601\t$host\t$request_method\t$uri\t$status\t$body_bytes_sent\t'
    '$request_time\t$upstream_response_time\t$upstream_cache_status\t'
    '$http_referer\t$http_user_agent\t$remote_addr';

map $http_upgrade $rg_core_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ranked.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rg-core/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rg-core/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/rg-stats.log rg_stats buffer=32k flush=5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Dispute proofs are uploaded as text-encoded images up to 8 MiB.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rg_core_connection;
        # Colyseus rooms stay open for a whole match.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rg-core/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rg-core/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdn.rosegriffon.fr;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/rg-core/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rg-core/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    # Heavy public media written by rg-cron (RG_MEDIA_ROOT): same URL shape as Supabase Storage,
    # immutable, cached by Cloudflare. Objects not yet on disk fall back to Supabase Storage.
    location ~ ^/storage/v1/object/public/(tweets|assets)/(.+)$ {
        root /var/lib/rg-core/media;
        try_files /$1/$2 @storage;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location @storage {
        proxy_pass https://xzwfnxzkxtcpgmtqulbh.supabase.co;
        proxy_http_version 1.1;
        proxy_set_header Host xzwfnxzkxtcpgmtqulbh.supabase.co;
        proxy_ssl_server_name on;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Static CDN tree synchronised by the `cdn` cron task (CDN_STATIC_ROOT).
    location ^~ /static/ {
        alias /var/lib/rg-core/cdn/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Legacy CDN layout used by the site: `/dx11/<vfs>.png` is the decoded texture `/tex/dx11/<vfs>.png`.
    location ~ ^/dx11/.+\.png$ {
        rewrite ^ /tex$uri break;
        limit_req zone=nie_assets burst=40 nodelay;
        limit_conn nie_conn 8;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Cut-in camera tracks (`.g4cm`) are the only raw game bytes the site reads.
    location ~ ^/raw/.+\.g4cm$ {
        limit_req zone=nie_assets burst=20 nodelay;
        limit_conn nie_conn 8;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        add_header Access-Control-Allow-Origin "*" always;
    }

    include snippets/nie-assets.inc;
}

server {
    listen 80;
    listen [::]:80;
    server_name ranked.rosegriffon.fr bot.rosegriffon.fr cdn.rosegriffon.fr;
    return 301 https://$host$request_uri;
}

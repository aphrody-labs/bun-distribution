#
# deploy.aphrody.app: the Komodo control plane (aphrody-komodo-core, 127.0.0.1:29021, ~/apps/komodo/compose.yaml).
# Generated from deploy.aphrody.app.json: aphrody-infra nginx render deploy.aphrody.app.json --comment ... > deploy.aphrody.app.conf
# TLS: Let's Encrypt, certificate /etc/letsencrypt/live/aphrody-control (SAN deploy.aphrody.app).
# Installed on the vps host nginx as /etc/nginx/conf.d/deploy.aphrody.app.conf. Rollback: restore the .bak file, nginx -t, reload.
server {
    listen 80;
    listen [::]:80;
    server_name deploy.aphrody.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name deploy.aphrody.app;
    ssl_certificate /etc/letsencrypt/live/aphrody-control/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody-control/privkey.pem;
    http2 on;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 512m;
    include snippets/aphrody-security.inc;

    location = /install {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:29021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}


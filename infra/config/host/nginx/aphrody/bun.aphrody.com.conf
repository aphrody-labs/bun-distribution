#
# bun.aphrody.com: former host of the Bun runtime fork site. The site (home, /runtime, docs, downloads, installers)
# and its API now run on Cloudflare at https://aphrody.com (Worker aphrody-webos; legacy API Worker aphrody-app,
# packages/web/cloudflare, published by packages/web/site/publish.ts). Every path answers a permanent redirect to
# the same path on aphrody.com (single hop, infra/config/routes.catalog.json), so existing `curl -fsSL https://bun.aphrody.com/install | bash` links keep working.
# TLS: Let's Encrypt webroot, certificate /etc/letsencrypt/live/aphrody.com.
server {
    listen 80;
    listen [::]:80;
    server_name bun.aphrody.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://aphrody.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bun.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aphrody_tls:10m;
    ssl_session_timeout 1d;
    access_log off;

    location / {
        include snippets/aphrody-security.inc;
        return 301 https://aphrody.com$request_uri;
    }
}

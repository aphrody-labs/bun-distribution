server {
    listen 80;
    listen [::]:80;
    server_name git.aphrody.app source.aphrody.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name git.aphrody.app;
    ssl_certificate /home/ubuntu/.aphrody/secrets/tls/source-origin/fullchain.pem;
    ssl_certificate_key /home/ubuntu/.aphrody/secrets/tls/source-origin/privkey.pem;
    http2 on;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 512m;
    include snippets/aphrody-security.inc;
    include snippets/bun-os-product-api.inc;

    location = /install {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:29020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-WEBAUTH-USER ;
        proxy_set_header X-WEBAUTH-EMAIL ;
        proxy_set_header X-WEBAUTH-FULLNAME ;
        proxy_set_header X-Aphrody-Tunnel-User ;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name source.aphrody.app;
    ssl_certificate /etc/letsencrypt/live/source.aphrody.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/source.aphrody.app/privkey.pem;
    http2 on;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 512m;
    include snippets/aphrody-security.inc;
    include snippets/bun-os-product-api.inc;

    location = /install {
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:29020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        include snippets/source-tunnel-auth.inc;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}


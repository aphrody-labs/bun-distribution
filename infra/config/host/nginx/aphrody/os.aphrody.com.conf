# os.aphrody.com: the WebOS was removed on 2026-10-23; the name redirects to the Bun site.
# The /desktop/ container (aphrody-bun-os, 127.0.0.1:18804) and the /api/search route are retired with it.
# Installed on the vps host nginx as /etc/nginx/conf.d/os.aphrody.com.conf. Rollback: restore the previous file, `nginx -t`, reload.
server {
    listen 80;
    listen [::]:80;
    server_name os.aphrody.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://bun.aphrody.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name os.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aphrody_tls:10m;
    ssl_session_timeout 1d;

    include snippets/aphrody-security.inc;

    location / { return 301 https://bun.aphrody.com$request_uri; }
}

# Installed as /etc/ssh/sshd_config.d/62-postgres-no-login.conf on dbfr only. The postgres role is reached through
# `sudo -u postgres` (journaled), never through a direct login: no ssh session as postgres, from any source.
# The plan checks first that /var/lib/postgresql/.ssh/authorized_keys does not exist, so no key in use is cut.
DenyUsers postgres

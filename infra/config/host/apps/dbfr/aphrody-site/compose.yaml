# SPDX-License-Identifier: Apache-2.0
services:
  aphrody-site:
    image: sha256:8b12917085a44f30c1dbee201c62a206be2b2e38b11c2ed2cffbfafa2b091489
    pull_policy: never
    entrypoint: ["/usr/local/bin/bun"]
    command: ["run", "/opt/public-site/server.mjs"]
    environment:
      PORT: "3000"
      SITE_HOST: "0.0.0.0"
      SITE_HOSTS: aphrody.com,www.aphrody.com,yohan.aphrody.com
      SITE_PUBLIC_ORIGIN: https://aphrody.com
      APP_UI_ROOT: /opt/public-site/app-ui
      SITE_ROOT: /opt/public-site/app-ui
      SITE_CATALOG_MODULE: /opt/public-site/catalog.mjs
      SITE_THEME_FILE: /opt/public-site/google-public-theme.css
      SITE_PUBLIC_CATALOG: /opt/public-site/public-catalog.json
      SITE_M3_RENDERER: http://m3-renderer:3000
      GOOGLE_SEARCH_OWNER: /opt/aphrody
      DOWNLOADS_ROOT: /srv/downloads
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    cpus: 2
    ports:
      - "10.200.77.3:18803:3000"
    volumes:
      - /home/ubuntu/.local/share/aphrody-runtime-20261011/bun-1.4.4-qualified:/usr/local/bin/bun:ro
      - /home/ubuntu/.local/bin/aphrody:/opt/aphrody:ro
      - /srv/aphrody/releases/bun-m3-main-20261011:/opt/public-site:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:3000/health')).status === 204 ? 0 : 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
  m3-renderer:
    image: sha256:8b12917085a44f30c1dbee201c62a206be2b2e38b11c2ed2cffbfafa2b091489
    pull_policy: never
    entrypoint: ["/opt/aphrody-site"]
    command: ["--root", "/srv/site", "--bind", "0.0.0.0:3000"]
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 32
    cpus: 0.5
    volumes:
      - /home/ubuntu/.local/share/aphrody-runtime-20261011/aphrody-site:/opt/aphrody-site:ro
      - /srv/aphrody/releases/site-20261011b:/srv/site:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000

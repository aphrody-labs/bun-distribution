# Low-latency graph and a virtual sink the session plays into; the sender captures its monitor.
context.properties = {
    default.clock.rate = 48000
    default.clock.quantum = 480
    default.clock.min-quantum = 240
}

context.objects = [
    {   factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = "gamestream"
            node.description = "Gamestream"
            media.class = Audio/Sink
            audio.position = [ FL FR ]
            audio.rate = 48000
            monitor.channel-volumes = true
            priority.session = 2000
        }
    }
]

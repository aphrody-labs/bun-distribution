# Wolf configuration for the Bun OS VPS (CPU only). Derived from the default config.v7.toml of
# games-on-whales/wolf (MIT License, Copyright (c) games-on-whales contributors); the
# [gstreamer] section below is upstream's, with the x264 entry tuned for zero-latency CPU use.
# up.sh seeds it into $WOLF_STATE/cfg/config.toml once: Wolf then owns that copy (it records
# paired clients there).
hostname = "Bun OS VPS"
config_version = 7
paired_clients = []

[[profiles]]
id = "moonlight-profile-id"

# gamescope + glxgears (llvmpipe) from aphrody/bun-gamestream: the end-to-end CPU workload.
[[profiles.apps]]
title = "Gamescope glxgears (CPU)"
start_virtual_compositor = true

[profiles.apps.runner]
type = "docker"
name = "BunGamestreamGlxgears"
image = "aphrody/bun-gamestream:local"
mounts = []
env = [
    "GAMESTREAM_MODE=wolf-app",
    "GAMESTREAM_APP=glxgears -fullscreen",
    "LP_NUM_THREADS=4",
]
devices = []
ports = []
base_create_json = """
{
  "HostConfig": {
    "IpcMode": "host",
    "CpusetCpus": "4-11",
    "Memory": 25769803776,
    "CapAdd": ["SYS_NICE"],
    "Privileged": false,
    "DeviceCgroupRules": ["c 13:* rmw", "c 244:* rmw"]
  }
}
\
"""

[[profiles.apps]]
title = "Gamescope vkcube (CPU)"
start_virtual_compositor = true

[profiles.apps.runner]
type = "docker"
name = "BunGamestreamVkcube"
image = "aphrody/bun-gamestream:local"
mounts = []
env = [
    "GAMESTREAM_MODE=wolf-app",
    "GAMESTREAM_APP=vkcube",
    "LP_NUM_THREADS=4",
]
devices = []
ports = []
base_create_json = """
{
  "HostConfig": {
    "IpcMode": "host",
    "CpusetCpus": "4-11",
    "Memory": 25769803776,
    "CapAdd": ["SYS_NICE"],
    "Privileged": false,
    "DeviceCgroupRules": ["c 13:* rmw", "c 244:* rmw"]
  }
}
\
"""

# Steam Big Picture in gamescope (games-on-whales image, pulled on first launch). The owner
# signs in manually inside the stream; the library lives on the /games volume.
[[profiles.apps]]
title = "Steam (CPU)"
icon_png_path = "https://games-on-whales.github.io/wildlife/apps/steam/assets/icon.png"
start_virtual_compositor = true

[profiles.apps.runner]
type = "docker"
name = "BunWolfSteam"
image = "ghcr.io/games-on-whales/steam:edge"
mounts = ["/games/SteamLibrary-wolf:/home/retro/.steam/debian-installation/steamapps:rw"]
env = [
    "RUN_GAMESCOPE=true",
    "GAMESCOPE_WIDTH=1280",
    "GAMESCOPE_HEIGHT=720",
    "GAMESCOPE_REFRESH=60",
    "LP_NUM_THREADS=4",
    "GOW_REQUIRED_DEVICES=/dev/input/* /dev/dri/*",
]
devices = []
ports = []
base_create_json = """
{
  "HostConfig": {
    "IpcMode": "host",
    "CpusetCpus": "4-11",
    "Memory": 25769803776,
    "CapAdd": ["SYS_ADMIN", "SYS_NICE", "SYS_PTRACE", "NET_RAW", "MKNOD", "NET_ADMIN"],
    "SecurityOpt": ["seccomp=unconfined", "apparmor=unconfined"],
    "Ulimits": [{"Name":"nofile", "Hard":10240, "Soft":10240}],
    "Privileged": false,
    "DeviceCgroupRules": ["c 13:* rmw", "c 244:* rmw"]
  }
}
\
"""

[[profiles.apps]]
title = "Test ball"
start_virtual_compositor = false
start_audio_server = false

[profiles.apps.runner]
type = "process"
run_cmd = "sh -c \"while :; do sleep 10; done\""

[profiles.apps.video]
source = """
videotestsrc pattern=ball flip=true is-live=true !
video/x-raw, framerate={fps}/1
\
"""

[profiles.apps.audio]
source = "audiotestsrc wave=ticks is-live=true"

[gstreamer]

[gstreamer.video]

default_source = 'interpipesrc name=interpipesrc_{}_video listen-to={session_id}_video is-live=true stream-sync=restart-ts max-bytes=0 max-buffers=1 leaky-type=downstream'
default_sink = """
queue ! \
rtpmoonlightpay_video name=moonlight_pay \
payload_size={payload_size} fec_percentage={fec_percentage} min_required_fec_packets={min_required_fec_packets} !
appsink sync=false max-buffers=1 drop=true name=wolf_udp_sink
"""

######################
# Default settings for the main encoders
# To avoid repetition between H264, HEVC and AV1 encoders
[gstreamer.video.defaults.nvcodec]
video_params = """
cudaupload !
cudaconvertscale add-borders=true !
video/x-raw(memory:CUDAMemory), width={width}, height={height}, \
chroma-site={color_range}, format=NV12, colorimetry={color_space}, pixel-aspect-ratio=1/1\
"""

video_params_zero_copy = """
cudaupload !
cudaconvertscale add-borders=true !
video/x-raw(memory:CUDAMemory),format=NV12, width={width}, height={height}, pixel-aspect-ratio=1/1
"""

[gstreamer.video.defaults.qsv]
video_params = """
videoconvertscale !
video/x-raw, chroma-site={color_range}, width={width}, height={height}, format=NV12,
colorimetry={color_space}, pixel-aspect-ratio=1/1\
"""

video_params_zero_copy = """
vapostproc add-borders=true !
video/x-raw(memory:VAMemory), format=NV12, width={width}, height={height}, pixel-aspect-ratio=1/1\
"""

[gstreamer.video.defaults.va]
video_params = """
vapostproc add-borders=true !
video/x-raw, chroma-site={color_range}, width={width}, height={height}, format=NV12,
colorimetry={color_space}, pixel-aspect-ratio=1/1\
"""

video_params_zero_copy = """
vapostproc add-borders=true !
video/x-raw(memory:VAMemory), format=NV12, width={width}, height={height}, pixel-aspect-ratio=1/1\
"""

######################
# HEVC encoders
# Order here matters: Wolf will try them in order and pick the first one that's not failing
###
[[gstreamer.video.hevc_encoders]]
plugin_name = "nvcodec"
check_elements = ["nvh265enc", "cudaconvertscale", "cudaupload"]
encoder_pipeline = """
nvh265enc gop-size=-1 bitrate={bitrate} vbv-buffer-size={vbv_buffer_size} aud=false rc-mode=cbr zerolatency=true preset=p1 tune=ultra-low-latency multi-pass=two-pass-quarter !
h265parse !
video/x-h265, profile=main, stream-format=byte-stream\
"""

[[gstreamer.video.hevc_encoders]]
plugin_name = "va"
check_elements = ["vah265enc", "vapostproc"]
encoder_pipeline = """
vah265enc aud=false b-frames=0 ref-frames=1 num-slices={slices_per_frame} bitrate={bitrate} cpb-size={vbv_buffer_size} min-qp=20 key-int-max=1024 rate-control=cbr target-usage=6 !
h265parse !
video/x-h265, profile=main, stream-format=byte-stream\
"""

[[gstreamer.video.hevc_encoders]]
plugin_name = "qsv"
check_elements = ["qsvh265enc", "vapostproc"]
encoder_pipeline = """
qsvh265enc b-frames=0 gop-size=0 idr-interval=1 ref-frames=1 bitrate={bitrate} rate-control=cbr low-latency=1 target-usage=6 !
h265parse !
video/x-h265, profile=main, stream-format=byte-stream\
"""

[[gstreamer.video.hevc_encoders]]
plugin_name = "va"
check_elements = ["vah265lpenc", "vapostproc"] # lp: (Low Power)
encoder_pipeline = """
vah265lpenc aud=false b-frames=0 ref-frames=1 num-slices={slices_per_frame} bitrate={bitrate} cpb-size={vbv_buffer_size} min-qp=20 key-int-max=1024 rate-control=cbr target-usage=6 !
h265parse !
video/x-h265, profile=main, stream-format=byte-stream\
"""

[[gstreamer.video.hevc_encoders]]
plugin_name = "x265" # SW Encoding
check_elements = ["x265enc"]
video_params = """
videoconvertscale !
videorate !
video/x-raw, width={width}, height={height}, framerate={fps}/1, format=I420,
chroma-site={color_range}, colorimetry={color_space}\
"""
video_params_zero_copy = """
videoconvertscale !
videorate !
video/x-raw, width={width}, height={height}, framerate={fps}/1, format=I420,
chroma-site={color_range}, colorimetry={color_space}\
"""
encoder_pipeline = """
x265enc tune=zerolatency speed-preset=superfast bitrate={bitrate}
option-string="info=0:keyint=-1:qp=28:repeat-headers=1:slices={slices_per_frame}:aud=0:annexb=1:log-level=3:open-gop=0:bframes=0:intra-refresh=0" !
video/x-h265, profile=main, stream-format=byte-stream\
"""


######################
# H264 encoders
# Order here matters: Wolf will try them in order and pick the first one that's not failing
###
[[gstreamer.video.h264_encoders]]
plugin_name = "nvcodec"
check_elements = ["nvh264enc", "cudaconvertscale", "cudaupload"]
encoder_pipeline = """
nvh264enc preset=low-latency-hq zerolatency=true gop-size=0 rc-mode=cbr-ld-hq bitrate={bitrate} vbv-buffer-size={vbv_buffer_size} aud=false !
h264parse !
video/x-h264, profile=main, stream-format=byte-stream\
"""

[[gstreamer.video.h264_encoders]]
plugin_name = "va"
check_elements = ["vah264enc", "vapostproc"]
encoder_pipeline = """
vah264enc aud=false b-frames=0 ref-frames=1 num-slices={slices_per_frame} bitrate={bitrate} cpb-size={vbv_buffer_size} min-qp=20 key-int-max=1024 rate-control=cbr target-usage=6 !
h264parse !
video/x-h264, profile=main, stream-format=byte-stream\
"""

[[gstreamer.video.h264_encoders]]
plugin_name = "va"
check_elements = ["vah264lpenc", "vapostproc"] # lp: (Low Power)
encoder_pipeline = """
vah264lpenc aud=false b-frames=0 ref-frames=1 num-slices={slices_per_frame} bitrate={bitrate} cpb-size={vbv_buffer_size} min-qp=20 key-int-max=1024 rate-control=cbr target-usage=6 !
h264parse !
video/x-h264, profile=main, stream-format=byte-stream\
"""

[[gstreamer.video.h264_encoders]]
plugin_name = "qsv"
check_elements = ["qsvh264enc", "vapostproc"]
encoder_pipeline = """
qsvh264enc b-frames=0 gop-size=0 idr-interval=1 ref-frames=1 bitrate={bitrate} rate-control=cbr target-usage=6  !
h264parse !
video/x-h264, profile=main, stream-format=byte-stream\
"""

[[gstreamer.video.h264_encoders]]
plugin_name = "x264" # SW Encoding
check_elements = ["x264enc"]
encoder_pipeline = """
x264enc pass=qual tune=zerolatency speed-preset=ultrafast b-adapt=false bframes=0 ref=1
sliced-threads=true threads={slices_per_frame} option-string="slices={slices_per_frame}:keyint=infinite:open-gop=0"
b-adapt=false bitrate={bitrate} aud=false !
video/x-h264, profile=high, stream-format=byte-stream\
"""

##############
# AV1 encoders
###
[[gstreamer.video.av1_encoders]]
plugin_name = "nvcodec"
check_elements = ["nvav1enc", "cudaconvertscale", "cudaupload"]
encoder_pipeline = """
nvav1enc gop-size=-1 bitrate={bitrate} vbv-buffer-size={vbv_buffer_size} rc-mode=cbr zerolatency=true preset=p1 tune=ultra-low-latency multi-pass=two-pass-quarter !
av1parse !
video/x-av1, stream-format=obu-stream, alignment=frame, profile=main\
"""

[[gstreamer.video.av1_encoders]]
plugin_name = "va"
check_elements = ["vaav1enc", "vapostproc"]
encoder_pipeline = """
vaav1enc ref-frames=1 bitrate={bitrate} cpb-size={vbv_buffer_size} key-int-max=1024 rate-control=cbr min-qp=20 target-usage=6 !
av1parse !
video/x-av1, stream-format=obu-stream, alignment=frame, profile=main\
"""

[[gstreamer.video.av1_encoders]]
plugin_name = "va"
check_elements = ["vaav1lpenc", "vapostproc"] # LP = Low Power
encoder_pipeline = """
vaav1lpenc ref-frames=1 bitrate={bitrate} cpb-size={vbv_buffer_size} key-int-max=1024 rate-control=cbr min-qp=20 target-usage=6 !
av1parse !
video/x-av1, stream-format=obu-stream, alignment=frame, profile=main\
"""

[[gstreamer.video.av1_encoders]]
plugin_name = "qsv"
check_elements = ["qsvav1enc", "vapostproc"]
encoder_pipeline = """
qsvav1enc gop-size=0 ref-frames=1 bitrate={bitrate} rate-control=cbr low-latency=1 target-usage=6 !
av1parse !
video/x-av1, stream-format=obu-stream, alignment=frame, profile=main\
"""

[[gstreamer.video.av1_encoders]]
plugin_name = "aom"
check_elements = ["av1enc"]
video_params = """
videoconvertscale !
videorate !
video/x-raw, width={width}, height={height}, framerate={fps}/1, format=I420,
chroma-site={color_range}, colorimetry={color_space}\
"""
video_params_zero_copy = """
videoconvertscale !
videorate !
video/x-raw, width={width}, height={height}, framerate={fps}/1, format=I420,
chroma-site={color_range}, colorimetry={color_space}\
"""
encoder_pipeline = """
av1enc usage-profile=realtime end-usage=vbr target-bitrate={bitrate} !
av1parse !
video/x-av1, stream-format=obu-stream, alignment=frame, profile=main\
"""

###########
# Audio
###
[gstreamer.audio]
default_source = """
interpipesrc name=interpipesrc_{}_audio listen-to={session_id}_audio is-live=true stream-sync=restart-ts max-bytes=0 max-buffers=3 block=false\
"""

default_audio_params = "queue max-size-buffers=3 leaky=downstream ! audiorate ! audioconvert"

default_opus_encoder = """
opusenc bitrate={bitrate} bitrate-type=cbr frame-size={packet_duration} bandwidth=fullband \
audio-type=restricted-lowdelay max-payload-size=1400\
"""

default_sink = """
queue ! \
rtpmoonlightpay_audio name=moonlight_pay packet_duration={packet_duration} encrypt={encrypt} \
aes_key="{aes_key}" aes_iv="{aes_iv}" !
appsink name=wolf_udp_sink\
"""

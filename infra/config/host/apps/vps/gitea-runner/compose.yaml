# SPDX-License-Identifier: Apache-2.0
services:
  gitea-runner:
    image: docker.io/gitea/runner:5.0.0@sha256:328b8dad8de80a19dab6c5c61292c1d624cd3460c25a5c0067e95c11318657ca
    container_name: aphrody-gitea-runner
    restart: unless-stopped
    init: true
    profiles: [control-agents]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    environment:
      APHRODY_HOST_HOME: ${HOME}
    working_dir: /data
    entrypoint: [gitea-runner]
    command: [daemon, --config, /data/config.yaml]
    volumes:
      - ./data:/data
      - ./config.yaml:/data/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/build/gitea-work:${HOME}/build/gitea-work
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

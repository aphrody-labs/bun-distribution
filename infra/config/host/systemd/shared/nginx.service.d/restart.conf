# nginx ne se relançait PAS en cas de crash (Restart=no par défaut) → tout le site
# tombait. Drop-in : relance auto, sans limite de tentatives : un démarrage qui échoue
# parce qu'un upstream ne se résout pas encore (DNS) est retenté jusqu'au succès.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5

# privoxy.service drop-in for the Shenron media proxy (Mullvad SOCKS5 over
# wg0, exposed as HTTP on 127.0.0.1:8119). Moved from
# shenron/deploy/systemd/privoxy.service.d/shenron-media.conf.
#
# Installed by deploy/install-media-vpn-proxy.sh (aphrody-labs/shenron), which reads this file
# from the sibling aphrody-infra checkout. Host-level package: candidate for a
# shared aphrody-os component (see shenron/docs/INFRA-DELEGATION.md).
#
#   sudo install -d -m 0755 /etc/systemd/system/privoxy.service.d
#   sudo install -m 0644 $YOLO_ROOT/tools/config/host/systemd/shenron/privoxy.service.d/shenron-media.conf \
#     /etc/systemd/system/privoxy.service.d/shenron-media.conf
#   sudo systemctl daemon-reload && sudo systemctl restart privoxy.service
[Unit]
After=network-online.target wg-quick@wg0.service
Wants=network-online.target wg-quick@wg0.service
StartLimitIntervalSec=5min
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=10s

# Aphrody tmux profile (WSL and VPS). Sessions: vps-tunnel (local SSH master + git daemon) and
# vps-cargo (remote Cargo jobs), driven by scripts/build/rust/vps-cargo.ts.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 200000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
setw -g aggressive-resize on
set -g status-interval 10
set -g status-left-length 30
set -g status-right-length 80
# Tunnel state from the SSH control socket: no process is spawned beyond test(1).
set -g status-right "#(test -S $HOME/.ssh/cm/vps-cargo && echo \"VPS <->\" || echo \"VPS --\") | #H %H:%M"
bind r { source-file ~/.tmux.conf; display "tmux reloaded" }
bind T run-shell "bun ~/src/aphrody/scripts/build/rust/vps-cargo.ts tunnel status"

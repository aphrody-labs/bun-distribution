[package]
name = "__NAME__-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "__IDENT___desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tauri comes from the Aphrody forks of the yolo checkout (package aphrody-*, upstream dependency keys).
[build-dependencies]
tauri-build = { package = "aphrody-tauri-build", path = "__YOLO__/crates/aphrody-tauri-build", version = "1.4.4" }

[dependencies]
tauri = { package = "aphrody-tauri", path = "__YOLO__/crates/aphrody-tauri", version = "1.4.4" }
tauri-plugin-opener = { package = "aphrody-tauri-plugin-opener", path = "__YOLO__/crates/aphrody-tauri-plugin-opener", version = "1.4.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Optimise la RAM globale en activant le mode smol de Bun
smol = true

[install]
# Layout des node_modules. À partir de Bun 1.3 le défaut des workspaces est
# passé à "isolated" : chaque app reçoit son propre node_modules et la racine ne
# garde que ses dépendances propres. Le layout est choisi par `linker`.
#
# Toute l'infra du dépôt suppose l'arbre HOISTÉ : `scripts/ops/deploy-site.ts` et
# surtout les units systemd `shenron-site{,-b}.service` pointent
# `<repo>/node_modules/next/dist/bin/next`. Basculer en isolated a fait échouer
# le déploiement du 2026-08-15 et laissait la prod en panne au premier restart.
linker = "hoisted"
# Un runtime de production ne télécharge jamais implicitement une dépendance
# absente. Les installations explicites restent faites avec `bun ci`.
auto = "disable"
# Évite les rafales de postinstall sur le VPS tout en gardant du parallélisme.
concurrentScripts = 4
# Filtre uniquement les NOUVELLES résolutions ; bun.lock reste inchangé.
minimumReleaseAge = 259200
saveTextLockfile = true
registry = "https://registry.npmjs.org/"

[install.scopes]
"@aphrody" = { url = "https://registry.npmjs.org/" }

[run]
# Les scripts qui invoquent `node` utilisent le runtime Bun, sans installer Node.js.
bun = true
silent = false

[test]
coverage = false

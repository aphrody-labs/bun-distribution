# Profile of `yolo update rust doctor` (stage `test`): run every test, keep going, and write a JUnit report to
# target/nextest/doctor/junit.xml. One retry separates a flaky test (reported as a warning) from a failing one.
# Six test threads match the six rustc jobs of scripts/build/rust/cargo-serial.sh.
[profile.doctor]
fail-fast = false
retries = 1
test-threads = 6
status-level = "fail"
final-status-level = "flaky"
failure-output = "final"
success-output = "never"
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.doctor.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

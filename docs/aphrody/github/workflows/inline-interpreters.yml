# SPDX-License-Identifier: Apache-2.0
name: Inline interpreter ratchet

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the aphrody-labs/bun runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/aphrody-labs/bun/main/scripts/aphrody/install.sh | bash -s 1.4.4
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      # The scanner imports only Node built-ins: no install step is needed.
      - name: Check inline Python/Bun/Node against the baseline
        run: |
          bun packages/engine/yolo/src/index.ts ops automation-inventory --inline --check --markdown \
            | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

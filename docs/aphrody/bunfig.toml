[install]
linker = "isolated"
globalStore = true
hoist = false
# react-selecto 1.26 imports the first two without declaring them, swiper 14 imports react (phantom dependencies).
publicHoistPattern = ["@daybrush/utils", "framework-utils", "react", "react-dom"]
saveTextLockfile = true
minimumReleaseAge = 259200
# Owner-published forks use exact pins. Security fixes (next, nodemailer, undici) and Tauri v3 alphas must track the Rust crates in real time (tools/config/update, tauri sync).
minimumReleaseAgeExcludes = [
  "@aphrody/typesafe-sdk",
  "@aphrody/bun-cloudflare",
  "@cloudflare/workers-types",
  "@aphrody/base-ui",
  "@aphrody/ag-ui-client",
  "@aphrody/mcp-ui",
  "@aphrody/material-web",
  "@aphrody/bun-types",
  "@aphrody/bun-webview-page",
  "@aphrody/bun-plugin-tailwind",
  "@aphrody/next-bun",
  "@aphrody/bun-plugin-svelte",
  "@aphrody/bun-plugin-yaml",
  "@aphrody/bun-mdx-rs",
  "@aphrody/bun-mdx-rs-darwin-arm64",
  "@aphrody/bun-mdx-rs-darwin-x64",
  "@aphrody/bun-mdx-rs-linux-x64-gnu",
  "@aphrody/bun-mdx-rs-linux-arm64-gnu",
  "@aphrody/bun-mdx-rs-linux-x64-musl",
  "@aphrody/bun-mdx-rs-linux-arm64-musl",
  "@aphrody/bun-mdx-rs-win32-x64-msvc",
  "@aphrody/bun-mdx-rs-win32-arm64-msvc",
  "@aphrody/bun-plugin-n2b",
  "@aphrody/bun-plugin-oxc",
  "@aphrody/bun-plugin-oxc-darwin-arm64",
  "@aphrody/bun-plugin-oxc-darwin-x64",
  "@aphrody/bun-plugin-oxc-linux-x64-gnu",
  "@aphrody/bun-plugin-oxc-linux-arm64-gnu",
  "@aphrody/bun-plugin-oxc-linux-x64-musl",
  "@aphrody/bun-plugin-oxc-linux-arm64-musl",
  "@aphrody/bun-plugin-oxc-win32-x64-msvc",
  "@aphrody/bun-plugin-oxc-win32-arm64-msvc",
  "@aphrody/bun-inspector-protocol",
  "@aphrody/bun-debug-adapter-protocol",
  "@aphrody/web-inspector-bun",
  "next",
  "@next/env",
  "@next/swc-linux-x64-gnu",
  "@next/swc-linux-x64-musl",
  "@next/swc-win32-x64-msvc",
  "@next/swc-darwin-arm64",
  "@next/swc-darwin-x64",
  "@next/swc-linux-arm64-gnu",
  "@next/swc-linux-arm64-musl",
  "@next/swc-win32-arm64-msvc",
  "nodemailer",
  "undici",
  "@tauri-apps/cli",
  "@aphrody/api",
  "@tauri-apps/cli-linux-x64-gnu",
  "@modelcontextprotocol/sdk",
  "@modelcontextprotocol/ext-apps",
  "@modelcontextprotocol/client",
  "@modelcontextprotocol/core",
]

[jsx]
runtime = "automatic"
importSource = "react"

[loader]
".svg" = "text"
".css" = "css"

[test]
preload = ["../../scripts/aphrody/test-dom.ts"]

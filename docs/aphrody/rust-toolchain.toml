# Same stable toolchain as the category repositories (aphrody-ai, -os, -ui,
# -web, -compat, -contracts, -shell, -native): aphrody-ssh, aphrody-git and
# aphrody-vpn are compiled into those workspaces by relative path, so they must
# build on this channel. Nothing here uses nightly features. Python/uv
# dependencies are owned by ../aphrody-ai/py. Bump deliberately, together with
# the category repositories, after running every gate in README.md.

[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy", "rust-src", "rust-analyzer"]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "wasm32-unknown-unknown",
  "wasm32-wasip1",
]
profile = "minimal"

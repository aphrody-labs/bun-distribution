# SUPERSEDED (2026-09-26): nginx/rg/rg-production.conf now serves cdn.rosegriffon.fr directly
# (static /static/, content-addressed image fallback, then everything else proxied to rg-api
# 127.0.0.1:8800 — it does not route to :8801 the way this file does). Do not install this file
# alongside rg-production.conf; the rg-cdn:8801 vs rg-api:8800 routing question is an open owner
# decision, see docs/PORTS-AND-DOMAINS.md.
# ══════════════════════════════════════════════════════════
# cdn.rosegriffon.fr — CDN multi-app (uploads + static Next)
# ══════════════════════════════════════════════════════════
#
# 2 surfaces :
#   1. /upload  + /images/<id>     : API uploads (proxy → Bun :8801, apps/cdn/server.ts)
#   2. /static/<surface>/...       : assets statiques (rg partagé, azalee, website) — sert public/ + .next/static
#                                     pour décharger les builds Next.js
#
# Storage :
#   - /var/www/cdn/images/         : uploads API (pattern [a-f0-9]{16}.<ext>)
#   - /var/www/cdn/static/rg/public : miroir unique de packages/assets/public (tâche cron `cdn`)
#   - /var/www/cdn/static/<app>/   : assets propres à une surface et chunks Next
#
# Best practices (cf. nginx/documentation /admin-guide/web-server) :
#   - sendfile + tcp_nopush + tcp_nodelay : transmission zero-copy optimale
#   - open_file_cache                     : descripteurs en RAM (gain énorme sur petits fichiers)
#   - expires 1y immutable + etag off     : cache navigateur permanent (cache-busted via hash dans le path)
#   - gzip_static                         : sert *.gz précompressé si présent (cdn-sync.ts génère)
#   - Cross-Origin-Resource-Policy        : compat COEP côté apps Next 16
#   - access_log off sur immutable        : économie I/O
#
# Cert (à exécuter une fois, avant d'activer ce vhost) :
#   sudo certbot certonly --nginx -d cdn.rosegriffon.fr
#
# NOT INSTALLED. The live `cdn.rosegriffon.fr` block is in `nginx/rg/rg-production.conf`,
# installed as /etc/nginx/conf.d/rg.conf (measured 2026-09-25: no cdn.rosegriffon.conf under
# /etc/nginx). This file is kept as the per-surface reference; it carries the same raw/VFS
# policy as rg-production.conf so that installing it cannot reopen those routes.
#
# Déployer (historique) :
#   sudo install -m 644 nginx/rg/cdn.rosegriffon.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#   bun scripts/ops/cdn-sync.ts azalee website

upstream cdn_backend {
    server 127.0.0.1:8800;
    keepalive 4;
}

upstream nie_model_serve {
    # `max_conns` borne la concurrence vue par le décodeur. Sans lui, nginx peut ouvrir des
    # dizaines de milliers de connexions face à un service qui a rendu l'âme à 2 048 le
    # 21/8/2026. C'est ici que la charge doit être refusée, pas dans le dorsal.
    server 127.0.0.1:8790 max_conns=512;
    # ATTENTION : ce keepalive est aujourd'hui INERTE — le dorsal écrit « Connection: close »
    # en dur dans ses fonctions de réponse, donc aucune connexion n'est réutilisable. La valeur
    # est prête pour le jour où il cessera de fermer ; l'économie de sockets vient du cache.
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name cdn.rosegriffon.fr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS
server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name cdn.rosegriffon.fr;

    ssl_certificate     /etc/letsencrypt/live/cdn.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.rosegriffon.fr/privkey.pem;
    ssl_early_data on;

    # ── Security baseline (server-level — audit 2026-05-13) ────────────────
    # nginx drop TOUS les add_header parents dès qu'un add_header existe plus
    # inner. Les `location` avec leur propre add_header (ex: /static/, /upload)
    # doivent donc RE-déclarer ces 5 lignes (cf. CLAUDE.md « add_header pièges »).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # ── HTTP/3 advertisement ──
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # ── Static-serving best practices (vhost-scoped overrides des défauts globaux) ──
    sendfile           on;
    sendfile_max_chunk 1m;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65s;
    keepalive_requests 1000;

    # Descripteurs FD + métadonnées en RAM (gain massif sur 84 MiB de petits assets)
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # Sert *.br précompressé si Accept-Encoding: br + fichier .br présent (priorité 1)
    # Sert *.gz précompressé si Accept-Encoding: gzip + fichier .gz présent (priorité 2)
    # cdn-sync.ts génère les 2 (brotli quality 11 + gzip level 9).
    brotli_static on;
    gzip_static   on;
    gzip_vary     on;

    # Logs allégés (buffer + flush)
    access_log /var/log/nginx/cdn.rosegriffon.fr.access.log combined buffer=64k flush=5s;
    include /etc/nginx/conf.d/rg-stats.inc;
    error_log  /var/log/nginx/cdn.rosegriffon.fr.error.log;

    # Upload max 25MB (cohérent avec apps/cdn/server.ts)
    client_max_body_size 25m;

    root /var/www/cdn/images;

    # ════════════════════════════════════════════════════════
    # SURFACE 1 — API uploads (proxy → Bun :8801)
    # ════════════════════════════════════════════════════════

    # POST /upload : proxy vers Bun
    location = /upload {
        limit_except POST { deny all; }
        proxy_pass         http://cdn_backend/upload;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    # DELETE /images/<id> : proxy vers Bun
    location ~ "^/images/[a-f0-9]{16}\.(png|jpg|webp|gif|svg)$" {
        limit_except DELETE { deny all; }
        proxy_pass         http://cdn_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
    }

    # GET /health : proxy vers Bun (sans cache)
    # Le CDN sert des assets référencés par des pages indexables : on autorise la
    # collecte (un `Disallow: /` priverait Google Images des visuels du wiki), mais
    # on ferme l'endpoint d'écriture. Sans ce fichier : 37 requêtes/jour en 404.
    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /upload\nAllow: /\n";
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location = /health {
        proxy_pass         http://cdn_backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # GET /<id>.<ext> : static immutable, CDN-friendly (uploads existants)
    location ~* "^/[a-f0-9]{16}\.(png|jpg|jpeg|webp|gif|svg)$" {
        # expires off : géré explicitement via Cache-Control unique (évite doublon header)
        expires off;
        etag off;
        # Bug nginx : add_header dans une location REMPLACE les add_header du server.
        # Il faut re-déclarer Alt-Svc + tous les headers de sécurité ici.
        add_header Alt-Svc                  'h3=":443"; ma=86400'                  always;
        add_header Cache-Control            "public, immutable, max-age=31536000"  always;
        add_header Access-Control-Allow-Origin   "*"                              always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                   always;
        add_header X-Content-Type-Options   "nosniff"                              always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options          "DENY"                                 always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        try_files $uri =404;
        access_log off;
    }

    # ════════════════════════════════════════════════════════
    # SURFACE 2 — Static Next.js (miroir public/ + .next/static)
    # ════════════════════════════════════════════════════════
    # /static/<surface>/...   →  /var/www/cdn/static/<surface>/...
    # `rg/public` est le miroir unique des assets communs. azalee/website ne
    # servent que leurs assets spécifiques et les chunks Next historiques.

    # SURFACE 5 — Streaming LIVE des assets depuis les CPK IEVR.
    # g4tx -> PNG decode a la volee, AUCUN dump disque. C'est le but du projet : streamer les CPK.
    # Decodeur : nie-model-serve (niers, Rust, :8790) via /tex. L'ancien decodeur
    # iecode-cdn (pont Bun vers du .NET) a ete retire du depot le 11/8/2026 ;
    # le decodeur Rust couvre les memes formats et davantage (textures _animal).
    location /g4tx/ {
        rewrite ^/g4tx/(.+)$ /tex/$1 break;
        # Passait par l'adresse littérale : ni `max_conns` ni keepalive (ces directives
        # n'existent que dans un bloc `upstream`), et sans `proxy_http_version` le dialogue se
        # faisait en HTTP/1.0 — une connexion neuve par vignette.
        proxy_pass http://nie_model_serve;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

        location ^~ /static/ {
        # Sécurise le scope (refuse toute autre app)
        location ~ "^/static/(?!rg/|azalee/|website/)" { return 404; }

        alias /var/www/cdn/static/;

        # Cache navigateur permanent — assets cache-bustés via .next/static (hash dans le nom)
        # ou via query string ?v= côté public/.
        # expires off : géré explicitement via Cache-Control unique (évite doublon header)
        expires off;
        etag off;
        # add_header dans location REMPLACE ceux du server (bug nginx) → re-déclare tout.
        add_header Alt-Svc                       'h3=":443"; ma=86400'                   always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"   always;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header X-Content-Type-Options        "nosniff"                              always;
        add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains"  always;
        add_header X-Frame-Options               "DENY"                                 always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        # Vary: Accept-Encoding émis par gzip_vary on (vhost-level)

        access_log off;

        # Fallback propre (404 plutôt que listing)
        try_files $uri =404;

        # MIME — un sous-bloc types {} OVERRIDE complètement /etc/nginx/mime.types,
        # donc on doit re-déclarer tout ce qu'on serve sous /static/<app>/.
        types {
            # Texte
            text/html                   html htm shtml;
            text/css                    css;
            text/plain                  txt;
            text/xml                    xml;
            text/cache-manifest         appcache;

            # JS / WASM / data
            application/javascript      js mjs;
            application/json            json map;
            application/manifest+json   webmanifest;
            application/wasm            wasm;
            application/octet-stream    bin exe dll iso dmg;

            # Fonts
            font/woff                   woff;
            font/woff2                  woff2;
            application/x-font-ttf      ttf;
            application/x-font-otf      otf;
            application/vnd.ms-fontobject eot;

            # Images
            image/avif                  avif;
            image/webp                  webp;
            image/svg+xml               svg svgz;
            image/png                   png;
            image/jpeg                  jpg jpeg;
            image/gif                   gif;
            image/x-icon                ico;

            # Audio / vidéo
            video/mp4                   mp4;
            video/webm                  webm;
            audio/mpeg                  mp3;
            audio/ogg                   ogg oga;
        }
    }

    # ════════════════════════════════════════════════════════
    # SURFACE 7 — Inazuma Eleven Cross assets locaux (statiques)
    # ════════════════════════════════════════════════════════
    # Sert les assets et voix audio de jp.co.level5.inazumacross extraits
    # en statique depuis /var/www/cdn/cross/.
    location ^~ /cross/ {
        alias /var/www/cdn/cross/;

        expires off;
        etag off;
        add_header Alt-Svc                       'h3=":443"; ma=86400'                   always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"   always;
        add_header Access-Control-Allow-Origin   "*"                                     always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                          always;
        add_header X-Content-Type-Options        "nosniff"                               always;
        add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains"   always;
        add_header X-Frame-Options               "DENY"                                  always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"       always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        access_log off;
        try_files $uri =404;

        types {
            image/png                   png;
            image/webp                  webp;
            image/jpeg                  jpg jpeg;
            audio/wav                   wav;
            application/json            json;
            font/woff                   woff;
            font/woff2                  woff2;
            application/x-font-ttf      ttf;
            application/octet-stream    bin glb bundle acb awb acb_data awb_data;
            text/plain                  txt hash;
        }
    }

    # ════════════════════════════════════════════════════════
    # SURFACE 3 — IEVR DX11 assets (dump pré-extrait + fallback live)
    # ════════════════════════════════════════════════════════
    # Stratégie : try_files sert le dump pré-extrait (fichier disque) ;
    # si absent → @cpk_live proxifie vers nie-model-serve :8790 (/tex) qui décode
    # la texture à la volée depuis les CPK (G4TX→PNG lossless).
    # Aucun dump préalable requis, aucune écriture disque.

    location ^~ /dx11/ {
        # Compatibilite avec les anciennes URL du dump pre-extrait. Ce dump nommait
        # certaines textures `<conteneur>_<texture>.png`; pour les illustrations a
        # texture unique, les deux noms sont identiques et donnaient donc
        # `img_story_..._img_story_....png`. Le CPK, lui, ne porte que le premier
        # basename. Canonicaliser ici garde fonctionnels les articles, embeds et
        # caches externes deja publies, avec ou sans variante `?w=`.
        rewrite ^(/dx11/menu/220_img/gallery_img2/)(img_.+)_\2\.png$ $1$2.png permanent;

        alias /home/ubuntu/.local/share/Steam/iecode/inazuma/data/dx11/;

        # Cache navigateur permanent — assets immuables (buildid Steam).
        expires off;
        etag off;
        add_header Alt-Svc                       'h3=":443"; ma=86400'                  always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header X-Content-Type-Options        "nosniff"                              always;
        add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains"  always;
        add_header X-Frame-Options               "DENY"                                 always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        access_log off;
        # Fallback : dump disque → décodeur live si absent.
        try_files $uri @cpk_live;

        # MIME — types {} OVERRIDE complet, on liste uniquement ce qu'on serve.
        types {
            image/webp                  webp;
            image/avif                  avif;
            image/png                   png;
            image/jpeg                  jpg jpeg;
            image/x-dds                 dds;
            application/vnd.level5.g4tx g4tx;
            application/octet-stream    bin;
        }
    }

    # Décodeur live : sert tout asset /dx11/<path>.png absent du dump depuis les CPK.
    location @cpk_live {
        # g4tx -> png : seul décodeur, nie-model-serve :8790 /tex (l'ancien iecode-cdn est
        # retiré ; 8788 est aujourd'hui aphrody-a2a). rewrite /dx11/<x>.png ->
        # /tex/dx11/<x>.png ; les en-têtes CORS/cache sont posés ici. Un échec répond 404
        # via @cpk_live_legacy.
        rewrite ^/(dx11/.+)\\.png$ /tex/$1.png break;
        # Adresse littérale => pool `max_conns` hors d'atteinte, sur le repli emprunté par
        # TOUTE requête /dx11/ absente du dump — le chemin le plus fréquenté du CDN.
        proxy_pass         http://nie_model_serve;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @cpk_live_legacy;
        proxy_hide_header  Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Cache-Control                "public, immutable, max-age=31536000" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Ancien repli vers iecode-cdn, retire du depot le 11/8/2026 avec toute la chaine
    # .NET. Garde comme repli explicite : proxifier un upstream mort renverrait 502
    # la ou un asset simplement absent doit repondre 404.
    location @cpk_live_legacy {
        add_header Access-Control-Allow-Origin "*" always;
        return 404;
    }


    # ════════════════════════════════════════════════════════
    # SURFACE 4 — IEVR modèles 3D GLB (dump + fallback live)
    # ════════════════════════════════════════════════════════
    # /model/<basename>.glb  →  ~/data/dx11/model/<basename>.glb
    # Si absent → @cpk_live (le décodeur peut servir les fichiers bruts des CPK).

    location ^~ /model/ {
        alias /home/ubuntu/.local/share/Steam/iecode/inazuma/data/dx11/model/;

        # Cache navigateur permanent — assets immuables (rebuild via iecode cdn export-glb).
        expires off;
        etag off;
        add_header Alt-Svc                       'h3=":443"; ma=86400'                  always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header X-Content-Type-Options        "nosniff"                              always;
        add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options               "DENY"                                 always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        access_log off;
        # Fallback live pour les GLB non encore exportés.
        try_files $uri @cpk_live;

        # MIME — types {} OVERRIDE complet, on liste uniquement ce qu'on serve.
        types {
            model/gltf-binary           glb;
            model/gltf+json             gltf;
        }
    }


    # ════════════════════════════════════════════════════════
    # SURFACE 6 — Modèles 3D COMPLETS assemblés live (corps+face+uniforme)
    # ════════════════════════════════════════════════════════
    # /model-full/<code>.glb → nie-model-serve :8790 (assemble depuis CPK)
    # Cache disque côté service : second appel = lecture cache, sous-ms.

    location ^~ /model-full/ {
        # Serve depuis le cache disque si disponible (évite le proxy pour les hits).
        alias /home/ubuntu/nie/var/model-cache/;

        expires off;
        etag off;
        add_header Alt-Svc                       'h3=":443"; ma=86400'                  always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header X-Content-Type-Options        "nosniff"                              always;
        add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options               "DENY"                                 always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        access_log off;
        # Fallback : proxy vers le service d'assemblage live.
        try_files $uri @model_live;

        types {
            model/gltf-binary           glb;
        }
    }

    # Assemblage live : nie-model-serve :8790.
    location @model_live {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
    }

    # /model-chr/<sub>/<code>.glb -> nie-model-serve :8790 : modeles generiques des
    # sous-domaines common/chr/_<sub>/ (techniques `waza`, objets `item`, animaux `animal`).
    # Maillage g4md+g4mg assemble live (sans texture embarquee). Le service gere son cache
    # disque interne (`chr_<sub>_<code>.glb`) -> on proxy directement (pas d'alias fichier,
    # le nom de cache differe du chemin d'URL).
    location ^~ /model-chr/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        access_log off;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        proxy_hide_header  X-Content-Type-Options;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
        add_header X-Content-Type-Options        "nosniff"                              always;
    }

    # /model-edit/<dossier>/<nom>.glb -> nie-model-serve :8790.
    # Modeles de l'editeur d'avatar (corps, visages, coiffures, oreilles, accessoires) : ils
    # vivent a plat sous chr/_face/20_EDIT/, d'ou une route distincte de /model-chr/.
    location ^~ /model-edit/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
    }

    # /model-avatar/<pieces>.glb -> nie-model-serve :8790 (avatar de l'editeur assemble).
    location ^~ /model-avatar/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
    }



    # /tex/<vfs-path>.png -> nie-model-serve :8790 decode N'IMPORTE QUEL G4TX du VFS en PNG.
    # Les textures perso (face/uniforme/corps sous dx11/chr/) sont absentes du dump ; seul
    # nie-model-serve les decode (nie-formats). L'ancien decodeur menu iecode-cdn est retire.
    location ^~ /tex/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        proxy_hide_header  X-Content-Type-Options;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header X-Content-Type-Options        "nosniff"                              always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
    }

    # /avatar/catalog.json + /avatar/icon/<nom>.png -> nie-model-serve :8790.
    # Editeur d'avatar (chara_edit) : le catalogue resolu (produit par `niers avatar export`)
    # et les vignettes decodees a la volee depuis les atlas menu/200_icon/21_icon_avatar/.
    # Icônes de l'éditeur : des centaines par ouverture de page, immuables, ~50 ms de décodage
    # pièce. Bloc séparé et PLUS SPÉCIFIQUE que /avatar/ (préfixe le plus long : il gagne), pour
    # ne pas appliquer un cache d'un mois au catalogue, qui lui peut changer.
    location ^~ /avatar/icon/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        proxy_cache            rg_decodeur;
        proxy_cache_valid      200 30d;
        proxy_cache_valid      404 1m;
        # Un seul décodage même si cent visiteurs demandent la même icône en même temps.
        proxy_cache_lock       on;
        proxy_cache_lock_timeout 20s;
        # LE POINT CENTRAL : si le dorsal sature ou redémarre, servir la copie périmée plutôt
        # qu'un 504. C'est ce qui rend la page publique insensible à une nouvelle panne.
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  X-Content-Type-Options;
        add_header Access-Control-Allow-Origin   "*"                            always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                 always;
        add_header X-Content-Type-Options        "nosniff"                      always;
        # Le Cache-Control du dorsal (immutable, 1 an) est CONSERVÉ : l'ancien bloc le masquait
        # pour le rabaisser à 3600 s, obligeant chaque visiteur à retélécharger toutes les
        # vignettes immuables toutes les heures.
        add_header X-Cache-Status                $upstream_cache_status         always;
    }

    location ^~ /avatar/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # catalog.json : c'est SA 504 qui a vidé la page le 21/8/2026. Cache court (il peut
        # changer), mais réutilisable en mode périmé si le dorsal ne répond plus — la page
        # aurait alors continué à s'afficher pendant toute la panne.
        proxy_cache            rg_decodeur;
        proxy_cache_valid      200 5m;
        proxy_cache_lock       on;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        proxy_hide_header  X-Content-Type-Options;
        add_header Access-Control-Allow-Origin   "*"                            always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                 always;
        add_header X-Content-Type-Options        "nosniff"                      always;
        add_header Cache-Control                 "public, max-age=3600"         always;
        add_header X-Cache-Status                $upstream_cache_status         always;
    }

    # /icons/index.json -> nie-model-serve :8790 (index des icones du jeu).
    location ^~ /icons/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
    }


    # /ui/theme.json + /ui/text.png -> nie-model-serve :8790.
    # Theme de l'interface du jeu : palette FONT_COLOR (70 couleurs) et rendu de texte dans la
    # police bitmap du jeu (atlas + metriques : pas servable comme webfont, donc compose ici).
    location ^~ /ui/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        proxy_hide_header  X-Content-Type-Options;
        add_header Access-Control-Allow-Origin   "*"                            always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                 always;
        add_header X-Content-Type-Options        "nosniff"                      always;
        add_header Cache-Control                 "public, max-age=86400"        always;
    }



    # /cfg/<vfs-path>.json -> nie-model-serve :8790 decode cfg.bin/objbin (RDBN/T2B) en JSON.
    location ^~ /cfg/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 30s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # /typed/<vfs-path>.json -> nie-model-serve :8790 : decodage TYPE des cfg.bin
    # (familles de jeu nie-data : formation, skill, item, mission...).
    location ^~ /typed/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 30s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # /raw/<vfs-path> (octets bruts du CPK) et /depot/ (source du projet) : jamais publics.
    # nie-model-serve n'a aucune authentification sur ces routes ; des robots d'indexation
    # telechargeaient /raw/ le 2026-09-25. Meme regle que nginx/rg/rg-production.conf.
    location ^~ /raw/ {
        return 404;
    }
    location ^~ /depot/ {
        return 404;
    }

    # /vfs/{ls,find,stat,stats} -> listing JSON du VFS LIVE (nie_explore::listing), la meme vue
    # que l'app desktop. Servi a l'hote lui-meme seulement (SSR de rg-website,
    # packages/azalee/src/cpk/live.ts, qui appelle ce nom public depuis le VPS) ; 404 pour le
    # reste du monde. `$remote_addr` est le pair TCP (pas de module realip sur cet hote) : il
    # n'egale `$server_addr` que pour une connexion ouverte par le VPS vers sa propre adresse.
    # Cache COURT : le VFS suit le jeu installe, contrairement au contenu decode qui est immutable.
    location ^~ /vfs/ {
        if ($remote_addr != $server_addr) {
            return 404;
        }
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                     always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"          always;
        add_header Cache-Control                 "public, max-age=300"   always;
    }

    # ── Routes servies par :8790 mais qui n'etaient PAS proxifiees ──────────────────────────
    # Les quatre suivantes repondaient 200 en direct sur le service et 404 par le CDN, faute
    # d'un bloc ici : de la donnee produite, vivante, et injoignable depuis le web. Un 404 se
    # lit comme une mauvaise URL, pas comme un service non expose — d'ou le silence.

    # /menu-tree[.json] et /menu-tree/<ecran>.json -> arbre des ecrans de menu (475 ecrans :
    # nav-hash CRC32, calques, ressources, commandes). Pas de barre finale : la route repond
    # aussi bien sur /menu-tree nu que sur /menu-tree/<ecran>.json.
    # Cache moyen : suit les dumps `*_setting.cfg.bin.json`, qui bougent avec les MAJ du jeu.
    location ^~ /menu-tree {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                      always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"           always;
        add_header Cache-Control                 "public, max-age=3600"   always;
    }

    # /story-scene[.png] et /story-scene/<n>.png -> scene de dialogue du mode histoire, composee
    # live (boite + VRAI texte via la police bitmap du jeu, lignes lues dans le miroir SQLite).
    # Composition a la demande : timeout large, cache court car le miroir est resynchronise.
    location ^~ /story-scene {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                      always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"           always;
        add_header Cache-Control                 "public, max-age=3600"   always;
    }

    # /lip/<vfs-path>.json -> visemes lip-sync dates d'un `.p3lip` (21 047 fichiers dans le VFS).
    # Decode a partir d'un fichier immuable : cache long, comme les autres decodages d'asset.
    location ^~ /lip/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
    }

    # /model-map/<vfs-path>.glb -> geometrie d'une map/stage assemblee a la demande.
    # Meme profil que /export : assemblage couteux, sortie immuable.
    location ^~ /model-map/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
    }

    # /audio-info/<vfs-path> -> catalogue des cues d'une banque ACB (nom, duree, codec, id AWB).
    # Bati sur l'ACB seul : ne lit jamais l'AWB (7,49 Gio a l'echelle du jeu).
    # /tex-info/<chemin>.g4tx -> catalogue JSON des textures d'un conteneur G4TX.
    # Un G4TX porte jusqu'a 80 payloads nommes : sans cet index, une galerie n'en montre qu'un.
    # /export/<vfs-path>?format=<id> -> le fichier converti AU FORMAT VOULU, en telechargement.
    # Meme table que l'app desktop : png/webp/gif/jpg/bmp/tga/tiff/qoi/json, wav, mp4, glb.
    # Timeout large : un glb s'assemble et un mp4 se remuxe a la demande.
    # Formats DERIVES seulement : sans `format`, nie-model-serve rend `raw` (le fichier
    # d'origine), et il lit la cle `format` a l'identique quand nginx compare les noms
    # d'arguments sans casse — d'ou le controle de la query ENTIERE.
    location ^~ /export/ {
        if ($args !~ "^format=(png|webp|gif|jpg|bmp|tga|tiff|qoi|json|glb|wav|mp4|webm|h264|m2v)(&id=[0-9]+)?$") {
            return 404;
        }
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
    }

    location ^~ /tex-info/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
    }

    location ^~ /audio-info/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
    }

    # /audio/<vfs-path> -> WAV PCM decode live (CRI HCA/ADX, ACB/AWB) depuis le CPK.
    location ^~ /audio/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
    }

    # /video/<vfs-path> -> MP4 fragmente (demux USM Sofdec2 + remux H.264) depuis le CPK.
    location ^~ /video/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
    }

    # /menu-render/<screen>.png -> rendu serveur Rust d'un ecran de menu (compositeur sprites).
    location ^~ /menu-render/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, max-age=3600"                 always;
    }

    # ════════════════════════════════════════════════════════
    # Tout le reste → 404
    # ════════════════════════════════════════════════════════
    location / {
        return 404;
    }
}

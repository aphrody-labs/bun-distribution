# SUPERSEDED (2026-09-26): nginx/rg/rg-production.conf now serves api.rosegriffon.fr directly
# (proxies straight to rg-api 127.0.0.1:8800) and is the canonical live vhost; the :8802/:8803
# upstreams below have no config/service-catalog.json entry and are not part of the current
# registry. Do not install this file alongside rg-production.conf. See docs/PORTS-AND-DOMAINS.md.
# ══════════════════════════════════════════════════════════
# api.rosegriffon.fr — gateway outils internes (Rust + Bun)
# ══════════════════════════════════════════════════════════
#
# Cert (à exécuter une fois, avant d'activer ce vhost) :
#   sudo certbot certonly --nginx -d api.rosegriffon.fr
#
# Activer :
#   sudo cp infra/nginx/api.rosegriffon.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pattern : chaque outil interne écoute 127.0.0.1:<port>
#   n2b-server   → 8802  (futur, Rust)
#   shai-http    → 8803  (futur, Rust)
#   Azalée       → 8800  (montage /v1/azalee de l'API unifiée Elysia + Kysely)
#   Les transports HTTP MCP et RAG ont été retirés le 2026-09-08. Leurs chemins
#   répondent 410 afin de ne jamais masquer ce retrait derrière un 502.
#
# Ce registre est le seul endroit du dépôt qui liste les ports loopback de la
# machine ; il vaut pour TOUS les vhosts, pas seulement pour celui-ci. Les ports
# Achilléa n'y figuraient pas alors qu'ils sont servis depuis le 8/9/2026 par
# achillea.rosegriffon.conf et achillea-supabase-internal.conf :
#   achillea-postgrest          → 8820  (PostgREST, base `achillea` isolée)
#   achillea-storage            → 8821  (Bun, compatible Supabase Storage)
#   achillea-realtime           → 8822  (Bun, compatible Supabase Realtime)
#   achillea-supabase-internal  → 8823  (passerelle nginx loopback, non publique)
#   achillea-auth               → 8824  RETIRÉ — GoTrue jamais utilisé, unité
#                                       désactivée. Les chemins `/auth/v1/`
#                                       répondent 410, même parti pris que /rag/.
#                                       La session Achilléa est émise par le
#                                       backend Ts.ED sous /api/auth/.
#   achillea-bot (Ts.ED direct) → 4000  (auth, OAuth, uploads binaires)
#   achillea ranked gateway     → 4002  (proxy JSON de /api/)

# ── HTTPS — api.rosegriffon.fr ──
server {
    listen 443 ssl;
    http2 on;
    server_name api.rosegriffon.fr;

    include /etc/nginx/conf.d/no-index.inc;

    ssl_certificate     /etc/letsencrypt/live/api.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rosegriffon.fr/privkey.pem;

    # Logs dédiés
    access_log /var/log/nginx/api.rosegriffon.fr.access.log;
    include /etc/nginx/conf.d/rg-stats.inc;
    error_log  /var/log/nginx/api.rosegriffon.fr.error.log;

    # Timeouts longs pour SSE / streaming Rust
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ── Security baseline (audit 2026-05-13) ──────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "DENY"                                 always;
    add_header Referrer-Policy           "no-referrer"                          always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Bloque les chemins de scanners (.env, .git, wp-admin, …) — coupe le bruit.
    location ~* "\.(env|git/|aws/|ssh/|sql|bak|old|swp|DS_Store)$" { return 410; }
    location ~* "/(wp-(admin|login|content|includes)|wordpress|phpmyadmin|pma|cgi-bin)/" { return 410; }

    # ── n2b-server (futur) ──
    # location /n2b/ {
    #     proxy_pass http://127.0.0.1:8802/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header Connection "";
    #     proxy_buffering off;
    #     add_header X-Accel-Buffering no;
    # }

    # ── shai-http (futur) ──
    # location /shai/ {
    #     proxy_pass http://127.0.0.1:8803/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header Connection "";
    #     proxy_buffering off;
    #     add_header X-Accel-Buffering no;
    # }

    # ── achillea (alias canonique vers l'API Achillea) ──
    # Achillea a sa propre infra (VPS dédié, en cours de migration vers un nouveau
    # — cf. docs/achillea.md, décision du 7/9/2026) : pas de 127.0.0.1 possible ici.
    # On reproxifie donc vers l'entrée publique stable qu'ils exposent déjà,
    # ranked.rosegriffon.fr, plutôt que vers une IP/port amenés à changer.
    # Lecture seule tant que l'OAuth Discord (redirect_uri dérivé de
    # x-forwarded-host) n'est pas déclaré pour ce domaine côté Achillea.
    location /achillea/ {
        proxy_pass https://ranked.rosegriffon.fr/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ranked.rosegriffon.fr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    # ── unified API (Elysia + Kysely) ──
    # The legacy /achillea/ proxy remains untouched during the cutover. New
    # clients use /v1/* and can migrate domain by domain without a split DB.
    location /v1/ {
        proxy_pass http://127.0.0.1:8800/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8800/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── azalee (montage canonique de l'API unifiée) ──
    # Compatibilité d'URL conservée : /azalee/* est réécrit vers /v1/azalee/*.
    # Il n'existe plus de second processus headless ni de second pool de données.
    location /azalee/ {
        proxy_pass http://127.0.0.1:8800/v1/azalee/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header X-Accel-Buffering no;
    }

    # Le MCP public a migré vers https://mcp.aphrody.com/mcp.
    location = /mcp {
        return 410;
    }

    location = /mcp/health {
        return 410;
    }

    # Le RAG local a été archivé : conserver une réponse explicite, sans backend.
    location /rag/ {
        return 404;
        default_type application/json;
    }

    # Tout le reste → 404
    location / {
        return 404 '{"error":"unknown service"}\n';
        # Même raison que /health : `add_header` ici annulait tout l'héritage du `server`.
        default_type application/json;
    }
}

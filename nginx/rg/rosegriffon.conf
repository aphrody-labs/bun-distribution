# SUPERSEDED (2026-09-26): the consolidated, release-managed nginx/rg/rg-production.conf is the
# canonical live vhost for rosegriffon.fr (docs/PLAN.md decision ledger, 2026-09-25). Kept only as
# the historical HTTP-only ACME-bootstrap template referenced below; do not install alongside
# rg-production.conf. See docs/PORTS-AND-DOMAINS.md.
# rosegriffon.fr + www — bootstrap HTTP-only (Next.js standalone :3004, website-web.service).
# Installé au cutover AVANT certbot : permet le challenge ACME HTTP-01 + sert en clair
# le temps d'obtenir le cert. `certbot --nginx -d rosegriffon.fr -d www.rosegriffon.fr`
# réécrit ensuite ce fichier pour ajouter le 443/SSL + la redirection 80->443.
# Source de vérité en repo (infra/nginx/rosegriffon.conf) ; copie dans /etc/nginx/conf.d/.
map $http_upgrade $connection_upgrade {
    default upgrade;
    # Une valeur vide supprime l'en-tête Connection et permet de réutiliser le
    # pool keepalive de l'upstream. Les vraies montées WebSocket gardent "upgrade".
    ''      '';
}
# Amont piloté par scripts/ops/deploy.ts (bascule bleu/vert sans coupure).
include /etc/nginx/rg-upstreams/website_web.conf;
include /etc/nginx/rg-upstreams/website_preview.conf;
server {
    server_name rosegriffon.fr www.rosegriffon.fr;

    # Multiplexe les nombreux chunks Next sur une seule connexion TLS.
    http2 on;
    # Niveau 4 : compromis débit/taille pour le HTML dynamique. Les assets hashés
    # précompressés restent servis par brotli_static, sans recompression.
    brotli_comp_level 4;

    # www -> apex (canonique : NEXT_PUBLIC_BASE_URL pointe www, mais SEO unifié sur l'apel ;
    # better-auth trustedOrigins couvre les deux. On NE redirige PAS ici pour rester neutre
    # avant certbot ; la redirection HTTPS sera gérée après émission du cert.)

    location /.well-known/acme-challenge/ { root /var/www/html; }

    client_max_body_size 25m;

    # En-têtes de sécurité. Le backend Next de ce site n'en émet aucun : jusqu'au
    # 14/8/2026, rosegriffon.fr n'avait donc ni HSTS, ni Permissions-Policy, et héritait
    # du bloc `http` de nginx.conf un Referrer-Policy `no-referrer-when-downgrade` qui
    # laisse fuir l'URL complète vers tout site en clair. Le fragment est réinclus dans
    # chaque `location` qui pose son propre `add_header`, sans quoi ces blocs perdraient
    # l'intégralité de l'héritage (règle nginx : remplacement, jamais accumulation).
    include /etc/nginx/conf.d/rg-securite.inc;
    include /etc/nginx/conf.d/rg-csp-website.inc;

    # Statiques Next hashés servis directement par nginx (offload Bun, cache 1 an immutable)
    location /_next/static/ {
        alias /home/ubuntu/rg-releases/website/static/;
        include /etc/nginx/conf.d/rg-securite.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @bunproxy;
    }
    location @bunproxy {
        proxy_pass http://$website_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
    include /etc/nginx/conf.d/supabase-compat.inc;
    # Prévisualisation : pose (ou retire) le cookie qui aiguille vers le slot B.
    # Généré par scripts/ops/deploy.ts.
    location = /__preview {
        if ($arg_off) {
            add_header Set-Cookie "rg_preview=; Path=/; Max-Age=0; SameSite=Lax" always;
            return 302 /;
        }
        add_header Set-Cookie "rg_preview=$arg_token; Path=/; Secure; HttpOnly; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/rg-securite.inc;
        return 302 /;
    }

    # Compatibilité des anciennes URL OAuth : aucun callback n'est traité par
    # Achilléa. Discord reste chez Better Auth ; Twitch/Challonge chez rg-api.
    location = /bot/OAuth/discord {
        return 302 https://rosegriffon.fr/login?redirect=%2Fachillea;
    }
    location ^~ /bot/OAuth/ {
        return 302 https://api.rosegriffon.fr/v1/auth/oauth/callback$is_args$args;
    }
    location = /bot/OAuth/callback {
        return 302 https://api.rosegriffon.fr/v1/auth/oauth/callback$is_args$args;
    }

    # Passerelle d'auth directe Achilléa sur rosegriffon.fr (bypass ranked)
    location ^~ /api/achillea/auth/ {
        rewrite ^/api/achillea/(.*)$ /$1 break;
        proxy_pass http://achillea_bot_direct;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Uploads images Achilléa directs
    location ^~ /api/achillea/proxy/ {
        rewrite ^/api/achillea/(.*)$ /$1 break;
        proxy_pass http://achillea_bot_direct;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        client_max_body_size 6M;
    }

    location / {
        proxy_pass http://$website_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.rosegriffon.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = rosegriffon.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name rosegriffon.fr www.rosegriffon.fr;
    return 404; # managed by Certbot




}

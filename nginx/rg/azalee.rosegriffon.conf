# SUPERSEDED (2026-09-26): nginx/rg/rg-production.conf now serves azalee.rosegriffon.fr directly
# (storage/v1 proxy + the same redirects). Do not install this file alongside rg-production.conf.
# See docs/PORTS-AND-DOMAINS.md.
# azalee.rosegriffon.fr — Redirection unifiée vers Rose Griffon (rosegriffon.fr/wiki).
# Migration 2-en-1 : Azalée + Website fusionnés dans apps/website.
# Préserve 100% du trafic, SEO, bookmarks, APIs et liens externes (zero regression).
# Source de vérité repo : infra/nginx/azalee.rosegriffon.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    server_name azalee.rosegriffon.fr 51.77.147.152;

    http2 on;
    brotli_comp_level 4;

    add_header X-DNS-Prefetch-Control "on" always;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Statiques Next hashés servis directement par nginx (offload Bun, cache 1 an immutable)
    location /_next/static/ {
        alias /home/ubuntu/rg-releases/website/static/;
        include /etc/nginx/conf.d/rg-securite.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @bunproxy;
    }
    location @bunproxy {
        proxy_pass http://$website_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # API Azalée -> proxy transparent vers le backend unifié (préserve POST/PUT/headers/Discord bots)
    location /api/ {
        proxy_pass http://$website_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host rosegriffon.fr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Compatibilité Supabase self-host
    include /etc/nginx/conf.d/supabase-compat.inc;

    # Dashboard Azalée -> Admin Rose Griffon
    location ^~ /dashboard {
        rewrite ^/dashboard/(.*)$ https://rosegriffon.fr/admin/$1 permanent;
        rewrite ^/dashboard/?$ https://rosegriffon.fr/admin permanent;
    }

    # Actualités et articles Azalée
    location ^~ /news {
        return 301 https://rosegriffon.fr$request_uri;
    }

    # Chemins déjà sous /wiki/
    location ^~ /wiki/ {
        return 301 https://rosegriffon.fr$request_uri;
    }

    # Catalogue complet du wiki et outils du jeu -> rosegriffon.fr/wiki/*
    location ~ ^/(chara|skill|item|aura|passive|tactic|equipe|quete|stade|succes|niveau|drops|invocation|entraineur|capsule|gallery|textures|sons|videos|modeles|mode|keshin|tools|save|demo|cross|patch-notes|vroid|avatar)(/|$) {
        return 301 https://rosegriffon.fr/wiki$request_uri;
    }

    # Page d'accueil Azalée -> Portail Wiki Rose Griffon
    location = / {
        return 301 https://rosegriffon.fr/wiki;
    }

    # Tout autre chemin -> rosegriffon.fr
    location / {
        return 301 https://rosegriffon.fr$request_uri;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/azalee.rosegriffon.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/azalee.rosegriffon.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = azalee.rosegriffon.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name azalee.rosegriffon.fr 51.77.147.152;
    return 404; # managed by Certbot
}

# SUPERSEDED (2026-09-26): nginx/rg/rg-production.conf now serves achillea.rosegriffon.fr directly
# (its own `/health/check` and `/api/` blocks proxy to 127.0.0.1:4000) and is the canonical live
# vhost; do not install this file alongside it. See docs/PORTS-AND-DOMAINS.md.
# Achilléa est désormais rendu par Next sous `rosegriffon.fr/achillea`.
# Ce vhost ne conserve que les passerelles d'API et callbacks OAuth historiques ;
# tout contenu web, y compris les anciens bundles Angular, est redirigé en 301.
#
# Cert     : sudo certbot certonly --webroot -w /var/www/html -d achillea.rosegriffon.fr

# Passerelle ranked (Colyseus + proxy JSON vers bot :4000)
# max_fails/fail_timeout : après 3 échecs le backend est marqué mort 15 s, nginx sert
# immédiatement la réponse d'indisponibilité au lieu de retenter un amont éteint à
# chaque requête (le bot redémarre chaque nuit et à chaque relance du watchdog).
upstream achillea_api {
    server 127.0.0.1:4002 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# Bot TSed direct — uploads binaires (multipart). Le gateway ranked lit le body
# via bun-serve-express en UTF-8 et corrompait les PNG (0x89 → U+FFFD).
upstream achillea_bot_direct {
    server 127.0.0.1:4000 max_fails=3 fail_timeout=15s;
    keepalive 8;
}

# Routes métier migrées : elles gardent leur URL publique historique, mais
# convergent vers l'API Elysia/Kysely unique.
upstream rg_unified_api_achillea {
    server 127.0.0.1:8800 max_fails=3 fail_timeout=15s;
    keepalive 16;
}


# HTTP — ACME + redirection HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name achillea.rosegriffon.fr;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS — SPA + proxy API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name achillea.rosegriffon.fr;

    ssl_certificate     /etc/letsencrypt/live/achillea.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/achillea.rosegriffon.fr/privkey.pem;

    include /etc/nginx/conf.d/achillea-headers.inc;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json text/css image/svg+xml application/manifest+json;
    gzip_min_length 256;

    client_max_body_size 6M;

    # Indisponibilité du bot en JSON, pas en HTML : le seul appelant de /api est le
    # XHR de la SPA, à qui une page de maintenance ne sert à rien. La SPA elle-même
    # est statique — elle ne tombe pas avec le bot, donc elle reste chargée et peut
    # afficher son propre état dégradé. C'est l'adaptation du @maintenance de rg à
    # une façade statique plutôt qu'à un rendu serveur.
    location @api_indisponible {
        default_type application/json;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"ok":false,"error":"service_unavailable","hint":"le bot redemarre, reessayez dans quelques secondes","retryAfter":15}';
    }

    # Réservoir de fragments : les morceaux hachés des versions précédentes restent
    # joignables ici. Sans lui, un onglet ouvert avant une publication demande un
    # `chunk-<hash>.js` que la nouvelle version ne contient plus → erreur de
    # chargement de morceau côté Angular. Généré par scripts/ops/deploy.ts.
    location @reservoir {
        root /home/ubuntu/achillea-releases/web/static;
        # Pas de `expires` : il poserait un second Cache-Control à côté de celui-ci.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/achillea-headers.inc;
        access_log off;
    }

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    # API Supabase locale dédiée à Achillea. Les clés de rôle restent requises
    # par chaque service; aucun secret serveur n'est injecté par nginx.
    location ^~ /rest/v1/ {
        proxy_pass http://127.0.0.1:8820/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # GoTrue (achillea-auth.service, :8824) est RETIRÉ du chemin public.
    #
    # Achilléa n'a jamais eu qu'une seule session : celle que le backend Ts.ED
    # signe lui-même sous `/api/auth/*` (cookie JWT, cf. src/api/controllers/
    # auth.ts et oauth.ts), dérivée du compte Rose Griffon. Aucune ligne des
    # trois paquets `achillea-*` ni des deux applications ne référence
    # `/auth/v1` ou GoTrue : le service a été installé pendant la bascule
    # self-host « par symétrie » avec la pile RG, et n'a jamais servi — zéro
    # requête `/auth/v1/` dans les journaux d'accès publics.
    #
    # L'unité est désactivée au démarrage. Proxifier vers elle ne produirait
    # donc qu'un 502 au prochain redémarrage de la machine : un 410 explicite
    # dit la même chose, tout de suite et sans ambiguïté — même parti pris que
    # `/rag/` et `/mcp` dans api.rosegriffon.conf.
    location ^~ /auth/v1/ {
        return 410 '{"status":"retired","service":"achillea-gotrue","hint":"la session Achillea est emise par /api/auth"}\n';
        default_type application/json;
    }

    # Le callback historique `/api/auth/callback` appartient au backend TSed :
    # il doit suivre la location `/api/auth/` plus bas afin de valider le state
    # signé, synchroniser l'utilisateur et poser son cookie JWT.

    location ^~ /storage/v1/ {
        proxy_pass http://127.0.0.1:8821/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 6M;
    }

    location ^~ /realtime/v1/ {
        proxy_pass http://127.0.0.1:8822/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Prévisualisation : pose (ou retire) le cookie qui aiguille vers la version en
    # relecture, sur le domaine public. Évite un sous-domaine + DNS + certificat par
    # version. Sans cookie, le comportement est rigoureusement inchangé.
    location = /__preview {
        if ($arg_off) {
            add_header Set-Cookie "achillea_preview=; Path=/; Max-Age=0; SameSite=Lax" always;
            return 302 /;
        }
        add_header Set-Cookie "achillea_preview=$arg_token; Path=/; Secure; HttpOnly; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 302 /;
    }

    # Uploads images : bypass ranked → bot :4000 (corps binaire intact)
    # Path public /api/proxy/* → bot /proxy/* (controllers montés sur /)
    location ^~ /api/proxy/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://achillea_bot_direct;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;
        # Fail-fast : 3 s pour se connecter à un port local. Au-delà le bot est mort,
        # pas lent — inutile de faire patienter 60 s.
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 =503 @api_indisponible;
        client_max_body_size 6M;
    }

    # Achilléa tournaments : source canonique `rg-api.service`.
    location = /api/tournaments {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_achillea;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }

    location ^~ /api/tournaments/ {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_achillea;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }

    # Ressources déjà migrées dans l'API unifiée.
    location = /api/leagues {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_achillea;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }
    location ^~ /api/leagues/ {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_achillea;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }
    location = /api/organizations {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_achillea;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }
    location ^~ /api/organizations/ {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_achillea;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }

    # Lectures déjà couvertes par les contrats Elysia/Kysely.
    location ^~ /api/licenses/verify/ {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_achillea;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }
    location ^~ /api/wallet/ {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_achillea;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }
    location = /api/users/leaderboard {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_achillea;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }
    # Liste publique des clans ; les mutations restent sur l'adaptateur
    # historique jusqu'à validation de tous leurs contrats.
    location = /api/clans {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_achillea;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }
    location = /api/sanctions {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_achillea;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }

    # Staff player notes are API-owned; keep the historical URL as a thin alias.
    location ^~ /api/player-notes {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_achillea;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }

    location ^~ /api/admin/ops/ {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_achillea;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }
    location ^~ /api/sanctions/ {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_achillea;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }

    # Auth directe vers Ts.ED. Le détour historique par le gateway ranked Bun
    # altérait les réponses avec plusieurs Set-Cookie (callback OAuth) et les
    # POST sans corps (logout). Le backend monte ces routes sous `/auth/*`, donc
    # on retire uniquement le préfixe public `/api/`.
    location ^~ /api/auth/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://achillea_bot_direct;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 =503 @api_indisponible;
    }

    # Compatibilité des anciennes URL OAuth : aucun callback n'est traité par
    # Achilléa. Discord reste chez Better Auth ; Twitch/Challonge chez rg-api.
    location = /bot/OAuth/discord {
        return 302 https://rosegriffon.fr/login?redirect=%2Fachillea;
    }
    location ^~ /bot/OAuth/ {
        return 302 https://api.rosegriffon.fr/v1/auth/oauth/callback$is_args$args;
    }
    location = /bot/OAuth/callback {
        return 302 https://api.rosegriffon.fr/v1/auth/oauth/callback$is_args$args;
    }

    # /api -> ranked gateway (^~ : priorité sur les regex assets pour ne pas servir /api/*.json en fichier)
    location ^~ /api/ {
        proxy_pass http://achillea_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 =503 @api_indisponible;
    }

    location = /opengraph-image { return 301 https://rosegriffon.fr/achillea; }

    # Les chunks Angular encore mis en cache ne doivent pas prolonger l'ancienne
    # surface. Ils rejoignent la page Achilléa Next ; l'API et OAuth ci-dessus
    # gardent leurs locations `^~` et ne sont donc pas concernés.
    location ~ "-[A-Z0-9]{8,}\.(?:js|mjs|css|woff2?|ttf|otf|png|jpe?g|webp|avif|gif|svg|ico|json|map)$" {
        return 301 https://rosegriffon.fr/achillea;
    }

    # Actifs NON hachés (logo.svg, favicon.ico, assets/…) : pas d'immutable, leur nom
    # ne change pas quand leur contenu change.
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|png|jpe?g|webp|avif|gif|svg|ico|json|map)$ {
        return 301 https://rosegriffon.fr/achillea;
    }

    # Page d'accueil Achilléa -> Hub Achilléa Rose Griffon
    location = / {
        return 301 https://rosegriffon.fr/achillea;
    }

    # Chemins DÉJÀ préfixés `/achillea` : ne pas préfixer une seconde fois.
    # Les redirections d'authentification sont traitées par Better Auth et
    # l'API unifiée ; ce vhost ne réécrit aucun callback OAuth.
    location ^~ /achillea {
        return 301 https://rosegriffon.fr$request_uri;
    }

    # Redirection unifiée de toutes les URLs web vers Rose Griffon (zéro régression)
    location / {
        return 301 https://rosegriffon.fr/achillea$request_uri;
    }
}

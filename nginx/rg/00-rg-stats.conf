# Journal d'audience unifié de tous les domaines Rose Griffon.
#
# POURQUOI UN SEUL FICHIER
# Les domaines api/cdn/mcp/studio/supabase avaient chacun leur journal, mais
# `rosegriffon.fr` et `azalee.rosegriffon.fr` tombaient dans le journal par
# défaut au format `combined`, qui ne contient PAS le `Host` : impossible d'y
# distinguer le site principal du wiki. Un journal commun portant `$host` règle
# les deux problèmes à la fois, et tout nouveau sous-domaine y apparaît sans
# configuration supplémentaire.
#
# FORMAT
# Séparateur `\t` : ni les URL, ni les agents utilisateurs, ni les référents ne
# peuvent en contenir sans être encodés, contrairement à l'espace et aux
# guillemets du format `combined`, qu'il faut parser avec une expression
# régulière fragile. Un `split("\t")` suffit ici.
#
# `$request_time` mesure la durée VUE DU CLIENT (première ligne reçue → dernier
# octet envoyé) ; `$upstream_response_time` isole la part applicative. Les deux
# sont utiles : leur écart révèle les clients lents plutôt qu'un serveur lent.
log_format rg_stats escape=json
    '$time_iso8601\t$host\t$request_method\t$uri\t$status\t$body_bytes_sent\t'
    '$request_time\t$upstream_response_time\t$upstream_cache_status\t'
    '$http_referer\t$http_user_agent\t$remote_addr';

# `buffer` + `flush` : les écritures sont regroupées plutôt que faites à chaque
# requête, et vidées au plus tard toutes les cinq secondes. Sur le CDN, qui sert
# des milliers d'images, l'écriture ligne à ligne se voyait sur la latence.
access_log /var/log/nginx/rg-stats.log rg_stats buffer=32k flush=5s;

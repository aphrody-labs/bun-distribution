        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }

    # WebSocket Colyseus — Upgrade obligatoire
    location ~ ^/(colyseus|matchmake) {
        proxy_pass http://achillea_ranked;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        # Long-lived WS
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        error_page 502 503 504 =503 @api_indisponible;
    }

    # WebSocket Socket.io — Upgrade obligatoire
    location /socket.io/ {
        proxy_pass http://achillea_socketio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        # Long-lived WS
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        error_page 502 503 504 =503 @api_indisponible;
    }

    # Uploads images : bypass ranked → bot :4000 (corps binaire intact)
    location ^~ /api/proxy/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://achillea_bot_direct;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 =503 @api_indisponible;
        client_max_body_size 6M;
    }

    # Auth directe vers Ts.ED. Le détour historique par le gateway ranked Bun
    # altérait les réponses avec plusieurs Set-Cookie (callback OAuth) et les
    # POST sans corps (logout). Le backend monte ces routes sous `/auth/*`, donc
    # on retire uniquement le préfixe public `/api/`.
    location ^~ /api/auth/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://achillea_bot_direct;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 =503 @api_indisponible;
    }

    # Compatibilité : OAuth n'est plus possédé par Achillea/Ts.ED.
    location = /bot/OAuth/discord {
        return 302 https://rosegriffon.fr/login?redirect=%2Fachillea;
    }
    location ^~ /bot/OAuth/ {
        return 302 https://api.rosegriffon.fr/v1/auth/oauth/callback$is_args$args;
    }
    location = /bot/OAuth/callback {
        return 302 https://api.rosegriffon.fr/v1/auth/oauth/callback$is_args$args;
    }

    # REST API + storage statique
    location / {
        proxy_pass http://achillea_ranked;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 =503 @api_indisponible;
    }
}

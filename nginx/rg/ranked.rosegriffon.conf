# SUPERSEDED (2026-09-26): nginx/rg/rg-production.conf now serves ranked.rosegriffon.fr directly
# (proxies to 127.0.0.1:4002 only; the :4005 socket.io upstream below is not routed there — see
# config/service-catalog.json rg-achillea-bot note). Do not install this file alongside
# rg-production.conf. See docs/PORTS-AND-DOMAINS.md.
# achillea-ranked — Colyseus + REST sur :4002, socket.io sur :4005.
# Déployer : sudo cp infra/nginx/ranked.rosegriffon.conf /etc/nginx/conf.d/ranked.rosegriffon.conf
# Cert : sudo certbot certonly --webroot -w /var/www/html -d ranked.rosegriffon.fr

# max_fails/fail_timeout : après 3 échecs l'amont est marqué mort 15 s → réponse
# d'indisponibilité immédiate au lieu d'une nouvelle tentative par requête. Le bot
# redémarre chaque nuit (achillea-nightly) et à chaque relance du watchdog : sans
# cela, chaque requête de la fenêtre de redémarrage attendait le délai plein.
upstream achillea_ranked {
    server 127.0.0.1:4002 max_fails=3 fail_timeout=15s;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_time 1h;
    keepalive_timeout 60s;
}

# socket.io — même processus que le bot (:4005), amont nommé pour porter les mêmes
# garde-fous que le reste plutôt qu'un proxy_pass sur adresse littérale.
upstream achillea_socketio {
    server 127.0.0.1:4005 max_fails=3 fail_timeout=15s;
}

# Les routes métier déjà portées dans l'API unifiée ne repassent plus par
# Ts.ED/ranked. Le client historique conserve son préfixe `/api`, mais la
# source d'exécution est Elysia + Kysely sur 8800.
upstream rg_unified_api_ranked {
    server 127.0.0.1:8800 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# HTTP — ACME + redirect HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ranked.rosegriffon.fr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS — REST + WSS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ranked.rosegriffon.fr;

    ssl_certificate /etc/letsencrypt/live/ranked.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ranked.rosegriffon.fr/privkey.pem;

    include /etc/nginx/conf.d/achillea-headers.inc;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;

    client_max_body_size 6M; # screenshots disputes max 5M + overhead

    # Ce domaine ne sert que de l'API : une page HTML de maintenance y serait
    # illisible pour l'appelant. On répond donc en JSON, avec Retry-After pour que
    # les clients qui le respectent espacent leurs tentatives.
    location @api_indisponible {
        default_type application/json;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"ok":false,"error":"service_unavailable","hint":"le bot redemarre, reessayez dans quelques secondes","retryAfter":15}';
    }

    # Healthcheck — bypass log. Sondé toutes les 60 s par achillea-watchdog.timer :
    # `access_log off` évite d'ajouter 1 440 lignes par jour au journal d'audience.
    location = /api/health {
        proxy_pass http://achillea_ranked;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        access_log off;
        error_page 502 503 504 =503 @api_indisponible;
    }

    # Achilléa tournaments : contrat identique, backend désormais unifié.
    # Les deux locations couvrent `/api/tournaments` et ses sous-routes.
    location = /api/tournaments {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_ranked;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }

    location ^~ /api/tournaments/ {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_ranked;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }

    # Même convergence pour les ressources Elysia déjà contractuellement
    # complètes (le client historique garde `/api`).
    location = /api/leagues {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_ranked;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }
    location ^~ /api/leagues/ {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_ranked;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }
    location = /api/organizations {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_ranked;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }
    location ^~ /api/organizations/ {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_ranked;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }

    # Lectures publiques/session déjà couvertes par les contrats Elysia.
    location ^~ /api/licenses/verify/ {
        rewrite ^/api/(.*)$ /v1/achillea/$1 break;
        proxy_pass http://rg_unified_api_ranked;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @api_indisponible;
    }
    location ^~ /api/wallet/ {

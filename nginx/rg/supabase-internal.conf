# SUPERSEDED (2026-09-26): only consumed via `include supabase-compat.inc` by the legacy per-host
# rg vhosts (rosegriffon.conf, azalee.rosegriffon.conf, cdn.rosegriffon.conf), which are themselves
# superseded by nginx/rg/rg-production.conf. rg-production.conf implements /storage/v1/ and
# /realtime/v1/ inline (straight to rg-api:8800) and never includes this file or listens on :8811.
# Not part of config/nginx-routes.json. See docs/PORTS-AND-DOMAINS.md.
# ══════════════════════════════════════════════════════════
# Endpoint Supabase-compatible interne — 127.0.0.1:8811
# ══════════════════════════════════════════════════════════
#
# Point d'entrée unique pour tout ce qui tourne sur le VPS et parle
# `@supabase/supabase-js` côté serveur (cron, scripts d'ops, bot, builds) :
#   SUPABASE_INTERNAL_URL=http://127.0.0.1:8811
#
# Ne sort pas de la boucle locale — aucune exposition publique, aucun TLS.

server {
    listen 127.0.0.1:8811;
    server_name _;

    access_log /var/log/nginx/supabase-internal.access.log;
    error_log  /var/log/nginx/supabase-internal.error.log;

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"service":"supabase-internal"}';
    }

    include /etc/nginx/conf.d/supabase-compat.inc;
}

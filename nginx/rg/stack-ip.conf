# ORPHANED TEMPLATE (2026-09-26 audit, docs/PORTS-AND-DOMAINS.md §4 item 10): a repo-wide
# search of every sibling checkout (aphrody-ai, aphrody-ui, aphrody-web, aphrody-os, nie, rg,
# shenron) found no code, systemd unit, or documentation anywhere that owns `stack_api` on
# :3010 or serves from `/var/www/stack`. No `config/service-catalog.json` entry, no domain, and
# no other reference to this template exist in this repository either. Its purpose is not
# recoverable from source. Kept in place (not deleted) only because it may still be installed
# on the live host outside this repo's tracked state; do not reinstall or extend it without
# first confirming a live owner, and consider deleting outright if none is found on-host.
upstream stack_api {
    server 127.0.0.1:3010;
    keepalive 16;
}

server {
    listen 3080;
    listen [::]:3080;
    # Only listener on :3080, so the catch-all name suffices; no public IP is pinned here.
    server_name _;

    root /var/www/stack;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 256;
    client_max_body_size 12M;

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://stack_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /api/ {
        proxy_pass http://stack_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
        proxy_read_timeout 60s;
    }

    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|png|jpe?g|webp|avif|gif|svg|ico|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}

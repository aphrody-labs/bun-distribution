[patch.crates-io]
# Integrated YAML implementation preserves the Mistral.rs 0.0.16 API and regex compatibility.
serde-saphyr = { path = "crates/compat/serde-saphyr" }
# Modified layout fork; preserve local fixes through a commit-locked Git dependency.
taffy = { git = "ssh://git@github-dev/aphrody-labs/taffy.git", rev = "ed38f5bb36affbc6bfa35b01f0fc866585f0c37d" }
# Integrated Unicode implementation preserves the private C++ namespace alongside V8.
simdutf = { path = "crates/native/simdutf" }
# tauri-plugin-dialog 3.0.0-alpha.2 predates tauri 3.0.0-alpha.3 (Manager::run_on_main_thread); see config/tauri-upstream.json

# Build footprint (2026-10-02): full DWARF for 191 members and ~2,300 dependencies made target/debug ~250 GiB and
# kept the WSL disk saturated during links. Line tables keep file:line backtraces and profiler symbols for workspace
# code; dependencies carry no debuginfo. Opt back in per crate with [profile.dev.package.<name>] debug = true.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

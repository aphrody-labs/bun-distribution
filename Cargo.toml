# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "3"
members = ["crates/iecode/ievr-data", "crates/infra/*", "crates/contracts/aphrody-kernel-client", "crates/ai/*", "crates/web/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
authors = ["aphrody-code"]
homepage = "https://github.com/aphrody-labs/aphrody"
description = "aphrody — the ultimate cross-platform CLI (Linux/Windows/WASM)."
categories = ["command-line-utilities", "development-tools", "web-programming"]
keywords = ["cli", "cross-platform", "rust", "linux", "wasm"]

[workspace.dependencies]
anyhow = { version = "1.0", features = [] }
aphrody = { path = "crates/ai/aphrody", features = [] }

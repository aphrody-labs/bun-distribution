# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "3"
members = ["crates/ui/*", "crates/infra/*", "crates/contracts/*", "crates/os/*", "crates/shell/*", "crates/compat/*", "crates/native/*", "crates/ml/*", "crates/ai/*", "crates/google/*", "crates/interop/*", "apps/cli", "crates/web/*", "crates/discord/*", "crates/engine/*", "crates/tauri/*"]
exclude = [
  "crates/contracts/schema",
  "crates/os/drive",
  "crates/tauri/aphrody-tauri-api",
  "crates/tauri/aphrody-tauri-plugin-sql",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
authors = ["aphrody-code"]
homepage = "https://github.com/aphrody-labs/aphrody"
description = "aphrody \u2014 the ultimate cross-platform CLI (Linux/Windows/WASM)."
categories = ["command-line-utilities", "development-tools", "web-programming"]
keywords = ["cli", "cross-platform", "rust", "linux", "wasm"]
[workspace.dependencies]
aphrody-ai = { path = "crates/ai/ai", version = "1.0.0" }
aphrody-softraster = { path = "crates/ui/softraster", version = "1.0.0-canary" }

# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "3"
members = ["crates/ui/*", "crates/infra/*", "crates/contracts/*", "crates/os/ostd/*", "crates/os/kernel/core", "crates/os/kernel/client", "crates/os/kernel/comps/*", "crates/os/kernel/libs/*", "crates/shell/*", "crates/compat/*", "crates/native/*", "crates/ml/*", "crates/ai/*", "crates/interop/*", "crates/engine/*", "crates/tauri/*", "crates/pkg/*"]
exclude = [
  "crates/shell/web",
  "crates/contracts/schema",
  "crates/os/kernel/comps/drive",
  "crates/tauri/aphrody-tauri-api",
  "crates/tauri/aphrody-tauri-runtime",
  "crates/web/dragon-pixel-core",
  "crates/web/dragon-pixel-server",
  "crates/web/dragon-pixel-wasm",
]

[workspace.package]
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
authors = ["aphrody-code"]
homepage = "https://github.com/aphrody-labs/aphrody"
description = "aphrody \u2014 the ultimate cross-platform CLI (Linux/Windows/WASM)."
categories = ["command-line-utilities", "development-tools", "web-programming"]
keywords = ["cli", "cross-platform", "rust", "linux", "wasm"]
[workspace.dependencies]
tauri-build = { package = "aphrody-tauri-build", path = "../bun/packages/bun-tauri/crates/aphrody-tauri-build", version = "1.4.4" }

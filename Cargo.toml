[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[patch.crates-io]
# Integrated Unicode implementation preserves the private C++ namespace alongside V8.
simdutf = { path = "crates/native/simdutf" }
# rfb-encodings 0.1.7 (Apache-2.0, used by rustvncserver): fixes the inverted true-colour test that skipped pixel translation for BGRA clients.
rfb-encodings = { path = "crates/compat/rfb-encodings" }
# tauri-plugin-dialog 3.0.0-alpha.2 predates tauri 3.0.0-alpha.3 (Manager::run_on_main_thread); see tools/config/tauri-upstream.json

# Build footprint (2026-10-02): full DWARF for 191 members and ~2,300 dependencies made target/debug ~250 GiB and
# kept the WSL disk saturated during links. Line tables keep file:line backtraces and profiler symbols for workspace
# code; dependencies carry no debuginfo. Opt back in per crate with [profile.dev.package.<name>] debug = true.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

# Precompiled runtime artifact (docs/architecture/runtime-native/RUNTIME-ABI.md, packages/engine/yolo/yolo.just runtime-build): release with unwinding panics.
[profile.runtime]
inherits = "release"
panic = "unwind"

# WebAssembly release profile: aggressive size optimization, link-time optimization, single codegen unit, and abort-on-panic.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Use the same local application contracts for the migrated Bun providers.

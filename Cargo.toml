[workspace.package]
version = "1.4.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/aphrody-labs/bun-distribution"
rust-version = "1.97"
authors = ["aphrody-dev <contact@aphrody.com>"]
homepage = "https://aphrody.app"
keywords = ["aphrody", "bun", "runtime", "protocol", "workspace"]
categories = ["development-tools", "api-bindings", "web-programming"]

[workspace.dependencies]
tracing-subscriber = { version = "0.3.22", features = ["env-filter","fmt","json","regex","registry"] }
aphrody-command = { path = "crates/aphrody-command", version = "1.4.4", features = [] }
aphrody-agent-home = { path = "crates/aphrody-agent-home", version = "1.4.4", features = [] }

# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "3"
members = ["crates/iecode/ievr-data", "crates/infra/*", "crates/contracts/aphrody-kernel-client", "crates/ai/aphrody-agent-home", "crates/ai/aphrody-models", "crates/ai/aphrody-config", "crates/ai/aphrody-toolcall", "crates/ai/aphrody-patch", "crates/ai/aphrody-context", "crates/ai/aphrody-prompts", "crates/ai/aphrody-providers"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
authors = ["aphrody-code"]
homepage = "https://github.com/aphrody-labs/aphrody"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }
anyhow = "1.0"
async-trait = "0.1"
arc-swap = "1.7"
base64 = "0.22"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6"
dirs = "6"
dunce = "1.0"
futures-util = "0.3"
hex = "0.4"
gix = { version = "0.83", default-features = false, features = ["sha1", "basic", "extras", "comfort", "max-performance-safe", "revision", "index", "worktree-mutation"] }
globset = "0.4"
ignore = "0.4"
memmap2 = "0.9.11"
notify = "8"
notify-debouncer-full = "0.6"
octocrab = "0.50"
parking_lot = "0.12"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
ring = "0.17"
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
thiserror = "2.0"
toml = "0.9"
tokio = { version = "1.52", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util"] }
tracing = "0.1"
unicode-segmentation = "1"
url = "2"
which = "8"
criterion = "0.8"
pretty_assertions = "1"
schemars = { version = "0.8", features = ["derive"] }
similar = "3"
minijinja = { version = "2", default-features = false, features = ["loader", "builtins", "macros", "multi_template", "deserialization", "serde"] }
aphrody-models = { path = "crates/ai/aphrody-models" }
aphrody-config = { path = "crates/ai/aphrody-config" }
fast_rsync = "0.2"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "3.0"
opendal = { version = "0.59", default-features = false, features = ["executors-tokio", "services-fs"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

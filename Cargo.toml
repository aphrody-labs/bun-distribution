[workspace]
resolver = "3"
members = [
    "crates/craft-fonts",
    "crates/craft-fonts-tests",
]

[workspace.package]
version = "1.4.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/aphrody-labs/bun-distribution"
rust-version = "1.97"
authors = ["aphrody-dev <contact@aphrody.com>"]

[workspace.dependencies]
anyhow = { version = "=1.0.104", default-features = false }
base64 = { version = "=0.23.1", default-features = false }
chrono = { version = "=0.4.45", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }
image = { version = "=0.25.10", default-features = false }
libc = { version = "=0.2.190", default-features = false }
log = { version = "=0.4.34", default-features = false }
png = { version = "=0.18.1", default-features = false }
regex = { version = "=1.13.1", default-features = false }
reqwest = { version = "=0.13.5", default-features = false }
rustls = { version = "=0.23.45", default-features = false }
serde = { version = "=1.0.229", default-features = false }
serde_json = { version = "=1.0.154", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
tempfile = { version = "=3.27.0", default-features = false }
thiserror = { version = "=2.0.21", default-features = false }
tokio = { version = "=1.53.2", default-features = false }
tracing = { version = "=0.1.44", default-features = false }
url = { version = "=2.5.8", default-features = false }
uuid = { version = "=1.28.0", default-features = false }

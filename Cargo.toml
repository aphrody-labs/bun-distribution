[workspace]
resolver = "3"
members = [
    "crates/craft-atomic",
    "crates/craft-settings",
    "crates/craft-cms",
    "crates/craft-print",
    "crates/craft-quit",
    "crates/craft-ui",
    "crates/craft-fonts",
    "crates/craft-fonts-tests",
    "crates/deckcraft-matroska",
    "crates/pdfcraft-compare",
    "crates/cadcraft-cli",
    "crates/cadcraft-color",
    "crates/cadcraft-geom",
    "crates/cadcraft-doc",
    "crates/cadcraft-engine",
    "crates/cadcraft-constraints",
    "crates/cadcraft-dxf",
    "crates/cadcraft-dwg",
    "crates/cadcraft-fonts",
    "crates/cadcraft-io",
    "crates/cadcraft-mcp",
    "crates/cadcraft-render",
    "crates/cadcraft-ui-egui",
    "crates/gridcraft-pdf",
    "crates/aphrody-a2a",
    "crates/aphrody-agent-proto",
    "crates/aphrody-app-protocol",
    "crates/aphrody-toolcall",
    "crates/aphrody-patch",
    "crates/aphrody-toolcall-repair",
    "crates/aphrody-translate-core",
    "crates/aphrody-http-error",
    "crates/aphrody-guard",
    "crates/aphrody-subsystem",
    "crates/aphrody-proc",
    "crates/aphrody-config",
    "crates/aphrody-jev",
]

[workspace.package]
version = "1.4.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/aphrody-labs/bun-distribution"
rust-version = "1.97"
authors = ["aphrody-dev <contact@aphrody.com>"]
homepage = "https://aphrody.app"
keywords = ["aphrody", "bun", "runtime", "protocol", "workspace"]
categories = ["development-tools", "api-bindings", "web-programming"]

[workspace.dependencies]
craft-fonts = { path = "crates/craft-fonts", version = "=1.4.4" }
craft-fonts-tests = { path = "crates/craft-fonts-tests", version = "=1.4.4" }
craft-atomic = { path = "crates/craft-atomic", version = "=1.4.4" }
craft-settings = { path = "crates/craft-settings", version = "=1.4.4" }
craft-cms = { path = "crates/craft-cms", version = "=1.4.4" }
craft-print = { path = "crates/craft-print", version = "=1.4.4" }
craft-quit = { path = "crates/craft-quit", version = "=1.4.4" }
craft-ui = { path = "crates/craft-ui", version = "=1.4.4" }
deckcraft-matroska = { path = "crates/deckcraft-matroska", version = "=1.4.4" }
pdfcraft-compare = { path = "crates/pdfcraft-compare", version = "=1.4.4" }
cadcraft-color = { path = "crates/cadcraft-color", version = "=1.4.4" }
cadcraft-geom = { path = "crates/cadcraft-geom", version = "=1.4.4" }
cadcraft-doc = { path = "crates/cadcraft-doc", version = "=1.4.4" }
cadcraft-engine = { path = "crates/cadcraft-engine", version = "=1.4.4" }
cadcraft-constraints = { path = "crates/cadcraft-constraints", version = "=1.4.4" }
cadcraft-dxf = { path = "crates/cadcraft-dxf", version = "=1.4.4" }
cadcraft-dwg = { path = "crates/cadcraft-dwg", version = "=1.4.4" }
cadcraft-fonts = { path = "crates/cadcraft-fonts", version = "=1.4.4" }
cadcraft-io = { path = "crates/cadcraft-io", version = "=1.4.4" }
cadcraft-mcp = { path = "crates/cadcraft-mcp", version = "=1.4.4" }
cadcraft-render = { path = "crates/cadcraft-render", version = "=1.4.4" }
cadcraft-ui-egui = { path = "crates/cadcraft-ui-egui", version = "=1.4.4" }
gridcraft-pdf = { path = "crates/gridcraft-pdf", version = "=1.4.4" }
aphrody-a2a = { path = "crates/aphrody-a2a", version = "=1.4.4" }
aphrody-agent-proto = { path = "crates/aphrody-agent-proto", version = "=1.4.4" }
aphrody-app-protocol = { path = "crates/aphrody-app-protocol", version = "=1.4.4" }
aphrody-toolcall = { path = "crates/aphrody-toolcall", version = "=1.4.4" }
aphrody-patch = { path = "crates/aphrody-patch", version = "=1.4.4" }
aphrody-toolcall-repair = { path = "crates/aphrody-toolcall-repair", version = "=1.4.4" }
aphrody-translate-core = { path = "crates/aphrody-translate-core", version = "=1.4.4" }
aphrody-http-error = { path = "crates/aphrody-http-error", version = "=1.4.4" }

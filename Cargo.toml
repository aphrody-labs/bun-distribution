# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "3"
members = ["crates/ui/*", "crates/iecode/*", "crates/infra/*", "crates/contracts/*", "crates/os/*", "crates/shell/*", "crates/compat/*", "crates/native/*", "crates/koharu/*", "crates/ai/*", "crates/web/*"]


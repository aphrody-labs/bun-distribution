# cargo-deny policy for the whole workspace (run: just deny)

[graph]
all-features = false

[advisories]
version = 2
# Unmaintained crates count only when a workspace crate depends on them directly; the transitive
# ones (difference, fxhash, paste, rustls-pemfile, rustybuzz, serial, ttf-parser) have no
# maintained drop-in in their parents (apple-codesign, selectors, gemm, portable-pty, athena-text).
unmaintained = "workspace"
ignore = [
  # rsa Marvin attack: no fixed release; reached through apple-codesign and jsonwebtoken.
  { id = "RUSTSEC-2023-0071", reason = "no fixed rsa release; transitive (apple-codesign, jsonwebtoken)" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "BlueOak-1.0.0",
  "NCSA",
  "bzip2-1.0.6",
  "LGPL-2.0-or-later",
  "Unlicense",
]
# Per-crate exceptions for licenses not allowed globally: Spacedrive-derived aphrody-drive,
# the IJG clause of jpeg-encoder (remote-desktop) and libesedb (rookie-cookies in aphrody-ffi).
exceptions = [
  { crate = "aphrody-drive", allow = ["FSL-1.1-ALv2"] },
  { crate = "jpeg-encoder", allow = ["IJG"] },
  { crate = "libesedb", allow = ["LGPL-3.0-or-later"] },
  { crate = "libesedb-sys", allow = ["LGPL-3.0-or-later"] },
]

# Unpublished workspace crates (publish = false) carry no license of their own.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git dependencies allowed in Cargo.lock (the aphrody-labs taffy fork).
allow-git = [
  "ssh://git@github-dev/aphrody-labs/taffy.git",
]

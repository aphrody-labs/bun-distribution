name: Set up Bun and install dependencies
description: Install the Aphrody Bun runtime, restore Bun's package cache (saved only from trusted default-branch events) and install the locked dependencies.
inputs:
  bun-version:
    description: Bun release to install.
    default: "1.4.4"
  install:
    description: Whether to run bun install --frozen-lockfile.
    default: "true"
outputs:
  can-save:
    description: Whether this run may update the shared Bun package cache.
    value: ${{ steps.context.outputs.can-save }}
  path:
    description: The Bun package-cache directory.
    value: ${{ steps.context.outputs.path }}
runs:
  using: composite
  steps:
    - name: Install Bun (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        curl -fsSL https://aphrody.app/install | bash -s "${BUN_VERSION}"
        echo "${BUN_INSTALL:-$HOME/.bun}/bin" >> "${GITHUB_PATH}"
    - name: Install Bun (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        & ([scriptblock]::Create((Invoke-RestMethod https://aphrody.app/install.ps1))) $env:BUN_VERSION
        Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE ".bun\bin")
    - id: context
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        LOCKFILE_HASH: ${{ hashFiles('bun.lock', 'bunfig.toml') }}
      run: |
        cache_path="$(bun pm cache)"
        can_save=false
        if [[ -n "${DEFAULT_BRANCH}" && "${GITHUB_REF}" == "refs/heads/${DEFAULT_BRANCH}" && ( "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "schedule" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ) ]]; then
          can_save=true
        fi
        {
          printf 'can-save=%s\n' "${can_save}"
          printf 'path=%s\n' "${cache_path}"
          printf 'key=%s\n' "bun-install-${RUNNER_OS}-${RUNNER_ARCH}-${LOCKFILE_HASH}"
        } >> "${GITHUB_OUTPUT}"
    - name: Restore and save Bun package downloads
      if: steps.context.outputs.can-save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.context.outputs.path }}
        key: ${{ steps.context.outputs.key }}
    - name: Restore Bun package downloads without saving
      if: steps.context.outputs.can-save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.context.outputs.path }}
        key: ${{ steps.context.outputs.key }}
    - name: Install locked dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile

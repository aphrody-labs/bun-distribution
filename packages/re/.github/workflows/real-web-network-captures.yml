name: Real historical web network captures

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      description: Portable build cache artifact from the calling CI run.
      required: false
      type: string
      default: ""

permissions:
  contents: read

env:
  HUSKY: "0"
  NODE_OPTIONS: --max-old-space-size=768

jobs:
  real-web-network-captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-bun
        uses: ./.github/actions/setup-bun
      - name: Acquire fixed upstream native profile in runner temporary storage
        shell: bash
        run: |
          capture_tool_root="${RUNNER_TEMP}/rea-mitmproxy-12.2.3"
          mkdir -p "${capture_tool_root}"
          curl --fail --location --retry 3 --max-time 180 \
            https://downloads.mitmproxy.org/12.2.3/mitmproxy-12.2.3-linux-x86_64.tar.gz \
            --output "${capture_tool_root}/mitmproxy.tar.gz"
          echo '2e95286b618fa6fd33e5e62a78c2e5112571d85f42ec2bac29b97ee242bdb5c5  mitmproxy.tar.gz' \
            | (cd "${capture_tool_root}" && sha256sum --check --strict)
          tar -xzf "${capture_tool_root}/mitmproxy.tar.gz" -C "${capture_tool_root}"
          echo "REA_MITMDUMP_COMMAND=${capture_tool_root}/mitmdump" >> "${GITHUB_ENV}"
      - name: Verify upstream producer fixtures through public CLI and MCP
        run: bun run verify:web:network-captures

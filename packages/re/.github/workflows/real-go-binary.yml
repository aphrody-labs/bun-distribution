name: Real Go binary metadata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/real-go-binary.yml"
      - "src/go/**"
      - "src/domain/go/**"
      - "src/domain/dosMz.ts"
      - "src/application/go/**"
      - "src/contracts/go/**"
      - "src/composition/go.ts"
      - "src/cli/goCommands.ts"
      - "src/server/registerGoTools.ts"
      - "src/server/createServer.ts"
      - "src/cli.ts"
      - "src/cliCommandNames.ts"
      - "src/contracts/toolContracts.ts"
      - "src/contracts/toolEffects.ts"
      - "src/artifacts/readStableArtifact*.ts"
      - "src/artifacts/ArtifactReader.ts"
      - "src/process/PrivateRuntimeRoot.ts"
      - "scripts/verify-go-binary.mjs"
      - "scripts/lib/mcp-verifier-results.mjs"
      - "scripts/rea.mjs"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"

permissions:
  contents: read

concurrency:
  group: real-go-binary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=768
  HUSKY: "0"

jobs:
  real-go-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-bun
        uses: ./.github/actions/setup-bun
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.1"
          cache: false
      - name: Verify compiler-produced ELF, PE and Mach-O through public CLI and MCP
        run: bun run verify:go:binary

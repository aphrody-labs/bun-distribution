<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#1a1a2e"/>
  <rect width="1200" height="675" fill="url(#bg-gradient)" opacity="0.9"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="300" fill="#a14b3f" opacity="0.06"/>
  <circle cx="1000" cy="500" r="350" fill="#344E8C" opacity="0.06"/>
  <circle cx="600" cy="337" r="180" fill="#a14b3f" opacity="0.04"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Center icon group -->
  <g transform="translate(600, 290)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#icon-gradient)" stroke-width="2" opacity="0.3"/>

    <!-- Newspaper icon -->
    <g transform="translate(-28, -28)" fill="none" stroke="url(#icon-gradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <rect x="4" y="4" width="48" height="48" rx="6"/>
      <line x1="14" y1="16" x2="28" y2="16"/>
      <line x1="14" y1="24" x2="42" y2="24"/>
      <line x1="14" y1="32" x2="42" y2="32"/>
      <line x1="14" y1="40" x2="34" y2="40"/>
      <rect x="34" y="12" width="12" height="10" rx="2"/>
    </g>
  </g>

  <!-- "Chroniques du Bouquet" text -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ffffff" opacity="0.25" letter-spacing="4">
    CHRONIQUES DU BOUQUET
  </text>

  <!-- Rose Griffon branding -->
  <text x="600" y="432" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#a14b3f" opacity="0.35" letter-spacing="2">
    ROSE GRIFFON
  </text>

  <!-- Bottom accent line -->
  <rect x="540" y="455" width="120" height="2" rx="1" fill="url(#icon-gradient)" opacity="0.2"/>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="675">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="40%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="icon-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a14b3f"/>
      <stop offset="100%" stop-color="#344E8C"/>
    </linearGradient>
  </defs>
</svg>

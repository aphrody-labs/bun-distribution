<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Subs Sorter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Mes groupes</h1>
      <ul id="groups" class="groups"></ul>
      <p id="empty" class="dim" hidden>
        Aucun groupe pour l'instant. Crée-en un ci-dessous.
      </p>
      <form id="add-group" class="row">
        <input
          id="new-name"
          type="text"
          maxlength="40"
          placeholder="Nouveau groupe (ex. Combat/FGC)"
          aria-label="Nom du nouveau groupe"
          required
        />
        <input
          id="new-color"
          type="color"
          aria-label="Couleur du nouveau groupe"
        />
        <button type="submit">Ajouter</button>
      </form>
      <p id="group-error" class="error" role="alert" hidden></p>
      <p id="summary" class="dim"></p>

      <h2>Réglages</h2>
      <label class="line"
        ><input id="hideShorts" type="checkbox" /> Masquer les Shorts du
        flux</label
      >
      <label class="line"
        ><input id="hideWatched" type="checkbox" /> Masquer les vidéos déjà
        vues</label
      >
      <label class="line">
        Vue à partir de
        <input id="threshold" type="range" min="1" max="100" step="1" />
        <output id="threshold-out"></output>
      </label>
      <label class="line"
        ><input id="badges" type="checkbox" /> Pastilles de groupe sur les
        miniatures</label
      >
      <label class="line">
        Tri de la liste des chaînes
        <select id="sort">
          <option value="default">Ordre YouTube</option>
          <option value="alpha">A → Z</option>
          <option value="group">Par groupe</option>
        </select>
      </label>

      <h2>Sauvegarde</h2>
      <div class="row">
        <button id="export" type="button">Exporter</button>
        <button id="download" type="button">Télécharger .json</button>
        <button id="copy" type="button">Copier</button>
      </div>
      <textarea
        id="json"
        rows="5"
        spellcheck="false"
        aria-label="Sauvegarde JSON"
        placeholder="Colle ici une sauvegarde JSON à importer"
      ></textarea>
      <div class="row">
        <label class="file"
          >Fichier…
          <input id="file" type="file" accept="application/json,.json"
        /></label>
        <label class="line"
          ><input type="radio" name="mode" value="merge" checked />
          Fusionner</label
        >
        <label class="line"
          ><input type="radio" name="mode" value="replace" /> Remplacer</label
        >
        <button id="import" type="button">Importer</button>
      </div>
      <p id="io-status" class="dim" role="status"></p>
    </main>
    <script src="../src/core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

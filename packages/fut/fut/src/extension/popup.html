<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BXC FUT Assistant</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin: 6px 0;
      color: #94a3b8;
    }
    .stat-val {
      font-weight: 600;
      color: #f8fafc;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0369a1;
    }
    .footer {
      font-size: 10px;
      text-align: center;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span class="status-dot" id="statusDot"></span>
      <span>BXC FUT Bridge</span>
    </div>
    <span style="font-size: 11px; color: #38bdf8;" id="versionTag">v1.0.0</span>
  </div>

  <div class="card">
    <div class="stat-row">
      <span>VPS Daemon:</span>
      <span class="stat-val" id="vpsStatus">ws://localhost:3000</span>
    </div>
    <div class="stat-row">
      <span>Cookies Synced:</span>
      <span class="stat-val" id="cookieStatus">Active</span>
    </div>
    <div class="stat-row">
      <span>UTAS Telemetry:</span>
      <span class="stat-val" id="telemetryStatus">Streaming</span>
    </div>
    <div class="stat-row">
      <span>MCP Agent Control:</span>
      <span class="stat-val" style="color: #22c55e;">Ready</span>
    </div>
  </div>

  <button class="btn" id="forceSyncBtn">Force Resync Session</button>
  <button class="btn" id="snapshotBtn" style="margin-top: 6px; background: #334155;">Capture DOM Snapshot</button>

  <div class="footer">
    BXC Autonomous AI Agent Framework &copy; 2026 aphrody
  </div>

  <script src="popup.js"></script>
</body>
</html>

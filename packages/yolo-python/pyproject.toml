[build-system]
requires = [
  "bun-native-build @ git+https://github.com/aphrody-labs/bun.git@fcfc2a6dca114193a1d7120ad9cd7c2855a022b0#subdirectory=packages/bun-python-native/python/build-backend",
]
build-backend = "bun_native_build"

[project]
name = "yolo"
version = "0.1.0"
description = "Python wrapper around YOLO Rust native engine (PyO3 + uv)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0", "polars>=1.12.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "yolo._yolo_native"
python-source = "python"
features = ["pyo3/extension-module"]
locked = true

[tool.aphrody.bun-native]
revision = "6181424bc2fca4349560832161c07ba85c33e8ef"
workspace = "packages/bun-runtime-sdk"
manifest = "crates/yolo-pyo3/Cargo.toml"

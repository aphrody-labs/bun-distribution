name: Real Ghidra Windows E2E

on:
  repository_dispatch:
    types: [real-ghidra-windows]

env:
  HUSKY: "0"

permissions:
  contents: read

jobs:
  native-artifact:
    name: Build matching Windows native artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-bun
        uses: ./.github/actions/setup-bun
      - name: Prepare cross compiler
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g; s|http://archive.ubuntu.com|https://archive.ubuntu.com|g' "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++-mingw-w64-x86-64
      - run: bun run build:windows-native
      - run: bun run verify:windows-native:artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-ghidra-windows-native
          path: native/windows/build/
          if-no-files-found: error
      # The boundary observations need a separate Windows executable, which the
      # native lane skips when it is absent. Cross-build it here, where MinGW is
      # already installed, so the proof run observes them too.
      - name: Build Windows process boundary fixture
        run: |
          mkdir -p .cache/windows-process-boundary
          x86_64-w64-mingw32-g++ -municode -std=c++17 -O2 -static -Wall -Wextra \
            -o .cache/windows-process-boundary/process-boundary.exe \
            tests/fixtures/windows/processBoundary.cc -ladvapi32
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-ghidra-windows-process-boundary
          path: .cache/windows-process-boundary/
          if-no-files-found: error

  verify:
    name: Real Ghidra 12.1.4 Windows x64 PE proof
    if: github.ref == 'refs/heads/main'
    needs: native-artifact
    environment: real-ghidra-windows
    runs-on: [self-hosted, Windows, x64, ghidra-12-1-4]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-bun
        uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: real-ghidra-windows-native
          path: native/windows/build/
      - run: bun run verify:windows-native:artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: real-ghidra-windows-process-boundary
          path: .cache/windows-process-boundary/
      - run: >-
          bun run verify:windows-native -- .
          "${{ github.workspace }}\.cache\windows-process-boundary\process-boundary.exe"
      - name: Verify all admitted Windows Ghidra operations
        env:
          REA_ANALYSIS_PROVIDER: ghidra
        run: bun run verify:ghidra:windows | Tee-Object -FilePath windows-ghidra-proof.log
      - name: Verify native x86 Windows Ghidra operations
        env:
          REA_ANALYSIS_PROVIDER: ghidra
        run: bun run verify:ghidra:windows -- --x86 | Tee-Object -FilePath windows-ghidra-x86-proof.log
      - name: Verify native x64 DLL Windows Ghidra operations
        env:
          REA_ANALYSIS_PROVIDER: ghidra
        run: bun run verify:ghidra:windows -- --dll | Tee-Object -FilePath windows-ghidra-dll-proof.log
      - name: Verify native x86 DLL Windows Ghidra operations
        env:
          REA_ANALYSIS_PROVIDER: ghidra
        run: bun run verify:ghidra:windows -- --x86 --dll | Tee-Object -FilePath windows-ghidra-x86-dll-proof.log
      - name: Verify ordinary-user CLI and MCP operations
        env:
          REA_ANALYSIS_PROVIDER: ghidra
        run: bun run verify:ghidra:windows:package | Tee-Object -FilePath windows-ghidra-package-proof.log
      - name: Verify ordinary-user x86 CLI and MCP operations
        env:
          REA_ANALYSIS_PROVIDER: ghidra
        run: bun run verify:ghidra:windows:package -- --x86 | Tee-Object -FilePath windows-ghidra-x86-package-proof.log
      - name: Verify ordinary-user x64 DLL CLI and MCP operations
        env:
          REA_ANALYSIS_PROVIDER: ghidra
        run: bun run verify:ghidra:windows:package -- --dll | Tee-Object -FilePath windows-ghidra-dll-package-proof.log
      - name: Verify ordinary-user x86 DLL CLI and MCP operations
        env:
          REA_ANALYSIS_PROVIDER: ghidra
        run: bun run verify:ghidra:windows:package -- --x86 --dll | Tee-Object -FilePath windows-ghidra-x86-dll-package-proof.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-ghidra-proof
          path: |
            windows-ghidra-proof.log
            windows-ghidra-package-proof.log
            windows-ghidra-x86-proof.log
            windows-ghidra-x86-package-proof.log
            windows-ghidra-dll-proof.log
            windows-ghidra-x86-dll-proof.log
            windows-ghidra-dll-package-proof.log
            windows-ghidra-x86-dll-package-proof.log
          retention-days: 30

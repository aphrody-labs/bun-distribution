name: RG migration gates

on:
  pull_request:
    paths:
      - "apps/rg/**"
      - "packages/rg/**"
      - "docs/rg/**"
      - "config/rg/**"
      - "config/sibling-checkouts.json"
      - ".github/actions/setup-iecode/**"
      - "scripts/rg/**"
      - "scripts/audit/rg-build.test.ts"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "packages/infra/workspace/**"
      - ".github/workflows/rg-migration.yml"
  push:
    branches: [main]
    paths:
      - "apps/rg/**"
      - "packages/rg/**"
      - "docs/rg/**"
      - "config/rg/**"
      - "config/sibling-checkouts.json"
      - ".github/actions/setup-iecode/**"
      - "scripts/rg/**"
      - "scripts/audit/rg-build.test.ts"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "packages/infra/workspace/**"
      - ".github/workflows/rg-migration.yml"

permissions:
  contents: read

jobs:
  rg-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aphrody
    steps:
      - uses: actions/checkout@v4
        with:
          path: aphrody
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: ./aphrody/.github/actions/setup-iecode
        with:
          token: ${{ secrets.IECODE_CHECKOUT_TOKEN }}
      - run: bun install --frozen-lockfile
      - run: bun test packages/infra/workspace/test/rg.test.ts scripts/audit/rg-build.test.ts
      - run: bun --bun tsc --project packages/infra/workspace/tsconfig.json --noEmit
      - run: bun run rg:pipeline

name: CI timings

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: ci-timings-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  report:
    name: Collect recent completed workflow attempts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Consume only API data and execute batch code from the trusted default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: setup-bun
        uses: ./.github/actions/setup-bun
      - name: Diagnose missing and startup-failed PR CI
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bun scripts/ci/pr-ci-health.mjs
      - name: Record queue, execution, and matched step timing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
        run: bun scripts/ci/job-timings-batch.mjs
      - name: Upload CI timing artifacts
        if: always() && hashFiles('.cache/ci-job-timings/*') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-job-timings-batch
          path: .cache/ci-job-timings/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Attribute supported static failures against main
        if: ${{ !cancelled() && hashFiles('.cache/ci-job-timings/batch-manifest.json') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bun scripts/ci/failure-report.mjs
      - name: Upload CI health and failure diagnostics
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-health-diagnostics
          path: |
            .cache/ci-pr-health/
            .cache/ci-failures/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

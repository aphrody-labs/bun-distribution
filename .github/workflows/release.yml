name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: Binaries ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          rust: "true"
      - name: Build
        run: |
          bun scripts/cargo-nie.ts --install dist/bin
          bun scripts/cargo.ts exec -- build --release --locked -p bun-re --features pipeline,steam-download --bin bunre
          cp target/release/bunre dist/bin/
      - name: Archive
        run: tar -C dist -czf "bun-os-${{ matrix.target }}.tar.gz" bin
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bun-os-${{ matrix.target }}.tar.gz
          generate_release_notes: true

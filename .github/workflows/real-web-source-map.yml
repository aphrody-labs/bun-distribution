name: Real website source-map verification
on:
  workflow_call:
    inputs:
      description: Portable build cache artifact from the calling CI run.
      required: false
      type: string
      default: ""
  workflow_dispatch:
permissions:
  contents: read
env:
  HUSKY: "0"
jobs:
  real-web-source-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-bun
        uses: ./.github/actions/setup-bun
      - name: Install the pinned compiler into an isolated fixture directory
        run: mkdir -p "$RUNNER_TEMP/rea-web-source-map-compiler" && bun add --cwd "$RUNNER_TEMP/rea-web-source-map-compiler" --exact esbuild@0.25.10
      - run: bun run verify:browser:source-maps
        env:
          REA_BROWSER_EXECUTABLE: /usr/bin/google-chrome
          REA_BROWSER_NO_SANDBOX: "true"
          REA_WEB_SOURCE_MAP_COMPILER: ${{ runner.temp }}/rea-web-source-map-compiler/node_modules/esbuild/lib/main.js

# SPDX-License-Identifier: Apache-2.0
name: update
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Report only (never applies)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          bun packages/engine/yolo/src/index.ts update tools --root .
          bun packages/engine/yolo/src/index.ts update deps facts --root .
      - uses: actions/upload-artifact@v4
        with:
          name: update-facts
          path: docs/research/workspace/deps/
          if-no-files-found: ignore

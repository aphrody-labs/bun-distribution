name: Real offline EVM interface

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      description: Portable build cache artifact from the calling CI run.
      required: false
      type: string
      default: ""

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=768
  HUSKY: "0"

jobs:
  real-evm-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-bun
        uses: ./.github/actions/setup-bun
      - name: Acquire unchanged fixture compiler in isolated runner storage
        shell: bash
        run: |
          evm_fixture_root="${RUNNER_TEMP}/rea-evm-fixture-compiler"
          mkdir -p "${evm_fixture_root}"
          mkdir -p "${evm_fixture_root}" && bun add --cwd "${evm_fixture_root}" --ignore-scripts --exact solc@0.8.30
          command -v prlimit
          command -v strace
          echo "REA_VERIFY_STRACE_COMMAND=$(command -v strace)" >> "${GITHUB_ENV}"
          echo "REA_VERIFY_SOLC_MODULE=${evm_fixture_root}/node_modules/solc/index.js" >> "${GITHUB_ENV}"
      - name: Verify source-owned compiled bytecode through public CLI and MCP
        run: bun run verify:evm:interface
      - name: Verify content-hash-free and CBOR-free owned compiler artifacts
        run: bun run verify:solidity:metadata

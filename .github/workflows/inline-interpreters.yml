# SPDX-License-Identifier: Apache-2.0
name: Inline interpreter ratchet

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The scanner imports only Node built-ins: no install step is needed.
      - name: Check inline Python/Bun/Node against the baseline
        run: |
          bun packages/infra/workspace/src/ops.ts automation-inventory --inline --check --markdown \
            | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

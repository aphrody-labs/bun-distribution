name: Real browser verification

on:
  workflow_call:
    inputs:
      description: Portable build cache artifact from the calling CI run.
      required: false
      type: string
      default: ""
  workflow_dispatch:

env:
  HUSKY: "0"

permissions:
  contents: read

jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-bun
        uses: ./.github/actions/setup-bun
      - run: bun run verify:browser
        env:
          REA_BROWSER_EXECUTABLE: /usr/bin/google-chrome
          REA_BROWSER_NO_SANDBOX: "true"

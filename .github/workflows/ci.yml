  required:
    name: CI required
    # Report failed dependencies, but release superseded PR concurrency slots.
    if: ${{ !cancelled() }}
    needs:
      [
        changes,
        static,
        build,
        reverse-tools-quality,
        test-shard,
        test-source,
        sqlite-runtime,
        test,
        conformance-fixtures,
        windows-native-build,
        package-e2e,
        apple-artifacts,
        reconstruction-readiness,
        windows-curated,
        docs,
        browser,
        binary_layout,
        evm,
        javascript_recovery,
        recorded_crash,
        web_network,
        web_runtime,
        web_source_map,
        nativeaot,
        ghidra_bridge,
        website,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-bun
        uses: ./.github/actions/setup-bun
      - name: Require every selected lane to pass
        id: gate
        env:
          CI_JOBS: ${{ toJSON(needs) }}
          CI_QUALIFICATION_DIRECTORY: .cache/ci-qualification
        run: bun scripts/ci/required.mjs
      - name: Upload full qualification receipt artifact
        if: needs.changes.outputs.tier == 'full' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.gate.outputs.receipt_name }}
          path: ${{ steps.gate.outputs.receipt_path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

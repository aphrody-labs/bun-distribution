# SPDX-License-Identifier: Apache-2.0
name: Container images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish versioned images to the repository's GHCR package
        type: boolean
        default: false
      release:
        description: Immutable downloads release (empty selects the current release once)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Select one immutable runtime release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - name: Resolve published release once
        id: release
        shell: bash
        env:
          REQUESTED_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          id="${REQUESTED_RELEASE:-}"
          if [ -z "$id" ]; then
            id="$(curl --fail --silent --show-error https://downloads.aphrody.com/latest.json | jq --exit-status --raw-output '.release.id')"
          fi
          [[ "$id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          selected="$(curl --fail --silent --show-error "https://downloads.aphrody.com/releases/$id/latest.json" | jq --exit-status --raw-output '.release.id')"
          [ "$selected" = "$id" ]
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Aphrody runtime
            context: .
            file: tools/config/container/Dockerfile
            target: runtime
            cache: aphrody-runtime
          - name: Aphrody developer image
            context: .
            file: tools/config/container/Dockerfile
            target: dev
            cache: aphrody-dev
          - name: Aphrody release builder
            context: .
            file: tools/config/container/Dockerfile
            target: release-builder
            cache: aphrody-release-builder
            cache_from: |
              type=gha,scope=aphrody-dev
              type=gha,scope=aphrody-release-builder
          - name: Browser and Bun WASM package
            context: .
            file: tools/config/container/Dockerfile
            target: wasm-artifacts
            cache: aphrody-wasm
            output: type=local,dest=dist/container-wasm
          - name: Alpine minimal runtime (AMD64 and ARM64)
            context: tools/config/container/aphrody-os
            file: tools/config/container/aphrody-os/Dockerfile
            target: runtime
            cache: aphrody-alpine-runtime
            platforms: linux/amd64,linux/arm64
          - name: Alpine CLI
            context: tools/config/container/aphrody-os
            file: tools/config/container/aphrody-os/Dockerfile
            target: cli
            cache: aphrody-alpine-cli
          - name: Alpine COSMIC desktop
            context: tools/config/container/aphrody-os
            file: tools/config/container/aphrody-os/Dockerfile
            target: desktop
            cache: aphrody-alpine-desktop
          - name: Ubuntu desktop builder
            context: .
            file: tools/config/container/desktop/Dockerfile
            target: builder
            cache: aphrody-ubuntu-desktop-builder
          - name: Ubuntu desktop runtime
            context: .
            file: tools/config/container/desktop/Dockerfile
            target: runtime
            cache: aphrody-ubuntu-desktop-runtime

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up ARM64 emulation
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Authenticate the requested image publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish && matrix.target != 'wasm-artifacts'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build or publish the versioned image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms || 'linux/amd64' }}
          build-args: APHRODY_RELEASE=${{ needs.release.outputs.id }}
          outputs: ${{ matrix.output || '' }}
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && matrix.target != 'wasm-artifacts' }}
          tags: ghcr.io/aphrody-labs/aphrody:${{ matrix.cache }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.aphrody.downloads.release=${{ needs.release.outputs.id }}
          cache-from: ${{ matrix.cache_from || format('type=gha,scope={0}', matrix.cache) }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

      - name: Keep the compiled WASM package
        if: matrix.target == 'wasm-artifacts'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aphrody-browser-bun-wasm
          path: dist/container-wasm
          if-no-files-found: error

name: Aphrody Sites

on:
  push:
    branches: [os]
    paths:
      - apps/webos/**
      - apps/craft*/**
      - packages/**
      - crates/**
      - bun.lock
      - .github/workflows/aphrody-sites.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aphrody-sites-production
  cancel-in-progress: false

jobs:
  webos:
    name: Build and publish unified WebOS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Require production credential
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
      - uses: actions/checkout@v4
      - name: Skip the distribution-only kernel, LLVM and Wine forks
        run: |
          for path in vendor/cachyos-linux vendor/ogc-linux vendor/linux-cachyos vendor/kernel-patches vendor/ogc-kernel-packages vendor/nvidia-kernels vendor/open-gpu-kernel-modules vendor/llvm vendor/proton vendor/proton-cachyos vendor/wine-cachyos; do
            git config "submodule.$path.update" none
          done
      - uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          rust: "true"
      - name: Compile the complete installable Craft suite
        run: |
          rustup target add wasm32-unknown-unknown
          bun apps/webos/build-craft.ts
      - name: Build, deploy and verify all unified Worker hosts
        run: bun apps/webos/deploy.ts

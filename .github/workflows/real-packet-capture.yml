name: Real packet capture
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/boundary/captures/**"
      - "tests/boundary/cli/captureCleanup.test.ts"
      - "tests/boundary/mcp/packetCaptureMcp.test.ts"
      - "src/captures/**"
      - "src/pcap/**"
      - "src/domain/pcap/**"
      - "src/domain/analysisView/pcapCaptureView.ts"
      - "src/application/pcap/**"
      - "src/contracts/pcap/**"
      - "src/server/registerPcapTools.ts"
      - "tests/boundary/pcap/**"
      - "src/domain/captures/**"
      - "src/application/captures/**"
      - "src/contracts/captures/**"
      - "src/composition/captures.ts"
      - "src/cli/captureCommands.ts"
      - "src/server/registerCaptureTools.ts"
      - "src/server/createServer.ts"
      - "src/server/sessionAvailabilityPolicy.ts"
      - "src/application/CapabilityInventory.ts"
      - "src/contracts/toolContracts.ts"
      - "src/contracts/toolEffects.ts"
      - "src/cli.ts"
      - "src/cliCommandNames.ts"
      - "src/process/**"
      - "src/artifacts/readStableArtifact.ts"
      - "scripts/verify-packet-capture.mjs"
      - ".github/workflows/real-packet-capture.yml"
      - "package*.json"
permissions:
  contents: read
concurrency:
  group: real-packet-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tshark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-bun
        uses: ./.github/actions/setup-bun
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark util-linux python3
      - run: bun run build:cached
      - run: bun run test:focused -- tests/boundary/captures/fieldDiscovery.test.ts src/process/LinuxResourceLimits.test.ts tests/boundary/captures/captureProvider.test.ts tests/boundary/captures/captureDescriptorCleanup.test.ts tests/boundary/pcap/pcapProvider.test.ts tests/boundary/pcap/pcapProviderCrossPlatform.test.ts tests/boundary/captures/resourceLimits.test.ts tests/boundary/captures/packetOutput.test.ts tests/boundary/mcp/packetCaptureMcp.test.ts tests/boundary/cli/captureCleanup.test.ts
      - run: bun scripts/verify-packet-capture.mjs
        env:
          REA_TSHARK_COMMAND: /usr/bin/tshark
          REA_CAPINFOS_COMMAND: /usr/bin/capinfos

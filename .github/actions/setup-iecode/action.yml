name: Prepare pinned IECODE packages
description: Checkout the private producer and prepare revision-qualified local archives.
inputs:
  token:
    description: Credential with read access to the configured IECODE repository.
    required: true
runs:
  using: composite
  steps:
    - name: Read producer contract
      id: source
      shell: bash
      working-directory: ${{ github.workspace }}/aphrody
      env:
        CHECKOUT_TOKEN: ${{ inputs.token }}
      run: |
        test -n "$CHECKOUT_TOKEN" || { echo "::error::IECODE_CHECKOUT_TOKEN is required."; exit 1; }
        python3 - <<'PYTHON'
        import json, os, re
        source = json.load(open("config/sibling-checkouts.json"))["iecode"]
        match = re.fullmatch(r"https://github.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)\.git", source["repository"])
        assert match and re.fullmatch(r"[0-9a-f]{40}", source["rev"])
        assert source["path"] == "../iecode"
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            print("repository=" + match[1], file=output)
            print("revision=" + source["rev"], file=output)
        PYTHON
    - uses: actions/checkout@v4
      with:
        repository: ${{ steps.source.outputs.repository }}
        ref: ${{ steps.source.outputs.revision }}
        path: iecode
        token: ${{ inputs.token }}
        persist-credentials: false
    - name: Prepare private archives
      shell: bash
      working-directory: ${{ github.workspace }}/aphrody
      run: bun run iecode:prepare

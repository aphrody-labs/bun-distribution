name: Setup Bun
description: Installs the pinned Aphrody Bun runtime (published aphrody-labs/bun release).

inputs:
  bun-version:
    description: Published release tag of aphrody-labs/bun (bun-v<version>).
    default: "1.4.5"
    required: false
  token:
    description: Token able to read aphrody-labs/bun releases.
    default: ${{ github.token }}
    required: false

runs:
  using: composite
  steps:
    - name: Cache Bun
      uses: actions/cache@v4
      with:
        path: ~/.bun/bin
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}
    - name: Install Bun
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if ! "$HOME/.bun/bin/bun" --version 2>/dev/null | grep -q "^${BUN_VERSION}"; then
          tmp="$(mktemp -d)"
          gh release download "bun-v${BUN_VERSION}" -R aphrody-labs/bun -p bun-linux-x64.zip -D "$tmp"
          mkdir -p "$HOME/.bun/bin"
          unzip -qjo "$tmp/bun-linux-x64.zip" "*/bun" -d "$HOME/.bun/bin"
          chmod +x "$HOME/.bun/bin/bun"
        fi
        echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
        "$HOME/.bun/bin/bun" --version

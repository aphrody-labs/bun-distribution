name: Setup Bun
description: Installs the pinned Aphrody Bun runtime (published aphrody-labs/bun release).

inputs:
  bun-version:
    description: Published release tag of aphrody-labs/bun (bun-v<version>).
    default: "1.4.5"
    required: false
  token:
    description: Token able to read aphrody-labs/bun releases.
    default: ${{ github.token }}
    required: false

runs:
  using: composite
  steps:
    - name: Cache Bun
      uses: actions/cache@v4
      with:
        path: ~/.bun/bin
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}
    - name: Install Bun
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) asset=bun-linux-x64.zip; exe=bun;;
          Windows-X64) asset=bun-windows-x64.zip; exe=bun.exe;;
          *) echo "::error::no published Bun ${BUN_VERSION} runtime for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1;;
        esac
        if ! "$HOME/.bun/bin/$exe" --version 2>/dev/null | grep -q "^${BUN_VERSION}"; then
          tmp="$(mktemp -d)"
          gh release download "bun-v${BUN_VERSION}" -R aphrody-labs/bun -p "$asset" -D "$tmp"
          mkdir -p "$HOME/.bun/bin"
          unzip -qjo "$tmp/$asset" "*/$exe" -d "$HOME/.bun/bin"
          chmod +x "$HOME/.bun/bin/$exe"
        fi
        # Native tools see Windows paths: a /c/Users/... entry is not one, and the workspace scripts that spawn a
        # separate Bun (resolveBunExecutable) did not find it on the Windows runner. Hand them the executable directly.
        bin="$HOME/.bun/bin" path="$HOME/.bun/bin/$exe"
        if command -v cygpath >/dev/null; then bin="$(cygpath -w "$bin")" path="$(cygpath -w "$path")"; fi
        echo "$bin" >> "$GITHUB_PATH"
        echo "APHRODY_BUN_BINARY=$path" >> "$GITHUB_ENV"
        "$HOME/.bun/bin/$exe" --version

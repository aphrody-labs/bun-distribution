name: Setup Bun
description: Installs the pinned Aphrody Bun runtime (aphrody-labs/bun releases).

inputs:
  bun-version:
    description: Runtime version from the workspace engines field.
    default: "1.4.4"
    required: false

runs:
  using: composite
  steps:
    - name: Cache Bun
      uses: actions/cache@v4
      with:
        path: ~/.bun/bin
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}
    - name: Install Bun
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        set -euo pipefail
        if ! "$HOME/.bun/bin/bun" --version 2>/dev/null | grep -q "^${BUN_VERSION}"; then
          curl -fsSL https://aphrody.app/install | bash -s -- "bun-v${BUN_VERSION}"
        fi
        echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
        "$HOME/.bun/bin/bun" --version

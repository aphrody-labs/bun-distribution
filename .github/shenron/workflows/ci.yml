name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DISCORD_TOKEN: test-token
  GUILD_ID: "1497167233280118896"
  OWNER_ID: "11111111111111111"
  DATABASE_PATH: "./data/test-ci.db"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cible de prod = Linux (unités systemd sur le VPS). Le binaire
        # natif skia (@aphrody-code/canvas) n'est publié que pour linux-x64-gnu :
        # sur macOS aucun binding n'existe et mock.module ne peut pas intercepter
        # l'import statique → faux échec. On ne teste donc que linux.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache ~/.bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ matrix.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ matrix.os }}-

      # @aphrody/canvas is on public npm and @aphrody/* are in-repo workspaces,
      # so no GitHub Packages auth is needed.
      - name: Install
        run: bun ci

      - name: Generate entries barrel
        run: bun --filter @shenron/bot gen:entries

      - name: Verify workspace dependency catalog
        run: bun run check:catalog

      - name: Verify lockfile deduplication
        run: bun run deps:dedupe:check

      - name: Verify workspace package conformance (strict)
        run: bun run check:packages --strict

      - name: OpenAPI document is up to date
        run: bun packages/api/scripts/openapi.ts --check

      - name: UI tokens are up to date
        run: bun packages/ui/scripts/generate-tokens.ts --check

      - name: UI stylesheet equivalence
        run: bun packages/ui/scripts/check-css-equivalence.ts

      - name: AI contracts
        run: bun packages/ai/scripts/check-contracts.ts

      - name: Architecture audit
        run: bun run audit:architecture

      - name: Scripts audit
        run: bun run audit:scripts

      - name: Type-check
        run: bun run type-check

      - name: Lint (oxlint)
        run: bun run lint

      - name: Tests (every scope, strict — fails on any uncovered scope)
        # Custom runner covers EVERY workspace member (turbo skips script-less
        # ones); --strict fails the build on a zero-test scope; the live tier
        # (site no-404 prod crawler) is opt-in (--live) and stays out of CI.
        run: bun run test:ci

      # Pas de step build ici : la cible de prod n'a pas de bundle préalable.
      # - Le bot tourne `bun src/index.ts` en direct (unité systemd du VPS),
      #   jamais le binaire `--compile`. Le binaire standalone (bundling du
      #   dashboard HTML/CSS + assets fonts) est produit séparément par
      #   release.yml sur tags v* ; il n'est sur aucun chemin de déploiement.
      # - Le site est construit en artefact (`site:artifact`) consommé par
      #   aphrody-infra ; ce workflow vérifie types, lint et tests applicatifs.
      # - `turbo run build` est exclu : il lancerait le `build: tsup` des
      #   packages @aphrody/* (tsup non installé ; leurs dist sont commités).

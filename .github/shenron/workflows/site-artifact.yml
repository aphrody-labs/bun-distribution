name: Site build artifact (no deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-artifact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build verified Bun artifact
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.SITE_BUILD_DATABASE_URL }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-bun lit la version exacte depuis package.json#packageManager.
      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun downloads only
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: site-artifact-bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Require isolated read-only build database
        run: |
          test -n "$DATABASE_URL" || { echo "SITE_BUILD_DATABASE_URL absent" >&2; exit 1; }

      - name: Install exact dependencies
        run: bun ci

      - name: Build Site with Bun
        run: |
          SITE_SHA="$(git rev-parse --short HEAD)"
          export NEXT_DEPLOYMENT_ID="$SITE_SHA"
          export NEXT_DIST_DIR=.next-build
          cd apps/site
          bun ../../node_modules/next/dist/bin/next build --turbopack

      - name: Package and attest commit/checksum manifest
        run: bun scripts/ops/package-site-artifact.ts artifacts/site-build.tar.gz

      - name: Verify sidecar before upload
        run: sha256sum --check artifacts/site-build.tar.gz.sha256

      - name: Upload artifact only (never deploy)
        uses: actions/upload-artifact@v5
        with:
          name: site-build-${{ github.sha }}
          path: |
            artifacts/site-build.tar.gz
            artifacts/site-build.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

name: Demande de Fonctionnalité
description: Proposer une nouvelle fonctionnalité pour Shenron
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problème / Besoin
      description: Quel cas d'usage ou frustration cette fonctionnalité résout-elle ?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution proposée
      description: À quoi ressemblerait l'implémentation (nouvelle commande, option, rendu canvas, etc.) ?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
      description: Autres approches considérées, et pourquoi tu préfères celle-ci.

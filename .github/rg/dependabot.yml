version: 2

# Auto-update deps weekly. Groupage minimal pour réduire les PR.
# Dependabot pour GitHub Actions est natif ; npm scope inclut Bun
# (Dependabot lit package.json, indépendant du gestionnaire).
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "ci"
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "deps"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group minor/patch React + Next + TS together to avoid PR spam
    groups:
      react-next:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "@types/react*"
          - "@next/*"
        update-types:
          - "minor"
          - "patch"
      tailwind:
        applies-to: version-updates
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
        update-types:
          - "minor"
          - "patch"
      radix:
        applies-to: version-updates
        patterns:
          - "@radix-ui/*"
          - "radix-ui"
        update-types:
          - "minor"
          - "patch"
      lint:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "oxlint"
          - "prettier*"
        update-types:
          - "minor"
          - "patch"
      types:
        applies-to: version-updates
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major bumps : on les fait manuellement
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

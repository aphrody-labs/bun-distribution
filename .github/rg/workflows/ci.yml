name: Validation continue

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  achillea:
    name: Achillea sans secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer le lockfile unique
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Vérifier les imports et la topologie
        run: |
          bun run check:imports
          bun test scripts/achillea/*.test.ts

      - name: Vérifier les packages partagés
        run: |
          bun --filter @rosegriffon/achillea-types type-check
          bun --filter @rosegriffon/achillea-types test
          bun --filter @rosegriffon/achillea-core type-check
          bun --filter @rosegriffon/achillea-core test
          bun --filter @rosegriffon/achillea-client type-check
          bun --filter @rosegriffon/achillea-client test
          bun --filter @rosegriffon/achillea-contract type-check
          bun --filter @rosegriffon/achillea-contract test

      - name: Vérifier les thèmes et la navigation unifiée
        run: |
          bun test packages/ui/test packages/app-shell/test packages/preferences/test
          bun --filter @rosegriffon/ui type-check
          bun --filter @rosegriffon/app-shell type-check
          bun --filter @rosegriffon/preferences type-check

      - name: Vérifier que le contrat exporté est à jour
        run: bun --filter @rosegriffon/achillea-contract check

      - name: Vérifier le backend
        working-directory: apps/achillea-bot
        run: |
          bun run type-check
          bun run lint
          bun run test:unit
          bun run build:compile
          bun run build:ranked

      - name: Vérifier le frontend Next et les routes Achilléa migrées
        working-directory: apps/website
        run: |
          bun run type-check
          bun test src/app/achillea src/lib/achillea

      - name: Construire le site unifié
        run: bun --filter @rosegriffon/website build

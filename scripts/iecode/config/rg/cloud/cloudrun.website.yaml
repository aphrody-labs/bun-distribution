apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rosegriffon-website
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - image: IMAGE_TO_REPLACE
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_POOL_MAX
              value: "4"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi

# pg_net uses one background worker database per PostgreSQL cluster. RG does
# not install pg_net; reserve the worker explicitly for the isolated Achillea
# database restored from Supabase Cloud.
shared_preload_libraries = 'pg_net'
pg_net.database_name = 'achillea'
pg_net.username = 'postgres'

# The co-located production services maintain bounded pools (website, Azalee,
# PostgREST, Storage, Realtime and Achillea). A limit of 100 left fewer than
# twenty slots free at idle and caused real `too many clients` failures during
# deploys. 200 provides restart/deploy headroom on this 45 GiB host while the
# application pools are consolidated separately.
max_connections = 200

# Bun OS overrides, loaded after /etc/limine-entry-tool.d/omarchy-defaults.conf
# (verbatim Omarchy file, factory/upstream/omarchy). Same keys, Bun OS values.
TARGET_OS_NAME="Bun OS"
CUSTOM_UKI_NAME="bunos"
# Keep the boot log visible (Omarchy's defaults boot quietly under Plymouth, which Bun OS does not ship).
KERNEL_CMDLINE[default]+=" loglevel=4 systemd.show_status=1 console=tty0 console=ttyS0,115200"
# linux-cachyos first, then any other kernel, fallbacks and snapshots.
BOOT_ORDER="linux-cachyos, linux-cachyos-*, *, *fallback, Snapshots"

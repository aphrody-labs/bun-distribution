# Bun OS Limine header. limine-entry-tool (limine-update, pacman hooks) appends the kernel entries and
# limine-snapper-sync the snapshot entries below. Entry 1 is the "/+Bun OS" directory, entry 2 its first kernel
# (as in Omarchy's template); see https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
timeout: 3
default_entry: 2
interface_branding: Bun OS
hash_mismatch_panic: no
serial: yes

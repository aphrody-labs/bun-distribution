# Bun OS initrd: systemd, verity-protected erofs /usr, tmpfs root.
MODULES=(erofs dm_verity virtio_blk virtio_pci virtio_scsi ahci nvme)
BINARIES=(/usr/lib/systemd/systemd-veritysetup veritysetup)
FILES=(/usr/lib/systemd/system-generators/systemd-veritysetup-generator
  /usr/lib/systemd/system/veritysetup.target
  /usr/lib/systemd/system/sysinit.target.wants/veritysetup.target
  /usr/lib/systemd/system/veritysetup-pre.target
  /usr/lib/systemd/system/remote-veritysetup.target)
# sd-encrypt brings the device-mapper udev rules that libcryptsetup waits on.
HOOKS=(base systemd modconf block sd-encrypt filesystems)
COMPRESSION=zstd
COMPRESSION_OPTIONS=(-19)
